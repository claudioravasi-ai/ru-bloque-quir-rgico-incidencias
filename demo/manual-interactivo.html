<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HRU · Manual interactivo</title>
<meta name="description" content="Demo interactivo: del ingreso de cada integrante del equipo a la cirugía terminada, la lista mensual de Anestesiología y las coberturas de guardia y planta.">
<style>
/* Rediseño 15-10-2026: sobrio y claro (con modo oscuro), un acento por sector
   en tonos apagados, y la guía en un panel chico y translúcido que no tapa. */
:root {
  --bg: #f4f6f9; --bg2: #ffffff; --ink: #172033; --mut: #5f6b7d; --line: #e2e7ee; --soft: #eef1f5; --glass: #ffffff; --glass2: #f1f4f8;
  --anest: #6d5bd0; --jefa: #9d4bb8; --enf: #0f8a7e; --inst: #b7791f; --cir: #2f6fd0; --jefe: #c2415d; --ok: #16a34a; --mal: #dc2626; --acento: #0f766e;
  --sh: 0 1px 2px rgba(23,32,51,.05), 0 8px 24px -16px rgba(23,32,51,.25);
  --coach: rgba(255,255,255,.84); --coach-ink: #172033;
  --r: 16px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1422; --bg2: #151d2e; --ink: #e6ebf3; --mut: #95a1b4; --line: #26314a; --soft: #1b2438; --glass: #151d2e; --glass2: #1d2740;
  --anest: #9b8cf0; --jefa: #c47ddb; --enf: #3fbfb1; --inst: #e0a744; --cir: #6ea0ec; --jefe: #e2758c; --ok: #4ade80; --mal: #f87171; --acento: #2dd4bf;
  --sh: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.7); --coach: rgba(21,29,46,.84); --coach-ink: #e6ebf3; } }
:root[data-theme="dark"] {
  --bg: #0e1422; --bg2: #151d2e; --ink: #e6ebf3; --mut: #95a1b4; --line: #26314a; --soft: #1b2438; --glass: #151d2e; --glass2: #1d2740;
  --anest: #9b8cf0; --jefa: #c47ddb; --enf: #3fbfb1; --inst: #e0a744; --cir: #6ea0ec; --jefe: #e2758c; --ok: #4ade80; --mal: #f87171; --acento: #2dd4bf;
  --sh: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.7); --coach: rgba(21,29,46,.84); --coach-ink: #e6ebf3; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { min-height: 100vh; overflow-x: hidden; line-height: 1.45; }
button { font-family: inherit; cursor: pointer; color: inherit; }
.fondo { display: none; }
#app { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 14px 16px 140px; }

/* ---------- barra superior ---------- */
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 10px; border-radius: 16px; background: color-mix(in srgb, var(--bg2) 92%, transparent); backdrop-filter: blur(10px); border: 1px solid var(--line); box-shadow: var(--sh); position: sticky; top: 8px; z-index: 20; }
.marca { display: flex; align-items: center; gap: 9px; font-weight: 800; letter-spacing: -.01em; }
.marca span { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--acento); color: #fff; }
.marca span b { font-size: 1rem; }
.marca small { display: block; font-weight: 600; color: var(--mut); font-size: .68rem; }
.reloj { font-variant-numeric: tabular-nums; font-weight: 800; font-size: .98rem; padding: 5px 10px; border-radius: 10px; background: var(--soft); border: 1px solid var(--line); }
.reloj small { color: var(--mut); font-weight: 600; font-size: .7rem; margin-right: 6px; }
.esp { flex: 1; }
.yo { display: flex; align-items: center; gap: 9px; padding: 4px 12px 4px 4px; border-radius: 999px; background: color-mix(in srgb, var(--k) 9%, var(--bg2)); border: 1px solid color-mix(in srgb, var(--k) 30%, var(--line)); }
.yo b { display: block; font-size: .84rem; line-height: 1.15; } .yo small { color: var(--mut); font-size: .7rem; font-weight: 700; }
.yo em { font-style: normal; background: color-mix(in srgb, var(--k) 14%, transparent); color: var(--k); border-radius: 6px; padding: 0 6px; margin-left: 4px; }
.av { width: 36px; height: 36px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .76rem; color: #fff; background: var(--k); position: relative; }
.av .bd { position: absolute; right: -4px; top: -4px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--mal); color: #fff; font-size: .62rem; display: grid; place-items: center; padding: 0 4px; box-shadow: 0 0 0 2px var(--bg2); }
@keyframes late { 50% { transform: scale(1.12); } }
.btn { border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 700; font-size: .84rem; color: #fff; background: var(--k, var(--acento)); transition: transform .15s, filter .2s, opacity .2s; }
.btn:hover { filter: brightness(1.06); transform: translateY(-1px); } .btn:active { transform: scale(.98); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.btn.fant { background: var(--soft); color: var(--ink); border: 1px solid var(--line); }
.btn.chico { padding: 6px 10px; font-size: .76rem; border-radius: 9px; }
.volver-app { --k: var(--acento); white-space: nowrap; }
.tema { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--soft); }

/* ---------- pestañas y títulos ---------- */
.tabs { display: flex; gap: 4px; margin: 14px 0 10px; padding: 4px; border-radius: 12px; background: var(--soft); border: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; border: 0; background: transparent; color: var(--mut); padding: 8px 12px; border-radius: 9px; font-weight: 700; font-size: .84rem; white-space: nowrap; }
.tabs button.on { background: var(--bg2); color: var(--ink); box-shadow: var(--sh); }
h2 { font-size: 1.35rem; margin: 18px 0 4px; letter-spacing: -.015em; }
.sub { color: var(--mut); margin: 0 0 14px; font-size: .9rem; line-height: 1.5; }
.card { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; box-shadow: var(--sh); animation: sube .35s ease both; }
@keyframes sube { from { opacity: 0; transform: translateY(8px); } }
@keyframes entra { from { opacity: 0; transform: scale(.94); } }
.grid { display: grid; gap: 12px; }

/* ---------- ingreso y capítulos ---------- */
.ingreso h1 { font-size: clamp(1.6rem, 4.4vw, 2.4rem); margin: 26px 0 6px; letter-spacing: -.025em; line-height: 1.1; }
.ingreso h1 span { color: var(--acento); }
.sector { margin-top: 18px; } .sector > b { display: flex; align-items: center; gap: 8px; font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--mut); margin-bottom: 8px; }
.sector > b::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.gente { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.persona { display: flex; align-items: center; gap: 10px; text-align: left; padding: 9px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg2); color: var(--ink); transition: all .15s; position: relative; }
.persona:hover { border-color: var(--k); box-shadow: var(--sh); }
.persona b { display: block; font-size: .86rem; } .persona small { color: var(--mut); font-size: .72rem; }
.login-ov { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(15,20,34,.45); backdrop-filter: blur(4px); animation: sube .2s; padding: 16px; }
.login { width: min(400px, 100%); border-radius: 20px; padding: 22px; background: var(--bg2); border: 1px solid var(--line); border-top: 4px solid var(--k); box-shadow: 0 30px 60px -30px rgba(0,0,0,.5); animation: entra .3s ease; }
.login .av { width: 60px; height: 60px; font-size: 1.1rem; margin: 0 auto 10px; }
.login h3 { text-align: center; margin: 0; } .login p { text-align: center; color: var(--mut); margin: 4px 0 16px; font-size: .84rem; }
.campo { background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; margin-bottom: 8px; font-size: .9rem; min-height: 42px; }
.campo small { display: block; color: var(--mut); font-size: .66rem; text-transform: uppercase; letter-spacing: .08em; }
.cursor::after { content: '▍'; animation: parpa .7s steps(2) infinite; color: var(--k); }
@keyframes parpa { 50% { opacity: 0; } }
.chequeos { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; }
.chequeos li { display: flex; gap: 8px; align-items: center; font-size: .84rem; animation: sube .3s both; }
.chequeos li i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--ok); color: #fff; font-size: .7rem; font-weight: 900; }

/* ---------- tarjetas de cirugía y recorrido ---------- */
.cx { border-radius: 16px; padding: 0; overflow: hidden; border: 1px solid var(--line); background: var(--bg2); box-shadow: var(--sh); margin-bottom: 10px; animation: sube .3s both; border-left: 4px solid var(--s); }
.cx.toca { border-color: var(--k); border-left-color: var(--k); box-shadow: 0 0 0 1px var(--k), var(--sh); }
.cx-cab { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; cursor: pointer; }
.hora { font-weight: 800; font-size: 1rem; font-variant-numeric: tabular-nums; padding: 7px 9px; border-radius: 10px; background: var(--soft); }
.cx-cab b { display: block; } .cx-cab small { color: var(--mut); font-size: .76rem; }
.sala-tag { display: inline-block; font-weight: 800; font-size: .68rem; padding: 2px 7px; border-radius: 6px; background: color-mix(in srgb, var(--s) 16%, transparent); color: var(--s); margin-right: 6px; }
.metro { display: flex; align-items: center; }
.metro i { width: 12px; height: 12px; border-radius: 50%; background: var(--soft); border: 2px solid var(--line); position: relative; }
.metro i + i { margin-left: 9px; } .metro i + i::before { content: ''; position: absolute; right: 100%; top: 50%; width: 9px; height: 2px; background: var(--line); }
.metro i.hecho { background: var(--ok); border-color: var(--ok); } .metro i.hecho + i::before { background: var(--ok); }
.metro i.activo { background: var(--bg2); border-color: var(--k); box-shadow: 0 0 0 3px color-mix(in srgb, var(--k) 25%, transparent); }
.estado-l { padding: 8px 14px; border-top: 1px solid var(--line); font-size: .8rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--soft); }
.toca-txt { font-weight: 800; color: var(--k); } .espera-txt { color: var(--mut); }
.pasos { list-style: none; margin: 0; padding: 6px 14px 14px; position: relative; }
.paso { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 10px 0; position: relative; }
.paso::before { content: ''; position: absolute; left: 16px; top: 44px; bottom: -10px; width: 2px; background: var(--line); }
.paso:last-child::before { display: none; }
.paso.hecho::before { background: var(--ok); }
.num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: var(--soft); border: 2px solid var(--line); font-size: .86rem; z-index: 1; color: var(--mut); }
.paso.hecho .num { background: var(--ok); color: #fff; border-color: var(--ok); }
.paso.activo .num { background: var(--k); color: #fff; border-color: var(--k); box-shadow: 0 0 0 5px color-mix(in srgb, var(--k) 18%, transparent); }
.paso.bloq { opacity: .55; }
.paso h4 { margin: 6px 0 2px; font-size: .95rem; } .paso > div > small { color: var(--mut); font-size: .76rem; }
.firmas { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.firma { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 999px; font-size: .74rem; background: var(--soft); border: 1px dashed var(--line); }
.firma .av { width: 22px; height: 22px; font-size: .55rem; }
.firma.ok { border-style: solid; border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); background: color-mix(in srgb, var(--ok) 8%, var(--bg2)); }
.firma.libre .av { background: var(--line); color: var(--mut); }
.accion { margin-top: 8px; padding: 12px; border-radius: 12px; background: color-mix(in srgb, var(--k) 6%, var(--bg2)); border: 1px solid color-mix(in srgb, var(--k) 35%, var(--line)); }
.accion > b { display: block; font-size: .8rem; margin-bottom: 8px; color: var(--k); text-transform: uppercase; letter-spacing: .04em; }
.falta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: space-between; margin-top: 6px; padding: 8px 10px; border-radius: 10px; background: var(--soft); font-size: .78rem; color: var(--mut); }
.bloqueo { margin-top: 8px; padding: 10px 12px; border-radius: 10px; font-size: .8rem; background: color-mix(in srgb, var(--mal) 8%, var(--bg2)); border: 1px solid color-mix(in srgb, var(--mal) 35%, var(--line)); color: var(--ink); }
.chk { display: grid; gap: 6px; margin-bottom: 10px; }
.chk label { display: flex; gap: 9px; align-items: center; padding: 8px 10px; border-radius: 9px; background: var(--bg2); border: 1px solid var(--line); font-size: .84rem; cursor: pointer; transition: background .2s; }
.chk label.si { background: color-mix(in srgb, var(--ok) 9%, var(--bg2)); border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); }
.chk input { width: 18px; height: 18px; accent-color: var(--ok); }
.cont { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 10px; }
.cont div { padding: 8px 10px; border-radius: 10px; background: var(--bg2); border: 1px solid var(--line); font-size: .78rem; }
.cont div.mal { background: color-mix(in srgb, var(--mal) 8%, var(--bg2)); border-color: var(--mal); animation: tiembla .4s; }
@keyframes tiembla { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.cont span { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.cont button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--soft); font-weight: 900; font-size: 1rem; }
.cont output { min-width: 34px; text-align: center; font-weight: 800; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.aviso-mal { padding: 8px 10px; border-radius: 9px; background: color-mix(in srgb, var(--mal) 9%, var(--bg2)); color: var(--mal); font-weight: 700; font-size: .8rem; margin-bottom: 8px; }
.ald { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; margin-bottom: 10px; }
.ald label { font-size: .74rem; color: var(--mut); display: grid; gap: 3px; }
.ald select, .form input, .form select { background: var(--bg2); color: var(--ink); border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; font-family: inherit; font-size: .86rem; }
.ahora { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 16px; margin-bottom: 12px; background: var(--bg2); border: 1px solid var(--line); border-left: 4px solid var(--k); box-shadow: var(--sh); }
.ahora .big { font-size: 1.8rem; } .ahora b { display: block; font-size: 1rem; } .ahora small { color: var(--mut); font-size: .82rem; }

/* ---------- lista del mes ---------- */
.mes-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--line); background: var(--bg2); }
table.mes { border-collapse: separate; border-spacing: 3px; font-size: .72rem; min-width: 100%; }
.mes th { color: var(--mut); font-weight: 700; padding: 4px 2px; min-width: 30px; }
.mes th.fs { color: var(--jefe); } .mes th.hoy { color: #fff; background: var(--acento); border-radius: 7px; }
.mes td.nom { position: sticky; left: 0; background: var(--bg2); padding: 4px 8px; white-space: nowrap; font-weight: 700; z-index: 1; }
.mes td.nom i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--p); margin-right: 6px; }
.cel { width: 30px; height: 30px; border-radius: 7px; border: 0; font-weight: 800; font-size: .72rem; background: var(--soft); color: var(--mut); transition: transform .15s; }
.cel:hover { transform: scale(1.1); }
.cel.P { background: color-mix(in srgb, var(--enf) 22%, var(--bg2)); color: var(--enf); } .cel.G { background: color-mix(in srgb, var(--anest) 24%, var(--bg2)); color: var(--anest); }
.cel.F { background: var(--line); color: var(--mut); } .cel.L { background: color-mix(in srgb, var(--inst) 22%, var(--bg2)); color: var(--inst); }
.cel.pop { animation: pop .3s; } @keyframes pop { 50% { transform: scale(1.25); } }
.mes tr.cob td { text-align: center; font-size: .9rem; }
.leyenda { display: flex; gap: 12px; flex-wrap: wrap; font-size: .76rem; color: var(--mut); margin: 10px 0; }
.leyenda span { display: inline-flex; align-items: center; gap: 5px; } .leyenda .cel { width: 22px; height: 22px; font-size: .6rem; display: inline-grid; place-items: center; font-style: normal; }
.sello { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; font-weight: 700; font-size: .76rem; background: var(--soft); color: var(--mut); }
.sello.borrador { background: color-mix(in srgb, var(--inst) 14%, var(--bg2)); color: var(--inst); } .sello.enviada { background: color-mix(in srgb, var(--cir) 14%, var(--bg2)); color: var(--cir); }
.sello.validada { background: color-mix(in srgb, var(--ok) 14%, var(--bg2)); color: var(--ok); } .sello.mal { background: color-mix(in srgb, var(--mal) 12%, var(--bg2)); color: var(--mal); }
.barra-acc { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }

/* ---------- calendario personal y cobertura ---------- */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal .dn { text-align: center; color: var(--mut); font-size: .7rem; font-weight: 800; }
.cal .d { aspect-ratio: 1; border-radius: 10px; padding: 6px; background: var(--bg2); border: 1px solid var(--line); display: flex; flex-direction: column; justify-content: space-between; font-size: .72rem; }
.cal .d b { font-size: .85rem; }
.cal .d.P { background: color-mix(in srgb, var(--enf) 12%, var(--bg2)); border-color: color-mix(in srgb, var(--enf) 40%, var(--line)); }
.cal .d.G { background: color-mix(in srgb, var(--anest) 14%, var(--bg2)); border-color: color-mix(in srgb, var(--anest) 40%, var(--line)); }
.cal .d.F { background: var(--soft); } .cal .d.L { background: color-mix(in srgb, var(--inst) 12%, var(--bg2)); border-color: color-mix(in srgb, var(--inst) 40%, var(--line)); }
.cal .d.hoy { box-shadow: 0 0 0 2px var(--acento); }
.cal .d small { font-weight: 700; line-height: 1.1; color: var(--mut); }
.totales { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin: 12px 0; }
.totales div { padding: 12px; border-radius: 14px; background: var(--bg2); border: 1px solid var(--line); box-shadow: var(--sh); }
.totales b { display: block; font-size: 1.5rem; font-weight: 800; } .totales small { color: var(--mut); font-size: .74rem; }
.dias { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; }
.dias button { flex: none; width: 46px; padding: 6px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--bg2); font-weight: 800; font-size: .82rem; }
.dias button small { display: block; font-size: .6rem; color: var(--mut); font-weight: 700; }
.dias button.on { background: var(--acento); color: #fff; border-color: var(--acento); } .dias button.on small { color: #fff; }
.dias button.fs { opacity: .6; }
.cob { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.cob .card { display: flex; gap: 10px; align-items: center; }
.cob .card .lbl { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--mut); font-weight: 800; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--line); margin-right: 4px; } .dot.si { background: var(--ok); }

/* ---------- tablero en vivo y programación ---------- */
.tablero { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.sala-card { border-radius: 16px; padding: 14px; background: var(--bg2); border: 1px solid var(--line); border-top: 4px solid var(--s); box-shadow: var(--sh); }
.sala-card h3 { margin: 0; font-size: 1.02rem; display: flex; justify-content: space-between; align-items: center; }
.sala-card p { margin: 4px 0 10px; color: var(--mut); font-size: .8rem; }
.prog { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; margin: 8px 0; }
.prog i { display: block; height: 100%; border-radius: 3px; background: var(--ok); transition: width .6s cubic-bezier(.2,1,.3,1); }
.vivo { display: inline-flex; align-items: center; gap: 5px; font-size: .66rem; font-weight: 800; color: var(--mal); vertical-align: middle; } .vivo::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--mal); animation: late 1.4s infinite; }
.linea-t { position: relative; border-radius: 14px; border: 1px solid var(--line); background: var(--bg2); padding: 10px 10px 10px 70px; overflow-x: auto; }
.linea-t .fila { position: relative; height: 46px; margin-bottom: 6px; min-width: 560px; }
.linea-t .fila > b { position: absolute; left: -62px; top: 10px; font-size: .78rem; }

function volverApp() {
  const planB = () => {

    if (history.length > 1) { history.back(); return; }

      try { window.opener.focus(); } catch (e) {}

      setTimeout(() => { if (!window.closed) planB(); }, 400);

  };
  // Borrador: la Jefa de Anestesia ya cargó los primeros días; hay una licencia.
  ANEST.forEach((k) => { S.mes.g[k] = Array(NDIAS + 1).fill(''); });
  const sug = sugerencia();
  for (let d = 1; d <= Math.min(NDIAS, 9); d++) ANEST.forEach((k) => { S.mes.g[k][d] = sug[k][d]; });
  licencias().forEach((d) => { S.mes.g.quiroga[d] = 'L'; });
}
function licencias() { const r = []; for (let d = HOY + 6; d <= Math.min(NDIAS, HOY + 10); d++) r.push(d); return r; }
const reloj = () => `${pad(Math.floor(S.min / 60))}:${pad(S.min % 60)}`;
function avanza(m) { S.min += m || 2 + Math.floor(Math.random() * 4); }

/* ---------- Lista del mes: sugerencia automática ----------
   Guardia de 24 h rotativa; el día siguiente a la guardia es franco; los
   demás hacen planta de lunes a viernes. Se arma para que hoy Dr. Arce
   esté de planta en el Quirófano 1. */
function sugerencia() {
  const off = (6 - (HOY % 6)) % 6, lic = new Set(licencias()), g = {};
  ANEST.forEach((k) => { g[k] = Array(NDIAS + 1).fill(''); });
  for (let d = 1; d <= NDIAS; d++) {
    const gi = (d + off) % 6, fi = (d - 1 + off) % 6;
    let guard = ROTA[gi];
    if (lic.has(d) && guard === 'quiroga') guard = ROTA[(gi + 2) % 6];
    g[guard][d] = 'G';
    if (!lic.has(d) || ROTA[fi] !== 'quiroga') g[ROTA[fi]][d] = g[ROTA[fi]][d] || 'F';
    if (lic.has(d)) g.quiroga[d] = 'L';
    if (!finde(d)) {
      for (let j = 1; j <= 5; j++) { const k = ROTA[(gi + j) % 6]; if (!g[k][d]) g[k][d] = 'P'; }
      // Si una licencia deja la planta corta, entra el itinerante.
      if (ROTA.filter((k) => g[k][d] === 'P').length < 4) g.ortiz[d] = 'P';
    }
  }
  return g;
}
function cobertura(d) {
  const r = { P: [], G: [], F: [], L: [] };
  ANEST.forEach((k) => { const v = S.mes.g[k][d]; if (r[v]) r[v].push(k); });
  // Orden de puestos: rotación a partir de la guardia, como la sugerencia.
  const off = (6 - (HOY % 6)) % 6, gi = (d + off) % 6;
  const ord = (k) => ROTA.includes(k) ? (ROTA.indexOf(k) - gi + 6) % 6 : 99;   // el itinerante, al final
  r.P.sort((a, b) => ord(a) - ord(b));
  r.puestos = PUESTOS.map(([id, n], i) => ({ id, n, k: r.P[i] || null }));
  r.ok = finde(d) ? r.G.length === 1 : r.G.length === 1 && r.P.length >= 4;
  return r;
}
const puestoHoy = (k) => { const c = cobertura(HOY); const v = S.mes.g[k][HOY]; if (v === 'G') return { t: 'Guardia de 24 h', sala: null }; if (v === 'P') { const p = c.puestos.find((x) => x.k === k); return { t: 'Planta · ' + (p ? p.n : 'refuerzo'), sala: p ? p.id : null }; } return v === 'F' ? { t: 'Franco post-guardia' } : v === 'L' ? { t: 'Licencia' } : { t: 'Sin asignar' }; };

/* ---------- Reglas del recorrido ---------- */
const quien = (c, rol) => rol === 'anest' ? c.anest : rol === 'circ' || rol === 'enf' ? c.circ : rol === 'inst' ? c.inst : rol === 'cir' ? c.cir : null;
function estado(c) {
  const p = PASOS.map((x) => ({ ...x, firmas: x.roles.map((r) => ({ rol: r, f: c.f[x.k + '.' + r], k: quien(c, r) })) }));
  p.forEach((x) => { x.hecho = x.firmas.every((y) => y.f); });
  const a = p.findIndex((x) => !x.hecho);
  p.forEach((x, i) => { x.est = x.hecho ? 'hecho' : i === a ? 'activo' : 'bloq'; });
  return { p, a, hechos: p.filter((x) => x.hecho).length };
}
/* ¿Puede el usuario actual firmar este rol? Solo quien está anotado en ESA
   cirugía; con el puesto libre, solo anotarse (y si es de esa función). */
function puedo(c, rol, paso) {
  const yo = S.yo; if (!yo || supervisa(yo)) return false;
  const f = G[yo].f, q = quien(c, rol);
  if (ROL[rol].f !== f) return false;
  if (rol === 'cir') return q === yo;
  if (q) return q === yo;
  return paso === 'equipo';
}
/* Una persona, una sala: la otra cirugía del día donde figura y que todavía no tuvo la Salida. */
function ocupadoEn(k, salvo) {
  return S.cx.find((c) => c.id !== salvo && !c.f['salida.enf'] && [c.anest, c.circ, c.inst].includes(k));
}
const salaActual = (k) => { const c = ocupadoEn(k); return c ? c : null; };

/* ---------- Acciones ---------- */
function registrar(c, txt) { S.log.unshift({ t: reloj(), c: c ? salaDe(c.sala).n : '', txt }); }
function avisar(k, txt, de) {
  (S.avisos[k] = S.avisos[k] || []).unshift({ t: reloj(), txt, leido: false });
  if (S.yo === k) toast(txt, colorDe(k));
}
/* Cuando termina un paso, la app avisa sola a quienes tienen que firmar el siguiente. */
function avisarSiguientes(c, pasoPrevio) {
  const e = estado(c), act = e.p[e.a]; if (!act) return;
  const sala = salaDe(c.sala).n;
  act.firmas.filter((x) => !x.f).forEach((x) => {
    if (x.k) avisar(x.k, `🔔 Le toca ${ACCION[act.k]} en ${sala}${pasoPrevio ? ` (ya se completó «${pasoPrevio}»)` : ''}`);
  });
}
function firmar(c, paso, rol, extra) {
  const antes = estado(c).a;
  c.f[paso + '.' + rol] = Object.assign({ k: S.yo, t: reloj() }, extra || {});
  const pn = PASOS.find((p) => p.k === paso).n;
  registrar(c, `${G[S.yo].n} firmó «${pn}» como ${ROL[rol].n}`);
  avanza();
  const e = estado(c);
  if (e.a !== antes) {
    toast(`✅ «${pn}» completo en ${salaDe(c.sala).n}`, '#4ade80');
    if (e.a === -1) { festejo(); toast(`🎉 Recorrido completo: ${c.proc}`, '#e879f9'); registrar(c, 'Recorrido completo'); }
    else avisarSiguientes(c, pn);
  } else avisarSiguientes(c);
  render();
}
function anotar(id, rol, forzar) {
  const c = S.cx.find((x) => x.id === id), yo = S.yo;
  if (G[yo].f === 'anest' && !S.llegada[yo]) { toast('Primero marque su llegada: arriba, «Llegué».', '#fb7185'); return; }
  const otra = ocupadoEn(yo, id);
  if (otra && !forzar) { S.modal = { tipo: 'sala', id, rol, otra: otra.id }; render(); return; }
  if (otra) {
    ['anest', 'circ', 'inst'].forEach((r) => { if (otra[r] === yo) { otra[r] = null; delete otra.f['equipo.' + r]; } });
    registrar(otra, `${G[yo].n} dejó la sala por cambio a ${salaDe(c.sala).n}`);
    toast(`↪ Cambio de sala: ${salaDe(otra.sala).n} → ${salaDe(c.sala).n}. El puesto que dejó queda libre y avisado.`, '#fbbf24');
    ANEST.concat(['ruiz', 'sosa', 'gomez', 'vera']).filter((k) => G[k].f === G[yo].f && k !== yo).forEach((k) => avisar(k, `⚠ Quedó libre un puesto de ${FUNC[G[yo].f].n} en ${salaDe(otra.sala).n}`));
  }
  c[rol === 'enf' ? 'circ' : rol] = yo;
  S.modal = null;
  firmar(c, 'equipo', rol);
}
function llegue() { S.llegada[S.yo] = reloj(); registrar(null, `${G[S.yo].n} marcó su llegada`); avanza(1); toast('Llegada registrada. Ya puede tomar sus cirugías.', '#4ade80'); render(); }
function avisarFalta(id, rol) {
  const c = S.cx.find((x) => x.id === id), k = quien(c, rol), e = estado(c), p = e.p[e.a];
  if (k) avisar(k, `🔔 ${G[S.yo].n} le pide su firma: «${p.n}» en ${salaDe(c.sala).n}`);
  else Object.keys(G).filter((x) => G[x].f === ROL[rol].f && !ocupadoEn(x)).forEach((x) => avisar(x, `🔔 Falta ${ROL[rol].n} en ${salaDe(c.sala).n} (${c.hora} h)`));
  toast(`Aviso enviado a ${k ? G[k].n : 'todo ' + FUNC[ROL[rol].f].n}`, '#60a5fa');
  registrar(c, `${G[S.yo].n} avisó a ${k ? G[k].n : ROL[rol].n} que falta su firma`);
  render();
}
function recuento(id, cual) {
  const c = S.cx.find((x) => x.id === id), v = Object.assign({}, S.ui.cnt[id + cual] || {});
  if (cual === 'rec1') { if (!RECUENTO.some(([k]) => v[k])) { toast('Cargue al menos un valor.', '#fb7185'); return; } c.rec1 = v; firmar(c, 'rec1', 'inst'); return; }
  c.rec2 = v;
  const dif = difRecuento(c);
  if (dif.length) { registrar(c, `Recuento final NO coincide (${dif.join(', ')})`); toast('⚠ El recuento no coincide. Vuelvan a contar: la Salida queda frenada.', '#f87171'); avanza(); render(); return; }
  firmar(c, 'rec2', 'inst');
}
function difRecuento(c) { if (!c.rec1 || !c.rec2) return []; return RECUENTO.filter(([k]) => Number(c.rec1[k] || 0) !== Number(c.rec2[k] || 0)).map(([k, n]) => `${n}: ${c.rec2[k] || 0} de ${c.rec1[k] || 0}`); }
function aldrete(id) {
  const c = S.cx.find((x) => x.id === id), v = S.ui.ald[id] || [2, 2, 2, 2, 2];
  const tot = v.reduce((a, b) => a + Number(b), 0);
  c.ald = tot;
  if (tot < 9) { registrar(c, `Aldrete ${tot}/10: sigue en recuperación`); toast(`Aldrete ${tot}/10: todavía no puede salir de recuperación.`, '#fbbf24'); avanza(); render(); return; }
  firmar(c, 'recup', 'anest', { tot });
}

/* Lista del mes */
let animando = false;
async function sugerir() {
  if (animando) return; animando = true;
  const sug = sugerencia();
  for (let d = 1; d <= NDIAS; d++) {
    ANEST.forEach((k) => { if (S.mes.g[k][d] !== 'L') S.mes.g[k][d] = sug[k][d]; });
    render(); document.querySelectorAll(`[data-d="${d}"]`).forEach((b) => b.classList.add('pop'));

  }

}

  const ciclo = ['', 'P', 'G', 'F', 'L'], v = S.mes.g[k][d];

  if (malos.length) { toast(`Faltan cubrir ${malos.length} día(s): ${malos.slice(0, 6).join(', ')}${malos.length > 6 ? '…' : ''}. Use «Sugerir cobertura».`, '#f87171'); return; }
  S.mes.estado = 'enviada'; registrar(null, 'La Jefa de Anestesia envió la lista del mes a Jefatura');

}

/* ---------- Ingreso ---------- */

  for (let i = 1; i <= 8; i++) { S.login.pass = i; renderLogin(); await espera(rapido ? 18 : 40); }
  const ch = G[k].f === 'dir' ? ['Cuenta de Dirección Médica', 'Acceso de solo lectura'] : G[k].f === 'jefe' ? ['Cuenta de Jefatura', 'Permisos de supervisión'] : G[k].f === 'cir' ? ['Cuenta aprobada', 'Matrícula vigente', 'Seguro de mala praxis al día'] : ['Cuenta aprobada', 'Matrícula vigente', 'Función: ' + FUNC[G[k].f].n + (G[k].jefaAnest ? ' · Jefa de Servicio' : '')];

function barra() {

/* La ventanita de ingreso se arma UNA vez; después solo cambian las letras

function renderLogin() {
  const L = S.login, ov = $('#login-ov'); if (!L || !ov) return;

/* --- Hoy: lo que tiene que hacer esta persona --- */
function vistaHoy() {
  const k = S.yo, f = G[k].f;
  let h = '';
  const mia = salaActual(k);
  if (f === 'anest') {
    const ph = puestoHoy(k);
    h += `<div class="ahora" style="--k:${colorDe(k)}"><span class="big">${S.llegada[k] ? '✅' : '⏰'}</span><div style="flex:1"><b>${S.llegada[k] ? `Llegó a las ${S.llegada[k]} h` : 'Paso 0 · Marque su llegada'}</b>
      <small>Según la lista del mes, hoy: <b style="display:inline">${ph.t}</b>${S.mes.estado !== 'validada' ? ' (lista todavía sin validar)' : ''}${mia ? ` · Ahora en ${salaDe(mia.sala).n}` : ''}</small></div>
      ${S.llegada[k] ? '' : `<button class="btn" data-a="llegue" onclick="llegue()">Llegué · estoy disponible</button>`}</div>`;
    if (!S.llegada[k]) return h + `<div class="card" style="text-align:center;padding:30px"><div style="font-size:2.4rem">🔒</div><b>Las cirugías del día se habilitan cuando marca su llegada.</b><p class="sub" style="margin-top:6px">Así la Jefatura sabe quién está en el hospital antes de asignar salas.</p></div>`;
  } else if (f !== 'cir') {
    h += `<div class="ahora" style="--k:${colorDe(k)}"><span class="big">${mia ? '📍' : '👋'}</span><div><b>${mia ? `Está en ${salaDe(mia.sala).n} · ${mia.proc}` : 'Todavía no está en ninguna sala'}</b>
      <small>${mia ? 'Hasta que esa cirugía tenga la Salida firmada, no puede anotarse en otra sala (salvo «cambio de sala»).' : 'Elija la cirugía donde va a estar y anótese en su puesto: es el paso 1 de cada una.'}</small></div></div>`;
  }
  const mias = S.cx.filter((c) => [c.anest, c.circ, c.inst, c.cir].includes(k));
  const otras = S.cx.filter((c) => !mias.includes(c) && f !== 'cir');
  const orden = (a, b) => a.hora.localeCompare(b.hora);
  h += `<h2>${f === 'cir' ? 'Sus cirugías de hoy' : 'Cirugías del día'}</h2><p class="sub">Cada tarjeta avanza en 7 pasos. Usted ve en color lo que le toca; lo demás espera con candado 🔒 hasta que termine el paso anterior.</p>`;
  h += mias.sort(orden).map(tarjeta).join('');
  if (otras.length) h += `<h2 style="font-size:1.05rem;color:var(--mut)">Otras salas</h2>` + otras.sort(orden).map(tarjeta).join('');
  return h;
}
function tarjeta(c) {
  const e = estado(c), act = e.p[e.a], sala = salaDe(c.sala), abierta = S.abierta === c.id;
  const meToca = act && act.firmas.some((x) => !x.f && puedo(c, x.rol, act.k) && !(act.k === 'equipo' && ocupadoEn(S.yo, c.id) && false));
  const esperan = act ? act.firmas.filter((x) => !x.f && !puedo(c, x.rol, act.k)) : [];
  const sugerida = G[S.yo].f === 'anest' && puestoHoy(S.yo).sala && (puestoHoy(S.yo).sala === c.sala || (puestoHoy(S.yo).sala === 'END' && c.sala === 'OBS'));
  return `<article class="cx ${meToca ? 'toca' : ''}" style="--s:${sala.c}">
    <div class="cx-cab" data-a="abrir-${c.id}" onclick="S.abierta=S.abierta==='${c.id}'?null:'${c.id}';render()">
      <span class="hora">${c.hora}</span>
      <span><b><span class="sala-tag">${sala.id}</span>${c.proc}</b><small>${G[c.cir].n} · ${c.pac}${sugerida && !c.anest ? ' · <b style="color:var(--anest);display:inline">⭐ su sala según la lista</b>' : ''}</small></span>
      <span class="metro">${e.p.map((p) => `<i class="${p.est}" title="${p.n}"></i>`).join('')}</span>
    </div>
    <div class="estado-l">${!act ? '<b style="color:var(--ok)">✓ Recorrido completo</b>' : meToca ? `<span class="toca-txt">▶ Le toca: ${ACCION[act.k]}</span>` : `<span class="espera-txt">⏳ Esperando a ${esperan.map((x) => x.k ? G[x.k].n : ROL[x.rol].n + ' (sin anotar)').join(', ')} para ${ACCION[act.k]}</span>`}
      <span style="margin-left:auto;color:var(--mut)">${e.hechos}/7</span></div>
    ${abierta ? `<ol class="pasos">${e.p.map((p, i) => paso(c, p, i)).join('')}</ol>` : ''}
  </article>`;
}
function paso(c, p, i) {
  const firmas = p.firmas.map((x) => `<span class="firma ${x.f ? 'ok' : x.k ? '' : 'libre'}">${x.k ? avatar(x.k) : '<span class="av">?</span>'}${ROL[x.rol].n}: ${x.k ? G[x.k].n : 'sin anotar'}${x.f ? ` · ✓ ${x.f.t} h` : ''}</span>`).join('');
  if (p.est !== 'activo') {
    const prev = PASOS[i - 1];
    return `<li class="paso ${p.est}"><span class="num">${p.est === 'hecho' ? '✓' : '🔒'}</span><div><h4>${p.ic} ${i + 1}. ${p.n}</h4><small>${p.est === 'hecho' ? p.d : `${p.d} · se habilita cuando termine «${estado(c).p[estado(c).a].n}»`}</small>${p.est === 'hecho' ? `<div class="firmas">${firmas}</div>` : ''}</div></li>`;
  }
  const acc = p.firmas.filter((x) => !x.f).map((x) => {
    if (puedo(c, x.rol, p.k)) return accion(c, p.k, x.rol);
    if (supervisa(S.yo) || x.k !== S.yo) {
      return `<div class="falta"><span>Falta: <b>${x.k ? G[x.k].n : ROL[x.rol].n + ' (nadie anotado)'}</b> · ${ROL[x.rol].n}</span>${G[S.yo].f === 'dir' ? '' : `<button class="btn fant chico" data-a="avisar-${c.id}-${x.rol}" onclick="avisarFalta('${c.id}','${x.rol}')">🔔 Avisar</button>`}</div>`;
    }
    return '';
  }).join('');
  return `<li class="paso activo"><span class="num">${i + 1}</span><div><h4>${p.ic} ${p.n}</h4><small>${p.d}</small><div class="firmas">${firmas}</div>${acc}</div></li>`;
}
function accion(c, paso, rol) {
  const id = c.id, key = id + paso + rol, a = (t, cuerpo) => `<div class="accion"><b>${t}</b>${cuerpo}</div>`;
  if (paso === 'equipo') {
    const otra = ocupadoEn(S.yo, id);
    const t = { anest: 'Confirmo que doy la anestesia', circ: 'Me anoto como circulante', inst: 'Me anoto como instrumentador/a' }[rol];
    return otra ? `<div class="bloqueo">🔒 Usted ya está en <b>${salaDe(otra.sala).n}</b> (${otra.proc}). Una persona no puede estar en dos salas a la vez.
        <div style="margin-top:8px"><button class="btn chico" style="--k:#fbbf24" data-a="cambio-${id}-${rol}" onclick="anotar('${id}','${rol}')">↪ Es un cambio de sala</button></div></div>`
      : a('Su paso: anotarse', `<button class="btn" data-a="anotar-${id}-${rol}" onclick="anotar('${id}','${rol}')">${t}</button>`);
  }
  if (CHECK[paso + '.' + rol]) {
    const L = CHECK[paso + '.' + rol], marc = S.ui.chk[key] || [];
    const listo = L.every((_, j) => marc[j]);
    return a(`Lista de verificación · ${ROL[rol].n}`, `<div class="chk">${L.map((t, j) => `<label class="${marc[j] ? 'si' : ''}" data-a="chk-${key}-${j}"><input type="checkbox" ${marc[j] ? 'checked' : ''} onchange="(S.ui.chk['${key}']=S.ui.chk['${key}']||[])[${j}]=this.checked;render()">${t}</label>`).join('')}</div>
      <button class="btn" data-a="firmar-${key}" ${listo ? '' : 'disabled'} onclick="firmar(S.cx.find(x=>x.id==='${id}'),'${paso}','${rol}')">${listo ? 'Firmar ' + PASOS.find((p) => p.k === paso).n : `Marque los ${L.length} puntos para firmar`}</button>`);
  }
  if (paso === 'rec1' || (paso === 'rec2' && rol === 'inst')) {
    const v = S.ui.cnt[id + paso] = S.ui.cnt[id + paso] || {};
    const dif = paso === 'rec2' && c.rec2 ? difRecuento(c) : [];
    return a(paso === 'rec1' ? 'Recuento inicial · cuente y cargue' : 'Recuento final · tiene que coincidir con el inicial',
      `${dif.length ? `<div class="aviso-mal">⚠ No coincide: ${dif.join(' · ')}. Vuelvan a contar.</div>` : ''}
      <div class="cont">${RECUENTO.map(([k, n]) => `<div class="${dif.some((d) => d.startsWith(n)) ? 'mal' : ''}">${n}${paso === 'rec2' ? ` <small style="color:var(--mut)">(inicial ${c.rec1[k] || 0})</small>` : ''}<span>
        <button onclick="S.ui.cnt['${id + paso}'].${k}=Math.max(0,(S.ui.cnt['${id + paso}'].${k}||0)-1);render()" aria-label="Uno menos">−</button><output>${v[k] || 0}</output>
        <button data-a="mas-${id + paso}-${k}" onclick="S.ui.cnt['${id + paso}'].${k}=(S.ui.cnt['${id + paso}'].${k}||0)+1;render()" aria-label="Uno más">+</button></span></div>`).join('')}</div>
      <button class="btn" data-a="rec-${id}-${paso}" onclick="recuento('${id}','${paso}')">${paso === 'rec1' ? 'Firmar el recuento inicial' : dif.length ? 'Cargar el recuento corregido' : 'Firmar el recuento final'}</button>`);
  }
  if (paso === 'rec2' && rol === 'enf') {
    if (!c.f['rec2.inst']) return `<div class="falta"><span>🔒 La cofirma se habilita cuando Instrumentación carga un recuento final que coincide.</span></div>`;
    return a('Cofirma del recuento', `<button class="btn" data-a="cofirma-${id}" onclick="firmar(S.cx.find(x=>x.id==='${id}'),'rec2','enf')">Cofirmo: el recuento coincide</button>`);
  }
  if (paso === 'pausa') return a('Pausa · en voz alta', `<p class="sub" style="margin:0 0 8px">Paciente, procedimiento, sitio, tiempo estimado y profilaxis antibiótica confirmados por todo el equipo.</p><button class="btn" data-a="pausa-${id}-${rol}" onclick="firmar(S.cx.find(x=>x.id==='${id}'),'pausa','${rol}')">Confirmo la Pausa (${ROL[rol].n})</button>`);
  if (paso === 'recup') {
    const v = S.ui.ald[id] = S.ui.ald[id] || [2, 2, 2, 2, 2], tot = v.reduce((x, y) => x + Number(y), 0);
    return a('Escala de Aldrete', `<div class="ald">${ALDRETE.map(([n, o], j) => `<label>${n}<select onchange="S.ui.ald['${id}'][${j}]=+this.value;render()">${o.map((t, q) => `<option value="${q}" ${v[j] === q ? 'selected' : ''}>${q} · ${t}</option>`).join('')}</select></label>`).join('')}</div>
      <div class="barra-acc"><b style="font-size:1.4rem;color:${tot >= 9 ? 'var(--ok)' : 'var(--inst)'}">${tot}/10</b><button class="btn" data-a="ald-${id}" onclick="aldrete('${id}')">${tot >= 9 ? 'Dar el alta de recuperación' : 'Registrar (sigue en recuperación)'}</button></div>`);
  }
  return '';
}

/* ---------- Avisos flotantes y festejo ---------- */
function toast(txt, color) {
  if (S && S.silencio) return;
  const t = document.createElement('div'); t.className = 'toast'; t.style.setProperty('--k', color || '#a78bfa'); t.innerHTML = txt;
  $('#toasts').prepend(t);
  setTimeout(() => t.classList.add('fuera'), 3800); setTimeout(() => t.remove(), 4300);
  while ($('#toasts').children.length > 4) $('#toasts').lastChild.remove();
}
function festejo(n = 160) {
  if (S && S.silencio) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#conf'), cx = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
  const col = ['#0f766e', '#2f6fd0', '#6d5bd0', '#b7791f', '#16a34a', '#c2415d'];
  const ps = Array.from({ length: n }, () => ({ x: innerWidth / 2, y: innerHeight * .6, vx: (Math.random() - .5) * 16, vy: -Math.random() * 16 - 6, r: Math.random() * 6 + 3, c: col[Math.floor(Math.random() * col.length)], a: Math.random() * 6 }));
  let f = 0;
  (function paso() { cx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach((p) => { p.x += p.vx; p.y += p.vy; p.vy += .45; p.a += .2; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); cx.restore(); });
    if (++f < 150) requestAnimationFrame(paso); else cx.clearRect(0, 0, cv.width, cv.height); })();
}

  { sec: ['cir', 'anest', 'enf'], k: 'ferrari', tab: 'hoy', t: 'Pausa quirúrgica', d: 'Antes de la incisión firman cirujano, anestesia y enfermería, cada uno desde su cuenta.', hint: 'Firme la Pausa como cirujano; después entre como Arce y como Ruiz.',
    ya() { hacer('ferrari', () => firmar(S.cx[0], 'pausa', 'cir')); hacer('arce', () => firmar(S.cx[0], 'pausa', 'anest')); hacer('ruiz', () => firmar(S.cx[0], 'pausa', 'enf')); } },
  { sec: ['inst', 'enf'], k: 'gomez', tab: 'hoy', t: 'Recuento final y cofirma', d: 'Si falta una gasa, la app no deja seguir hasta que coincida. Después cofirma Enfermería.', hint: 'Cargue el recuento final (pruebe con una gasa menos) y fírmelo.',
    ya() { hacer('gomez', () => { S.ui.cnt.cx1rec2 = { gasas: 10, compresas: 5, agujas: 3, instr: 42 }; recuento('cx1', 'rec2'); }); hacer('ruiz', () => firmar(S.cx[0], 'rec2', 'enf')); } },
  { sec: ['enf'], k: 'ruiz', tab: 'hoy', t: 'Salida', d: 'Enfermería cierra la Lista de Verificación. Recién ahí puede anotarse en otra sala.', hint: 'Marque los 4 puntos y firme la Salida.',
    ya() { hacer('ruiz', () => firmar(S.cx[0], 'salida', 'enf')); } },
  { sec: ['anest'], k: 'arce', tab: 'hoy', t: 'Alta de recuperación (Aldrete)', d: 'Con 9 o más, el paciente puede salir de recuperación y el recorrido queda completo.', hint: 'Revise la escala y toque «Dar el alta de recuperación».',
    ya() { hacer('arce', () => aldrete('cx1')); } },
  { sec: ['anest', 'jefa'], k: 'arce', tab: 'mimes', t: 'Mi mes', d: 'Cada anestesiólogo ve su calendario: días de planta con su sala, guardias, francos y horas del mes.', hint: 'Mire sus días; el día de hoy está marcado con borde blanco.',
    ya() {} },
  { sec: ['jefe', 'dir'], k: 'direccion', tab: 'vivo', t: 'Tablero en vivo', d: 'Todas las salas: en qué paso está cada cirugía y a quién espera. La Jefatura puede avisar; la Dirección, solo mirar.', hint: 'Recorra las tarjetas de cada sala y los últimos movimientos.',
    ya() {} },
];
/* Cada capítulo, ¿ya está hecho? Sale del estado del demo, en el mismo orden
   que la guía: así el camino se tilda solo y no se saltea nada. */
const pasoHecho = (k) => estado(S.cx[0]).p.find((p) => p.k === k).hecho;
const CAP_HECHO = [
  () => S.mes.estado !== 'borrador', () => S.mes.estado === 'validada', () => !!(S.vistos.cob && S.vistos.prog),
  () => S.sol.length > 0, () => S.sol.length > 0 && !S.sol.some((x) => x.estado === 'pendiente'),
  () => !!S.cx[0].anest, () => !!S.cx[0].circ, () => !!S.cx[0].inst,
  () => pasoHecho('entrada'), () => pasoHecho('rec1'), () => pasoHecho('pausa'), () => pasoHecho('rec2'), () => pasoHecho('salida'), () => pasoHecho('recup'),
  () => !!S.vistos.mimes, () => !!S.vistos.vivo,
];
const capActual = () => CAP_HECHO.findIndex((f) => !f());
function progresoHTML() {
  const ca = capActual(), n = ESC.length, h = ca < 0 ? n : ca, L = 2 * Math.PI * 22;
  return `<div class="progreso-g"><svg class="anillo" viewBox="0 0 54 54" aria-hidden="true"><circle cx="27" cy="27" r="22" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="27" cy="27" r="22" fill="none" stroke="var(--ok)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${L * h / n} ${L}" transform="rotate(-90 27 27)"/><text x="27" y="31" text-anchor="middle" font-size="12" font-weight="800" fill="currentColor">${h}/${n}</text></svg>
    <div><b>${ca < 0 ? '🎉 Recorrió todo el manual' : h ? `Va por el capítulo ${ca + 1}: ${ESC[ca].t}` : `El recorrido: ${n} capítulos, uno detrás del otro`}</b><small>${ca < 0 ? 'Puede repetir cualquier capítulo o entrar libremente con cualquier persona.' : h ? `${h} de ${n} capítulos hechos. La guía sigue exactamente desde acá.` : 'De la lista mensual de Anestesia a la cirugía terminada, en orden, sin saltear nada.'}</small></div>
    ${ca < 0 ? '' : `<button class="btn" data-a="seguir-guia" onclick="empezarGuia()">${h ? '▶ Seguir donde quedé' : '🧭 Empezar el recorrido'}</button>`}</div>`;
}
const escSector = (sec) => ESC.map((e, i) => [e, i]).filter(([e]) => sec === 'todos' || e.sec.includes(sec));
function preparar(hasta) { nuevo(); S.silencio = true; for (let i = 0; i < hasta; i++) ESC[i].ya(); S.silencio = false; S.yo = null; S.modal = null; }

/* ---------- Guía paso a paso ----------
   En lugar de una película, la app le marca a la persona QUÉ tocar (un aro que
   late y un globito). Cuando lo toca, el demo avanza y marca lo siguiente.
   Se calcula siempre del estado: si la persona se sale del camino, la guía la
   vuelve a llevar. */
function empezarGuia(i) {
  if (i != null) { preparar(i); if (i > 2) S.vistos.cob = S.vistos.prog = true; if (i > 14) S.vistos.mimes = true; if (i > 15) S.vistos.vivo = true; }
  S.guiaOn = true; S.guiaMin = false; S.mision = ''; S.ultFoco = null; S.capPrev = capActual(); S.capRecien = null; render(); scrollTo({ top: 0, behavior: 'smooth' });
}
function salirGuia() { S.guiaOn = false; render(); }
function visto(k) { S.vistos[k] = true; S.ultFoco = null; render(); }
/* El próximo objetivo: quién, en qué pestaña y qué tocar. */
function objetivo() {
  const paso = (k, tab, sel, txt, extra) => Object.assign({ k, tab, sel, txt }, extra || {});
  if (S.mes.estado === 'borrador') {
    const faltan = Array.from({ length: NDIAS }, (_, i) => i + 1).some((d) => !cobertura(d).ok);
    return faltan ? paso('bianchi', 'lista', 'sugerir', 'La Jefa de Anestesia arma la lista del mes. Toque «Sugerir cobertura» y mire cómo se llena sola.')
      : paso('bianchi', 'lista', 'enviar', 'Todos los días quedaron cubiertos (🟢). Ahora toque «Enviar a Jefatura».');
  }
  if (S.mes.estado === 'enviada') return paso('jefatura', 'lista', 'validar', 'La Jefatura revisa la lista que le mandaron. Toque «Validar la lista».');
  if (!S.vistos.cob) return paso('jefatura', 'cob', null, 'Coberturas del día: quién está en cada sala, la guardia de 24 h y los francos. Puede tocar otros días arriba.', { info: 'cob' });
  if (!S.vistos.prog) return paso('jefatura', 'prog', null, 'Programación de hoy, sala por sala; la línea rosa es la hora actual y debajo de cada sala, su anestesiólogo.', { info: 'prog' });
  if (!S.sol.length) {
    return paso('ferrari', 'nueva', 'f-enviar', 'El cirujano pide una cirugía. Ya completamos el formulario de ejemplo: toque «Enviar a Jefatura».');
  }
  const pend = S.sol.find((x) => x.estado === 'pendiente');
  if (pend) return paso('jefatura', 'sol', 'conf-' + pend.id, 'Llegó la solicitud. Toque «Confirmar y programar»: entra en la programación y se avisa al cirujano y al anestesiólogo.');
  const c = S.cx[0], e = estado(c), act = e.p[e.a];
  if (act) {
    const x = act.firmas.find((y) => !y.f), k = x.k || { anest: 'arce', circ: 'ruiz', enf: 'ruiz', inst: 'gomez', cir: 'ferrari' }[x.rol];
    const base = (sel, txt) => paso(k, 'hoy', sel, txt, { cx: 'cx1' });
    if (G[k].f === 'anest' && !S.llegada[k]) return paso(k, 'hoy', 'llegue', 'Primero el anestesiólogo marca que llegó. Toque «Llegué».');
    const key = 'cx1' + act.k + x.rol;
    if (act.k === 'equipo') return base(`anotar-cx1-${x.rol}`, { anest: 'Toque «Confirmo que doy la anestesia» en el Quirófano 1.', circ: 'La enfermera se anota en su sala: toque «Me anoto como circulante».', inst: 'La instrumentadora se anota: sin esto no se habilita el recuento. Toque «Me anoto como instrumentador/a».' }[x.rol]);
    if (CHECK[act.k + '.' + x.rol]) {
      const marc = S.ui.chk[key] || [], j = CHECK[act.k + '.' + x.rol].findIndex((_, q) => !marc[q]);
      return j >= 0 ? base(`chk-${key}-${j}`, `${act.n}: marque este punto de la lista (${j + 1} de ${CHECK[act.k + '.' + x.rol].length}).`)
        : base(`firmar-${key}`, `Lista completa. Toque «Firmar ${act.n}».`);
    }
    if (act.k === 'rec1') {
      const v = S.ui.cnt.cx1rec1 || {};
      return RECUENTO.some(([q]) => v[q]) ? base('rec-cx1-rec1', 'Cuando termine de contar, toque «Firmar el recuento inicial».') : base('mas-cx1rec1-gasas', 'Recuento inicial: toque «+» para contar las gasas (y lo mismo con lo demás).');
    }
    if (act.k === 'rec2' && x.rol === 'inst') {
      const v = S.ui.cnt.cx1rec2 || {};
      return RECUENTO.some(([q]) => v[q]) ? base('rec-cx1-rec2', 'Toque «Firmar el recuento final». Si no coincide con el inicial, la app no deja seguir.') : base('mas-cx1rec2-gasas', 'Recuento final: cuente otra vez con «+». Tiene que dar lo mismo que al empezar.');
    }
    if (act.k === 'rec2') return base('cofirma-cx1', 'Enfermería cofirma el recuento. Toque «Cofirmo: el recuento coincide».');
    if (act.k === 'pausa') return base(`pausa-cx1-${x.rol}`, `Pausa antes de la incisión: toque «Confirmo la Pausa (${ROL[x.rol].n})».`);
    if (act.k === 'recup') return base('ald-cx1', 'Último paso: revise la escala de Aldrete y toque «Dar el alta de recuperación».');
  }
  if (!S.vistos.mimes) return paso('arce', 'mimes', null, 'Cada anestesiólogo ve su mes: días de planta con la sala, guardias, francos y horas.', { info: 'mimes' });
  if (!S.vistos.vivo) return paso('direccion', 'vivo', null, 'La Dirección Médica ve todas las salas en vivo, con cada firma, quién y a qué hora. Solo mira.', { info: 'vivo' });
  return null;
}
/* Qué tocar AHORA para llegar al objetivo: primero entrar como esa persona,
   después la pestaña, después abrir la cirugía, y recién ahí la acción. */
function focoGuia() {
  const o = objetivo();
  if (!o) return { fin: true, txt: 'Recorrió todo: la lista del mes, la solicitud y la cirugía completa, paso a paso y en orden.' };
  if (S.modal) return { sel: 'modal-no', txt: 'Ese paso no le toca ahora. Toque «Cancelar» y siga con la guía.', o };
  const tabN = ((tabsDe(o.k).find(([t]) => t === o.tab) || [0, ''])[1]).replace(/^\S+\s/, '').replace(/\s*\(\d+\)$/, '');
  const mini = ['Entrar como ' + G[o.k].n.split(' ').slice(0, 2).join(' '), 'Pestaña «' + tabN + '»'].concat(o.cx ? ['Abrir la cirugía'] : [], [o.info ? 'Mirar la pantalla' : 'Tocar lo marcado']);
  const base = { o, mini };
  if (S.yo !== o.k) return Object.assign(base, { miniI: 0, sel: 'guia-entrar', txt: `Esto lo hace <b>${G[o.k].n}</b>. Toque «Entrar como…» acá abajo: la app abre su cuenta.` });
  if (S.tab !== o.tab) return Object.assign(base, { miniI: 1, sel: 'tab-' + o.tab, txt: `Toque la pestaña <b>«${tabN}»</b>, arriba (está marcada con 👆).` });
  if (o.cx && S.abierta !== o.cx) return Object.assign(base, { miniI: 2, sel: 'abrir-' + o.cx, txt: 'Abra la cirugía del <b>Quirófano 1</b> tocando su tarjeta.' });
  if (o.info) return Object.assign(base, { miniI: mini.length - 1, sel: null, info: o.info, txt: o.txt });
  return Object.assign(base, { miniI: mini.length - 1, sel: o.sel, txt: o.txt });
}
function ponerMano(el, mano) {
  const r = el.getBoundingClientRect();
  mano.style.left = Math.min(r.right + scrollX - 16, scrollX + innerWidth - 34) + 'px';
  mano.style.top = (r.bottom + scrollY - 12) + 'px';
}
/* Que lo marcado quede a la vista y por encima del panel de la guía. */
function asegurarVisible(el) {
  const r = el.getBoundingClientRect(), co = $('.coach');
  const tope = co ? Math.min(innerHeight, co.getBoundingClientRect().top) : innerHeight;
  if (r.top < 64 || r.bottom > tope - 12) scrollTo({ top: Math.max(0, r.top + scrollY - Math.max(72, (tope - r.height) / 2)), behavior: 'smooth' });
}
function pintarGuia() {
  document.querySelectorAll('.guia-foco').forEach((x) => x.classList.remove('guia-foco'));
  const m0 = $('#mano'); if (m0) m0.remove();
  if (!S.guiaOn || S.login) return;
  const ca = capActual();
  if (S.capPrev != null && ca !== S.capPrev && (ca < 0 || ca > S.capPrev)) { S.capRecien = { t: ESC[S.capPrev].t, hasta: Date.now() + 7000 }; const c = $('.coach'); if (c && !c.querySelector('.coach-hecho')) { S.capPrev = ca; render(); return; } }
  S.capPrev = ca;
  if (S.guiaMin) return;
  const f = focoGuia();
  const el = f.sel ? document.querySelector(`[data-a="${f.sel}"]`) : null;
  if (el) {
    el.classList.add('guia-foco');
    if (!el.closest('.coach')) { const mano = document.createElement('div'); mano.id = 'mano'; mano.className = 'mano'; mano.textContent = '👆'; mano.setAttribute('aria-hidden', 'true'); document.body.appendChild(mano); ponerMano(el, mano); }
    if (S.ultFoco !== f.sel) { S.ultFoco = f.sel; asegurarVisible(el); }
  }
  if (f.fin && !S.festejado) { S.festejado = true; festejo(); }
}
addEventListener('scroll', () => { const el = document.querySelector('.guia-foco'), mano = $('#mano'); if (el && mano) ponerMano(el, mano); }, { passive: true });
addEventListener('resize', () => { if (S && S.guiaOn) pintarGuia(); });


nuevo(); render();
addEventListener('click', (e) => { if (S.bandeja && !e.target.closest('.campana')) { S.bandeja = false; render(); } });
</script>
</body>
