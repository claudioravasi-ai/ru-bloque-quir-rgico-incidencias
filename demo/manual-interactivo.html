<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HRU · Manual interactivo</title>
<meta name="description" content="Demo interactivo: del ingreso de cada integrante del equipo a la cirugía terminada, la lista mensual de Anestesiología y las coberturas de guardia y planta.">
<style>
:root {
  --bg: #0a0f1f; --bg2: #111833; --ink: #f1f5f9; --mut: #94a3b8; --line: rgba(255,255,255,.1); --glass: rgba(255,255,255,.055); --glass2: rgba(255,255,255,.09);
  --anest: #a78bfa; --jefa: #e879f9; --enf: #2dd4bf; --inst: #fbbf24; --cir: #60a5fa; --jefe: #fb7185; --ok: #4ade80; --mal: #f87171;
  --r: 18px; font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { min-height: 100vh; overflow-x: hidden; }
button { font-family: inherit; cursor: pointer; }
.fondo { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.fondo i { position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%; filter: blur(80px); opacity: .33; animation: flota 22s ease-in-out infinite alternate; }
.fondo i:nth-child(1) { background: #7c3aed; left: -12vmax; top: -14vmax; }
.fondo i:nth-child(2) { background: #0d9488; right: -16vmax; top: 18vh; animation-delay: -6s; }
.fondo i:nth-child(3) { background: #db2777; left: 20vw; bottom: -24vmax; animation-delay: -12s; }
@keyframes flota { to { transform: translate(6vmax, 4vmax) scale(1.12); } }
#app { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 14px 16px 150px; }

/* ---------- barra superior ---------- */
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 12px; border-radius: 22px; background: rgba(10,15,31,.7); backdrop-filter: blur(14px); border: 1px solid var(--line); position: sticky; top: 10px; z-index: 20; }
.marca { display: flex; align-items: center; gap: 9px; font-weight: 800; letter-spacing: -.01em; }
.marca span { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: conic-gradient(from 200deg, #a78bfa, #2dd4bf, #fbbf24, #fb7185, #a78bfa); animation: gira 8s linear infinite; }
.marca span b { width: 26px; height: 26px; border-radius: 8px; background: var(--bg); display: grid; place-items: center; font-size: .95rem; animation: gira 8s linear infinite reverse; }
@keyframes gira { to { transform: rotate(360deg); } }
.marca small { display: block; font-weight: 600; color: var(--mut); font-size: .68rem; }
.reloj { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 1.05rem; padding: 6px 12px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line); }
.reloj small { color: var(--mut); font-weight: 600; font-size: .7rem; margin-right: 6px; }
.esp { flex: 1; }
.yo { display: flex; align-items: center; gap: 10px; padding: 5px 14px 5px 5px; border-radius: 999px; background: color-mix(in srgb, var(--k) 18%, transparent); border: 1px solid color-mix(in srgb, var(--k) 50%, transparent); animation: entra .5s cubic-bezier(.2,1.4,.4,1); }
.yo b { display: block; font-size: .86rem; line-height: 1.15; } .yo small { color: color-mix(in srgb, var(--k) 70%, white); font-size: .7rem; font-weight: 700; }
.yo em { font-style: normal; background: var(--k); color: #0a0f1f; border-radius: 6px; padding: 0 6px; margin-left: 4px; }
.av { width: 38px; height: 38px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: .8rem; color: #0a0f1f; background: var(--k); box-shadow: 0 0 0 3px color-mix(in srgb, var(--k) 30%, transparent); position: relative; }
.av .bd { position: absolute; right: -4px; top: -4px; min-width: 18px; height: 18px; border-radius: 9px; background: #ef4444; color: #fff; font-size: .62rem; display: grid; place-items: center; padding: 0 4px; box-shadow: 0 0 0 2px var(--bg); animation: late 1.2s infinite; }
@keyframes late { 50% { transform: scale(1.18); } }
.btn { border: 0; border-radius: 12px; padding: 9px 14px; font-weight: 800; font-size: .84rem; color: #0a0f1f; background: var(--k, #e2e8f0); transition: transform .15s, box-shadow .2s, opacity .2s; box-shadow: 0 8px 22px -10px var(--k, #000); }
.btn:hover { transform: translateY(-2px); } .btn:active { transform: scale(.97); }
.btn:disabled { opacity: .35; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.fant { background: var(--glass2); color: var(--ink); box-shadow: none; border: 1px solid var(--line); }
.btn.chico { padding: 6px 10px; font-size: .76rem; border-radius: 10px; }

/* ---------- escenas / pestañas ---------- */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 16px 0 12px; }
.tabs button { border: 1px solid var(--line); background: var(--glass); color: var(--mut); padding: 9px 14px; border-radius: 999px; font-weight: 700; font-size: .84rem; transition: all .2s; }
.tabs button.on { background: var(--k); color: #0a0f1f; border-color: transparent; box-shadow: 0 8px 24px -10px var(--k); }
h2 { font-size: 1.45rem; margin: 18px 0 4px; letter-spacing: -.02em; }
.sub { color: var(--mut); margin: 0 0 14px; font-size: .9rem; line-height: 1.45; }
.card { background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; backdrop-filter: blur(10px); animation: sube .45s ease both; }
@keyframes sube { from { opacity: 0; transform: translateY(12px); } }
@keyframes entra { from { opacity: 0; transform: scale(.85); } }
.grid { display: grid; gap: 12px; }

/* ---------- ingreso ---------- */
.ingreso h1 { font-size: clamp(1.7rem, 4.6vw, 2.7rem); margin: 28px 0 6px; letter-spacing: -.03em; line-height: 1.05; }
.ingreso h1 span { background: linear-gradient(90deg, #a78bfa, #2dd4bf, #fbbf24, #fb7185); -webkit-background-clip: text; background-clip: text; color: transparent; background-size: 200%; animation: brillo 6s linear infinite; }
@keyframes brillo { to { background-position: 200%; } }
.sector { margin-top: 18px; } .sector > b { display: flex; align-items: center; gap: 8px; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--k); margin-bottom: 8px; }
.sector > b::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--k), transparent); opacity: .5; }
.gente { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.persona { display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px; border-radius: 16px; border: 1px solid var(--line); background: var(--glass); color: var(--ink); transition: all .2s; position: relative; overflow: hidden; }
.persona:hover { transform: translateY(-3px); border-color: var(--k); background: color-mix(in srgb, var(--k) 12%, transparent); }
.persona b { display: block; font-size: .86rem; } .persona small { color: var(--mut); font-size: .72rem; }
.login-ov { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(5,8,18,.75); backdrop-filter: blur(8px); animation: sube .25s; padding: 16px; }
.login { width: min(420px, 100%); border-radius: 26px; padding: 22px; background: linear-gradient(160deg, color-mix(in srgb, var(--k) 30%, #111833), #111833 60%); border: 1px solid color-mix(in srgb, var(--k) 50%, transparent); box-shadow: 0 40px 80px -30px var(--k); animation: entra .35s cubic-bezier(.2,1.3,.4,1); }
.login .av { width: 64px; height: 64px; font-size: 1.2rem; margin: 0 auto 10px; }
.login h3 { text-align: center; margin: 0; } .login p { text-align: center; color: var(--mut); margin: 4px 0 16px; font-size: .84rem; }
.campo { background: rgba(0,0,0,.3); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-size: .9rem; min-height: 42px; }
.campo small { display: block; color: var(--mut); font-size: .66rem; text-transform: uppercase; letter-spacing: .08em; }
.cursor::after { content: '▍'; animation: parpa .7s steps(2) infinite; color: var(--k); }
@keyframes parpa { 50% { opacity: 0; } }
.chequeos { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; }
.chequeos li { display: flex; gap: 8px; align-items: center; font-size: .84rem; animation: sube .3s both; }
.chequeos li i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--ok); color: #052e16; font-size: .7rem; font-weight: 900; }

/* ---------- tarjetas de cirugía y recorrido ---------- */
.cx { border-radius: 20px; padding: 0; overflow: hidden; border: 1px solid var(--line); background: var(--glass); margin-bottom: 12px; animation: sube .4s both; }
.cx.toca { border-color: var(--k); box-shadow: 0 0 0 1px var(--k), 0 20px 50px -28px var(--k); }
.cx-cab { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; cursor: pointer; }
.hora { font-weight: 900; font-size: 1.1rem; font-variant-numeric: tabular-nums; padding: 8px 10px; border-radius: 12px; background: rgba(0,0,0,.25); }
.cx-cab b { display: block; } .cx-cab small { color: var(--mut); font-size: .76rem; }
.sala-tag { display: inline-block; font-weight: 900; font-size: .7rem; padding: 2px 8px; border-radius: 6px; background: var(--s); color: #0a0f1f; margin-right: 6px; }
.metro { display: flex; align-items: center; gap: 0; }
.metro i { width: 13px; height: 13px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.18); position: relative; }
.metro i + i { margin-left: 10px; } .metro i + i::before { content: ''; position: absolute; right: 100%; top: 50%; width: 10px; height: 2px; background: rgba(255,255,255,.15); }
.metro i.hecho { background: var(--ok); border-color: var(--ok); } .metro i.hecho + i::before { background: var(--ok); }
.metro i.activo { background: var(--k); border-color: #fff; animation: late 1.1s infinite; }
.estado-l { padding: 8px 14px; border-top: 1px solid var(--line); font-size: .8rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: rgba(0,0,0,.14); }
.toca-txt { font-weight: 900; color: var(--k); } .espera-txt { color: var(--mut); }
.pasos { list-style: none; margin: 0; padding: 6px 14px 14px; position: relative; }
.paso { display: grid; grid-template-columns: 36px 1fr; gap: 12px; padding: 10px 0; position: relative; }
.paso::before { content: ''; position: absolute; left: 17px; top: 46px; bottom: -10px; width: 2px; background: rgba(255,255,255,.1); }
.paso:last-child::before { display: none; }
.paso.hecho::before { background: var(--ok); }
.num { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.14); font-size: .9rem; z-index: 1; }
.paso.hecho .num { background: var(--ok); color: #052e16; border-color: var(--ok); animation: entra .4s; }
.paso.activo .num { background: var(--k); color: #0a0f1f; border-color: #fff; box-shadow: 0 0 0 6px color-mix(in srgb, var(--k) 25%, transparent); }
.paso.bloq { opacity: .5; } .paso.bloq .num { animation: none; }
.paso h4 { margin: 6px 0 2px; font-size: .95rem; } .paso > div > small { color: var(--mut); font-size: .76rem; }
.firmas { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.firma { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; font-size: .74rem; background: rgba(255,255,255,.06); border: 1px dashed rgba(255,255,255,.2); }
.firma .av { width: 22px; height: 22px; font-size: .55rem; box-shadow: none; }
.firma.ok { border-style: solid; border-color: color-mix(in srgb, var(--ok) 60%, transparent); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.firma.libre .av { background: rgba(255,255,255,.15); color: var(--mut); }
.accion { margin-top: 8px; padding: 12px; border-radius: 14px; background: color-mix(in srgb, var(--k) 12%, rgba(0,0,0,.2)); border: 1px solid color-mix(in srgb, var(--k) 45%, transparent); animation: sube .35s; }
.accion > b { display: block; font-size: .82rem; margin-bottom: 8px; color: color-mix(in srgb, var(--k) 70%, white); }
.falta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: space-between; margin-top: 6px; padding: 8px 10px; border-radius: 12px; background: rgba(0,0,0,.2); font-size: .78rem; color: var(--mut); }
.bloqueo { margin-top: 8px; padding: 10px 12px; border-radius: 12px; font-size: .8rem; background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.35); color: #fecaca; }
.chk { display: grid; gap: 6px; margin-bottom: 10px; }
.chk label { display: flex; gap: 9px; align-items: center; padding: 8px 10px; border-radius: 10px; background: rgba(0,0,0,.2); font-size: .82rem; cursor: pointer; transition: background .2s; }
.chk label.si { background: color-mix(in srgb, var(--ok) 15%, transparent); }
.chk input { width: 18px; height: 18px; accent-color: var(--ok); }
.cont { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 10px; }
.cont div { padding: 8px 10px; border-radius: 12px; background: rgba(0,0,0,.22); font-size: .76rem; }
.cont div.mal { background: rgba(248,113,113,.18); box-shadow: inset 0 0 0 1px var(--mal); animation: tiembla .4s; }
@keyframes tiembla { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.cont span { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.cont button { width: 30px; height: 30px; border-radius: 9px; border: 0; background: var(--glass2); color: var(--ink); font-weight: 900; font-size: 1rem; }
.cont output { min-width: 34px; text-align: center; font-weight: 900; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.aviso-mal { padding: 8px 10px; border-radius: 10px; background: rgba(248,113,113,.15); color: #fecaca; font-size: .8rem; margin-bottom: 8px; }
.ald { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; margin-bottom: 10px; }
.ald label { font-size: .74rem; color: var(--mut); display: grid; gap: 3px; }
.ald select { background: rgba(0,0,0,.35); color: var(--ink); border: 1px solid var(--line); border-radius: 9px; padding: 6px; font-family: inherit; }
.ahora { display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 22px; margin-bottom: 14px; background: linear-gradient(120deg, color-mix(in srgb, var(--k) 35%, transparent), rgba(255,255,255,.04)); border: 1px solid color-mix(in srgb, var(--k) 45%, transparent); animation: sube .4s; }
.ahora .big { font-size: 2rem; } .ahora b { display: block; font-size: 1.05rem; } .ahora small { color: color-mix(in srgb, var(--k) 40%, white); font-size: .82rem; }

/* ---------- lista del mes ---------- */
.mes-wrap { overflow-x: auto; border-radius: 16px; border: 1px solid var(--line); background: rgba(0,0,0,.2); }
table.mes { border-collapse: separate; border-spacing: 3px; font-size: .72rem; min-width: 100%; }
.mes th { color: var(--mut); font-weight: 700; padding: 4px 2px; min-width: 30px; }
.mes th.fs { color: #f9a8d4; } .mes th.hoy { color: #fff; background: var(--k); border-radius: 8px; }
.mes td.nom { position: sticky; left: 0; background: #12183a; padding: 4px 8px; white-space: nowrap; font-weight: 700; border-radius: 8px; z-index: 1; }
.mes td.nom i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--p); margin-right: 6px; }
.cel { width: 30px; height: 30px; border-radius: 8px; border: 0; font-weight: 900; font-size: .72rem; background: rgba(255,255,255,.05); color: var(--mut); transition: transform .15s; }
.cel:hover { transform: scale(1.15); }
.cel.P { background: #2dd4bf; color: #042f2e; } .cel.G { background: #a78bfa; color: #1e1b4b; } .cel.F { background: #475569; color: #e2e8f0; } .cel.L { background: #fbbf24; color: #451a03; }
.cel.pop { animation: pop .35s; } @keyframes pop { 50% { transform: scale(1.35) rotate(-6deg); } }
.mes tr.cob td { text-align: center; font-size: .9rem; }
.leyenda { display: flex; gap: 12px; flex-wrap: wrap; font-size: .76rem; color: var(--mut); margin: 10px 0; }
.leyenda span { display: inline-flex; align-items: center; gap: 5px; } .leyenda .cel { width: 22px; height: 22px; font-size: .6rem; display: inline-grid; place-items: center; }
.sello { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-weight: 800; font-size: .76rem; }
.sello.borrador { background: rgba(251,191,36,.18); color: #fde68a; } .sello.enviada { background: rgba(96,165,250,.18); color: #bfdbfe; } .sello.validada { background: rgba(74,222,128,.18); color: #bbf7d0; }
.barra-acc { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }

/* ---------- calendario personal y cobertura ---------- */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal .dn { text-align: center; color: var(--mut); font-size: .7rem; font-weight: 800; }
.cal .d { aspect-ratio: 1; border-radius: 14px; padding: 6px; background: rgba(255,255,255,.04); border: 1px solid var(--line); display: flex; flex-direction: column; justify-content: space-between; font-size: .72rem; animation: entra .3s both; }
.cal .d b { font-size: .85rem; } .cal .d.P { background: rgba(45,212,191,.22); border-color: #2dd4bf; } .cal .d.G { background: rgba(167,139,250,.28); border-color: #a78bfa; }
.cal .d.F { background: rgba(71,85,105,.3); } .cal .d.L { background: rgba(251,191,36,.2); border-color: #fbbf24; } .cal .d.hoy { box-shadow: 0 0 0 3px #fff; }
.cal .d small { font-weight: 800; line-height: 1.1; }
.totales { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin: 12px 0; }
.totales div { padding: 12px; border-radius: 16px; background: var(--glass); border: 1px solid var(--line); }
.totales b { display: block; font-size: 1.6rem; font-weight: 900; } .totales small { color: var(--mut); font-size: .74rem; }
.dias { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; }
.dias button { flex: none; width: 46px; padding: 6px 0; border-radius: 12px; border: 1px solid var(--line); background: var(--glass); color: var(--ink); font-weight: 800; font-size: .82rem; }
.dias button small { display: block; font-size: .6rem; color: var(--mut); font-weight: 700; }
.dias button.on { background: var(--k); color: #0a0f1f; } .dias button.on small { color: #0a0f1f; }
.dias button.fs { opacity: .6; }
.cob { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.cob .card { display: flex; gap: 10px; align-items: center; }
.cob .card .lbl { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--mut); font-weight: 800; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: #64748b; margin-right: 4px; } .dot.si { background: var(--ok); box-shadow: 0 0 10px var(--ok); }

/* ---------- tablero en vivo y programación ---------- */
.tablero { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.sala-card { border-radius: 20px; padding: 14px; background: linear-gradient(160deg, color-mix(in srgb, var(--s) 22%, transparent), rgba(255,255,255,.03)); border: 1px solid color-mix(in srgb, var(--s) 45%, transparent); animation: sube .4s both; }
.sala-card h3 { margin: 0; font-size: 1.05rem; display: flex; justify-content: space-between; align-items: center; }
.sala-card p { margin: 4px 0 10px; color: var(--mut); font-size: .8rem; }
.prog { height: 8px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; margin: 8px 0; }
.prog i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--s), var(--ok)); transition: width .6s cubic-bezier(.2,1,.3,1); }
.vivo { display: inline-flex; align-items: center; gap: 5px; font-size: .68rem; font-weight: 900; color: #fecaca; } .vivo::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; animation: late 1s infinite; }
.linea-t { position: relative; border-radius: 16px; border: 1px solid var(--line); background: rgba(0,0,0,.2); padding: 10px 10px 10px 70px; overflow-x: auto; }
.linea-t .fila { position: relative; height: 46px; margin-bottom: 6px; min-width: 560px; }
.linea-t .fila > b { position: absolute; left: -62px; top: 12px; font-size: .78rem; }
.linea-t .bloque { position: absolute; top: 3px; height: 40px; border-radius: 10px; padding: 4px 8px; font-size: .7rem; overflow: hidden; white-space: nowrap; background: color-mix(in srgb, var(--s) 70%, #0a0f1f); color: #fff; border: 1px solid var(--s); }
.linea-t .bloque small { display: block; opacity: .85; }
.linea-t .regla { position: relative; height: 18px; min-width: 560px; font-size: .64rem; color: var(--mut); }
.linea-t .regla span { position: absolute; transform: translateX(-50%); }
.linea-t .ahora-l { position: absolute; top: 0; bottom: 0; width: 2px; background: #fb7185; box-shadow: 0 0 10px #fb7185; z-index: 2; }

/* ---------- guía inferior, avisos y película ---------- */
.guia { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 30; width: min(1150px, calc(100% - 24px)); display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  padding: 10px 12px; border-radius: 22px; background: rgba(10,15,31,.88); backdrop-filter: blur(16px); border: 1px solid var(--line); box-shadow: 0 30px 60px -20px rgba(0,0,0,.8); }

<script>
/* =====================================================================
   DEMO · Recorrido del equipo quirúrgico del HRU
   Todo es de ejemplo e inventado. No guarda nada: al recargar vuelve a
   empezar. Reglas que muestra:
   1. Cada persona entra con su cuenta y ve SU nombre, su función y su sala.
   2. Una persona = una sala. Para pasar a otra hay que hacer «cambio de sala».
   3. Cada paso se habilita recién cuando termina el anterior, y solo lo firma
      quien está anotado en ESA cirugía (si la instrumentadora no se anotó, no
      hay recuento inicial).
   ===================================================================== */
const $ = (s) => document.querySelector(s);
const pad = (n) => String(n).padStart(2, '0');
const espera = (ms) => new Promise((r) => setTimeout(r, ms / VEL));
let VEL = 1;

/* ---------- La gente (inventada) ---------- */
const FUNC = {
  anest: { n: 'Anestesiología', c: '#a78bfa', i: '💜' },
  enf: { n: 'Enfermería', c: '#2dd4bf', i: '🩺' },
  inst: { n: 'Instrumentación quirúrgica', c: '#fbbf24', i: '🧰' },
  cir: { n: 'Cirugía', c: '#60a5fa', i: '🔪' },
  jefe: { n: 'Jefatura de Quirófanos', c: '#fb7185', i: '🏥' },
  dir: { n: 'Dirección Médica', c: '#38bdf8', i: '🔎' },
};
const supervisa = (k) => k && ['jefe', 'dir'].includes(G[k].f);
const G = {
  bianchi: { n: 'Dra. Sofía Bianchi', f: 'anest', jefaAnest: true, mail: 'sbianchi' },
  arce: { n: 'Dr. Tomás Arce', f: 'anest', mail: 'tarce' },
  paz: { n: 'Dra. Lucía Paz', f: 'anest', mail: 'lpaz' },
  molina: { n: 'Dr. Iván Molina', f: 'anest', mail: 'imolina' },
  quiroga: { n: 'Dra. Ana Quiroga', f: 'anest', mail: 'aquiroga' },
  herrera: { n: 'Dr. Luis Herrera', f: 'anest', mail: 'lherrera' },
  ruiz: { n: 'Lic. Marta Ruiz', f: 'enf', mail: 'mruiz' },
  sosa: { n: 'Enf. Jorge Sosa', f: 'enf', mail: 'jsosa' },
  gomez: { n: 'Inst. Carla Gómez', f: 'inst', mail: 'cgomez' },
  vera: { n: 'Inst. Diego Vera', f: 'inst', mail: 'dvera' },
  ferrari: { n: 'Dr. Pablo Ferrari', f: 'cir', mail: 'pferrari', serv: 'Cirugía General' },
  luna: { n: 'Dra. Elena Luna', f: 'cir', mail: 'eluna', serv: 'Gastroenterología' },
  rios: { n: 'Dr. Martín Ríos', f: 'cir', mail: 'mrios', serv: 'Obstetricia' },
  jefatura: { n: 'Jefatura de Quirófanos', f: 'jefe', mail: 'jefatura' },
  direccion: { n: 'Dirección Médica', f: 'dir', mail: 'direccion' },
};
const ANEST = ['bianchi', 'arce', 'paz', 'molina', 'quiroga', 'herrera'];
const PCOL = { bianchi: '#e879f9', arce: '#a78bfa', paz: '#818cf8', molina: '#c084fc', quiroga: '#f0abfc', herrera: '#7dd3fc' };
const colorDe = (k) => G[k].jefaAnest ? 'var(--jefa)' : FUNC[G[k].f].c;
const ini = (n) => n.replace(/^(Dra?|Lic|Enf|Inst)\.\s*/, '').split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();
const avatar = (k, extra = '') => `<span class="av" style="--k:${colorDe(k)}">${k === 'jefatura' ? '🏥' : k === 'direccion' ? '🔎' : ini(G[k].n)}${extra}</span>`;

/* ---------- El día del demo: hoy (o el lunes siguiente si cae fin de semana) ---------- */
const DIA = (() => { const d = new Date(); d.setHours(12); while ([0, 6].includes(d.getDay())) d.setDate(d.getDate() + 1); return d; })();
const ANIO = DIA.getFullYear(), MES = DIA.getMonth(), HOY = DIA.getDate();
const NDIAS = new Date(ANIO, MES + 1, 0).getDate();
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const DS = ['Do', 'Lu', 'Ma', 'Mi', 'Ju', 'Vi', 'Sá'];
const dow = (d) => new Date(ANIO, MES, d, 12).getDay();
const finde = (d) => [0, 6].includes(dow(d));

const SALAS = [
  { id: 'Q1', n: 'Quirófano 1', c: '#f472b6' }, { id: 'Q2', n: 'Quirófano 2', c: '#38bdf8' }, { id: 'Q3', n: 'Quirófano 3', c: '#a3e635' },
  { id: 'END', n: 'Endoscopía', c: '#fb923c' }, { id: 'OBS', n: 'Obstetricia', c: '#c084fc' },
];
const salaDe = (id) => SALAS.find((s) => s.id === id);
/* Puestos de planta de cada día hábil, en orden. Endoscopía y Obstetricia comparten anestesiólogo. */
const PUESTOS = [['Q1', 'Quirófano 1'], ['Q2', 'Quirófano 2'], ['Q3', 'Quirófano 3'], ['END', 'Endoscopía y Obstetricia']];

/* ---------- El recorrido de cada cirugía (igual que la app) ---------- */
const ACCION = { equipo: 'anotarse en esta cirugía', entrada: 'firmar la Entrada', rec1: 'hacer el recuento inicial', pausa: 'confirmar la Pausa', rec2: 'hacer el recuento final', salida: 'firmar la Salida', recup: 'dar el alta de recuperación' };
const ROL = { anest: { n: 'Anestesia', f: 'anest' }, circ: { n: 'Circulante', f: 'enf' }, enf: { n: 'Enfermería', f: 'enf' }, inst: { n: 'Instrumentación', f: 'inst' }, cir: { n: 'Cirujano/a', f: 'cir' } };
const PASOS = [
  { k: 'equipo', n: 'Equipo en sala', d: 'Cada uno se anota en su puesto', ic: '👥', roles: ['anest', 'circ', 'inst'] },
  { k: 'entrada', n: 'Entrada', d: 'Antes de la inducción · Lista OMS', ic: '🚪', roles: ['enf', 'anest'] },
  { k: 'rec1', n: 'Recuento inicial', d: 'Gasas, compresas, agujas e instrumental', ic: '🧮', roles: ['inst'] },
  { k: 'pausa', n: 'Pausa quirúrgica', d: 'Antes de la incisión, todos en voz alta', ic: '✋', roles: ['cir', 'anest', 'enf'] },
  { k: 'rec2', n: 'Recuento final', d: 'Antes del cierre: tiene que coincidir', ic: '🔢', roles: ['inst', 'enf'] },
  { k: 'salida', n: 'Salida', d: 'Antes de que el paciente deje la sala', ic: '🏁', roles: ['enf'] },
  { k: 'recup', n: 'Recuperación', d: 'Alta con escala de Aldrete ≥ 9', ic: '💚', roles: ['anest'] },
];
const CHECK = {
  'entrada.enf': ['Identidad del paciente confirmada (pulsera)', 'Sitio quirúrgico marcado', 'Consentimiento firmado', 'Alergias conocidas revisadas', 'Ayuno verificado'],
  'entrada.anest': ['Máquina y monitores controlados', 'Vía aérea evaluada', 'Riesgo de sangrado previsto'],
  'salida.enf': ['Procedimiento registrado', 'Muestras rotuladas', 'Problemas de equipos anotados', 'Indicaciones para recuperación'],
};
const RECUENTO = [['gasas', 'Gasas'], ['compresas', 'Compresas'], ['agujas', 'Agujas'], ['instr', 'Instrumental']];
const ALDRETE = [['Actividad', ['Ninguna', 'Mueve 2 miembros', 'Mueve 4 miembros']], ['Respiración', ['Apnea', 'Disnea', 'Respira profundo']],
  ['Circulación', ['PA ±50%', 'PA ±20-50%', 'PA ±20%']], ['Conciencia', ['No responde', 'Despierta al llamarla', 'Despierta']], ['Saturación', ['< 90% con O₂', '> 90% con O₂', '> 92% aire']]];

/* ---------- Estado del demo ---------- */
let S;
function nuevo() {
  S = {
    yo: null, tab: null, min: 7 * 60 + 25, abierta: 'cx1', narr: '', bandeja: false, peli: false, modal: null, login: null,
    llegada: {}, avisos: {}, log: [], ui: { chk: {}, cnt: {}, ald: {} }, diaCob: HOY,
    sol: [], sector: (S && S.sector) || 'todos', mision: '', silencio: false,
    mes: { estado: 'borrador', g: {} },
    cx: [
      { id: 'cx1', sala: 'Q1', hora: '08:00', fin: '09:30', proc: 'Apendicectomía laparoscópica', pac: 'Paciente de ejemplo A', cir: 'ferrari' },
      { id: 'cx2', sala: 'Q2', hora: '08:30', fin: '10:30', proc: 'Colecistectomía laparoscópica', pac: 'Paciente de ejemplo B', cir: 'luna' },
      { id: 'cx3', sala: 'END', hora: '09:00', fin: '09:45', proc: 'Videocolonoscopía', pac: 'Paciente de ejemplo C', cir: 'luna' },
      { id: 'cx4', sala: 'OBS', hora: '10:00', fin: '11:15', proc: 'Cesárea programada', pac: 'Paciente de ejemplo D', cir: 'rios' },
      { id: 'cx5', sala: 'Q3', hora: '11:00', fin: '12:30', proc: 'Hernioplastia inguinal', pac: 'Paciente de ejemplo E', cir: 'ferrari' },
      { id: 'cx6', sala: 'Q1', hora: '10:30', fin: '12:00', proc: 'Colectomía derecha', pac: 'Paciente de ejemplo F', cir: 'ferrari' },
    ].map((c) => Object.assign(c, { anest: null, circ: null, inst: null, f: {}, rec1: null, rec2: null, ald: null })),
  };
  // Borrador: la Jefa de Anestesia ya cargó los primeros días; hay una licencia.
  ANEST.forEach((k) => { S.mes.g[k] = Array(NDIAS + 1).fill(''); });
  const sug = sugerencia();
  for (let d = 1; d <= Math.min(NDIAS, 9); d++) ANEST.forEach((k) => { S.mes.g[k][d] = sug[k][d]; });
  licencias().forEach((d) => { S.mes.g.quiroga[d] = 'L'; });
}
function licencias() { const r = []; for (let d = HOY + 6; d <= Math.min(NDIAS, HOY + 10); d++) r.push(d); return r; }
const reloj = () => `${pad(Math.floor(S.min / 60))}:${pad(S.min % 60)}`;
function avanza(m) { S.min += m || 2 + Math.floor(Math.random() * 4); }

/* ---------- Lista del mes: sugerencia automática ----------
   Guardia de 24 h rotativa; el día siguiente a la guardia es franco; los
   demás hacen planta de lunes a viernes. Se arma para que hoy Dr. Arce
   esté de planta en el Quirófano 1. */
function sugerencia() {
  const off = (6 - (HOY % 6)) % 6, lic = new Set(licencias()), g = {};
  ANEST.forEach((k) => { g[k] = Array(NDIAS + 1).fill(''); });
  for (let d = 1; d <= NDIAS; d++) {
    const gi = (d + off) % 6, fi = (d - 1 + off) % 6;
    let guard = ANEST[gi];
    if (G[guard] && lic.has(d) && guard === 'quiroga') guard = ANEST[(gi + 2) % 6];
    g[guard][d] = 'G';
    if (!lic.has(d) || ANEST[fi] !== 'quiroga') g[ANEST[fi]][d] = g[ANEST[fi]][d] || 'F';
    if (!finde(d)) for (let j = 1; j <= 5; j++) { const k = ANEST[(gi + j) % 6]; if (!g[k][d]) g[k][d] = 'P'; }
    if (lic.has(d)) g.quiroga[d] = 'L';
  }
  return g;
}
function cobertura(d) {
  const r = { P: [], G: [], F: [], L: [] };
  ANEST.forEach((k) => { const v = S.mes.g[k][d]; if (r[v]) r[v].push(k); });
  // Orden de puestos: rotación a partir de la guardia, como la sugerencia.
  const off = (6 - (HOY % 6)) % 6, gi = (d + off) % 6;
  r.P.sort((a, b) => ((ANEST.indexOf(a) - gi + 6) % 6) - ((ANEST.indexOf(b) - gi + 6) % 6));
  r.puestos = PUESTOS.map(([id, n], i) => ({ id, n, k: r.P[i] || null }));
  r.ok = finde(d) ? r.G.length === 1 : r.G.length === 1 && r.P.length >= 4;
  return r;
}
const puestoHoy = (k) => { const c = cobertura(HOY); const v = S.mes.g[k][HOY]; if (v === 'G') return { t: 'Guardia de 24 h', sala: null }; if (v === 'P') { const p = c.puestos.find((x) => x.k === k); return { t: 'Planta · ' + (p ? p.n : 'refuerzo'), sala: p ? p.id : null }; } return v === 'F' ? { t: 'Franco post-guardia' } : v === 'L' ? { t: 'Licencia' } : { t: 'Sin asignar' }; };

/* ---------- Reglas del recorrido ---------- */
const quien = (c, rol) => rol === 'anest' ? c.anest : rol === 'circ' || rol === 'enf' ? c.circ : rol === 'inst' ? c.inst : rol === 'cir' ? c.cir : null;
function estado(c) {
  const p = PASOS.map((x) => ({ ...x, firmas: x.roles.map((r) => ({ rol: r, f: c.f[x.k + '.' + r], k: quien(c, r) })) }));
  p.forEach((x) => { x.hecho = x.firmas.every((y) => y.f); });
  const a = p.findIndex((x) => !x.hecho);
  p.forEach((x, i) => { x.est = x.hecho ? 'hecho' : i === a ? 'activo' : 'bloq'; });
  return { p, a, hechos: p.filter((x) => x.hecho).length };
}
/* ¿Puede el usuario actual firmar este rol? Solo quien está anotado en ESA
   cirugía; con el puesto libre, solo anotarse (y si es de esa función). */
function puedo(c, rol, paso) {
  const yo = S.yo; if (!yo || supervisa(yo)) return false;
  const f = G[yo].f, q = quien(c, rol);
  if (ROL[rol].f !== f) return false;
  if (rol === 'cir') return q === yo;
  if (q) return q === yo;
  return paso === 'equipo';
}
/* Una persona, una sala: la otra cirugía del día donde figura y que todavía no tuvo la Salida. */
function ocupadoEn(k, salvo) {
  return S.cx.find((c) => c.id !== salvo && !c.f['salida.enf'] && [c.anest, c.circ, c.inst].includes(k));
}
const salaActual = (k) => { const c = ocupadoEn(k); return c ? c : null; };

/* ---------- Acciones ---------- */
function registrar(c, txt) { S.log.unshift({ t: reloj(), c: c ? salaDe(c.sala).n : '', txt }); }
function avisar(k, txt, de) {
  (S.avisos[k] = S.avisos[k] || []).unshift({ t: reloj(), txt, leido: false });
  if (S.yo === k) toast(txt, colorDe(k));
}
/* Cuando termina un paso, la app avisa sola a quienes tienen que firmar el siguiente. */
function avisarSiguientes(c, pasoPrevio) {
  const e = estado(c), act = e.p[e.a]; if (!act) return;
  const sala = salaDe(c.sala).n;
  act.firmas.filter((x) => !x.f).forEach((x) => {
    if (x.k) avisar(x.k, `🔔 Le toca ${ACCION[act.k]} en ${sala}${pasoPrevio ? ` (ya se completó «${pasoPrevio}»)` : ''}`);
  });
}
function firmar(c, paso, rol, extra) {
  const antes = estado(c).a;
  c.f[paso + '.' + rol] = Object.assign({ k: S.yo, t: reloj() }, extra || {});
  const pn = PASOS.find((p) => p.k === paso).n;
  registrar(c, `${G[S.yo].n} firmó «${pn}» como ${ROL[rol].n}`);
  avanza();
  const e = estado(c);

  setTimeout(() => t.classList.add('fuera'), 3800 / Math.max(1, VEL * .8)); setTimeout(() => t.remove(), 4300);
  while ($('#toasts').children.length > 4) $('#toasts').lastChild.remove();

function festejo(n = 160) {
  if (S && S.silencio) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#conf'), cx = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
  const col = ['#a78bfa', '#2dd4bf', '#fbbf24', '#fb7185', '#60a5fa', '#4ade80'];
  const ps = Array.from({ length: n }, () => ({ x: innerWidth / 2, y: innerHeight * .6, vx: (Math.random() - .5) * 16, vy: -Math.random() * 16 - 6, r: Math.random() * 6 + 3, c: col[Math.floor(Math.random() * col.length)], a: Math.random() * 6 }));
  let f = 0;
  (function paso() { cx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach((p) => { p.x += p.vx; p.y += p.vy; p.vy += .45; p.a += .2; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); cx.restore(); });
    if (++f < 150) requestAnimationFrame(paso); else cx.clearRect(0, 0, cv.width, cv.height); })();
}

    ${mias.length ? mias.map((x) => `<div class="card sol" style="margin-bottom:8px"><div><b>${x.proc}</b><br><small>${salaDe(x.sala).n} · ${x.hora}–${x.fin} h · anestesia ${x.anest.toLowerCase()}</small></div><span class="sello ${x.estado === 'pendiente' ? 'enviada' : x.estado === 'confirmada' ? 'validada' : 'borrador'}">${{ pendiente: '⏳ Esperando a Jefatura', confirmada: '✅ Confirmada', rechazada: '✖ Rechazada' }[x.estado]}</span></div>`).join('') : '<p class="sub">Todavía no envió solicitudes hoy.</p>'}`;
}
function enviarSolicitud() {
  const f = S.ui.form;
  if (!String(f.proc).trim()) { toast('Escriba el procedimiento.', '#fb7185'); return; }
  const ini0 = aMin(f.hora), fin0 = ini0 + Number(f.dur);
  const choca = S.cx.find((c) => c.sala === f.sala && aMin(c.hora) < fin0 && ini0 < aMin(c.fin));
  if (choca) { toast(`⛔ ${salaDe(f.sala).n} está ocupado de ${choca.hora} a ${choca.fin} h (${choca.proc}). Elija otra hora o sala.`, '#f87171'); return; }
  const x = { id: 's' + (S.sol.length + 1), cir: S.yo, proc: f.proc.trim(), sala: f.sala, hora: f.hora, fin: deMin(fin0), anest: f.anest, ins: f.ins, estado: 'pendiente', t: reloj() };
  S.sol.push(x); S.ui.form = null;
  registrar(null, `${G[S.yo].n} solicitó ${x.proc} en ${salaDe(x.sala).n} a las ${x.hora} h`);
  avisar('jefatura', `📥 Nueva solicitud de ${G[S.yo].n}: ${x.proc} (${salaDe(x.sala).n}, ${x.hora} h)`);
  toast('📨 Solicitud enviada. Le avisamos cuando la Jefatura la confirme.', '#60a5fa'); avanza(); render();
}
function vistaSol() {
  const pend = S.sol.filter((x) => x.estado === 'pendiente'), resto = S.sol.filter((x) => x.estado !== 'pendiente');
  const fila = (x) => `<div class="card sol" style="margin-bottom:8px">${avatar(x.cir)}<div><b>${x.proc}</b><br><small>${G[x.cir].n} · ${salaDe(x.sala).n} · ${x.hora}–${x.fin} h · anestesia ${x.anest.toLowerCase()}${x.ins ? ' · ' + x.ins : ''} · pedida ${x.t} h</small></div>
    ${x.estado === 'pendiente' ? `<button class="btn fant chico" onclick="resolverSol('${x.id}',false)">✖ Rechazar</button><button class="btn chico" style="--k:var(--ok)" data-a="conf-${x.id}" onclick="resolverSol('${x.id}',true)">✅ Confirmar y programar</button>` : `<span class="sello ${x.estado === 'confirmada' ? 'validada' : 'borrador'}">${x.estado === 'confirmada' ? '✅ Programada' : '✖ Rechazada'}</span>`}</div>`;
  return `<h2>Solicitudes de cirugía</h2><p class="sub">Lo que piden los cirujanos llega acá. Al confirmar, la cirugía entra en la programación, se arma su recorrido de 7 pasos y se avisa al cirujano y al anestesiólogo de esa sala.</p>
    ${pend.length ? pend.map(fila).join('') : '<div class="card"><small style="color:var(--mut)">No hay solicitudes pendientes.</small></div>'}
    ${resto.length ? '<h2 style="font-size:1.05rem">Resueltas hoy</h2>' + resto.map(fila).join('') : ''}`;
}
function resolverSol(id, ok) {
  const x = S.sol.find((y) => y.id === id); if (!x) return;
  x.estado = ok ? 'confirmada' : 'rechazada';
  if (!ok) { avisar(x.cir, `✖ La Jefatura no pudo programar ${x.proc}. Comuníquese con Quirófanos.`); registrar(null, `Jefatura rechazó ${x.proc}`); render(); return; }
  const c = { id: 'cx' + (S.cx.length + 1), sala: x.sala, hora: x.hora, fin: x.fin, proc: x.proc, pac: 'Paciente de ejemplo ' + String.fromCharCode(65 + S.cx.length), cir: x.cir, anest: null, circ: null, inst: null, f: {}, rec1: null, rec2: null, ald: null };
  S.cx.push(c);
  registrar(c, `Jefatura confirmó y programó ${x.proc}`);
  avisar(x.cir, `✅ Confirmada: ${x.proc} en ${salaDe(x.sala).n} a las ${x.hora} h`);
  const p = cobertura(HOY).puestos.find((q) => q.id === x.sala || (x.sala === 'OBS' && q.id === 'END'));
  if (p && p.k) avisar(p.k, `🗓 Se sumó una cirugía en su sala: ${x.proc}, ${x.hora} h`);
  toast(`✅ Programada en ${salaDe(x.sala).n}. Avisados el cirujano${p && p.k ? ' y ' + G[p.k].n : ''}.`, '#4ade80'); avanza(); render();
}

const escSector = (sec) => ESC.map((e, i) => [e, i]).filter(([e]) => sec === 'todos' || e.sec.includes(sec));
function preparar(hasta) { nuevo(); S.silencio = true; for (let i = 0; i < hasta; i++) ESC[i].ya(); S.silencio = false; S.yo = null; S.modal = null; }

let corriendo = 0;
function pararPeli() { corriendo++; S.peli = false; S.narr = ''; VEL = 1; render(); }
async function correr(lista) {
  const yo = ++corriendo; S.peli = true; render();
  const vivo = () => yo === corriendo;
  const h = {
    vivo,
    narra: async (t, ms = 2200) => { if (!vivo()) throw 0; S.narr = t; render(); await espera(ms); },
    toca: async (sel, fn, ms = 900) => {
      if (!vivo()) throw 0;
      render(); const el = document.querySelector(`[data-a="${sel}"]`);
      if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.classList.add('foco'); }
      await espera(ms); if (!vivo()) throw 0; fn(); await espera(500);
    },
    como: async (k) => { if (!vivo()) throw 0; if (S.yo === k) return; S.yo = null; S.narr = ''; render(); await espera(300); await entrar(k); },
    abrir: (id) => { S.abierta = id; render(); },
    tildar: async (key, n) => { for (let j = 0; j < n; j++) { if (!vivo()) throw 0; (S.ui.chk[key] = S.ui.chk[key] || [])[j] = true; render(); const el = document.querySelector(`[data-a="chk-${key}-${j}"]`); if (el) el.scrollIntoView({ block: 'center' }); await espera(260); } },
    contar: async (id, paso, vals) => { S.ui.cnt[id + paso] = {}; for (const [k, v] of Object.entries(vals)) { for (let i = 1; i <= Math.min(v, 6); i++) { if (!vivo()) throw 0; S.ui.cnt[id + paso][k] = i; render(); await espera(70); } S.ui.cnt[id + paso][k] = v; render(); await espera(200); } },
  };
  try {
    for (const e of lista) await e.anim(h);
    if (vivo()) { S.narr = ''; S.peli = false; render(); }
  } catch (e) { if (e !== 0) throw e; }
}
function pelicula() { preparar(0); S.narr = '🎬 Un día en el bloque quirúrgico del HRU, paso a paso.'; correr(ESC); }
function mirar(i) { corriendo++; preparar(i); correr([ESC[i]]); }
async function probar(i) { corriendo++; preparar(i); S.peli = false; S.narr = ''; S.mision = ESC[i].hint; await entrar(ESC[i].k, true); S.tab = ESC[i].tab; S.abierta = 'cx1'; render(); scrollTo({ top: 0, behavior: 'smooth' }); }

nuevo(); render();
addEventListener('click', (e) => { if (S.bandeja && !e.target.closest('.campana')) { S.bandeja = false; render(); } });
