/* ================= MÓDULOS QUIRÚRGICOS =================
   Un módulo no es un dato aparte: nace de la cirugía. Al programar el turno el
   cirujano elige la práctica en el Nomenclador Modulado 2025 y con ella queda
   fijado el módulo (A, B o C). Ese módulo se imputa al cirujano, al ayudante y
   al anestesiólogo cargados en el equipo, pero **solo cuenta cuando la cirugía
   está marcada como Realizada**: mientras el turno esté programado, confirmado
   o en curso no figura en la solapa. Así la planilla de módulos y el parte
   quirúrgico no pueden contradecirse, y todo viaja por Firebase en vivo. */

/* ---- Configuración compartida (valores unitarios e importes) ---- */
function modConfig() {
  const c = DB.config.find((x) => String(x.id) === 'modulos') || {};
  return {
    id: 'modulos',
    valores: Object.assign({}, MOD_VALORES_DEF, c.valores || {}),
    mostrarImportes: !!c.mostrarImportes,
    actualizado: c.actualizado || '',
  };
}
function guardarModConfig(cambios) {
  upsert('config', Object.assign(modConfig(), cambios, { id: 'modulos', actualizado: nowDT() }));
}
const money = (n) => '$ ' + Math.round(n || 0).toLocaleString('es-AR');
/* Los importes son información sensible: solo los ve la Dirección Médica y
   únicamente si los habilitó de forma expresa. */
function verImportes() { return director && modConfig().mostrarImportes; }

/* ---- Equipo que percibe módulos ---- */
function equipoDe(c) {
  if (Array.isArray(c.equipo) && c.equipo.length) return c.equipo.filter((p) => p && p.nombre && p.modulo);
  // Turnos cargados antes de esta versión: el cirujano es el único conocido.
  return c.modulo ? [{ rol: 'Cirujano', nombre: c.cirujano || '', email: c.cirujanoEmail || '', modulo: c.modulo }] : [];
}
function equipoActualizado(c, modulo) {
  const previo = Array.isArray(c.equipo) ? c.equipo : [];
  const resto = previo.filter((p) => p && p.rol !== 'Cirujano');
  return [{ rol: 'Cirujano', nombre: c.cirujano || '', email: c.cirujanoEmail || '', modulo }].concat(resto);
}
function tieneAyudante(c) { return equipoDe(c).some((p) => p.rol === '1er Ayudante'); }
/* Cirugías ya realizadas a las que todavía les falta el ayudante. Es lo que se
   avisa al programar y lo que muestra el contador de la solapa. */
function modulosIncompletos(u) {
  return DB.cirugias.filter((c) => c.estado === 'realizada' && c.modulo && !tieneAyudante(c)
    && (!u || c.cirujanoEmail === u.email));
}

/* ---- Registro de módulos realizados ---- */
function modulosRegistrados(desde, hasta) {
  const filas = [];
  DB.cirugias.forEach((c) => {
    if (c.estado !== 'realizada' || !c.modulo) return;      // solo lo efectivamente operado
    const f = c.fecha || '';
    if ((desde && f < desde) || (hasta && f > hasta)) return;
    equipoDe(c).forEach((p) => filas.push({
      cir: c, fecha: f, servicio: servicioCanonico(c.servicio) || 'Otro', rol: p.rol,
      nombre: p.nombre, email: p.email || '', modulo: p.modulo,
    }));
  });
  return filas.sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
}
function agrupar(filas, clave) {
  const map = {};
  filas.forEach((f) => {
    const k = clave(f);
    if (!k) return;
    if (!map[k]) map[k] = { nombre: k, A: 0, B: 0, C: 0, T: 0, cir: 0, ayu: 0, servicios: {}, cirugias: {} };
    const g = map[k];
    g[f.modulo] = (g[f.modulo] || 0) + 1;
    g.T++;
    if (f.rol === 'Cirujano') g.cir++;
    if (f.rol === '1er Ayudante') g.ayu++;
    g.servicios[f.servicio] = (g.servicios[f.servicio] || 0) + 1;
    g.cirugias[f.cir.id] = true;
  });
  return Object.values(map).map((g) => Object.assign(g, {
    nCirugias: Object.keys(g.cirugias).length,
    servicioPrinc: Object.entries(g.servicios).sort((a, b) => b[1] - a[1])[0]?.[0] || '',
  })).sort((a, b) => b.T - a.T || a.nombre.localeCompare(b.nombre));
}
function importeDe(g) {
  const v = modConfig().valores;
  return g.A * v.A + g.B * v.B + g.C * v.C;
}

/* ---- Período: día, semana, mes, año o rango libre ---- */
let modPeriodo = 'mes';   // 'dia' | 'semana' | 'mes' | 'anio' | 'rango'
let modAncla = null;      // fecha de referencia del período
let modDesde = null, modHasta = null;   // solo para el rango libre
let modTab = 'prof';      // 'prof' | 'servicio' | 'detalle'
let modServicio = '';     // filtro de servicio (Dirección Médica)

function modRango() {
  const a = modAncla || hoyISO();
  if (modPeriodo === 'dia') return [a, a];
  if (modPeriodo === 'semana') {
    const dow = (new Date(a + 'T12:00:00').getDay() + 6) % 7;   // lunes = 0
    const ini = sumarDias(a, -dow);
    return [ini, sumarDias(ini, 6)];
  }
  if (modPeriodo === 'anio') return [a.slice(0, 4) + '-01-01', a.slice(0, 4) + '-12-31'];
  if (modPeriodo === 'rango') return [modDesde || a, modHasta || a];
  const ym = a.slice(0, 7);
  return [ym + '-01', ym + '-' + String(diasDelMes(ym)).padStart(2, '0')];
}
function modTituloPeriodo() {
  const [d, h] = modRango();
  if (modPeriodo === 'dia') return fmtDiaLargo(d);
  if (modPeriodo === 'semana') return `Semana del ${fmtFecha(d)} al ${fmtFecha(h)}`;
  if (modPeriodo === 'mes') return `${MESES_FULL[Number(d.slice(5, 7)) - 1]} de ${d.slice(0, 4)}`;
  if (modPeriodo === 'anio') return `Año ${d.slice(0, 4)}`;
  return `${fmtFecha(d)} al ${fmtFecha(h)}`;
}
function modMover(n) {
  const a = modAncla || hoyISO();
  if (modPeriodo === 'dia') modAncla = sumarDias(a, n);
  else if (modPeriodo === 'semana') modAncla = sumarDias(a, n * 7);
  else if (modPeriodo === 'mes') {
    const d = new Date(Number(a.slice(0, 4)), Number(a.slice(5, 7)) - 1 + n, 1);
    modAncla = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`;
  } else if (modPeriodo === 'anio') modAncla = (Number(a.slice(0, 4)) + n) + a.slice(4);
  renderModulos();
}
function modSetPeriodo(p) { modPeriodo = p; if (!modAncla) modAncla = hoyISO(); renderModulos(); }

/* ---- Alcance: cada cirujano ve su servicio; la Dirección Médica, todo ---- */
function modAlcance() {
  const u = usuarioActual();
  if (director) return { todo: true, servicio: modServicio, quien: 'Dirección Médica' };
  const serv = servicioCanonico(u && u.servicio);
  return { todo: false, servicio: serv, quien: serv };
}
function modFilasVisibles() {
  const [d, h] = modRango();
  const al = modAlcance();
  let filas = modulosRegistrados(d, h);
  if (!al.todo || al.servicio) filas = filas.filter((f) => mismoServicio(f.servicio, al.servicio));
  return filas;
}

function directorLogout() {

}

/* Barras del período: por día cuando el rango es corto, por mes cuando es largo. */
function modEvolucion(filas, desde, hasta) {
  const dias = diasEntre(desde, hasta) + 1;
  const porMes = dias > 62;
  const map = {};
  filas.forEach((f) => {
    const k = porMes ? f.fecha.slice(0, 7) : f.fecha;
    if (!map[k]) map[k] = { k, label: '', A: 0, B: 0, C: 0, T: 0 };
    map[k][f.modulo]++; map[k].T++;
  });
  const arr = Object.values(map).sort((a, b) => a.k.localeCompare(b.k));
  arr.forEach((b) => {
    b.label = porMes ? `${MESES_FULL[Number(b.k.slice(5, 7)) - 1]} ${b.k.slice(0, 4)}` : fmtFecha(b.k);
  });
  arr.unidad = porMes ? 'mes' : 'día';
  return arr;
}

function exportarModulos() {
  const [desde, hasta] = modRango();
  const conImportes = verImportes();
  const cfg = modConfig();
  const filas = [['Fecha', 'Paciente', 'DNI', 'Práctica', 'Capítulo', 'Sección', 'Servicio',
    'Módulo de la cirugía', 'Rol', 'Profesional', 'Módulo del profesional'].concat(conImportes ? ['Valor unitario'] : [])];
  modFilasVisibles().forEach((f) => filas.push([
    f.fecha, f.cir.paciente?.nombre || '', f.cir.paciente?.dni || '', f.cir.procedimiento || '',
    f.cir.practica?.g || 'Fuera del nomenclador', f.cir.practica?.s || '', f.servicio,
    f.cir.modulo, f.rol, f.nombre, f.modulo,
  ].concat(conImportes ? [cfg.valores[f.modulo]] : [])));
  filas.push([]);
  filas.push([`Período ${desde} a ${hasta}`, `Alcance: ${modAlcance().quien}`, `Exportado ${nowDT().replace('T', ' ')}`]);
  descargarCSV(`hru-modulos-${desde}_${hasta}.csv`, filas);
}

        Se cargó como «${esc(c.procedimiento || 's/d')}». Elíjala abajo para que quede fijado el módulo A, B o C:
        sin módulo la cirugía no se imputa a nadie.</div></div>
      <div class="form-grid" style="margin-bottom:6px">${campoPractica(c, '')}</div>`
    : `<div class="nom-sel" style="margin-bottom:14px">
      <span class="mod-tag mod-${c.modulo}">${c.modulo}</span>
      <div class="nom-sel-txt">${esc(c.procedimiento)}
        <span class="nom-item-sub">${c.practica ? esc(c.practica.g + ' · ' + c.practica.s) : 'Práctica declarada fuera del nomenclador'} — ${esc(c.servicio || '')}</span></div>
    </div>`}
    <p class="modal-sub" style="text-align:left;margin-bottom:4px">Cada integrante percibe el módulo que se le asigne aquí.
      Se propone el módulo de la práctica${c.modulo ? ` (<b>${c.modulo}</b>)` : ''} y puede modificarse. Los módulos se imputan
      <b>solo cuando la cirugía esté marcada como Realizada</b>${c.estado === 'realizada' ? ' — esta ya lo está.' : `; hoy está <b>${ESTC[c.estado].label}</b>.`}</p>

    <div class="mod-row">
      <div><div class="mod-rol">Cirujano</div>
        <input type="text" id="eq-cir-nom" value="${esc((cir && cir.nombre) || c.cirujano || '')}"></div>
      <div><div class="mod-rol">Módulo</div>${selMod('eq-cir-mod', (cir && cir.modulo) || c.modulo)}</div>
    </div>
    <div class="mod-row">
      <div><div class="mod-rol">1er Ayudante</div>
        <input type="text" id="eq-ayu-nom" placeholder="Apellido y nombre del cirujano ayudante" value="${esc((ayu && ayu.nombre) || '')}"></div>
      <div><div class="mod-rol">Módulo</div>${selMod('eq-ayu-mod', (ayu && ayu.modulo) || c.modulo)}</div>
    </div>
    <div class="mod-row">
      <div><div class="mod-rol">Anestesiólogo/a</div>
        <input type="text" id="eq-ane-nom" placeholder="Apellido y nombre" value="${esc((ane && ane.nombre) || c.anestesista || '')}"></div>
      <div><div class="mod-rol">Módulo</div>${selMod('eq-ane-mod', (ane && ane.modulo) || '')}</div>
    </div>

    <p class="form-note">Deje el nombre en blanco si el rol no corresponde: ese integrante no se registra y no genera módulo.</p>
    <div class="form-actions">
      <button class="btn btn-blue" onclick="guardarEquipoMod(${c.id})">${ico(ICONS.check, 16)} Guardar equipo y módulos</button>
      <button class="btn btn-outline" onclick="closeEquipoMod()">Cancelar</button>
    </div>`;
  $('eqm-overlay').classList.add('open');
  if (sinPractica) nomIniciar(c, '', true);
}
function closeEquipoMod() { $('eqm-overlay').classList.remove('open'); }
function guardarEquipoMod(id) {
  const c = DB.cirugias.find((x) => String(x.id) === String(id));
  if (!c) return;
  // Si la cirugía venía sin práctica, la que se eligió acá define su módulo.
  if (!c.modulo) {
    const pr = nomLeer();
    if (!pr.procedimiento || !pr.modulo) {
      alert('Elija la práctica del nomenclador (o cárguela a mano indicando su módulo) antes de guardar el equipo.');
      return;
    }
    c.procedimiento = pr.procedimiento;
    c.practica = pr.practica;
    c.modulo = pr.modulo;
    pushHist(c, `Práctica del nomenclador asignada: ${pr.procedimiento} (módulo ${pr.modulo})`);
  }
  const leer = (rol, pre) => {
    const nombre = ($(pre + '-nom').value || '').trim();
    const modulo = $(pre + '-mod').value;
    return nombre && modulo ? { rol, nombre, email: rol === 'Cirujano' ? (c.cirujanoEmail || '') : '', modulo } : null;
  };
  const cir = leer('Cirujano', 'eq-cir');
  if (!cir) { alert('El cirujano y su módulo son obligatorios.'); return; }
  const equipo = [cir, leer('1er Ayudante', 'eq-ayu'), leer('Anestesiólogo/a', 'eq-ane')].filter(Boolean);
  c.equipo = equipo;
  c.cirujano = cir.nombre;
  pushHist(c, `Equipo de módulos actualizado (${equipo.map((p) => p.rol + ' ' + p.modulo).join(', ')})`);
  upsert('cirugias', c);
  closeEquipoMod();
  refreshView();
}

/* ================= BUSCADOR DEL NOMENCLADOR (formulario del turno) =================
   Reemplaza al viejo campo de texto libre de "Cirugía / procedimiento". El
   cirujano escribe dos o tres letras, elige la práctica y con ella queda fijado
   el módulo. Si la práctica no figura en el nomenclador puede escribirla a mano,
   pero entonces debe declarar el módulo: sin módulo no hay imputación posible. */
let nomSel = null;        // práctica elegida del nomenclador
let nomLibre = false;     // el cirujano optó por escribirla a mano
let nomRO = '';           // 'disabled' cuando el turno ya no admite cambios
let nomHits = [];         // resultados visibles del buscador

function campoPractica(c, ro) {
  return `
    <div class="field full">
      <label>Cirugía / procedimiento *</label>
      <div class="nom-box">
        <input type="text" id="k-nomq" autocomplete="off" ${ro}
          placeholder="Escriba para buscar en el nomenclador — ej.: «colecis», «hernia ing», «rodilla»"
          oninput="nomBuscar()" onfocus="nomBuscar()" onkeydown="if(event.key==='Escape'){nomCerrarLista();}">
        <div class="nom-list" id="k-nomlist"></div>
      </div>
      <span class="hint">Nomenclador Modulado 2025 — ${NOMENCLADOR.length} prácticas. La práctica elegida fija el módulo A, B o C
        que se imputa en la solapa <b>Módulos Quirúrgicos</b> una vez realizada la cirugía.</span>
      <div id="k-nomsel"></div>
    </div>`;
}

/* Estado inicial del campo al abrir el turno. `prefill` deja el nombre viejo en
   el buscador: sirve al reasignar una cirugía que se había escrito a mano. */
function nomIniciar(c, ro, prefill) {
  nomRO = ro;
  nomHits = [];
  nomSel = (c && c.practica && c.practica.p) ? Object.assign({}, c.practica) : null;
  nomLibre = !!(c && c.procedimiento && !nomSel);
  nomPintarSel(c);
  const q = $('k-nomq');
  if (q) q.value = (prefill && !nomSel && c) ? (c.procedimiento || '') : '';
}

function nomBuscar() {
  const q = $('k-nomq');
  const lista = $('k-nomlist');
  if (!q || !lista) return;
  const u = usuarioActual();
  const serv = ($('k-serv') && $('k-serv').value) || (u && u.servicio) || '';
  const txt = q.value.trim();
  if (txt.length < 2) { nomCerrarLista(); return; }
  nomHits = buscarPracticas(txt, serv, 40);
  lista.innerHTML = nomHits.length
    ? nomHits.map((r, i) => `<button type="button" class="nom-item" onclick="nomElegir(${i})">
        <span class="mod-tag mod-${r.m || 'none'}">${r.m || '?'}</span>
        <span class="nom-item-txt">${esc(r.p)}<span class="nom-item-sub">${esc(r.g)} · ${esc(r.s)}</span></span>
      </button>`).join('')
    : `<div class="nom-vacio">Ninguna práctica del nomenclador coincide con «${esc(txt)}».
        Pruebe con otra palabra o cárguela como práctica fuera del nomenclador.</div>`;
  lista.classList.add('open');
}
function nomCerrarLista() { const l = $('k-nomlist'); if (l) l.classList.remove('open'); }
function nomElegir(i) {
  const r = nomHits[i];
  if (!r) return;
  nomSel = { g: r.g, s: r.s, p: r.p, m: r.m };
  nomLibre = false;
  const q = $('k-nomq');
  if (q) q.value = '';
  nomCerrarLista();
  nomPintarSel();
  // Dentro del modal de equipo, la práctica recién elegida propone su módulo a
  // quienes todavía no lo tengan asignado.
  ['eq-cir-mod', 'eq-ayu-mod'].forEach((k) => { if ($(k) && !$(k).value) $(k).value = r.m || ''; });
  // El nomenclador es la fuente del módulo; si además indica otro servicio, se
  // sugiere alinear el turno para que la imputación caiga donde corresponde.
  const sug = servicioDePractica(r);
  const sel = $('k-serv');
  if (sel && sug && !sel.disabled && sel.value !== sug && SERVICIOS_HRU.includes(sug)) sel.value = sug;
}
function nomLimpiar() { nomSel = null; nomLibre = false; nomPintarSel(); const q = $('k-nomq'); if (q) q.focus(); }
function nomUsarLibre(c) { nomSel = null; nomLibre = true; nomPintarSel(c); }

function nomPintarSel(c) {
  const cont = $('k-nomsel');
  if (!cont) return;
  const ro = nomRO;
  if (nomSel) {
    cont.innerHTML = `
      <div class="nom-sel">
        <span class="mod-tag mod-${nomSel.m || 'none'}">${nomSel.m || '?'}</span>
        <div class="nom-sel-txt">${esc(nomSel.p)}
          <span class="nom-item-sub">${esc(nomSel.g)} · ${esc(nomSel.s)}${nomSel.m ? ` — ${MODULOS[nomSel.m].label}, ${MODULOS[nomSel.m].desc}` : ''}</span>
          ${!nomSel.m ? `<div style="margin-top:8px;max-width:280px">
             <label style="font-size:0.78rem;font-weight:700">El nomenclador no le asignó módulo — indíquelo</label>
             <select id="k-modsel" ${ro}>${['', 'A', 'B', 'C'].map((k) => `<option value="${k}">${k ? 'Módulo ' + k : 'Seleccionar…'}</option>`).join('')}</select></div>` : ''}
        </div>
        ${ro ? '' : `<button type="button" class="btn btn-sm btn-outline" onclick="nomLimpiar()">${ICONS.x} Cambiar</button>`}
      </div>`;
    return;
  }
  if (nomLibre) {
    cont.innerHTML = `
      <div class="form-grid" style="margin-top:10px">
        <div class="field full"><label>Práctica no incluida en el nomenclador *</label>
          <input type="text" id="k-proclibre" value="${esc((c && !c.practica && c.procedimiento) || '')}" ${ro}
            placeholder="Nombre del procedimiento tal como debe figurar en el parte"></div>
        <div class="field"><label>Módulo que le corresponde *</label>
          <select id="k-modlibre" ${ro}>${['', 'A', 'B', 'C'].map((k) =>
            `<option value="${k}" ${c && !c.practica && c.modulo === k ? 'selected' : ''}>${k ? `Módulo ${k} — ${MODULOS[k].desc}` : 'Seleccionar…'}</option>`).join('')}</select></div>
      </div>
      ${ro ? '' : `<button type="button" class="nom-link" onclick="nomLimpiar()">Volver a buscar en el nomenclador</button>`}`;
    return;
  }
  cont.innerHTML = ro ? '' :
    `<button type="button" class="nom-link" onclick="nomUsarLibre()">La práctica no figura en el nomenclador — cargarla a mano</button>`;
}

/* Lo que el formulario debe guardar: texto del parte, módulo y práctica. */
function nomLeer() {
  if (nomSel) {
    const mod = nomSel.m || (($('k-modsel') && $('k-modsel').value) || '');
    return { procedimiento: nomSel.p, modulo: mod, practica: { g: nomSel.g, s: nomSel.s, p: nomSel.p, m: mod } };
  }
  if (nomLibre) {
    return {
      procedimiento: (($('k-proclibre') && $('k-proclibre').value) || '').trim(),
      modulo: ($('k-modlibre') && $('k-modlibre').value) || '',
      practica: null,
    };
  }
  return { procedimiento: '', modulo: '', practica: null };
}

/* ================= COMUNICADOS DE LA JEFATURA =================
   Canal de aviso urgente de la Jefatura de Quirófanos hacia los profesionales y
   la Dirección Médica. A diferencia de los recordatorios —que se derivan del
   estado de los datos y se recalculan— un comunicado es un registro que la
   Jefatura redacta y queda guardado con su fecha y hora de emisión.

   Cómo interrumpe:
   - Al entrar a la app, todo comunicado vigente y sin leer se muestra como
     ventana modal que solo se cierra confirmando la lectura.
   - Si no se confirma, vuelve a aparecer cada 10 minutos, con un tope de
     insistencia por prioridad (ver COM_PRIOS): lo urgente insiste sin límite,
     lo importante tres veces y lo informativo una sola vez. La idea es que un
     aviso menor no moleste a un cirujano en pleno quirófano.

   Quién queda registrado:
   - Los profesionales entran con su correo, así que cada lectura guarda nombre,
     servicio y hora exacta.
   - La Dirección Médica entra con clave compartida y no tiene identidad
     individual: se registra como un único renglón ('__direccion__'). No se
     puede saber qué persona de Dirección leyó, solo que Dirección lo leyó.

   Si la Jefatura no emite ningún comunicado, nada de esto se activa: los
   profesionales no ven la solapa, ni el modal, ni reciben sonido alguno. */
const COM_PRIOS = {
  urgente:     { label: 'Urgente',     orden: 0, veces: Infinity, color: 'var(--red)',   badge: 'badge-no',   banner: 'banner-red' },
  importante:  { label: 'Importante',  orden: 1, veces: 3,        color: 'var(--amber)', badge: 'badge-pend', banner: 'banner-amber' },
  informativo: { label: 'Informativo', orden: 2, veces: 1,        color: 'var(--blue)',  badge: 'badge-ok',   banner: 'banner-blue' },
};
/* ---- A quién se dirige un comunicado ----
   `padron: true` significa que se conoce de antemano la lista completa de
   destinatarios, y entonces la Jefatura puede leer «7 de 20 confirmaron». El
   personal no registrado no tiene padrón: nadie sabe cuántos enfermeros,
   instrumentadores o técnicos hay ni quién entró hoy, así que de ese grupo solo
   se puede contar cuántas lecturas hubo, no cuántas faltan. */
const COM_DESTINOS = {
  profesional:       { label: 'Un profesional en particular',     padron: true,  pide: 'profesional' },
  servicio:          { label: 'Un servicio completo',             padron: true,  pide: 'servicio' },
  medicos:           { label: 'Todos los profesionales',          padron: true,  pide: '' },
  direccion:         { label: 'Solo Dirección Médica',            padron: true,  pide: '' },
  medicos_direccion: { label: 'Profesionales y Dirección Médica', padron: true,  pide: '' },
  publico:           { label: 'Personal no registrado',           padron: false, pide: '' },
};
/* Áreas del personal que entra a la app sin cuenta. Al confirmar la lectura se
   elige una: es lo único que permite saber a qué sector llegó el aviso. */
const COM_AREAS = ['Enfermería de quirófano', 'Higiene de quirófanos',
  'Instrumentación quirúrgica', 'Técnicos de radiología', 'Otros'];
const COM_INTERVALO_MIN = 10;   // reiteración del emergente sin confirmar
const COM_DIAS_EMERGENTE = 30;  // pasado ese plazo deja de interrumpir (sigue en la lista)
const COM_CLAVE_DIRECCION = '__direccion__';
const COM_AVISOS_KEY = 'hruq_com_avisos_v1';       // sessionStorage: veces mostrado
const COM_PEND_KEY = 'hruq_com_lecturas_pend_v1';  // localStorage: lecturas sin enviar
const COM_MUTE_KEY = 'hruq_com_mute_v1';
const COM_DISPOSITIVO_KEY = 'hruq_com_dispositivo_v1';

/* Identificador del dispositivo, para el personal sin cuenta. No identifica a
   la persona —dos enfermeros que compartan la máquina comparten la clave— pero
   alcanza para que el emergente deje de insistirle a quien ya lo confirmó. */
function comDispositivo() {
  try {
    let d = localStorage.getItem(COM_DISPOSITIVO_KEY);
    if (!d) {
      d = 'disp_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      localStorage.setItem(COM_DISPOSITIVO_KEY, d);
    }
    return d;
  } catch (e) { return 'disp_sin_almacenamiento'; }
}

/* Un overlay «fijo» no se cierra con Escape, con el botón atrás ni tocando el
   fondo. Hoy solo lo es el comunicado: su razón de ser es que no se pueda
   esquivar sin dejar constancia de la lectura. */
function esOverlayFijo(ov) { return !!ov && ov.classList.contains('overlay-fijo'); }

function comPrio(c) { return COM_PRIOS[c && c.prioridad] ? c.prioridad : 'informativo'; }
function comLecturas(c) { return (c && c.lecturas && typeof c.lecturas === 'object') ? c.lecturas : {}; }
function comLeidoPor(c, clave) { return !!comLecturas(c)[clave]; }
function comPorId(id) { return DB.comunicados.find((x) => String(x.id) === String(id)) || null; }

/* Identidad de lectura. La Jefatura, por sí sola, no es destinataria: emite. Si
   además tiene sesión de profesional abierta, sí recibe como profesional. Quien
   entra sin cuenta y sin clave es «público»: enfermería, higiene,
   instrumentación, radiología y demás personal del bloque. */
function comIdentidad() {
  const u = usuarioActual();
  if (u) return { clave: claveMail(u.email), nombre: u.nombre, servicio: u.servicio || '', tipo: 'medico' };
  if (director) return { clave: COM_CLAVE_DIRECCION, nombre: 'Dirección Médica', servicio: 'Dirección Médica', tipo: 'direccion' };
  if (jefe) return null;
  return { clave: comDispositivo(), nombre: '', servicio: '', tipo: 'publico' };
}
function comVigente(c) {
  if (!c || c.activo === false) return false;
  if (c.vigenteHasta && c.vigenteHasta < hoyISO()) return false;
  return true;
}
/* Normaliza el destino. Los comunicados de la primera versión guardaban una
   cadena suelta ('todos' | 'medicos' | 'direccion'); se leen sin migrar nada. */
function comDestino(c) {
  const d = c && c.destino;
  if (d && typeof d === 'object') {
    return { tipo: COM_DESTINOS[d.tipo] ? d.tipo : 'medicos_direccion', valor: d.valor || '' };
  }
  if (d === 'medicos' || d === 'direccion') return { tipo: d, valor: '' };
  return { tipo: 'medicos_direccion', valor: '' };
}
function comDestinoLabel(c) {
  const d = comDestino(c);
  if (d.tipo === 'profesional') {
    const u = DB.usuarios.find((x) => claveMail(x.email) === claveMail(d.valor));
    return u ? `${u.nombre} (${u.servicio || 'sin servicio'})` : 'Un profesional (cuenta eliminada)';
  }
  if (d.tipo === 'servicio') return `Servicio de ${d.valor}`;
  return COM_DESTINOS[d.tipo].label;
}
function comEsPara(c, ident) {
  const d = comDestino(c);
  switch (d.tipo) {
    case 'profesional':       return ident.tipo === 'medico' && ident.clave === claveMail(d.valor);
    case 'servicio':          return ident.tipo === 'medico'
                                     && servicioCanonico(ident.servicio) === servicioCanonico(d.valor);
    case 'medicos':           return ident.tipo === 'medico';
    case 'direccion':         return ident.tipo === 'direccion';
    case 'medicos_direccion': return ident.tipo === 'medico' || ident.tipo === 'direccion';
    case 'publico':           return ident.tipo === 'publico';
  }
  return false;
}
/* Comunicados vigentes, dirigidos a quien está mirando, y sin confirmar. */
function comPendientes() {
  const ident = comIdentidad();
  if (!ident) return [];
  const limite = sumarDias(hoyISO(), -COM_DIAS_EMERGENTE);
  return DB.comunicados
    .filter((c) => comVigente(c) && comEsPara(c, ident) && !comLeidoPor(c, ident.clave))
    .filter((c) => String(c.emitido || '').slice(0, 10) >= limite)
    .sort((a, b) => (COM_PRIOS[comPrio(a)].orden - COM_PRIOS[comPrio(b)].orden)
      || String(a.emitido || '').localeCompare(String(b.emitido || '')));
}
/* Los que la Jefatura ve en su solapa, del más nuevo al más viejo. */
function comTodosOrdenados() {
  return DB.comunicados.slice().sort((a, b) => String(b.emitido || '').localeCompare(String(a.emitido || '')));
}

/* ---- Escritura de la lectura ----
   No se usa `upsert`, que reescribe el documento entero: si dos profesionales
   confirman al mismo tiempo, el segundo borraría el acuse del primero. Se
   escribe directamente la rama `comunicados/<id>/lecturas/<clave>`. */
function comLecturasPend() { try { return JSON.parse(localStorage.getItem(COM_PEND_KEY) || '[]'); } catch (e) { return []; } }
function comLecturasPendSet(a) { try { localStorage.setItem(COM_PEND_KEY, JSON.stringify(a)); } catch (e) {} }
function comEncolarLectura(id, clave, reg) {
  const p = comLecturasPend().filter((x) => !(String(x.id) === String(id) && x.clave === clave));
  p.push({ id, clave, reg });
  comLecturasPendSet(p);
}
function comEscribirLectura(id, clave, reg) {
  if (!cloudOn) return;
  if (refs.comunicados && conectado) {
    refs.comunicados.child(String(id)).child('lecturas').child(clave).set(reg)
      .catch(() => comEncolarLectura(id, clave, reg));
  } else comEncolarLectura(id, clave, reg);
}
/* Reenvío de los acuses que quedaron sin red. Se llama en cada ronda de revisión. */
function comFlushLecturas() {
  if (!cloudOn || !conectado || !refs.comunicados) return;
  const p = comLecturasPend();
  if (!p.length) return;
  comLecturasPendSet([]);
  p.forEach((x) => {
    refs.comunicados.child(String(x.id)).child('lecturas').child(x.clave).set(x.reg)
      .catch(() => comEncolarLectura(x.id, x.clave, x.reg));
  });
}
/* Cambio puntual de un campo del comunicado (archivar, reabrir): tampoco pisa
   las lecturas que estén entrando en ese momento. */
function comSetCampo(id, campo, valor) {
  const c = comPorId(id);
  if (!c) return;
  c[campo] = valor;
  saveLocal('comunicados');
  if (cloudOn) {
    if (refs.comunicados && conectado) {
      refs.comunicados.child(String(id)).child(campo).set(valor)
        .catch(() => upsert('comunicados', c));
    } else upsert('comunicados', c);
  }
  refreshView();
}

/* ---- Aviso sonoro ----
   Se sintetiza con Web Audio: no hay archivo que descargar ni que cachear, y
   funciona sin conexión. El navegador bloquea el audio hasta que hubo alguna
   interacción del usuario con la página; si lo bloquea, el modal igual aparece. */
let comAudioCtx = null;
function comSilenciado() { try { return localStorage.getItem(COM_MUTE_KEY) === '1'; } catch (e) { return false; } }
function comToggleSilencio() {
  try { localStorage.setItem(COM_MUTE_KEY, comSilenciado() ? '0' : '1'); } catch (e) {}
  refreshView();
}
function comSonar(prio) {
  if (comSilenciado()) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    comAudioCtx = comAudioCtx || new AC();
    const ctx = comAudioCtx;
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    const pauta = prio === 'urgente' ? [0, 0.3, 0.6] : (prio === 'importante' ? [0, 0.32] : [0]);
    const hz = prio === 'urgente' ? 880 : (prio === 'importante' ? 660 : 523);
    pauta.forEach((t) => {
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = hz;
      const t0 = ctx.currentTime + t;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.2, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.24);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + 0.26);
    });
  } catch (e) { /* audio bloqueado: el emergente sigue siendo visible */ }
}

/* ---- Motor de interrupción ---- */
function comAvisos() { try { return JSON.parse(sessionStorage.getItem(COM_AVISOS_KEY) || '{}'); } catch (e) { return {}; } }
function comAvisosSet(o) { try { sessionStorage.setItem(COM_AVISOS_KEY, JSON.stringify(o)); } catch (e) {} }
function revisarComunicados() {
  comFlushLecturas();
  if (!comIdentidad()) return;
  const ov = $('com-overlay');
  if (!ov || ov.classList.contains('open')) return;  // ya hay uno en pantalla
  const avisos = comAvisos();
  const ahora = Date.now();
  const toca = comPendientes().find((c) => {
    const a = avisos[c.id] || { veces: 0, ultimo: 0 };
    if (a.veces >= COM_PRIOS[comPrio(c)].veces) return false;
    return a.veces === 0 || (ahora - a.ultimo) >= COM_INTERVALO_MIN * 60000;
  });
  if (toca) mostrarComunicado(toca.id);
}
function mostrarComunicado(id, soloLectura) {
  const c = comPorId(id);
  const ov = $('com-overlay'), md = $('com-modal');
  if (!c || !ov || !md) return;
  const prio = comPrio(c), P = COM_PRIOS[prio];

  const restantes = ident && !soloLectura ? comPendientes().length - 1 : 0;

  if (!soloLectura && ident) {
    const avisos = comAvisos();
    const a = avisos[c.id] || { veces: 0, ultimo: 0 };

    <h2>${esc(c.titulo || 'Comunicado de la Jefatura')}</h2>
    <div class="com-meta">Emitido el <b>${fmtDT(c.emitido)}</b> · Dirigido a ${esc(comDestinoLabel(c))}${c.vigenteHasta ? ` · Vigente hasta el <b>${fmtFecha(c.vigenteHasta)}</b>` : ''}</div>
    <div class="com-cuerpo">${esc(c.texto || '')}</div>
    ${yaLeido || soloLectura ? `
      <div class="com-acciones">
        ${yaLeido && ident ? `<div class="banner banner-green" style="margin:0">${ICONS.check}
          <div><strong>Lectura confirmada</strong> El ${fmtDT(comLecturas(c)[ident.clave].t)}.</div></div>` : ''}
        <button class="btn btn-gray" onclick="cerrarComunicado()">Cerrar</button>
      </div>`
    : `
      ${ident.tipo === 'publico' ? `
        <div class="form-grid" style="margin-bottom:14px">
          <div class="field full"><label>¿En qué área trabaja? *</label>
            <select id="com-area">
              <option value="">Seleccionar…</option>
              ${COM_AREAS.map((a) => `<option>${esc(a)}</option>`).join('')}
            </select></div>
          <div class="field full"><label>Nombre y apellido (opcional)</label>
            <input type="text" id="com-nombre" placeholder="Deja constancia de quién lo leyó" autocomplete="name"></div>
        </div>
        <p class="pass-error" id="com-err">Elija su área para poder confirmar la lectura.</p>` : ''}
      <div class="com-acciones">
        <button class="btn btn-green" onclick="confirmarLecturaCom('${attr(c.id)}')">${ICONS.check} Confirmo que lo leí</button>
        ${ident.tipo === 'medico'
          ? `<button class="btn btn-outline" onclick="consultarPorComunicado('${attr(c.id)}')">${ICONS.mail} Confirmo y consulto a la Jefatura</button>`
          : ''}
        ${restantes > 0 ? `<div class="com-pila">Quedan ${restantes} comunicado(s) sin confirmar.</div>` : ''}

}
function cerrarComunicado() {
  const ov = $('com-overlay');
  if (ov) ov.classList.remove('open');
  document.body.style.overflow = '';
}
function confirmarLecturaCom(id) {
  const ident = comIdentidad();
  const c = comPorId(id);
  if (!c || !ident) { cerrarComunicado(); return; }
  // El personal sin cuenta declara su área: es el único dato que permite saber
  // a qué sector del bloque llegó el aviso. El nombre queda a su criterio.
  if (ident.tipo === 'publico') {
    const sel = $('com-area');
    const area = sel ? sel.value : '';
    if (!area) {
      const e = $('com-err');
      if (e) e.style.display = 'block';
      if (sel) sel.focus();
      return;
    }
    ident.servicio = area;
    ident.nombre = ($('com-nombre') && $('com-nombre').value.trim()) || '';
  }
  const reg = { nombre: ident.nombre, servicio: ident.servicio, tipo: ident.tipo, t: nowDT() };
  // Espejo inmediato en memoria para que no vuelva a interrumpir, haya red o no.
  c.lecturas = Object.assign({}, comLecturas(c), { [ident.clave]: reg });
  saveLocal('comunicados');
  comEscribirLectura(c.id, ident.clave, reg);
  cerrarComunicado();
  refreshView();
  // Encadena el siguiente pendiente, si lo hay.
  setTimeout(revisarComunicados, 500);
}
/* Confirma la lectura y abre Reclamos con el asunto ya escrito: el canal de
   respuesta a un comunicado es el que ya existe, no uno nuevo. */
function consultarPorComunicado(id) {
  const c = comPorId(id);
  confirmarLecturaCom(id);
  if (!usuarioActual()) { alert('Las consultas a la Jefatura se envían desde una sesión de profesional.'); return; }
  go('reclamos');
  setTimeout(() => {
    const a = $('r-asunto');
    if (!a || !c) return;
    a.value = 'Consulta sobre el comunicado: ' + (c.titulo || fmtDT(c.emitido));
    const t = $('r-texto');
    if (t) t.focus();
    a.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 250);
}
function comNotificarSistema(c) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    const n = new Notification('HRU Quirófanos — Comunicado de la Jefatura', {
      body: (c.titulo || '') + '\n' + String(c.texto || '').slice(0, 140),
      tag: 'com-' + c.id,
      requireInteraction: comPrio(c) === 'urgente',
    });
    n.onclick = () => { window.focus(); mostrarComunicado(c.id, true); n.close(); };
  } catch (e) { /* algunos navegadores exigen ServiceWorkerRegistration.showNotification */ }
}

/* ---- Emisión y seguimiento (Jefatura) ---- */
/* Padrón de destinatarios: profesionales con cuenta autorizada, más el renglón
   único de Dirección Médica cuando el comunicado la incluye. Las cuentas dadas
   de baja no cuentan como destinatarios: no pueden entrar a leer.
   El personal no registrado no tiene padrón —devuelve lista vacía— y su
   seguimiento se hace por lecturas registradas, no por faltantes. */
function comTienePadron(c) { return COM_DESTINOS[comDestino(c).tipo].padron; }
function comDestinatarios(c) {
  const d = comDestino(c);
  if (d.tipo === 'publico') return [];
  const lista = [];
  const activos = () => DB.usuarios.filter((u) => estadoCuenta(u) !== 'baja');
  const comoDest = (u) => ({ clave: claveMail(u.email), nombre: u.nombre, servicio: u.servicio || '', tipo: 'medico' });
  if (d.tipo === 'profesional') {
    const u = activos().find((x) => claveMail(x.email) === claveMail(d.valor));
    if (u) lista.push(comoDest(u));
  } else if (d.tipo === 'servicio') {
    activos().filter((u) => servicioCanonico(u.servicio) === servicioCanonico(d.valor)).forEach((u) => lista.push(comoDest(u)));
  } else if (d.tipo === 'medicos' || d.tipo === 'medicos_direccion') {
    activos().forEach((u) => lista.push(comoDest(u)));
  }
  if (d.tipo === 'direccion' || d.tipo === 'medicos_direccion') {
    lista.push({ clave: COM_CLAVE_DIRECCION, nombre: 'Dirección Médica', servicio: 'Clave compartida', tipo: 'direccion' });
  }
  return lista.sort((a, b) => String(a.nombre).localeCompare(String(b.nombre), 'es'));
}
/* Lecturas del personal sin cuenta, en orden de llegada. */
function comLecturasPublico(c) {
  return Object.entries(comLecturas(c))
    .filter(([, l]) => l && l.tipo === 'publico')
    .map(([clave, l]) => Object.assign({ clave }, l))
    .sort((a, b) => String(a.t || '').localeCompare(String(b.t || '')));
}
function emitirComunicado() {
  const err = $('c-error');
  const fail = (m) => { err.textContent = m; err.style.display = 'block'; };
  const titulo = $('c-titulo').value.trim();
  const texto = $('c-texto').value.trim();
  const prioridad = $('c-prio').value;
  const tipo = $('c-destino').value;
  const pide = COM_DESTINOS[tipo].pide;
  const valor = pide === 'profesional' ? $('c-dest-prof').value
    : (pide === 'servicio' ? $('c-dest-serv').value : '');
  const vigenteHasta = $('c-vigencia').value;
  if (!titulo) return fail('Escriba un título: es lo primero que ve el destinatario.');
  if (!texto) return fail('Escriba el cuerpo del comunicado.');
  if (pide === 'profesional' && !valor) return fail('Elija a qué profesional se dirige el comunicado.');
  if (pide === 'servicio' && !valor) return fail('Elija a qué servicio se dirige el comunicado.');
  if (vigenteHasta && vigenteHasta < hoyISO()) return fail('La fecha de vigencia no puede ser anterior a hoy.');

  const destino = { tipo, valor };
  const dest = comDestinatarios({ destino });
  const cuantos = dest.length;
  if (tipo !== 'publico' && !cuantos) {
    return fail(tipo === 'servicio'
      ? 'Ese servicio no tiene profesionales con cuenta activa: el comunicado no llegaría a nadie.'
      : 'No hay destinatarios con cuenta activa: el comunicado no llegaría a nadie.');
  }
  const aQuienes = tipo === 'publico'
    ? 'Va a interrumpir a todo el personal que entre a la app sin cuenta (enfermería, higiene, instrumentación, radiología y demás). No se puede saber de antemano a cuántas personas alcanza.'
    : `Va a interrumpir a ${cuantos} destinatario(s): ${dest.slice(0, 4).map((d) => d.nombre).join('; ')}${cuantos > 4 ? ` y ${cuantos - 4} más` : ''}.`;
  const insistencia = prioridad === 'urgente'
    ? `Reaparece cada ${COM_INTERVALO_MIN} minutos hasta que cada uno confirme la lectura.`
    : `Se muestra ${COM_PRIOS[prioridad].veces === 1 ? 'una sola vez' : `hasta ${COM_PRIOS[prioridad].veces} veces`}.`;
  if (!confirm(`¿Emitir el comunicado «${titulo}»?\n\n${aQuienes}\n\n${insistencia}\n\nQueda registrado con su fecha y hora de emisión.`)) return;

  const c = {
    id: 'com' + Date.now(),
    titulo, texto, prioridad, destino,
    vigenteHasta: vigenteHasta || '',
    emitido: nowDT(),
    emitidoPor: JEFATURA,
    activo: true,
    lecturas: {},
  };
  upsert('comunicados', c);
  $('c-titulo').value = '';
  $('c-texto').value = '';
  $('c-vigencia').value = '';
  err.style.display = 'none';
  comAbierto = c.id;
  renderComunicados();
  alert('Comunicado emitido.\n\nQuienes tengan la app abierta lo verán en el momento; el resto, al entrar. Puede seguir las confirmaciones de lectura en esta misma pantalla.');
}
/* El segundo selector (profesional o servicio) solo aparece si el destino lo pide. */
function onDestinoComChange() {
  const tipo = $('c-destino').value;
  const pide = COM_DESTINOS[tipo].pide;
  const wrapProf = $('c-dest-prof-wrap'), wrapServ = $('c-dest-serv-wrap');
  if (wrapProf) wrapProf.style.display = pide === 'profesional' ? '' : 'none';
  if (wrapServ) wrapServ.style.display = pide === 'servicio' ? '' : 'none';
  const nota = $('c-destino-nota');
  if (nota) {
    nota.innerHTML = tipo === 'publico'
      ? 'Al confirmar, cada persona declara su área (enfermería, higiene, instrumentación, radiología u otros). Como no hay padrón, se cuentan las lecturas registradas, no las que faltan.'
      : (tipo === 'direccion'
        ? 'Dirección Médica entra con clave compartida: la lectura se registra como un único renglón y no identifica a la persona.'
        : 'Cada lectura queda registrada con nombre, servicio y hora exacta.');
  }
}
function archivarComunicado(id) {
  const c = comPorId(id);
  if (!c) return;
  if (!confirm(`Archivar «${c.titulo}»?\n\nDeja de aparecer como ventana emergente. El comunicado y el registro de lecturas se conservan.`)) return;
  comSetCampo(id, 'activo', false);
}
function reabrirComunicado(id) {
  const c = comPorId(id);
  if (!c) return;
  if (!confirm(`Reactivar «${c.titulo}»?\n\nVolverá a interrumpir a quienes todavía no confirmaron la lectura.`)) return;
  comSetCampo(id, 'activo', true);
}
/* Borrado definitivo. Solo se habilita cuando ya no queda nadie por confirmar
   —es decir, cuando el comunicado cumplió su función— porque al borrarlo se
   pierde también el registro de quién lo leyó, que es la prueba de que el aviso
   circuló. El personal no registrado no tiene padrón, así que ahí el criterio
   es que el comunicado esté archivado. */
function comSePuedeBorrar(c) {
  if (!comTienePadron(c)) return c.activo === false;
  const dest = comDestinatarios(c);
  return dest.length > 0 && dest.every((d) => comLeidoPor(c, d.clave));
}
function eliminarComunicado(id) {
  const c = comPorId(id);
  if (!c) return;
  if (!comSePuedeBorrar(c)) {
    alert(comTienePadron(c)
      ? 'Todavía hay destinatarios que no confirmaron la lectura.\n\nUn comunicado se puede eliminar recién cuando lo leyeron todos: hasta entonces, use Archivar, que lo saca de circulación y conserva el registro.'
      : 'Archive primero el comunicado.\n\nComo se dirige a personal sin cuenta, no hay forma de saber si lo leyeron todos; archivarlo es la señal de que ya cumplió su función.');
    return;
  }
  const n = Object.keys(comLecturas(c)).length;
  if (!confirm(`¿Eliminar «${c.titulo}» definitivamente?\n\nSe borra también el registro de las ${n} lectura(s) confirmada(s), que es la constancia de que el aviso circuló. Esto no se puede deshacer.\n\nSi puede llegar a necesitar esa constancia, cancele y descargue antes la planilla.`)) return;
  removeDoc('comunicados', c.id);
  if (String(comAbierto) === String(c.id)) comAbierto = null;
  renderComunicados();
}
function toggleComunicado(id) {
  comAbierto = String(comAbierto) === String(id) ? null : id;
  renderComunicados();
}
function exportarLecturas(id) {
  const c = comPorId(id);
  if (!c) return;
  const lect = comLecturas(c);
  const meta = [c.titulo, fmtDT(c.emitido), COM_PRIOS[comPrio(c)].label, comDestinoLabel(c)];
  const filas = [['Comunicado', 'Emitido', 'Prioridad', 'Dirigido a', 'Destinatario', 'Área o servicio', 'Estado', 'Fecha y hora de lectura']];
  if (comTienePadron(c)) {
    comDestinatarios(c).forEach((d) => {
      const l = lect[d.clave];
      filas.push(meta.concat([d.nombre, d.servicio, l ? 'Leído' : 'Sin leer', l ? fmtDT(l.t) : '']));
    });
  } else {
    const pub = comLecturasPublico(c);
    if (!pub.length) filas.push(meta.concat(['—', '—', 'Sin lecturas registradas', '']));
    pub.forEach((l) => {
      filas.push(meta.concat([l.nombre || 'Sin identificar', l.servicio || '—', 'Leído', fmtDT(l.t)]));
    });
  }
  descargarCSV(`comunicado-${String(c.emitido).slice(0, 10)}.csv`, filas);
}

let comAbierto = null;  // id del comunicado con el detalle de lecturas desplegado

function comFicha(c) {
  const prio = comPrio(c), P = COM_PRIOS[prio];
  const conPadron = comTienePadron(c);
  const dest = comDestinatarios(c);
  const lect = comLecturas(c);
  const pub = conPadron ? [] : comLecturasPublico(c);
  const leidos = dest.filter((d) => lect[d.clave]);

  return `
    <div class="card">

        </div>
        <div style="text-align:right;min-width:110px">
          <div style="font-size:1.5rem;font-weight:800;color:${completo ? 'var(--green)' : (conPadron ? 'var(--amber)' : 'var(--blue)')}">${conPadron ? `${leidos.length}/${dest.length}` : pub.length}</div>
          <div style="font-size:0.76rem;color:var(--muted)">${conPadron ? 'confirmaron' : 'lecturas'}</div>

        <div class="com-barra"><i style="width:${pct}%"></i></div>
        <div style="font-size:0.8rem;color:var(--muted);margin-bottom:12px">${pct}% de lectura confirmada</div>`
      : `<div style="font-size:0.8rem;color:var(--muted);margin:10px 0 12px">Dirigido a personal sin cuenta: no hay padrón contra el cual medir, así que se cuentan las lecturas registradas y no las que faltan.</div>`}

        ${c.activo === false
          ? `<button class="btn btn-outline btn-sm" onclick="reabrirComunicado('${attr(c.id)}')">Reactivar</button>`
          : `<button class="btn btn-outline btn-sm" onclick="archivarComunicado('${attr(c.id)}')">Archivar</button>`}
        ${borrable ? `<button class="btn btn-del btn-sm" onclick="eliminarComunicado('${attr(c.id)}')">${ICONS.trash ? ico(ICONS.trash, 15) + ' ' : ''}Eliminar</button>` : ''}
      </div>

      ${abierto ? `<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:10px">
        ${conPadron ? dest.map((d) => {

      </div>` : ''}

}

      Aparece como <b>ventana emergente</b> apenas el destinatario entra a la app y no se cierra hasta que confirma la lectura. Si no la confirma, vuelve a aparecer cada ${COM_INTERVALO_MIN} minutos: sin límite si es <b>urgente</b>, hasta ${COM_PRIOS.importante.veces} veces si es <b>importante</b> y una sola vez si es <b>informativo</b>. Los profesionales con cuenta pueden responder desde la solapa <b>Reclamos</b>.</div></div>

    <div class="banner banner-blue">${ICONS.users}
      <div><strong>Quién queda registrado</strong>
      Los <b>profesionales</b> entran con su correo: cada lectura guarda nombre, servicio y hora exacta. La <b>Dirección Médica</b> usa clave compartida, así que figura como un único renglón sin identificar a la persona. El <b>personal sin cuenta</b> declara su área al confirmar y puede dejar su nombre si quiere; como no hay padrón, de ese grupo se cuentan las lecturas registradas, nunca las que faltan.</div></div>

    ${permiso === 'granted' ? '' : `<div class="banner banner-amber">${ICONS.bell.replace('16', '18')}
      <div><strong>Las notificaciones del dispositivo están desactivadas</strong>
      El emergente y el sonido funcionan igual dentro de la app, pero sin permiso del navegador no se avisa a quien la tenga cerrada.
      <div style="margin-top:10px"><button class="btn btn-blue btn-sm" onclick="pedirPermisoNotif()">${ICONS.bell} Activar notificaciones</button></div></div></div>`}

    <div class="card">
      <div class="card-title">Emitir un comunicado</div>
      <div class="card-sub">Queda registrado a nombre de la Jefatura de Quirófanos con la fecha y hora exactas de emisión</div>
      <div class="form-grid">
        <div class="field full"><label>Título *</label><input type="text" id="c-titulo" placeholder="Ej: Quirófano 3 fuera de servicio por falla del sistema de gases"></div>
        <div class="field full"><label>Cuerpo del comunicado *</label><textarea id="c-texto" placeholder="Detalle la situación, desde cuándo rige y qué debe hacer el profesional."></textarea></div>
        <div class="field"><label>Prioridad</label>
          <select id="c-prio">
            <option value="urgente">Urgente — insiste cada ${COM_INTERVALO_MIN} min hasta que lo lean</option>
            <option value="importante" selected>Importante — insiste hasta ${COM_PRIOS.importante.veces} veces</option>
            <option value="informativo">Informativo — se muestra una sola vez</option>
          </select></div>
        <div class="field"><label>Destinatarios</label>
          <select id="c-destino" onchange="onDestinoComChange()">
            <option value="medicos_direccion">${COM_DESTINOS.medicos_direccion.label}</option>
            <option value="medicos">${COM_DESTINOS.medicos.label}</option>
            <option value="servicio">${COM_DESTINOS.servicio.label}</option>
            <option value="profesional">${COM_DESTINOS.profesional.label}</option>
            <option value="direccion">${COM_DESTINOS.direccion.label}</option>
            <option value="publico">${COM_DESTINOS.publico.label}</option>
          </select></div>
        <div class="field full" id="c-dest-prof-wrap" style="display:none"><label>¿A qué profesional?</label>
          <select id="c-dest-prof">
            <option value="">Seleccionar…</option>
            ${DB.usuarios.filter((u) => estadoCuenta(u) !== 'baja')
              .sort((a, b) => String(a.nombre).localeCompare(String(b.nombre), 'es'))
              .map((u) => `<option value="${esc(u.email)}">${esc(u.nombre)} — ${esc(u.servicio || 'sin servicio')}</option>`).join('')}
          </select></div>
        <div class="field full" id="c-dest-serv-wrap" style="display:none"><label>¿A qué servicio?</label>
          <select id="c-dest-serv">
            <option value="">Seleccionar…</option>
            ${SERVICIOS_HRU.map((s) => {
              const n = DB.usuarios.filter((u) => estadoCuenta(u) !== 'baja' && servicioCanonico(u.servicio) === servicioCanonico(s)).length;
              return `<option value="${esc(s)}">${esc(s)} (${n} profesional${n === 1 ? '' : 'es'})</option>`;
            }).join('')}
          </select></div>
        <div class="field full"><div class="req-sub" id="c-destino-nota">Cada lectura queda registrada con nombre, servicio y hora exacta.</div></div>
        <div class="field"><label>Vigente hasta (opcional)</label><input type="date" id="c-vigencia" min="${hoyISO()}">
          <div class="req-sub" style="margin-top:5px">Cumplida esa fecha deja de emerger. Si se deja vacío, rige hasta que la Jefatura lo archive.</div></div>
      </div>
      <p class="pass-error" id="c-error"></p>
      <div class="form-actions">
        <button class="btn btn-red" onclick="emitirComunicado()">${ICONS.megafono} Emitir comunicado</button>
        <p class="form-note">Un comunicado se puede archivar cuando ya no hace falta, y eliminar definitivamente recién cuando lo confirmaron todos sus destinatarios: al eliminarlo se borra también la constancia de quiénes lo leyeron.</p>
      </div>
    </div>

    <div class="result-count">${lista.length} comunicado(s) · ${activos.length} vigente(s)</div>
    ${lista.length ? lista.map(comFicha).join('') : `<div class="empty">Todavía no se emitió ningún comunicado. Mientras no haya ninguno, los profesionales no ven cambio alguno en la app.</div>`}`;
}

/* ================= REGISTRO DE VISTAS ================= */
Object.assign(VIEWS, {
  grilla: renderProgDiaria,
  recordatorios: renderRecordatorios,
  panel: renderPanel,
  parte: renderParte,
  nueva: renderNueva,
  solicitud: renderSolicitud,
  mis: renderMis,
  programacion: renderProgramacion,
  confidenciales: renderConfidenciales,
  kpis: renderKPIs,
  estadisticas: renderEstadisticas,
  consentimientos: renderConsentimientos,
  usuarios: renderUsuarios,
  reclamos: renderReclamos,
  comunicados: renderComunicados,
  acceso: renderAcceso,
  perfil: renderPerfil,
  modulos: renderModulos,
});

/* ================= INIT ================= */
document.addEventListener('DOMContentLoaded', () => {
  $('i-activity').innerHTML = ICONS.activity;
  $('shield-slot').innerHTML = ICONS.shieldCheck;
  $('ingresar-icon').innerHTML = ICONS.shield.replace('18', '15').replace('18', '15');
  $('hamburger').innerHTML = ICONS.menu;
  $('bell-ico').innerHTML = ICONS.bell;
  $('clave-slot').innerHTML = ICONS.shieldCheck;
  $('clave-inp').addEventListener('keydown', (e) => { if (e.key === 'Enter') validarClave(); });
  $('install-ico').innerHTML = ICONS.download;
  $('libro-ico').innerHTML = ICONS.book;

  const toggle = $('pass-toggle');
  toggle.innerHTML = ICONS.eyeSm;
  toggle.addEventListener('click', () => {
    const inp = $('jefe-pass');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  });
  $('jefe-pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') tryJefeLogin(); });
  document.querySelectorAll('.overlay').forEach((ov) => {
    ov.addEventListener('click', (e) => { if (e.target === ov && !esOverlayFijo(ov)) ov.classList.remove('open'); });
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.overlay.open').forEach((ov) => { if (!esOverlayFijo(ov)) ov.classList.remove('open'); });
    closeDrawer();
  });
  // El cajón lateral solo existe en móvil: al ensanchar la ventana se cierra.
  window.addEventListener('resize', () => { if (window.innerWidth > 900) closeDrawer(); });
  window.addEventListener('online', () => pintarConexion());
  window.addEventListener('offline', () => { conectado = false; pintarConexion(); });

  cargarNotificados();
  pintarConexion();

  window.addEventListener('popstate', () => {
    const abiertos = [...document.querySelectorAll('.overlay.open')].filter((ov) => !esOverlayFijo(ov));
    if (abiertos.length) { abiertos.forEach((ov) => ov.classList.remove('open')); return; }
    go(vistaDelHash(), true);
  });

  initStore(() => {
    // Se calculan antes del primer render para que el Panel ya los muestre.
    remLista = calcRecordatorios();
    go(vistaDelHash());
    revisarRecordatorios();
    // Recálculo periódico: los plazos dependen del reloj, no solo de los datos.
    if (remTimer) clearInterval(remTimer);
    remTimer = setInterval(revisarRecordatorios, 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) revisarRecordatorios(); });

    /* Comunicados: se revisan al abrir y en cada ronda del minuto. La ronda es
       corta a propósito —la insistencia real la gobierna COM_INTERVALO_MIN—
       para que un comunicado nuevo no espere diez minutos para aparecer. */
    revisarComunicados();
    if (comTimer) clearInterval(comTimer);
    comTimer = setInterval(revisarComunicados, 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) revisarComunicados(); });
  });

  // Service worker: abre la app sin conexión y trae sola cada versión publicada.
  window.addEventListener('load', initActualizaciones);
});
</script>
</body>
</html>
