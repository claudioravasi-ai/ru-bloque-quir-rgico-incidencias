/* ================= PROGRAMACIÓN DIARIA (GRILLA DE TURNOS) =================
   Superficie principal de programación: una grilla por día con las seis salas
   y sus franjas horarias. Cada franja ocupada es un turno quirúrgico completo
   que recorre el circuito de estados (borrador → pendiente → validada →
   confirmada → en curso → realizada / suspendida), con su prioridad de
   prelación, su LVQ y su coordinación de áreas. */
let diaSel = null;
let slotCtx = null;

/* ================= HABILITACIÓN DEL BLOQUE =================
   El bloque programado **nace cerrado**. Todos los días, en los quirófanos 2, 3
   y 4 y en la Sala de Endoscopía, los turnos de mañana y de tarde aparecen
   bloqueados hasta que la Jefatura de Quirófanos los abra. Dos salas quedan
   fuera de la llave: el Quirófano 1 —guardia de urgencias de 08 a 08, que no se
   cierra nunca— y el Quirófano de Obstetricia —cesáreas—, abierto salvo cierre
   expreso de la Jefatura.

   Lo abierto se guarda en la colección `agenda`, un documento por fecha:
       { id: '2026-08-20', on: true, salas: { Q2: { M: true, T: false } } }
   `on` es el día; dentro de cada sala, una llave por turno ('M' mañana,
   'T' tarde). Ausente = cerrado. Como todo pasa por `upsert`, cada cambio viaja
   a Firebase y aparece en el resto de las computadoras en el momento. */
const TURNOS_BLOQUE = [
  { p: 'M', label: 'Mañana', rango: '08:00 – 14:00' },
  { p: 'T', label: 'Tarde', rango: '14:00 – 20:00' },
  { p: 'N', label: 'Guardia Nocturna', rango: '20:00 – 08:00 del día siguiente' },
];
const rotuloTurno = (p) => TURNOS_BLOQUE.find((t) => t.p === p) || TURNOS_BLOQUE[0];
/* Turnos que realmente tiene una sala, en orden de reloj. */
function turnosDeSala(s) {
  return TURNOS_BLOQUE.map((t) => t.p).filter((p) => s.franjas.some((f) => f.p === p));
}
/* Salas que la Jefatura abre y cierra (las de acceso permanente no cuentan). */
/* Salas que la Jefatura abre y cierra. Desde la versión 3.6.0 son todas: el
   Quirófano 1 y Obstetricia dejaron de estar siempre abiertos y su
   disponibilidad de guardia pasó al turno rodante de urgencia. */
const salasProgramables = () => SALAS.slice();

function agendaDia(d) { return DB.agenda.find((a) => a.id === d) || null; }
function cfgSala(d, sid) { const a = agendaDia(d); return (a && a.salas && a.salas[sid]) || null; }
function diaHabilitado(d) { const a = agendaDia(d); return !!(a && a.on === true); }
function turnoHabilitado(d, sid, p) {
  if (p === 'U') return true;   // el turno de urgencia de la hora no se cierra nunca
  const cfg = cfgSala(d, sid);
  return !!(diaHabilitado(d) && cfg && cfg[p] === true);
}
function salaHabilitada(d, sid) {
  return turnosDeSala(sala(sid)).some((p) => turnoHabilitado(d, sid, p));
}
function franjaHabilitada(d, sid, fid) {
  const f = franjaDe(sid, fid);
  return !!f && turnoHabilitado(d, sid, f.p);
}
/* Franjas del día realmente ofrecidas: es la capacidad que abrió la Jefatura. */
function franjasAbiertas(d) {
  return SALAS.reduce((n, s) => n + s.franjas.filter((f) => turnoHabilitado(d, s.id, f.p)).length, 0);
}

function guardarAgenda(d, mut) {
  const a = agendaDia(d) || { id: d, on: false, salas: {} };
  a.salas = a.salas || {};
  mut(a);
  upsert('agenda', a);
}
/* Abrir un turno abre el día: no puede quedar una franja disponible en un día
   cerrado. Cerrar el día, en cambio, cierra todo lo que hubiera abierto. */
function setTurnoOn(d, sid, p, v) {
  guardarAgenda(d, (a) => {
    a.salas[sid] = Object.assign({}, a.salas[sid], { [p]: v });
    if (v) a.on = true;
  });
}
function setSalaOn(d, sid, v) {
  guardarAgenda(d, (a) => {
    const cfg = Object.assign({}, a.salas[sid]);
    turnosDeSala(sala(sid)).forEach((p) => { cfg[p] = v; });
    a.salas[sid] = cfg;
    if (v) a.on = true;
  });
}
function setDiaOn(d, v) {
  guardarAgenda(d, (a) => { a.on = v; if (!v) a.salas = {}; });
}
/* Abre el día completo en los turnos indicados, en todas las salas programables. */
function abrirDiaEnTurnos(d, turnos) {
  guardarAgenda(d, (a) => {
    a.on = true;
    salasProgramables().forEach((s) => {
      const cfg = Object.assign({}, a.salas[s.id]);
      turnosDeSala(s).forEach((p) => { if (turnos.indexOf(p) >= 0) cfg[p] = true; });
      a.salas[s.id] = cfg;
    });
  });
}
/* Copia la configuración de un día a un rango. Sin esto la Jefatura tendría que
   repetir la apertura día por día durante todo el año. */
function copiarAgendaA(origen, dias, soloHabiles) {
  const base = agendaDia(origen);
  if (!base) return 0;
  let n = 0;
  for (let i = 1; i <= dias; i++) {
    const d = sumarDias(origen, i);
    if (soloHabiles && !esLaborable(d)) continue;
    upsert('agenda', { id: d, on: base.on === true, salas: JSON.parse(JSON.stringify(base.salas || {})) });
    n++;
  }
  return n;
}

/* Día de grilla al que pertenece un turno. Coincide con `fecha` salvo en las
   franjas de madrugada de la guardia del Quirófano 1, que se muestran en el día
   anterior (la guardia de 08 a 08) pero se operan en la fecha siguiente. */
function diaDeGrilla(c) { return c.diaGrilla || c.fecha; }
function turnoEn(d, sid, fid) {
  return DB.cirugias.find((c) => diaDeGrilla(c) === d && c.sala === sid && c.franja === fid) || null;
}
/* Fecha y hora reales de comienzo de una franja del día `d`. */
function fechaDeFranja(d, f) { return f && f.nd ? sumarDias(d, f.nd) : d; }
function inicioDeFranja(d, f) { return new Date(fechaDeFranja(d, f) + 'T' + f.t + ':00'); }
/* Fin de la franja: arranca donde arranca la siguiente de la misma sala. La
   guardia del Quirófano 1 va de hora en hora; el resto, de dos en dos. */
function finDeFranja(d, s, f) {
  const ini = inicioDeFranja(d, f);
  const i = s.franjas.findIndex((x) => x.id === f.id);
  const sig = i >= 0 ? s.franjas[i + 1] : null;
  if (sig) {
    const fin = inicioDeFranja(d, sig);
    if (fin.getTime() > ini.getTime()) return fin;
  }
  return new Date(ini.getTime() + (f.urg ? 36e5 : 2 * 36e5));   // la urgencia dura la hora
}
/* Salas de urgencia y emergencia: la franja cuya hora ya terminó deja de
   ofrecerse. La grilla se corre sola con el reloj del sistema —a las 14 h solo
   quedan disponibles las franjas de las 14 en adelante— y por eso la vista se
   repinta cada minuto (ver `tickGrilla`). Es una regla de la guardia: en las
   salas programadas la anticipación de 24 h ya cubre el caso. */
function franjaVencida(d, s, f) {
  if (!f || !f.urg) return false;   // solo el turno rodante de urgencia se vence
  return finDeFranja(d, s, f).getTime() <= Date.now();
}

/* ---- Reapertura excepcional de una franja vencida ----
   Una urgencia o una cesárea se opera primero y se anota después: puede pasar
   que nadie la haya cargado y que la franja ya se haya cerrado sola. Para esos
   casos —y solo para esos— la **Jefatura de Quirófanos** puede reabrir con su
   clave una franja vencida y registrar ahí la cirugía que efectivamente se
   hizo. Es una excepción, no el camino habitual: exige la clave, exige un
   motivo escrito, vale para una sola franja por vez y el turno queda marcado
   como **registro fuera de término** en la grilla y en su historial.
   `retroCtx` es esa llave: se guarda en memoria, no en la base, y se descarta
   al cerrar el formulario. */
let retroCtx = null;
function franjaReabierta(d, sid, fid) {
  return !!retroCtx && retroCtx.d === d && retroCtx.sid === sid && retroCtx.fid === fid;
}
function reabrirFranja(d, sid, fid) {
  if (!jefe) return;
  const s = sala(sid), f = franjaDe(sid, fid);
  pedirClave('Reabrir un turno vencido',
    `${s.nombre} — franja de las ${f.t} h del ${fmtFecha(fechaDeFranja(d, f))}. Es una excepción reservada a la Jefatura de Quirófanos: ingrese su clave.`,
    JEFE_CLAVE, async () => {
      const motivo = await pedirTexto('La franja se reabre solo para registrar una cirugía que ya se realizó y no se cargó a tiempo. El motivo queda asentado en el turno y en su historial.', {
        titulo: 'Registro fuera de término', tono: 'peligro', si: 'Reabrir la franja', no: 'Cancelar',
        campo: { label: 'Motivo de la reapertura', multilinea: true, requerido: true,
          placeholder: 'Ej: cesárea de urgencia operada a las 03:10 y no registrada por la guardia…',
          error: 'La reapertura exige un motivo escrito.' },
      });
      if (motivo === null) return;
      retroCtx = { d, sid, fid, motivo };
      renderProgDiaria();
      openSlot(d, sid, fid);
    });
}
function esLaborable(d) { const w = new Date(d + 'T12:00:00').getDay(); return w >= 1 && w <= 5; }
function fmtDiaLargo(d) {
  const dt = new Date(d + 'T12:00:00');
  return `${DIAS_S[dt.getDay()]} ${dt.getDate()} de ${MESES_FULL[dt.getMonth()]} de ${dt.getFullYear()}`;
}
/* Regla de anticipación: un turno electivo se programa con 24 h como mínimo.
   Las urgencias del Quirófano 1 y de Obstetricia la saltean. `f` es la franja
   completa, porque en la guardia de 24 h la hora sola no alcanza para saber en
   qué fecha empieza el turno. */
function puedeReservar(d, f, urgencia) {
  if (urgencia) return true;
  return inicioDeFranja(d, f).getTime() >= Date.now() + HORAS_ANTICIPACION * 36e5;
}
function anticipacionMinima() {
  const t = new Date(Date.now() + HORAS_ANTICIPACION * 36e5);
  return `${String(t.getDate()).padStart(2, '0')}/${String(t.getMonth() + 1).padStart(2, '0')}/${t.getFullYear()} ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')} h`;
}
/* El selector de cobertura abre un campo de texto cuando el financiador no
   figura en el listado; lo que se escriba ahí se suma al listado compartido. */
function onObraChange() {
  const sel = $('k-obra'), wrap = $('k-obra-nueva-wrap');
  if (!sel || !wrap) return;
  const nueva = sel.value === '__nueva__';
  wrap.style.display = nueva ? 'block' : 'none';
  if (nueva) setTimeout(() => { const i = $('k-obra-nueva'); if (i) i.focus(); }, 40);
}

/* ---- Aceptación de Admisión y Egresos: quién la necesita ANTES ----
   La regla general es que ningún turno programado se valida sin la aceptación
   de Admisión y Egresos. Lo único que la saltea es lo que no puede esperar un
   trámite administrativo sin poner la burocracia por delante del paciente:

     · las **urgencias y emergencias** marcadas como tales;
     · todo turno con **prioridad P1 (emergencia) o P2 (urgencia diferible)**,
       aunque no lleve la marca de urgencia.

   La **excepción de horario de la Jefatura** no está en esa lista: que un turno
   se programe fuera del cronograma habitual cambia *cuándo* se opera, no el
   circuito de aprobación. Si esa cirugía es programada, sigue la ruta de las
   programadas —Admisión primero, Jefatura después—; si es de urgencia, sigue la
   ruta de las urgencias, porque lleva la marca de urgencia o la prioridad P1/P2.

   En los casos exentos la aceptación no se elimina: queda **diferida**. El
   trámite se cumplimenta después —incluso con la cirugía ya operada— y hasta
   entonces el turno figura pendiente de regularizar. Lo que no frena es el
   quirófano; lo que sí frena es el cierre del caso. */
function authExenta(c) {
  if (!c) return false;
  return !!c.urgencia || prioridadEfectiva(c) <= 2;
}
/* Por qué este turno saltea la aceptación previa (para explicarlo en pantalla). */
function authMotivoExencion(c) {
  if (!c) return '';
  if (c.urgencia) return 'urgencia / emergencia';
  if (prioridadEfectiva(c) <= 2) return `prioridad P${prioridadEfectiva(c)} — ${PRIOS[prioridadEfectiva(c)].label.toLowerCase()}`;
  return '';
}
/* Un turno avanza en el circuito si tiene el visto de Admisión o si está exento
   de pedirlo por anticipado. */
function authOk(c) { return authExenta(c) || c.auth === 'AUTORIZADO'; }
/* Trámite administrativo todavía abierto: exento del visto previo, pero sin
   regularizar. Se puede cerrar en cualquier momento, incluso después de operar. */
function authPendienteDiferida(c) { return authExenta(c) && c.auth !== 'AUTORIZADO' && c.auth !== 'NO AUTORIZADO'; }

/* ---- Validación de la Jefatura de Quirófanos: quién la necesita ANTES ----
   El circuito normal es que la Jefatura valide el turno —repasando la lista de
   verificación de coordinación: Farmacia, Esterilización, Anestesiología,
   Hemoterapia, estudios preoperatorios y consentimiento— y recién después lo
   confirme en el parte. Eso funciona con la cirugía programada, pero no con la
   guardia: una urgencia que entra a las 2 de la mañana no puede esperar a que
   la Jefatura llegue al hospital para que el cirujano pueda operar.

   Por eso las urgencias y emergencias —la cesárea de urgencia y la endoscopía
   de urgencia entre ellas— y los turnos de prioridad P1 y P2 quedan exentos de
   la validación **previa**: el cirujano abre la Lista de Verificación
   Quirúrgica, opera y cierra el procedimiento sin esperar a nadie. La
   validación de la Jefatura no desaparece: queda **diferida**, igual que la
   autorización de Admisión y Egresos, y se regulariza después, incluso con la
   cirugía ya realizada.

   Si la urgencia entra en un horario en que la Jefatura está, valida como
   siempre: los botones de validar y confirmar en el parte siguen ahí. */
function jefaturaExenta(c) {
  if (!c) return false;
  return !!c.urgencia || prioridadEfectiva(c) <= 2;
}
/* Por qué este turno puede arrancar sin el visto previo de la Jefatura. */
function jefaturaMotivoExencion(c) {
  if (!c) return '';
  if (c.urgencia) return 'urgencia / emergencia';
  if (prioridadEfectiva(c) <= 2) return `prioridad P${prioridadEfectiva(c)} — ${PRIOS[prioridadEfectiva(c)].label.toLowerCase()}`;
  return '';
}
/* El turno se operó sin el visto previo de la Jefatura y nadie lo regularizó
   todavía. No frena nada: queda a la vista hasta que se cierre. */
function jefaturaPendienteDiferida(c) { return !!(c && c.jefaturaDiferida) && !(c && c.jefaturaRegularizada); }
/* ¿Puede el cirujano arrancar sin esperar a la Jefatura? Solo si el turno está
   exento y todavía no pasó por la validación. */
function puedeIniciarSinJefatura(c) {
  return !!c && jefaturaExenta(c) && ['pendiente', 'validada'].includes(c.estado);
}
function jefaturaChip(c) {
  if (!jefaturaPendienteDiferida(c)) return '';
  return '<span class="slot-auth auth-exe" title="Entró como urgencia y se operó sin la validación previa de la Jefatura de Quirófanos. La validación quedó diferida y se regulariza desde la ficha de la cirugía.">VALID. DIFERIDA</span>';
}
/* Bloque de la ficha con el estado de la validación de Jefatura. Devuelve vacío
   en el turno programado, que sigue el circuito normal y no tiene nada especial
   que contar. */
function jefaturaDetalle(c) {
  if (c && c.jefaturaRegularizada) {
    const f = c.jefaturaRegularizada.faltaban || [];
    return `<div class="det-row"><b>Validación de Jefatura</b> <span style="color:var(--green);font-weight:800">REGULARIZADA</span> (${esc(c.jefaturaRegularizada.por || JEFATURA)})${c.jefaturaRegularizada.t ? ' · ' + fmtDT(c.jefaturaRegularizada.t) : ''}${f.length ? `<br><small>Al momento de operar quedaban sin verificar: ${esc(f.join('; '))}.</small>` : ''}</div>`;
  }
  if (!jefaturaPendienteDiferida(c)) return '';
  return `<div class="det-row"><b>Validación de Jefatura</b> <span style="color:#5b21b6;font-weight:800">DIFERIDA — ${esc(c.jefaturaDiferida.motivo || jefaturaMotivoExencion(c))}</span><br>
    <small>La cirugía entró fuera del circuito programado y se operó sin el visto previo de la ${esc(JEFATURA)}: la lista de verificación de coordinación se repasa después. El trámite se cierra desde esta misma ficha, con el botón <b>Regularizar validación</b>. Hasta entonces el caso no queda finalizado ni computa en estadísticas ni en módulos.</small></div>`;
}

function authChip(c) {
  if (c.auth === 'AUTORIZADO') return '<span class="slot-auth auth-ok">AUTORIZADO</span>';
  if (c.auth === 'NO AUTORIZADO') return `<span class="slot-auth auth-no" title="${esc(c.authMotivo || 'Sin motivo registrado')}">NO AUTORIZ.</span>`;
  if (authExenta(c)) return `<span class="slot-auth auth-exe" title="Exenta de la autorización previa (${esc(authMotivoExencion(c))}). El trámite de Admisión y Egresos se puede completar después, incluso finalizada la cirugía.">AUT. DIFERIDA</span>`;
  return '<span class="slot-auth auth-pend">PEND. AUT.</span>';
}

function slotCard(d, s, f, salaOff) {
  const c = turnoEn(d, s.id, f.id);
  const nd = f.nd ? '<span class="slot-nd" title="Corresponde a la madrugada del día siguiente">+1 día</span>' : '';
  if (c) {
    const e = ESTC[c.estado];
    const pe = prioridadEfectiva(c);
    return `<button type="button" class="slot" style="border-left:4px solid ${e.color}" onclick="openSlot('${d}','${s.id}','${f.id}')">
      ${c.urgencia || c.excepcion || c.registroTardio ? `<span class="slot-tags">${c.urgencia ? '<i class="slot-urg-tag">URG</i>' : ''}${c.excepcion ? '<i class="slot-exc-tag" title="Programada por excepción de la Jefatura, fuera del cronograma habitual">EXC</i>' : ''}${c.registroTardio ? '<i class="slot-retro-tag" title="Cirugía ya realizada, registrada fuera de término por la Jefatura de Quirófanos">TARDÍO</i>' : ''}</span>` : ''}
      <span class="slot-hora">${f.t}${nd}</span>
      <span class="slot-cir">${esc(c.cirujano || 's/d')}</span>
      <span class="slot-pac">${esc(c.paciente?.nombre || 's/d')}</span>
      <span class="slot-cx">${esc(c.procedimiento || '')}</span>
      <span class="slot-chips">
        <span class="slot-est" style="background:${e.soft};color:${e.text}">${e.label}</span>
        <span class="slot-prio" style="background:${PRIOS[pe].color}">P${pe}</span>
        ${authChip(c)}
        ${jefaturaChip(c)}
        ${consentimientoDeTurno(c) ? '<span class="slot-ci ci-ok">CI ✓</span>' : '<span class="slot-ci ci-falta">SIN CI</span>'}
      </span>
    </button>`;
  }
  if (salaOff) {
    return `<div class="slot slot-libre slot-bloq"><span class="slot-hora">${f.t}${nd}</span>
      <span class="slot-mas">${ICONS.lock.replace('18', '16')}</span><span class="slot-hint">Bloqueado</span></div>`;
  }
  if (franjaVencida(d, s, f) && !franjaReabierta(d, s.id, f.id)) {
    // La Jefatura —y solo ella— puede reabrirla para anotar una cirugía que ya
    // se hizo y quedó sin registrar.
    if (jefe) {
      return `<button type="button" class="slot slot-libre slot-vencido" onclick="reabrirFranja('${d}','${s.id}','${f.id}')"
        title="Franja cumplida. La Jefatura puede reabrirla, con clave y motivo, para registrar una cirugía ya realizada">
        <span class="slot-hora">${f.t}${nd}</span><span class="slot-mas">${ico(ICONS.lock, 16)}</span>
        <span class="slot-hint">Cumplido — reabrir</span></button>`;
    }
    return `<div class="slot slot-libre slot-bloq" title="La franja ya transcurrió: en la guardia de urgencias solo se programan los horarios que siguen">
      <span class="slot-hora">${f.t}${nd}</span><span class="slot-mas">${ICONS.clockSm.replace('14', '16')}</span>
      <span class="slot-hint">Horario cumplido</span></div>`;
  }
  if (franjaReabierta(d, s.id, f.id)) {
    return `<button type="button" class="slot slot-libre slot-retro" onclick="openSlot('${d}','${s.id}','${f.id}')">
      <span class="slot-hora">${f.t}${nd}</span><span class="slot-mas">+</span>
      <span class="slot-hint">Reabierta — registro tardío</span></button>`;
  }
  const reservable = puedeReservar(d, f, !!f.urg);
  if (!reservable && !f.urg) {
    return `<div class="slot slot-libre slot-bloq" title="Se programa con ${HORAS_ANTICIPACION} h de anticipación (desde ${anticipacionMinima()})">
      <span class="slot-hora">${f.t}${nd}</span><span class="slot-mas">${ICONS.clockSm.replace('14', '16')}</span>
      <span class="slot-hint">&lt; ${HORAS_ANTICIPACION} h</span></div>`;
  }
  return `<button type="button" class="slot slot-libre ${f.urg ? 'slot-urg' : ''}" onclick="openSlot('${d}','${s.id}','${f.id}')">
    <span class="slot-hora">${f.t}${nd}</span><span class="slot-mas">+</span>
    <span class="slot-hint">${f.urg ? 'Anotar urgencia' : 'Disponible'}</span></button>`;
}

/* Bloque de franjas de un turno. El bloqueo ya no es de sala entera: cada turno
   —mañana o tarde— se abre y se cierra por separado, así que se resuelve acá. */
function periodoBloque(d, s, p, clase) {
  const fs = s.franjas.filter((f) => f.p === p);
  if (!fs.length) return '';
  const t = rotuloTurno(p);
  const off = !turnoHabilitado(d, s.id, p);
  const titulo = p === 'N' ? t.label : 'Turno ' + t.label;
  return `<div class="periodo-hdr">${titulo} <span class="ph-t">${t.rango}</span>
      <span class="turno-estado ${off ? 'off' : ''}">${off ? ico(ICONS.lock, 12) + ' Bloqueado' : 'Abierto'}</span></div>
    <div class="${clase || 'franjas-row'}">${fs.map((f) => slotCard(d, s, f, off)).join('')}</div>`;
}

/* Bloque de urgencia de una sala: el turno libre de la hora que corre más los
   turnos de urgencia del día que ya tienen una cirugía anotada. Va aparte de la
   grilla programada porque no se abre ni se cierra: está siempre. */
function urgenciaBloque(d, s) {
  if (!s.urgHoraria) return '';
  const fs = franjasUrgenciaVisibles(d, s);
  const r = rotuloUrgencia(s);
  const esHoy = d === hoyISO();
  const clase = s.tipo === 'endo' ? 'franjas-endo' : 'franjas-row';
  return `<div class="urg-bloque">
    <div class="urg-hdr">${ico(ICONS.zap, 14)} ${r.titulo}
      <span class="uh-t">${esHoy ? 'turno libre de la hora en curso' : 'lo anotado ese día'}</span>
      <span class="turno-estado">${esHoy ? 'ABIERTO 24 H' : ''}</span></div>
    <div class="urg-nota">${esHoy
      ? `Se ofrece <b>un turno libre en la hora que corre</b>, las 24 horas, de lunes a lunes, con la sala abierta o cerrada. Al cumplirse la hora el turno desaparece y aparece el de la hora siguiente; si se anota una ${esc(r.corto)}, queda a la vista en el día y se ofrece otro turno libre en la misma hora.`
      : `El turno de urgencia solo se ofrece en el día de hoy, en la hora que corre. Acá figuran únicamente las de este día que se anotaron.`}</div>
    ${fs.length ? `<div class="${clase}">${fs.map((f) => slotCard(d, s, f, false)).join('')}</div>`
      : '<div class="empty" style="padding:14px">Sin urgencias anotadas este día.</div>'}
    ${jefe ? `<div class="urg-retro"><button class="btn btn-sm btn-outline" onclick="registrarUrgenciaTardia('${d}','${s.id}')">${ico(ICONS.clockSm, 14)} Registrar una ${esc(r.corto)} de una hora ya cumplida</button></div>` : ''}
  </div>`;
}

function salaCard(d, s) {
  const turnos = turnosDeSala(s);
  const abiertos = turnos.filter((p) => turnoHabilitado(d, s.id, p));
  const off = !abiertos.length;
  const clase = s.tipo === 'endo' ? 'franjas-endo' : 'franjas-row';
  const cuerpo = `<div class="franjas-wrap">${turnos.map((p) => periodoBloque(d, s, p, clase)).join('')}${urgenciaBloque(d, s)}</div>`;
  const estado = off ? 'BLOQUEADA'
    : abiertos.length === turnos.length ? 'ABIERTA'
    : 'SOLO ' + abiertos.map((p) => rotuloTurno(p).label.toUpperCase()).join(' Y ');
  return `<div class="sala-card ${off ? 'off' : ''}">
    <div class="sala-hdr">
      <h3>${esc(s.nombre)}</h3>
      ${s.etiqueta ? `<span class="badge-sala ${s.clase}">${s.etiqueta}</span>` : ''}
      <span class="sala-estado ${off ? 'off' : ''}"><span class="sd"></span>${estado}</span>
    </div>
    ${cuerpo}
  </div>`;
}

/* Una urgencia se opera primero y se anota después: puede que nadie la haya
   cargado y que la hora ya se haya cumplido. La Jefatura elige la hora, pone su
   clave y el motivo, y el turno queda marcado como registro fuera de término. */
async function registrarUrgenciaTardia(d, sid) {
  if (!jefe) return;
  const s = sala(sid), r = rotuloUrgencia(s);
  const hora = await pedirTexto(`${s.nombre} — ${fmtDiaLargo(d)}. Indique la hora en que se realizó la ${r.corto} (0 a 23).`, {
    titulo: 'Registrar una urgencia ya realizada', tono: 'jefatura', si: 'Continuar', no: 'Cancelar',
    campo: { label: 'Hora del procedimiento (0–23)', placeholder: 'Ej: 3', requerido: true, error: 'Escriba la hora, de 0 a 23.' },
  });
  if (hora === null) return;
  const h = Number(String(hora).trim().replace(/[^0-9]/g, ''));
  if (!(h >= 0 && h <= 23)) { alert('La hora tiene que ser un número de 0 a 23.'); return; }
  let n = 1;
  while (turnoEn(d, sid, idFranjaUrgencia(h, n))) n++;
  reabrirFranja(d, sid, idFranjaUrgencia(h, n));
}

  const s = sala(sid), f = franjaDe(sid, fid);
  const c = turnoEn(d, sid, fid);
  const u = usuarioActual();
  const nuevo = !c;
  // Excepción habilitada por la Jefatura para esta franja: es la única llave
  // que abre un turno ya cerrado por horario (ver excHabilitar).
  const exc = excepcionPara(d, sid, fid);

  if (nuevo) {
    // La guardia solo admite las franjas que todavía no terminaron, salvo que
    // la Jefatura la haya reabierto para un registro fuera de término.
    if (franjaVencida(d, s, f) && !exc && !franjaReabierta(d, sid, fid)) {
      alert(`La franja de las ${f.t} h ya transcurrió.\n\nEn la guardia de urgencias solo se programan los horarios que siguen a la hora actual.`);
      return;
    }
    // El turno cerrado no se programa ni entrando por un enlace directo.
    if (!turnoHabilitado(d, sid, f.p) && !exc) {
      alert(`El turno de ${rotuloTurno(f.p).label.toLowerCase()} de ${s.nombre} está bloqueado para el ${fmtFecha(fechaDeFranja(d, f))}.\n\nEl bloque programado se abre desde la Jefatura de Quirófanos, por día, turno y sala.`);

        ${f && f.urg ? `<label class="check-row" style="color:var(--red);font-weight:700"><input type="checkbox" id="k-urg" checked disabled> Urgencia / emergencia — turno de guardia de las ${f.t} h: saltea la anticipación de ${HORAS_ANTICIPACION} h</label>` : ''}
      </div>
      <div class="field full" style="margin-top:12px"><label>Equipamiento especial</label>
        <div class="coord-grid">
          ${EQUIPOS.map((x, i) => `<label class="coord-item"><input type="checkbox" class="k-eq" data-eq="${esc(x)}" ${eq.includes(x) ? 'checked' : ''} ${ro}> ${x}</label>`).join('')}
        </div></div>
    </div>

    ${c ? `<div class="det-section">
      <h4>Circuito del turno</h4>
      <div class="det-row"><b>Estado</b> ${ESTC[c.estado].label} — ${ESTC[c.estado].desc}</div>
      ${c.registroTardio ? `<div class="det-row"><b>Registro fuera de término</b> asentado por la ${esc(c.registroTardio.autorizadoPor || JEFATURA)} el ${esc(c.registroTardio.fechaHora || '')} sobre una franja ya vencida — ${esc(c.registroTardio.motivo || '')}</div>` : ''}
      ${authDetalle(c)}
      ${jefaturaDetalle(c)}
      <div class="det-row"><b>Consentimiento informado</b> ${consentimientoDeTurno(c)
        ? `generado el ${esc(consentimientoDeTurno(c).fecha)}`
        : '<span style="color:var(--red);font-weight:700">pendiente de generar</span>'}</div>
      <div class="cir-actions" style="margin-top:10px">
        <button class="btn btn-sm btn-outline" onclick="closeSlot();openCirugia(${c.id})">${ICONS.eyeSm} Ver ficha completa (LVQ, coordinación, informe)</button>
        ${c.auth === 'AUTORIZADO' ? '' : `<button class="btn btn-sm btn-outline" onclick="pedirAutorizacion(${c.id})">${ICONS.shield.replace('18', '14')} ${authExenta(c) ? 'Regularizar Admisión y Egresos' : 'Autorización de Admisión'}</button>`}
      <button class="btn btn-sm btn-outline" onclick="openEquipoMod(${c.id})">${ico(ICONS.users, 14)} Equipo y módulos</button>
        <button class="btn btn-sm btn-blue" onclick="closeSlot();irAConsentimiento(${c.id})">${ICONS.fileText} ${consentimientoDeTurno(c) ? 'Ver / reimprimir consentimiento' : 'Generar consentimiento informado'}</button>
      </div>
    </div>` : ''}

    <div class="form-actions" style="margin-top:4px">
      ${puedeEditar ? `<button class="btn btn-blue" onclick="guardarSlot()">${ICONS.check.replace('14', '16')} ${nuevo ? 'Programar turno' : 'Guardar cambios'}</button>` : ''}
      ${c && (jefe || (u && c.cirujanoEmail === u.email)) ? `<button class="btn btn-red" onclick="cancelarSlot(${c.id})">${ICONS.trash} Cancelar turno</button>` : ''}
      <button class="btn btn-outline" onclick="closeSlot()">Cerrar</button>
      ${!puedeEditar ? `<p class="form-note">El turno ya avanzó en el circuito: los cambios se gestionan desde la ficha completa.</p>` : ''}
    </div>`;
  $('slot-overlay').classList.add('open');
  eqmModulo = '';
  nomIniciar(c, ro);
  pintarModEquipo();
}
function closeSlot() {
  $('slot-overlay').classList.remove('open');
  slotCtx = null;
  // La reapertura vale para un solo turno: cerrado el formulario, se descarta.
  if (retroCtx) { retroCtx = null; if (view === 'grilla') renderProgDiaria(); }
}

async function guardarSlot() {
  const { d, sid, fid, hora } = slotCtx;
  const s = sala(sid);
  const f = franjaDe(sid, fid);
  const u = usuarioActual();
  const exc = excepcionPara(d, sid, fid);
  const paciente = $('k-pac').value.trim();
  const cirujano = $('k-cir').value.trim();
  const diagnostico = $('k-diag').value.trim();
  const { procedimiento, modulo, practica } = nomLeer();
  if (!paciente || !cirujano || !diagnostico || !procedimiento) {
    alert('Complete los campos obligatorios: paciente, cirujano, diagnóstico y la cirugía a realizar (elíjala en el nomenclador).');
    return;
  }
  // Sin módulo la cirugía no puede imputarse en la solapa Módulos Quirúrgicos.
  if (!modulo) {
    alert('Indique el módulo que corresponde a la práctica (A, B o C).\n\nSi la eligió del nomenclador, el módulo se completa solo; si la cargó a mano, debe seleccionarlo.');
    return;
  }
  // Cobertura: si se eligió "agregar otra", el nombre escrito se suma al
  // listado compartido y queda como financiador del turno.
  let obraSocial = $('k-obra').value;
  if (obraSocial === '__nueva__') {
    const escrita = ($('k-obra-nueva') || {}).value || '';
    if (!escrita.trim()) {
      alert('Escriba el nombre de la obra social o prepaga que quiere agregar al listado.');
      return;
    }
    obraSocial = agregarObraSocial(escrita);
  }
  const ayudante = leerAyudante('k-ayu');
  const retro = franjaReabierta(d, sid, fid) ? retroCtx.motivo : '';
  // La urgencia la define la franja: el turno rodante de la hora es siempre
  // urgencia y la casilla está marcada y bloqueada.
  const urgEl = $('k-urg');
  const urgencia = !!f.urg || !!(urgEl && urgEl.checked);
  const existente = turnoEn(d, sid, fid);
  // La cuenta pudo darse de baja mientras el modal estaba abierto.
  if (!existente && u && !jefe && !cuentaAprobada(u)) {
    alert(bloqueoCuenta(u));
    closeSlot(); go('perfil'); return;
  }
  if (!existente && !turnoHabilitado(d, sid, f.p) && !exc && !retro) {
    alert('Ese turno acaba de bloquearse desde la Jefatura de Quirófanos. Actualice la grilla y elija otra franja.');
    return;
  }
  // La hora pudo pasar con el formulario abierto: la guardia no admite cargar
  // un turno en una franja que ya terminó —salvo el registro fuera de término
  // que autorizó la Jefatura—.
  if (!existente && franjaVencida(d, s, f) && !exc && !retro) {
    alert(`La franja de las ${hora} h ya transcurrió mientras cargaba el turno.\n\nElija uno de los horarios que siguen en la guardia.`);
    return;
  }
  if (!existente && !puedeReservar(d, f, urgencia) && !exc && !retro) {
    alert(`Este turno comienza en menos de ${HORAS_ANTICIPACION} horas.\n\nSolo puede programarse marcando "Urgencia / emergencia", y únicamente en el Quirófano 1 o en el quirófano de Obstetricia.`);
    return;
  }
  const edad = Number($('k-edad').value || 0);
  const prio = urgencia ? Math.min(Number($('k-prio').value), 2) : Number($('k-prio').value);
  const c = existente || {
    id: Date.now(), fechaSolicitud: hoyISO(), auth: null,
    historial: [{ t: nowDT(), a: 'Turno programado en la grilla' }],
    coordinacion: { insumos: false, esterilizacion: false, hemoterapia: false, anestesia: false },
    estado: 'pendiente',
  };
  Object.assign(c, {
    sala: sid, franja: fid, quirofano: s.nombre,
    // `fecha` es siempre la fecha calendario real de la cirugía; `diaGrilla` es
    // el día en que la franja se muestra (difieren en la madrugada del Q1).
    fecha: fechaDeFranja(d, f), diaGrilla: d, horaProg: hora,
    paciente: {
      nombre: paciente, dni: $('k-dni').value.trim(), edad, pediatrico: edad > 0 && edad < 15,
      nacimiento: $('k-nac').value, telefono: $('k-tel').value.trim(),
    },
    obraSocial,
    diagnostico, cie10: $('k-cie').value.trim(), procedimiento, practica, modulo,
    cirujano, cirujanoEmail: existente ? c.cirujanoEmail : (exc ? exc.cirujano.email : (u ? u.email : '')),
    servicio: $('k-serv').value,
    anestesista: $('k-anest').value.trim(), anestesia: $('k-tanest').value,
    duracionMin: Number($('k-dur').value || 90),
    prioridad: prio, urgencia,
    recursos: {
      arcoC: [...document.querySelectorAll('.k-eq')].some((x) => x.checked && x.dataset.eq.indexOf('Arco en C') === 0),
      implante: $('k-implante').checked,
      implanteDetalle: $('k-impdet').value.trim(),
      hemoderivados: $('k-hemo').checked,
    },
    equipos: [...document.querySelectorAll('.k-eq')].filter((x) => x.checked).map((x) => x.dataset.eq),
    hce: { datos: true, preop: $('k-preop').checked, consentimiento: $('k-consent').checked },
  });
  // El apto anestésico que declara el cirujano es la misma casilla que después
  // repasa la Jefatura en la lista de verificación de coordinación: una sola
  // verdad, cargada por quien la tiene primero.
  c.coordinacion = c.coordinacion || { insumos: false, esterilizacion: false, hemoterapia: false, anestesia: false };
  c.coordinacion.anestesia = !!($('k-preanest') || {}).checked;
  // Exención de la autorización previa. Antes el turno se estampaba solo como
  // AUTORIZADO, y así el trámite administrativo desaparecía del radar. Ahora la
  // autorización queda **diferida**: no frena nada, pero sigue figurando como
  // pendiente hasta que Admisión y Egresos la regularice —puede hacerlo incluso
  // con la cirugía ya realizada—.
  if (c.authPor === 'Exento — urgencia / emergencia' && !authExenta(c)) {
    // Turnos de la versión anterior a los que se les quitó la marca de urgencia.
    c.auth = null; c.authPor = ''; c.authFecha = '';
    pushHist(c, 'Dejó de estar exento: el turno vuelve a requerir la autorización previa de Admisión y Egresos');
  } else if (authExenta(c) && !c.auth && !c.authDiferida) {
    c.authDiferida = true;
    pushHist(c, `Exento de la autorización previa de Admisión y Egresos (${authMotivoExencion(c)}) — el trámite puede cumplimentarse después, incluso finalizada la cirugía`);
  }
  // La pediatría y la alta complejidad se programan en los primeros horarios.
  if (c.paciente.pediatrico && c.prioridad === 6) c.prioridad = 3;
  // El cirujano queda inscripto de oficio con el módulo de la práctica y el
  // ayudante con el escalón inmediato inferior. Si se declaró «SIN AYUDANTE»,
  // el segundo módulo no se genera.
  c.equipo = equipoActualizado(c, modulo, ayudante);
  c.sinAyudante = !ayudante;
  // Registro fuera de término: la franja ya había pasado y la Jefatura la
  // reabrió para asentar una cirugía hecha. Queda marcado en el turno.
  if (!existente && retro) {
    c.registroTardio = { motivo: retro, autorizadoPor: JEFATURA, fechaHora: nowDT() };
    pushHist(c, `Registrado fuera de término por la ${JEFATURA} sobre una franja ya vencida — ${retro}`);
  }
  // Excepción de la Jefatura: queda asentada en el turno antes de guardarlo,
  // porque de ella depende el aviso obligatorio al cirujano.
  if (!existente && exc) {
    c.excepcion = {
      motivo: exc.motivo, detalle: exc.detalle,
      autorizadaPor: JEFATURA, fechaHora: nowDT(),
      cirujano: exc.cirujano.nombre, cirujanoEmail: exc.cirujano.email,
      avisoId: '', avisos: [],
    };
    pushHist(c, `Programada por excepción de la Jefatura de Quirófanos, fuera del cronograma habitual — ${exc.motivo}`);
  }
  if (existente) pushHist(c, 'Turno actualizado');
  upsert('cirugias', c);
  if (!existente && exc) {
    excCtx = null;
    avisarExcepcion(c);   // vuelve a guardar con el id del aviso emitido
  }
  closeSlot();
  renderProgDiaria();
  // Cerrado el circuito de programación, el paso siguiente es el consentimiento
  // informado: se ofrece de inmediato, con los datos del turno ya volcados.
  if (!existente && retro) {
    // Es una cirugía ya operada: no hay nada que anticipar ni que confirmar al
    // cirujano, solo dejarla asentada y encaminarla al parte.
    await avisar(`Quedó asentada en ${s.nombre}, franja de las ${hora} h del ${fmtFecha(c.fecha)}, como registro fuera de término de la ${JEFATURA}.\n\nSi la cirugía ya se realizó, márquela como Realizada desde su ficha para que entre en el parte quirúrgico y en los módulos.`,
      { titulo: 'Cirugía registrada fuera de término', tono: 'jefatura' });
  } else if (!existente) {
    // Si el paciente ya tenía turno, se resuelve antes que nada: de eso depende
    // que la franja posterior quede libre, o que salga la alerta al cirujano
    // que la tiene programada.
    await ofrecerAnticipacion(c);
    openTurnoOk(c);
  }
}

function closeTurnoOk() { $('cxok-overlay').classList.remove('open'); }

function cancelarSlot(id) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c) return;
  if (['en_curso', 'realizada', 'finalizada'].includes(c.estado)) {
    alert('No se puede cancelar un turno en curso o ya realizado. Si corresponde, registre la incidencia correspondiente.');
    return;
  }
  if (c.estado === 'confirmada') {
    alert('El turno ya está confirmado en el parte oficial: debe suspenderse con causa registrada, no cancelarse.');
    closeSlot();
    openSuspender(id);
    return;
  }
  pedirClave('Cancelar turno', 'Ingrese la clave de autorización para liberar esta franja horaria.', CLAVE_CANCELAR, async () => {
    if (!await preguntar(`Se elimina el turno de ${c.paciente?.nombre || 's/d'} y la franja queda libre.`,
      { titulo: '¿Cancelar el turno?', tono: 'peligro', si: 'Sí, cancelarlo', no: 'No' })) return;
    removeDoc('cirugias', id);
    closeSlot();
    renderProgDiaria();
  });
}

/* ================= AUTORIZACIÓN DE ADMISIÓN Y EGRESOS =================
   El sector administrativo autoriza o rechaza el turno. El rechazo exige un
   motivo escrito, que queda guardado en el turno y visible en la grilla, en la
   ficha, en el parte y en los recordatorios: sin eso el cirujano no sabe qué
   corregir para volver a presentarlo. */
let authCtx = null;

/* El trámite se puede abrir en cualquier momento del circuito. En los turnos
   exentos —urgencias y emergencias, P1 y P2— sirve para regularizar
   la autorización después, incluso con la cirugía ya realizada. */
function pedirAutorizacion(id) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c) return;
  const dif = authExenta(c);
  // Turno programado: la carpeta llega completa o no llega. La urgencia entra
  // igual, porque regulariza después.
  if (!dif && !operada(c)) {
    const falta = requisitosAdmision(c);
    if (falta.length) {
      alert('El turno todavía no está en condiciones de pasar por Admisión y Egresos.\n\nFalta:\n\n· ' + falta.join('\n· ')
        + '\n\nEl cirujano debe completarlo desde el propio turno antes de que Admisión dictamine.');
      return;
    }
  }
  pedirClave(dif ? 'Regularizar — Admisión y Egresos' : 'Autorización — Admisión y Egresos',
    dif
      ? `Turno exento de la autorización previa (${authMotivoExencion(c)}). El trámite se registra ahora, sin importar en qué estado esté la cirugía. Ingrese la clave del sector de Admisión y Egresos.`
      : 'Ingrese la clave del sector de Admisión y Egresos del HRU.',
    CLAVE_AUTORIZACION, () => openAuth(id));
}

const MOTIVOS_NO_AUT = [
  'Cobertura sin verificar o dada de baja',
  'Falta documentación administrativa del paciente',
  'Paciente sin empadronar / datos filiatorios incompletos',
  'Autorización de la obra social no otorgada',
  'Prestación no cubierta por el financiador',
  'Deuda o cobertura suspendida',
  'Duplicación de solicitud para el mismo paciente',
];

function openAuth(id) {
  const c = DB.cirugias.find((x) => x.id === id);

  authCtx = id;
  const prev = c.auth === 'NO AUTORIZADO';
  $('auth-modal').innerHTML = `

      · ${esc(c.quirofano || '')} — ${esc(c.horaProg || '')} h · ${fmtFecha(c.fecha)}<br>
      · Estado actual: <b>${esc(c.auth || 'PENDIENTE')}</b>
    </div>

    <div class="field" style="margin-bottom:12px">
      <label>Dictamen</label>
      <label class="check-row"><input type="radio" name="auth-r" value="1" ${c.auth === 'AUTORIZADO' ? 'checked' : ''} onchange="onAuthOpcion()"><span><b>1 — AUTORIZADO</b> · el turno puede confirmarse en el parte oficial</span></label>
      <label class="check-row" style="color:var(--red)"><input type="radio" name="auth-r" value="2" ${prev ? 'checked' : ''} onchange="onAuthOpcion()"><span><b>2 — NO AUTORIZADO</b> · el turno no entra al parte oficial y el cirujano ve el motivo</span></label>
    </div>

    <div id="auth-motivo-wrap" style="display:${prev ? 'block' : 'none'}">

        <select id="auth-motivo-sel" onchange="onAuthMotivoSel()">
          <option value="">Seleccionar un motivo frecuente…</option>
          ${MOTIVOS_NO_AUT.map((m) => `<option value="${esc(m)}">${esc(m)}</option>`).join('')}

        <textarea id="auth-motivo" rows="3" placeholder="Explique por qué no se autoriza el turno. El cirujano verá este texto.">${esc(c.authMotivo || '')}</textarea>
        <span class="hint">Queda visible para el cirujano, la Jefatura y en el parte quirúrgico.</span>
      </div>
    </div>

    <div class="field" style="margin-bottom:6px">
      <label>Agente que dictamina (opcional)</label>
      <input type="text" id="auth-agente" placeholder="Apellido y nombre del administrativo" value="${esc(c.authAgente || '')}">
    </div>

    <p class="pass-error" id="auth-err" style="margin:6px 0 0"></p>
    <div class="form-actions" style="margin-top:14px">
      <button class="btn btn-blue" onclick="guardarAuth()">${ico(ICONS.check, 16)} Registrar dictamen</button>
      <button class="btn btn-outline" onclick="closeAuth()">Cancelar</button>
    </div>`;
  $('auth-overlay').classList.add('open');
}
function closeAuth() { $('auth-overlay').classList.remove('open'); authCtx = null; }
function authOpcion() {
  const r = document.querySelector('input[name="auth-r"]:checked');
  return r ? r.value : '';
}
function onAuthOpcion() {
  const w = $('auth-motivo-wrap');
  if (w) w.style.display = authOpcion() === '2' ? 'block' : 'none';
}
/* El motivo frecuente precarga el detalle, que sigue siendo editable. */
function onAuthMotivoSel() {
  const sel = $('auth-motivo-sel'), t = $('auth-motivo');
  if (!sel || !t) return;
  if (sel.value && sel.value !== '__otro__') t.value = sel.value;
  else if (sel.value === '__otro__') t.value = '';
  t.focus();
}
function guardarAuth() {
  const c = DB.cirugias.find((x) => x.id === authCtx);
  if (!c) return closeAuth();
  const err = $('auth-err');
  const op = authOpcion();
  if (op !== '1' && op !== '2') {
    err.textContent = 'Elija el dictamen: 1 (autorizado) o 2 (no autorizado).';
    err.style.display = 'block';
    return;
  }
  const motivo = (($('auth-motivo') || {}).value || '').trim();
  if (op === '2' && motivo.length < 5) {
    err.textContent = 'El rechazo exige un motivo escrito: explique por qué no se autoriza el turno.';
    err.style.display = 'block';
    return;
  }
  c.auth = op === '1' ? 'AUTORIZADO' : 'NO AUTORIZADO';
  c.authMotivo = op === '2' ? motivo : '';
  c.authAgente = (($('auth-agente') || {}).value || '').trim();
  c.authFecha = nowDT();
  c.authPor = 'Admisión y Egresos';
  // Deja constancia de que el trámite se cerró después de operar: es
  // exactamente lo que habilita la excepción, y conviene que quede escrito.
  c.authDiferidaCerrada = ['en_curso', 'realizada', 'finalizada'].includes(c.estado);
  pushHist(c, 'Admisión y Egresos: ' + (c.auth === 'AUTORIZADO' ? 'ACEPTADA' : c.auth) + (c.authAgente ? ' (' + c.authAgente + ')' : '') + (c.authMotivo ? ' — Motivo: ' + c.authMotivo : '')
    + (c.authDiferidaCerrada ? ' — trámite regularizado con la cirugía ya operada' : ''));
  // Si era lo último que faltaba, el caso se cierra acá mismo.
  revisarCierre(c);
  upsert('cirugias', c);
  closeAuth();
  if ($('slot-overlay').classList.contains('open')) openSlot(diaDeGrilla(c), c.sala, c.franja);
  else refreshView();
}
/* Bloque reutilizable con el dictamen y —si corresponde— el motivo del rechazo. */
function authDetalle(c) {
  if (authPendienteDiferida(c)) {
    return `<div class="det-row"><b>Autorización</b> <span style="color:#5b21b6;font-weight:800">DIFERIDA — ${esc(authMotivoExencion(c))}</span><br>
      <small>Exenta de la aceptación <b>previa</b>: el turno se valida y entra al parte sin esperarla. El trámite de Admisión y Egresos sigue pendiente y se cumplimenta en cualquier momento, <b>incluso con la cirugía ya operada</b>. Mientras no se cierre, el caso no queda finalizado ni computa en estadísticas ni en módulos.</small></div>`;
  }
  const cuando = c.authFecha ? ` · ${fmtDT(c.authFecha)}` : '';
  const quien = c.authAgente ? ` · ${esc(c.authAgente)}` : '';
  if (c.auth === 'NO AUTORIZADO') {
    return `<div class="det-row"><b>Autorización</b> <span style="color:var(--red);font-weight:800">NO AUTORIZADO</span> (Admisión y Egresos${quien})${cuando}</div>
      <div class="banner banner-red" style="margin:8px 0 0;padding:10px 14px">${ico(ICONS.alertTri, 16)}
        <div><strong>Motivo del rechazo</strong>${esc(c.authMotivo || 'sin motivo registrado')}</div></div>`;
  }
  if (c.auth === 'AUTORIZADO') {
    return `<div class="det-row"><b>Autorización</b> <span style="color:var(--green);font-weight:800">AUTORIZADO</span> (Admisión y Egresos${quien})${cuando}${c.authDiferidaCerrada ? ' · <span style="color:#5b21b6;font-weight:700">trámite regularizado después de la cirugía</span>' : ''}</div>`;

  return '<div class="det-row"><b>Autorización</b> PENDIENTE (Admisión y Egresos)</div>';
}

/* ---- Modal de clave genérico ---- */
let claveCB = null;
function pedirClave(titulo, desc, esperada, onOk) {
  claveCB = { esperada, onOk };
  $('clave-titulo').textContent = titulo;
  $('clave-desc').textContent = desc;
  $('clave-inp').value = '';
  $('clave-err').style.display = 'none';
  $('clave-overlay').classList.add('open');
  setTimeout(() => $('clave-inp').focus(), 60);
}
function closeClave() { $('clave-overlay').classList.remove('open'); claveCB = null; }
function validarClave() {
  if (!claveCB) return;
  if ($('clave-inp').value === claveCB.esperada) {
    const cb = claveCB.onOk;
    closeClave();
    cb();
  } else {
    $('clave-err').style.display = 'block';
    $('clave-inp').value = '';
    $('clave-inp').focus();
  }
}

let deferredPrompt = null;

  deferredPrompt = null;

});
async function promptInstall() {
  if (!deferredPrompt) {
    alert('Para instalar la app:\n\n· Android / Chrome: menú ⋮ → "Instalar aplicación" o "Agregar a pantalla principal".\n· iPhone / iPad (Safari): botón Compartir → "Agregar a pantalla de inicio".\n· Escritorio: icono de instalación en la barra de direcciones.');

}

/* ================= ACTUALIZACIÓN AUTOMÁTICA =================
   La app se publica en GitHub Pages y queda instalada en teléfonos y
   computadoras del hospital. Sin esto, un dispositivo podría seguir usando la
   copia cacheada por el service worker durante días.

   Circuito: el navegador descarga el sw.js nuevo, entra en estado "waiting", la
   app avisa con una barra y —al aceptar— le ordena tomar el control y recarga.
   La comprobación se repite cada media hora y cada vez que la app vuelve al
   frente, de modo que un cambio publicado hoy llega solo, sin desinstalar nada. */
let swRegistro = null;
let swEsperando = null;

/* ¿Quedó texto cargado en la pantalla? Se ignoran las casillas y los selectores
   de fecha, que traen valor por defecto y no son trabajo del usuario. */
function hayTextoCargado() {
  return [...document.querySelectorAll('#main input, #main textarea')].some((el) => {
    if (['checkbox', 'radio', 'date', 'month'].includes(el.type)) return false;
    return String(el.value || '').trim() !== '';
  });
}
/* Hay trabajo a medio hacer si algún campo tiene texto o si hay un modal
   abierto: en ese caso la actualización no se aplica sola. */
function hayTrabajoEnCurso() {
  return !!document.querySelector('.overlay.open') || hayTextoCargado();
}
function mostrarAvisoActualizacion() {
  // Sin nada tipeado, la app se actualiza sola: es el caso habitual, con la
  // pantalla en el panel o en la grilla.
  if (!hayTrabajoEnCurso()) { aplicarActualizacion(); return; }
  const bar = $('update-bar');
  if (bar) bar.classList.add('open');
}
function aplicarActualizacion() {
  const bar = $('update-bar');
  if (bar) $('update-txt').textContent = 'Actualizando…';
  if (swEsperando) swEsperando.postMessage('skipWaiting');
  // Si el worker no responde, la recarga forzada alcanza igual.
  setTimeout(() => location.reload(), 1500);
}
function vigilarWorker(reg) {
  const nuevo = reg.installing || reg.waiting;
  if (!nuevo) return;
  const evaluar = () => {
    // Solo es una actualización si ya había una versión controlando la página:
    // en la primera instalación no hay nada que avisar.
    if (nuevo.state === 'installed' && navigator.serviceWorker.controller) {
      swEsperando = reg.waiting || nuevo;
      mostrarAvisoActualizacion();
    }
  };
  evaluar();
  nuevo.addEventListener('statechange', evaluar);
}
function initActualizaciones() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  navigator.serviceWorker.register('sw.js').then((reg) => {
    swRegistro = reg;
    vigilarWorker(reg);
    reg.addEventListener('updatefound', () => vigilarWorker(reg));
    setInterval(() => reg.update().catch(() => {}), 30 * 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    window.addEventListener('online', () => reg.update().catch(() => {}));
  }).catch(() => { /* sin SW la app funciona igual, solo pierde el modo offline */ });

  // El worker nuevo tomó el control: se recarga una sola vez para estrenar la
  // versión publicada. En la primera visita no hay nada que estrenar —el worker
  // recién se instala y reclama la página—, así que ahí no se recarga.
  const teniaControlador = !!navigator.serviceWorker.controller;
  let recargando = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (recargando || !teniaControlador) return;
    recargando = true;
    location.reload();
  });
}

const escNl = (s) => esc(s).replace(/\n/g, '<br>');
function ciFechaLarga(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  if (!y || !m || !d) return '';
  return `${String(d).padStart(2, '0')} de ${MESES_FULL[m - 1].toLowerCase()} de ${y}`;
}
function ciHoy() { return ciFechaLarga(hoyISO()); }
function ciEdad(nac, edadDeclarada) {
  if (nac) {
    const n = new Date(nac + 'T00:00:00'), h = new Date();
    let a = h.getFullYear() - n.getFullYear();
    const dm = h.getMonth() - n.getMonth();
    if (dm < 0 || (dm === 0 && h.getDate() < n.getDate())) a--;
    if (a >= 0) return `${a} años`;
  }
  return edadDeclarada ? `${edadDeclarada} años` : '';
}
function ciFirmaRepresentante() { return String(ciForm.p_lucidez || '').includes('representante'); }

/* ---- Edición del formulario ----
   El campo se actualiza en memoria y solo se repinta la vista previa, para no
   perder el foco ni lo tipeado. Los cambios que alteran la estructura del
   formulario (especialidad, procedimiento, quién firma) sí lo repintan entero. */
function ciSet(k, valor, repintarTodo) {
  ciForm[k] = valor;
  if (['t_desc', 't_comp', 't_alt', 't_cita'].includes(k)) ciEvidencia = 'texto editado por el profesional';
  if (repintarTodo) { renderConsentimientos(); return; }
  ciPintarPreview();
}
function ciPintarPreview() {
  const doc = $('ci-doc');
  if (doc) doc.innerHTML = ciDocHTML(ciForm);
  const b = $('ci-badge');
  if (b) b.textContent = ciEvidencia.toUpperCase();
}
function ciSetEsp(v) {
  ciForm.c_esp = v;
  ciForm.c_proc = '';
  renderConsentimientos();
}
function ciSetProc(v) {
  ciForm.c_proc = v;
  const p = v && CI_PROCEDIMIENTOS[ciForm.c_esp] ? CI_PROCEDIMIENTOS[ciForm.c_esp][v] : null;
  if (p) {
    if (p.nombre) ciForm.c_nombre = p.nombre;
    ciForm.t_desc = p.desc;
    ciForm.t_comp = p.comp;
    ciForm.t_alt = p.alt;
    ciForm.t_cita = p.cita;
    ciForm.c_anest = p.anest;
    ciEvidencia = 'consenso cargado';
  }
  renderConsentimientos();
}

/* ---- Volcado automático desde un turno de la grilla ---- */
function ciNormalizar(s) {
  return String(s || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
}
/* Busca dentro de la especialidad el procedimiento cuyo nombre se parece más al
   texto escrito en el turno. Devuelve la clave, o la entrada genérica de la
   especialidad si ninguno alcanza una coincidencia razonable. */
function ciSugerirProc(esp, texto) {
  const procs = CI_PROCEDIMIENTOS[esp];
  if (!procs) return '';
  const palabras = ciNormalizar(texto).split(' ').filter((w) => w.length > 3);
  if (!palabras.length) return '';
  let mejor = '', mejorPunt = 0;
  Object.entries(procs).forEach(([k, p]) => {
    const ref = ciNormalizar(p.label + ' ' + p.nombre);
    const punt = palabras.reduce((n, w) => n + (ref.includes(w) ? w.length : 0), 0);
    if (punt > mejorPunt) { mejorPunt = punt; mejor = k; }
  });
  if (mejorPunt >= 5) return mejor;
  return Object.keys(procs).find((k) => k.startsWith('otro')) || '';
}
function ciDesdeTurno(c) {
  const u = usuarioActual();
  const esp = CI_MAP_SERVICIO[c.servicio] || 'Otra especialidad';
  const f = { ...CI_VACIO };
  f.turnoId = c.id;
  f.p_nombre = c.paciente?.nombre || '';
  f.p_dni = c.paciente?.dni || '';
  f.p_nac = c.paciente?.nacimiento || '';
  f.p_edad = c.paciente?.edad || '';
  f.p_tel = c.paciente?.telefono || '';
  f.p_os = c.obraSocial || '';
  f.p_lucidez = (c.paciente?.edad && c.paciente.edad < 18) ? CI_LUCIDEZ[2].v : CI_LUCIDEZ[0].v;
  f.m_nombre = c.cirujano || (u ? u.nombre : '');
  f.m_mat = (u && u.matricula?.numero) || '';
  f.m_esp = c.servicio || (u ? u.servicio : '');
  f.m_serv = c.servicio || '';
  f.m_inst = 'Hospital Regional Ushuaia';
  f.c_esp = CI_PROCEDIMIENTOS[esp] ? esp : 'Otra especialidad';
  f.c_fecha = c.fecha || '';
  f.c_hora = c.horaProg || '';
  f.c_sala = c.quirofano || '';
  f.c_anest = CI_MAP_ANESTESIA[c.anestesia] || 'A definir por anestesiólogo';
  f.c_dx = c.diagnostico || '';
  f.c_cie10 = c.cie10 || '';
  f.c_nombre = c.procedimiento || '';
  // Contenido clínico sugerido a partir del nombre de la cirugía declarada.
  const clave = ciSugerirProc(f.c_esp, c.procedimiento);
  const p = clave ? CI_PROCEDIMIENTOS[f.c_esp][clave] : null;
  if (p) {
    f.c_proc = clave;
    f.t_desc = p.desc; f.t_comp = p.comp; f.t_alt = p.alt; f.t_cita = p.cita;
    if (!f.c_anest || f.c_anest === 'A definir por anestesiólogo') f.c_anest = p.anest;
  }
  return f;
}
/* Abre el generador con los datos del turno ya volcados. Si el turno ya tiene
   un consentimiento guardado, se recupera ese en lugar de rehacerlo. */
function irAConsentimiento(turnoId) {
  const c = DB.cirugias.find((x) => String(x.id) === String(turnoId));
  if (!c) return;
  const previo = consentimientoDeTurno(c);
  ciForm = previo ? { ...CI_VACIO, ...previo.datos } : ciDesdeTurno(c);
  ciEvidencia = previo ? 'recuperado del registro' : 'volcado desde la programación';
  ciTab = 'generar';
  go('consentimientos');
}
/* Turnos futuros del cirujano que todavía no tienen consentimiento generado.
   Alimenta el aviso del menú lateral. */
function ciPendientesDe(u) {
  if (!u) return 0;
  const hoy = hoyISO();
  return DB.cirugias.filter((c) => c.cirujanoEmail === u.email && (c.fecha || '') >= hoy
    && !['suspendida', 'realizada', 'finalizada'].includes(c.estado) && !consentimientoDeTurno(c)).length;
}
function consentimientoDeTurno(c) {
  if (!c) return null;
  return DB.consentimientos.find((x) => String(x.turnoId) === String(c.id)) || null;
}

/* ---- Alcance del registro de consentimientos ----
   El consentimiento informado es una pieza de la historia clínica del paciente
   y lleva la firma del profesional que lo explicó. Cada médico ve, entonces,
   únicamente los que generó: el registro completo del bloque quirúrgico es de
   consulta exclusiva de la Jefatura de Quirófanos, que responde por el archivo.
   Los consentimientos guardados antes de que se registrara el autor se
   reconocen por el turno del que nacieron o por el nombre del médico. */
function ciVeTodo() { return !!jefe; }
function ciEsPropio(r) {
  const u = usuarioActual();
  if (!r || !u) return false;
  const igual = (a, b) => !!a && !!b && String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
  // Lo generó el profesional…
  if (igual(r.autor, u.email)) return true;
  // …o nació de un turno suyo —el caso del consentimiento que emite la
  // Jefatura por el cirujano— …
  const c = r.turnoId ? DB.cirugias.find((x) => String(x.id) === String(r.turnoId)) : null;
  if (c && igual(c.cirujanoEmail, u.email)) return true;
  // …o lleva su nombre como médico responsable.
  return igual(r.medico, u.nombre);
}
function ciPuedeVer(r) { return ciVeTodo() || ciEsPropio(r); }
function ciRegistroVisible() {
  return ciVeTodo() ? DB.consentimientos.slice() : DB.consentimientos.filter(ciEsPropio);
}
/* Un consentimiento ajeno no se abre, no se baja y no se borra. */
function ciTraerDelRegistro(id) {
  const r = DB.consentimientos.find((x) => String(x.id) === String(id));
  if (!r) return null;
  if (!ciPuedeVer(r)) {
    alert('Ese consentimiento informado pertenece a otro profesional. El registro completo del bloque quirúrgico lo consulta la Jefatura de Quirófanos.');
    return null;
  }
  return r;
}

/* ---- Acciones ---- */
function ciValido() {
  if (!ciForm.p_nombre.trim() || !ciForm.c_nombre.trim()) {
    alert('Complete al menos el nombre del paciente y el nombre del procedimiento.');
    return false;
  }
  if (ciFirmaRepresentante() && !ciForm.r_nombre.trim()) {
    alert('El paciente firma por representante legal: cargue su nombre y su vínculo.');
    return false;
  }
  return true;
}
function ciNombreArchivo() {
  const pac = (ciForm.p_nombre || 'paciente').replace(/[^a-zA-Z0-9áéíóúñÑÁÉÍÓÚ ]/g, '').replace(/\s+/g, '_');
  return `Consentimiento_${pac}_${hoyISO()}`;
}
function ciBajarArchivo(cuerpo, nombre) {
  const blob = new Blob(['﻿', ciDocWord(cuerpo)], { type: 'application/msword' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nombre + '.doc';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
function ciImprimirCuerpo(cuerpo) {
  const w = window.open('', '_blank');
  if (!w) { alert('El navegador bloqueó la ventana de impresión. Habilite las ventanas emergentes para este sitio.'); return; }
  w.document.write(ciDocImprimible(cuerpo));
  w.document.close();
  w.focus();
  setTimeout(() => w.print(), 400);
}
/* Guarda en el registro compartido y, si el consentimiento nació de un turno,
   lo marca como registrado en la ficha de esa cirugía. */
function ciRegistrar() {
  const previo = ciForm.turnoId ? DB.consentimientos.find((x) => String(x.turnoId) === String(ciForm.turnoId)) : null;
  const reg = {
    id: previo ? previo.id : Date.now(),
    fecha: new Date().toLocaleString('es-AR'),
    fechaISO: hoyISO(),
    paciente: ciForm.p_nombre,
    dni: ciForm.p_dni,
    procedimiento: ciForm.c_nombre,
    medico: ciForm.m_nombre,
    especialidad: ciForm.c_esp,
    fechaCx: ciForm.c_fecha,
    turnoId: ciForm.turnoId || null,
    autor: (usuarioActual() || {}).email || (jefe ? 'jefatura' : ''),
    datos: { ...ciForm },
  };
  upsert('consentimientos', reg);
  if (reg.turnoId) {
    const c = DB.cirugias.find((x) => String(x.id) === String(reg.turnoId));
    if (c && !c.hce?.consentimiento) {
      c.hce = { ...(c.hce || {}), consentimiento: true };
      pushHist(c, 'Consentimiento informado generado y registrado');
      upsert('cirugias', c);
    }
  }
  return reg;
}
function ciGuardar() {
  if (!ciValido()) return;
  ciRegistrar();
  alert('Consentimiento guardado en el registro del bloque quirúrgico.');
  renderConsentimientos();
}
function ciDescargar() {
  if (!ciValido()) return;
  ciRegistrar();
  ciBajarArchivo(ciDocHTML(ciForm), ciNombreArchivo());
  renderConsentimientos();
}
function ciImprimir() {
  if (!ciValido()) return;
  ciImprimirCuerpo(ciDocHTML(ciForm));
}
async function ciLimpiar() {
  if (!await preguntar('Se vacían los campos en pantalla. No se borra nada del registro guardado.',
    { titulo: '¿Limpiar el formulario?', tono: 'pregunta', si: 'Sí, limpiar' })) return;
  ciForm = { ...CI_VACIO };
  ciEvidencia = 'evidencia';
  renderConsentimientos();
}
function ciCargarDelRegistro(id) {
  const r = ciTraerDelRegistro(id);
  if (!r) return;
  ciForm = { ...CI_VACIO, ...r.datos };
  ciEvidencia = 'recuperado del registro';
  ciTab = 'generar';
  renderConsentimientos();
  window.scrollTo(0, 0);
}
function ciBajarDelRegistro(id) {
  const r = ciTraerDelRegistro(id);
  if (!r) return;
  const cuerpo = ciDocHTML({ ...CI_VACIO, ...r.datos });
  const pac = (r.paciente || 'paciente').replace(/[^a-zA-Z0-9áéíóúñÑÁÉÍÓÚ ]/g, '').replace(/\s+/g, '_');
  ciBajarArchivo(cuerpo, `Consentimiento_${pac}_${r.fechaISO || hoyISO()}`);
}
function ciImprimirDelRegistro(id) {
  const r = ciTraerDelRegistro(id);
  if (!r) return;
  ciImprimirCuerpo(ciDocHTML({ ...CI_VACIO, ...r.datos }));
}
function ciBorrarDelRegistro(id) {
  const r = ciTraerDelRegistro(id);
  if (!r) return;
  pedirClave('Eliminar consentimiento', 'El consentimiento informado forma parte de la historia clínica. Ingrese la clave de autorización para retirarlo del registro.', CLAVE_CANCELAR, async () => {
    if (!await preguntar(`Se elimina del registro el consentimiento informado de ${r.paciente || 's/d'}.`,
      { titulo: '¿Eliminar el consentimiento?', tono: 'peligro', si: 'Sí, eliminar' })) return;
    removeDoc('consentimientos', r.id);
    renderConsentimientos();
  });
}

/* ---- Vista ---- */
function ciCampo(k, label, tipo, ancho, extra) {
  const v = esc(ciForm[k] ?? '');
  return `<div class="field${ancho === 'full' ? ' full' : ''}">
    <label>${label}</label>
    <input type="${tipo || 'text'}" value="${v}" ${extra || ''} oninput="ciSet('${k}', this.value)">
  </div>`;
}
function ciArea(k, label, ayuda) {
  return `<div class="field full">
    <label>${label}</label>
    <textarea oninput="ciSet('${k}', this.value)">${esc(ciForm[k] || '')}</textarea>
    ${ayuda ? `<span class="hint">${ayuda}</span>` : ''}
  </div>`;
}
/* ---- Identidad del profesional que firmó el consentimiento ----
   El registro guarda el nombre escrito en el formulario y, si el médico estaba
   logueado, su correo. Con el correo se llega a la ficha del profesional y de
   ahí al servicio al que pertenece, que es como la Jefatura quiere leer el
   archivo: primero el servicio, después el médico. */
function ciMedicoDe(r) {
  const u = (r.autor && DB.usuarios.find((x) => x.email === r.autor))
    || DB.usuarios.find((x) => x.nombre && r.medico && mismoProfesional(x.nombre, r.medico))
    || null;
  const nombre = (u && u.nombre) || profesionalCanonico(r.medico) || 'Sin profesional identificado';
  const serv = (u && u.servicio) || r.especialidad || '';
  return { nombre, servicio: servicioCanonico(serv) || 'Sin servicio asignado' };
}
function ciRegistroLista() {
  const q = ciRegQ.toLowerCase();
  const list = ciRegistroVisible()
    .filter((r) => !q || [r.paciente, r.dni, r.procedimiento, r.medico].some((x) => String(x || '').toLowerCase().includes(q)))
    .sort((a, b) => b.id - a.id);
  if (!list.length) {
    return `<div class="empty">${ciRegQ ? 'Ningún consentimiento coincide con la búsqueda.'
      : (ciVeTodo() ? 'Todavía no hay consentimientos guardados en el bloque quirúrgico.'
        : 'Todavía no generó ningún consentimiento informado. Los que genere desde la programación quedan archivados acá.')}</div>`;
  }
  // La Jefatura ve el archivo completo: se agrupa por servicio y, dentro de
  // cada servicio, por profesional en orden alfabético de apellido. Cada
  // médico se despliega a un clic. El médico ve solo lo suyo, en lista simple.
  if (ciVeTodo()) return ciRegistroAgrupado(list);
  return ciFichas(list);
}

/* Las fichas propiamente dichas. Se usan tal cual en la lista simple del médico
   y dentro de cada profesional en el archivo agrupado de la Jefatura. */
function ciFichas(list) {
  return list.map((r) => `
    <div class="ci-reg-card">
      <div class="ci-reg-top">
        <span class="nm">${esc(r.paciente || 's/d')}</span>
        ${r.dni ? `<span style="font-size:0.78rem;color:var(--muted)">DNI ${esc(r.dni)}</span>` : ''}
        ${r.turnoId ? '<span class="ci-badge">VINCULADO A UN TURNO</span>' : ''}
        <span class="dt">${esc(r.fecha || '')}</span>
      </div>
      <div class="ci-reg-sub">${esc(r.procedimiento || '')}${r.fechaCx ? ` · cirugía del ${fmtFecha(r.fechaCx)}` : ''}${r.medico ? ` · ${esc(r.medico)}` : ''}</div>
      <div class="ci-reg-acc">
        <button class="btn btn-sm btn-outline" onclick="ciCargarDelRegistro('${r.id}')">${ICONS.edit} Cargar y editar</button>
        <button class="btn btn-sm btn-blue" onclick="ciBajarDelRegistro('${r.id}')">${ico(ICONS.download, 14)} Descargar (Word)</button>
        <button class="btn btn-sm btn-outline" onclick="ciImprimirDelRegistro('${r.id}')">${ICONS.fileText} Imprimir / PDF</button>
        <button class="btn btn-sm btn-red" onclick="ciBorrarDelRegistro('${r.id}')">${ICONS.trash} Eliminar</button>
      </div>
    </div>`).join('');
}

/* Registro del bloque agrupado: Servicio › Profesional (por apellido) › fichas. */
function ciRegistroAgrupado(list) {
  // Servicio y profesional se agrupan por su clave canónica: «Cirugia General»
  // y «Cirugía General» son el mismo servicio, y «hugo diaz» y «Dr. Hugo Díaz»
  // el mismo médico. El rótulo que se muestra es el bien escrito.
  const servicios = {}, rotulo = {}, rotuloM = {};
  list.forEach((r) => {
    const m = ciMedicoDe(r);
    const k = claveServicio(m.servicio) || sinTildes(m.servicio).trim();
    if (!rotulo[k] || m.servicio.length > rotulo[k].length) rotulo[k] = m.servicio;
    const km = claveProfesional(m.nombre) || sinTildes(m.nombre).trim();
    if (!rotuloM[km] || m.nombre.length > rotuloM[km].length) rotuloM[km] = m.nombre;
    const sv = servicios[k] || (servicios[k] = {});
    (sv[km] = sv[km] || []).push(r);
  });
  const buscando = !!ciRegQ;
  return Object.keys(servicios).sort((a, b) => (rotulo[a] || a).localeCompare(rotulo[b] || b, 'es'))
    .map((sv) => {
      const medicos = Object.keys(servicios[sv]).sort((a, b) => {
        const na = rotuloM[a] || a, nb = rotuloM[b] || b;
        return apellidoDe(na).localeCompare(apellidoDe(nb), 'es') || na.localeCompare(nb, 'es');
      });
      const total = medicos.reduce((n, m) => n + servicios[sv][m].length, 0);
      return `<div class="ci-serv">
        <div class="ci-serv-hdr">${ico(ICONS.layers, 15)} ${esc(rotulo[sv] || sv)}
          <span class="ci-serv-n">${medicos.length} profesional(es) · ${total} consentimiento(s)</span></div>
        <div class="q-acc-list">${medicos.map((m) => {
          const fichas = servicios[sv][m];
          const clave = sv + '|' + m;
          const abierto = buscando || !!ciAbierto[clave];
          return `<div>
            <button type="button" class="q-acc ${abierto ? 'on' : ''}" onclick="ciToggleMedico('${attr(clave)}')">
              <span class="q-acc-dot" style="background:#2980d9"></span>
              <span class="q-acc-lbl">${esc(rotuloM[m] || m)}</span>
              <span class="q-acc-hint">último: ${esc((fichas[0] && fichas[0].fecha) || '')}</span>
              <span class="q-acc-n">${fichas.length}</span>
              <span class="q-acc-car">▾</span>
            </button>
            ${abierto ? `<div class="q-acc-body">${ciFichas(fichas)}</div>` : ''}
          </div>`;
        }).join('')}</div>
      </div>`;
    }).join('');
}
let ciAbierto = {};
function ciToggleMedico(clave) {
  const k = decodeURIComponent(clave);   // viaja codificada en el onclick
  ciAbierto[k] = !ciAbierto[k];
  $('ci-reg-list').innerHTML = ciRegistroLista();
}

/* ================= LIBRO BLANCO DE QUIRÓFANOS =================
   Manual institucional de organización y funcionamiento del bloque. Se sirve
   junto a la app (misma carpeta) y el service worker lo guarda en caché, así
   que también se consulta sin conexión. */
const LIBRO_BLANCO = {
  archivo: './libro-blanco-quirofanos-hru.pdf',
  titulo: 'Libro Blanco de Quirófanos',
  subtitulo: 'Manual de Organización y Funcionamiento de Quirófanos Centrales y de la Unidad de Endoscopía Digestiva',
  ficha: 'Versión 3.0 · Mayo 2026 · 43 páginas · Jefatura del Departamento Quirúrgico — HRU',
  marco: 'Directrices de Organización y Funcionamiento para Centros Quirúrgicos, Ministerio de Salud de la Nación (IF-2020-14236688-APN).',
};
/* Safari de iPhone y iPad no muestra PDF dentro de un iframe: se le ofrece el
   documento en una pestaña propia, que es como el sistema lo abre bien. */
function esIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function openLibroBlanco() {
  const visor = esIOS()
    ? `<div class="empty" style="margin:24px 18px">${ICONS.book}
         <p style="margin-top:10px">Este dispositivo abre los PDF en su propio visor.<br>
         Toque <b>Abrir en pestaña nueva</b> para leer el manual completo.</p></div>`
    : `<iframe class="pdf-visor" src="${LIBRO_BLANCO.archivo}#view=FitH" title="${esc(LIBRO_BLANCO.subtitulo)}"></iframe>`;
  $('libro-modal').innerHTML = `
    <div class="pdf-hdr">
      <span class="pdf-ico">${ico(ICONS.book, 22)}</span>
      <div style="min-width:0">
        <h2>${esc(LIBRO_BLANCO.titulo)}</h2>
        <div class="sb">${esc(LIBRO_BLANCO.subtitulo)}</div>
      </div>
      <button class="modal-close" onclick="closeLibroBlanco()" aria-label="Cerrar" style="color:#fff">✕</button>
    </div>
    <div class="pdf-acc">
      <a class="btn btn-sm btn-blue" href="${LIBRO_BLANCO.archivo}" target="_blank" rel="noopener">${ICONS.external} Abrir en pestaña nueva</a>
      <a class="btn btn-sm btn-outline" href="${LIBRO_BLANCO.archivo}" download="Libro_Blanco_Quirofanos_HRU.pdf">${ico(ICONS.download, 14)} Descargar</a>
      <button class="btn btn-sm btn-outline" onclick="closeLibroBlanco()">Cerrar</button>
    </div>
    ${visor}
    <div class="pdf-nota"><b>${esc(LIBRO_BLANCO.ficha)}</b><br>
      Marco normativo: ${esc(LIBRO_BLANCO.marco)} Documento de cumplimiento obligatorio; queda disponible sin conexión.</div>`;
  $('libro-overlay').classList.add('open');
}
function closeLibroBlanco() {
  $('libro-overlay').classList.remove('open');
  // Se descarga el visor al cerrar: un PDF abierto consume memoria en el móvil.
  $('libro-modal').innerHTML = '';
}


/* ================= MÓDULOS QUIRÚRGICOS =================
   Un módulo no es un dato aparte: nace de la cirugía. Al programar el turno el
   cirujano elige la práctica en el Nomenclador Modulado 2025 y con ella queda
   fijado el módulo (A, B o C). Ese módulo se imputa al cirujano, al ayudante y
   al anestesiólogo cargados en el equipo, pero **solo cuenta cuando la cirugía
   está marcada como Realizada**: mientras el turno esté programado, confirmado
   o en curso no figura en la solapa. Así la planilla de módulos y el parte
   quirúrgico no pueden contradecirse, y todo viaja por Firebase en vivo. */

/* ---- Configuración compartida (valores unitarios e importes) ---- */
function modConfig() {
  const c = DB.config.find((x) => String(x.id) === 'modulos') || {};
  return {
    id: 'modulos',
    valores: Object.assign({}, MOD_VALORES_DEF, c.valores || {}),
    mostrarImportes: !!c.mostrarImportes,
    actualizado: c.actualizado || '',
  };
}
function guardarModConfig(cambios) {
  upsert('config', Object.assign(modConfig(), cambios, { id: 'modulos', actualizado: nowDT() }));
}
const money = (n) => '$ ' + Math.round(n || 0).toLocaleString('es-AR');
/* Los importes son información sensible: solo los ve la Dirección Médica y
   únicamente si los habilitó de forma expresa. */
function verImportes() { return director && modConfig().mostrarImportes; }

/* ---- Equipo que percibe módulos ---- */
/* El equipo se deriva del módulo de la práctica, no de lo que alguien haya
   tipeado: el cirujano lleva el módulo de la cirugía y el ayudante el escalón
   inmediato inferior. Los anestesiólogos cargados por versiones anteriores se
   descartan acá, porque el rol dejó de percibir módulo. */
function ayudanteDe(c) {
  const eq = Array.isArray(c && c.equipo) ? c.equipo : [];
  const a = eq.find((p) => p && p.rol === '1er Ayudante' && p.nombre);
  return a || null;
}
function equipoDe(c) {
  if (!c || !c.modulo) return [];
  const eq = Array.isArray(c.equipo) ? c.equipo : [];
  const cir = eq.find((p) => p && p.rol === 'Cirujano' && p.nombre);
  const out = [{
    rol: 'Cirujano',
    nombre: (cir && cir.nombre) || c.cirujano || '',
    email: (cir && cir.email) || c.cirujanoEmail || '',
    modulo: c.modulo,
  }];
  const ayu = ayudanteDe(c);
  if (ayu) out.push({ rol: '1er Ayudante', nombre: ayu.nombre, email: ayu.email || '', modulo: moduloAyudante(c.modulo) });
  return out;
}
/* Deja el equipo en su forma canónica. `ayudante` es el nombre elegido en el
   formulario: si viene vacío —«SIN AYUDANTE»— el segundo módulo desaparece. */
function equipoActualizado(c, modulo, ayudante) {
  const previo = ayudanteDe(c);
  const nom = ayudante === undefined ? (previo ? previo.nombre : '') : String(ayudante || '').trim();
  const eq = [{ rol: 'Cirujano', nombre: c.cirujano || '', email: c.cirujanoEmail || '', modulo }];
  if (nom) eq.push({ rol: '1er Ayudante', nombre: nom, email: (previo && previo.email) || '', modulo: moduloAyudante(modulo) });
  return eq;
}
function tieneAyudante(c) { return !!ayudanteDe(c); }
/* El cirujano puede resolver que opera sin ayudante: esa decisión también es un
   dato cargado, y por eso deja de reclamarse. */
function ayudanteDefinido(c) { return tieneAyudante(c) || !!(c && c.sinAyudante); }
/* Cirugías ya realizadas en las que todavía no se dijo si hubo ayudante. Es lo
   que se avisa al programar y lo que muestra el contador de la solapa. */
function modulosIncompletos(u) {
  return DB.cirugias.filter((c) => cirugiaCerrada(c) && c.modulo && !ayudanteDefinido(c)
    && (!u || c.cirujanoEmail === u.email));

/* ---- Campo del 1er ayudante (formulario del turno y modal de equipo) ----
   Es un desplegable, no un texto libre: se elige entre los profesionales dados
   de alta, se puede escribir un nombre que no figure y la primera opción es
   «SIN AYUDANTE». Elegir «SIN AYUDANTE» no deja el campo a medio cargar: es la
   declaración de que la cirugía se hace sin segundo cirujano, y con ella el
   segundo módulo directamente no existe. */
function campoAyudante(pre, actual, ro) {
  const nom = String(actual || '').trim();
  const nombres = [...new Set(DB.usuarios.filter((u) => u && u.nombre && cuentaAprobada(u)).map((u) => u.nombre.trim()))]
    .sort((a, b) => a.localeCompare(b, 'es'));
  const enLista = !!nom && nombres.includes(nom);
  const otro = !!nom && !enLista;
  return `<div class="field"><label>1er ayudante</label>
    <select id="${pre}-sel" ${ro || ''} onchange="onAyudanteChange('${pre}')">
      <option value="" ${!nom ? 'selected' : ''}>— SIN AYUDANTE —</option>
      ${nombres.map((n) => `<option value="${esc(n)}" ${enLista && n === nom ? 'selected' : ''}>${esc(n)}</option>`).join('')}
      <option value="__otro__" ${otro ? 'selected' : ''}>Otro profesional — escribir el nombre</option>
    </select>
    <div id="${pre}-otro-wrap" style="display:${otro ? 'block' : 'none'};margin-top:6px">
      <input type="text" id="${pre}-otro" placeholder="Apellido y nombre del cirujano ayudante"
        value="${esc(otro ? nom : '')}" ${ro || ''} oninput="pintarModEquipo()"></div>
    <span class="hint">Con «SIN AYUDANTE» la cirugía genera un solo módulo, el del cirujano.</span>
  </div>`;
}
function onAyudanteChange(pre) {
  const sel = $(pre + '-sel'), wrap = $(pre + '-otro-wrap');
  if (!sel || !wrap) return;
  const otro = sel.value === '__otro__';
  wrap.style.display = otro ? 'block' : 'none';
  if (otro) setTimeout(() => { const i = $(pre + '-otro'); if (i) i.focus(); }, 40);
  pintarModEquipo();
}
function leerAyudante(pre) {
  const sel = $(pre + '-sel');
  if (!sel) return '';
  if (sel.value === '__otro__') return ((($(pre + '-otro') || {}).value) || '').trim();
  return String(sel.value || '').trim();
}
/* Módulo vigente en el formulario abierto. En el modal de equipo la práctica ya
   está fijada; en el turno la fija el buscador del nomenclador. */
let eqmModulo = '';
function moduloEnPantalla(pre) {
  if (pre === 'eq-ayu' && eqmModulo) return eqmModulo;
  return nomLeer().modulo;
}
/* Cartel de módulos: no hay nada que elegir, se informa lo que corresponde. */
function pintarModEquipo() {
  ['k-ayu', 'eq-ayu'].forEach((pre) => {
    const cont = $(pre + '-mods');
    if (!cont) return;
    const m = moduloEnPantalla(pre);
    const ayu = leerAyudante(pre);
    const ma = moduloAyudante(m);
