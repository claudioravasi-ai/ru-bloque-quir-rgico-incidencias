/* ================= AUTORIZACIÓN DE LA CUENTA POR LA JEFATURA =================
   La habilitación documental (matrícula, seguro, RCP…) la carga el propio
   profesional. La autorización de la cuenta, en cambio, la otorga la Jefatura de
   Quirófanos: toda alta nace PENDIENTE y no puede programar hasta que la
   Jefatura la apruebe. La Jefatura también puede dar de baja una cuenta en
   cualquier momento, con motivo registrado. Las cuentas anteriores a esta
   versión no traen el campo y se tratan como pendientes: la Jefatura las revisa
   una vez y quedan resueltas. */
const CUENTAS = {
  pendiente: { label: 'Pendiente de autorización', badge: 'badge-pend', color: 'var(--amber)' },
  aprobado:  { label: 'Autorizado por Jefatura',   badge: 'badge-ok',   color: 'var(--green)' },
  baja:      { label: 'Dado de baja',              badge: 'badge-no',   color: 'var(--red)' },
};
function estadoCuenta(u) {
  const e = u && u.cuenta;
  return (e === 'aprobado' || e === 'baja') ? e : 'pendiente';
}
function cuentaAprobada(u) { return estadoCuenta(u) === 'aprobado'; }
/* El motivo lo escribe la Jefatura a mano: puede venir con punto final o sin él. */
function motivoCuenta(u) {
  const m = String((u && u.cuentaMotivo) || '').trim();
  if (!m) return '.';
  return ': ' + (/[.!?]$/.test(m) ? m : m + '.');
}
/* Motivo por el que un profesional no puede programar, o cadena vacía si puede. */
function bloqueoCuenta(u) {
  const e = estadoCuenta(u);
  if (e === 'aprobado') return '';
  if (e === 'baja') {
    return 'Su cuenta fue dada de baja por la Jefatura de Quirófanos' + motivoCuenta(u)
      + '\n\nNo puede programar cirugías. Comuníquese con la Jefatura de Quirófanos para regularizar la situación.';
  }
  return 'Su cuenta está PENDIENTE DE AUTORIZACIÓN por la Jefatura de Quirófanos.'
    + '\n\nHasta que la Jefatura la autorice no puede programar cirugías. Mientras tanto puede completar su documentación de habilitación en Mi Perfil.';
}

/* ================= MOTOR DE RECORDATORIOS =================
   Los recordatorios se derivan del estado real de los datos y del reloj: no se
   guardan como registros, se recalculan. Se muestran en la campana del
   encabezado, en la vista "Recordatorios" y —si el profesional dio permiso— como
   notificación del sistema mientras la app esté abierta en el dispositivo. */
const REM_NOTIF_KEY = 'hru_rem_notificados_v1';
let remLista = [];
let remNotificados = {};
let remTimer = null;
let comTimer = null;  // ronda de revisión de los comunicados de la Jefatura

function cargarNotificados() {
  try { remNotificados = JSON.parse(localStorage.getItem(REM_NOTIF_KEY) || '{}'); } catch (e) { remNotificados = {}; }
  // Se purgan las marcas de días anteriores para que el aviso se repita cada jornada.
  const hoy = hoyISO();
  Object.keys(remNotificados).forEach((k) => { if (remNotificados[k] !== hoy) delete remNotificados[k]; });
}
function guardarNotificados() {
  try { localStorage.setItem(REM_NOTIF_KEY, JSON.stringify(remNotificados)); } catch (e) {}
}
function humanoRestante(ms) {
  const neg = ms < 0;
  let m = Math.round(Math.abs(ms) / 60000);
  const d = Math.floor(m / 1440); m -= d * 1440;
  const h = Math.floor(m / 60); m -= h * 60;
  let s;
  if (d > 0) s = `${d} d ${h} h`;
  else if (h > 0) s = `${h} h ${String(m).padStart(2, '0')} min`;
  else s = `${m} min`;
  return (neg ? 'hace ' : 'en ') + s;
}
function creadaEn(c) {
  return (c.historial && c.historial[0] && c.historial[0].t) || ((c.fechaSolicitud || hoyISO()) + 'T08:00');
}

function calcRecordatorios() {
  const R = [];
  const ahora = new Date();
  const hoy = hoyISO();
  const manana = sumarDias(hoy, 1);
  const u = usuarioActual();
  const add = (o) => R.push(o);

  /* ---- 1. Ciclo de programación: cierre 13:00 y publicación 14:00 ---- */
  const cierreHoy = new Date(hoy + 'T' + BLOQUE.cierreSolicitudes + ':00');
  const publicHoy = new Date(hoy + 'T' + BLOQUE.publicacionParte + ':00');
  if (ahora < cierreHoy) {
    const falta = cierreHoy - ahora;
    add({
      key: 'ciclo-cierre', nivel: falta <= 2 * 36e5 ? 'warn' : 'info', vista: 'solicitud',
      titulo: `Cierre de solicitudes ${humanoRestante(falta)}`,
      texto: `Las solicitudes para el parte del ${fmtFecha(manana)} cierran hoy a las ${BLOQUE.cierreSolicitudes} h. Pasado ese horario solo ingresan emergencias y urgencias diferibles (P1–P2).`,
      cuando: `Hoy ${BLOQUE.cierreSolicitudes} h`,
    });
  }
  if (jefe) {
    const sinConfirmarManana = DB.cirugias.filter((c) => c.fecha === manana && ['pendiente', 'validada'].includes(c.estado));
    if (sinConfirmarManana.length && ahora >= cierreHoy) {
      add({
        key: 'ciclo-publicacion', nivel: ahora >= publicHoy ? 'crit' : 'warn', vista: 'programacion',
        titulo: `${sinConfirmarManana.length} turno(s) sin confirmar para mañana`,
        texto: ahora >= publicHoy
          ? `El parte del ${fmtFecha(manana)} ya debía estar publicado (${BLOQUE.publicacionParte} h). Confirme o suspenda los turnos pendientes.`
          : `El parte del ${fmtFecha(manana)} se publica hoy a las ${BLOQUE.publicacionParte} h. Quedan turnos en circuito de validación.`,
        cuando: `Hoy ${BLOQUE.publicacionParte} h`,
      });
    }
  }

  /* ---- 2. Emergencias (< 30 min a incisión) y urgencias diferibles (< 6 h) ---- */
  DB.cirugias.filter((c) => c.prioridad === 1 && ['borrador', 'pendiente', 'validada', 'confirmada'].includes(c.estado))
    .forEach((c) => {
      const limite = new Date(new Date(creadaEn(c)).getTime() + 30 * 60000);
      add({
        key: 'emerg-' + c.id, nivel: 'crit', vista: 'programacion', cirugia: c.id,
        titulo: `EMERGENCIA sin incisión — ${c.paciente?.nombre || 's/d'}`,
        texto: `${c.procedimiento} (${c.servicio}). Meta institucional: incisión en menos de 30 minutos desde la solicitud.`,
        cuando: ahora > limite ? `Meta vencida ${humanoRestante(limite - ahora)}` : `Meta ${humanoRestante(limite - ahora)}`,
      });
    });
  DB.cirugias.filter((c) => c.prioridad === 2 && ['borrador', 'pendiente', 'validada', 'confirmada'].includes(c.estado))
    .forEach((c) => {
      const limite = new Date(new Date(creadaEn(c)).getTime() + 6 * 36e5);
      add({
        key: 'urg-' + c.id, nivel: ahora > limite ? 'crit' : 'warn', vista: 'programacion', cirugia: c.id,
        titulo: `Urgencia diferible — ${c.paciente?.nombre || 's/d'}`,
        texto: `${c.procedimiento} (${c.servicio}). Debe resolverse dentro de las 6 horas de la solicitud.`,
        cuando: `Plazo ${humanoRestante(limite - ahora)}`,
      });
    });

  /* ---- 3. Coordinación de áreas: verificar 48–72 h antes ---- */
  DB.cirugias.filter((c) => ['borrador', 'pendiente', 'validada', 'confirmada'].includes(c.estado) && c.fecha >= hoy)
    .forEach((c) => {
      const inicio = new Date(c.fecha + 'T' + (c.horaProg || '08:00') + ':00');
      const horas = (inicio - ahora) / 36e5;
      if (horas > 72 || horas < -2) return;
      const faltan = coordFaltantes(c);
      if (!faltan.length) return;
      add({
        key: 'coord-' + c.id, nivel: horas <= 48 ? 'crit' : 'warn', vista: jefe ? 'programacion' : 'mis', cirugia: c.id,
        titulo: `Coordinación incompleta — ${c.procedimiento}`,
        texto: `${c.paciente?.nombre || 's/d'} · ${fmtFecha(c.fecha)} ${c.horaProg || ''} h. Pendiente: ${faltan.join('; ')}.`,
        cuando: `Cirugía ${humanoRestante(inicio - ahora)}`,
      });
    });

  /* ---- 3 bis. Autorización de Admisión y Egresos pendiente ---- */
  DB.cirugias.filter((c) => ['pendiente', 'validada'].includes(c.estado) && !authOk(c) && c.fecha >= hoy)
    .forEach((c) => {
      const inicio = new Date(c.fecha + 'T' + (c.horaProg || '08:00') + ':00');
      const horas = (inicio - ahora) / 36e5;
      if (horas > 48) return;
      const mio = u && c.cirujanoEmail === u.email;
      if (!jefe && !mio) return;
      add({
        key: 'auth-' + c.id, nivel: c.auth === 'NO AUTORIZADO' ? 'crit' : (horas <= 24 ? 'crit' : 'warn'),
        vista: 'grilla', cirugia: c.id,
        titulo: c.auth === 'NO AUTORIZADO' ? `Turno NO AUTORIZADO en el parte` : `Turno sin autorización de Admisión`,
        texto: c.auth === 'NO AUTORIZADO'
          ? `${c.procedimiento} — ${c.paciente?.nombre || 's/d'} (${c.quirofano}, ${c.horaProg} h). Motivo del rechazo: ${c.authMotivo || 'sin motivo registrado'}.`
          : `${c.procedimiento} — ${c.paciente?.nombre || 's/d'} (${c.quirofano}, ${c.horaProg} h). Sin la autorización de Admisión y Egresos el turno no puede confirmarse en el parte oficial.`,
        cuando: `Cirugía ${humanoRestante(inicio - ahora)}`,
      });
    });

  /* ---- 4. Retraso de inicio > 60 min (incidencia D reportable) ---- */
  DB.cirugias.filter((c) => c.estado === 'confirmada' && c.fecha === hoy).forEach((c) => {
    const prog = new Date(hoy + 'T' + (c.horaProg || '08:00') + ':00');
    const atraso = (ahora - prog) / 60000;
    if (atraso < 60) return;
    add({
      key: 'atraso-' + c.id, nivel: 'crit', vista: jefe ? 'programacion' : 'mis', cirugia: c.id,
      titulo: `Retraso de ${Math.round(atraso)} min en el inicio`,
      texto: `${c.procedimiento} — ${c.paciente?.nombre || 's/d'} (${c.quirofano}). Programada ${c.horaProg} h y aún no iniciada. Un atraso mayor a 60 minutos debe reportarse como incidencia de categoría D.`,
      cuando: `Programada ${c.horaProg} h`,
    });
  });

  /* ---- 5. Cirugía en curso excedida ---- */
  DB.cirugias.filter((c) => c.estado === 'en_curso' && c.horaInicioReal).forEach((c) => {
    const transcurrido = diffMin(c.horaInicioReal, dateToDT(ahora));
    const estimado = c.duracionMin || 90;
    if (transcurrido <= estimado + 30) return;
    add({
      key: 'excedida-' + c.id, nivel: 'warn', vista: jefe ? 'programacion' : 'mis', cirugia: c.id,
      titulo: `Procedimiento excedido en ${transcurrido - estimado} min`,
      texto: `${c.procedimiento} lleva ${transcurrido} min sobre ${estimado} min estimados. Afecta el recambio del ${c.quirofano} y los turnos siguientes.`,
      cuando: `Inicio ${fmtDT(c.horaInicioReal)}`,
    });
  });

  /* ---- 6. Informe operatorio: meta ≤ 2 h (cumplimiento ≥ 95 %) ---- */
  DB.cirugias.filter((c) => c.estado === 'realizada' && !c.informe).forEach((c) => {
    const mio = u && c.cirujanoEmail === u.email;
    if (!jefe && !mio) return;
    const fin = c.horaFinReal ? new Date(c.horaFinReal) : new Date(c.fecha + 'T12:00:00');
    const limite = new Date(fin.getTime() + 2 * 36e5);
    add({
      key: 'informe-' + c.id, nivel: ahora > limite ? 'crit' : 'warn', vista: mio ? 'mis' : 'programacion', cirugia: c.id,
      titulo: ahora > limite ? `Informe operatorio fuera de plazo` : `Informe operatorio pendiente`,
      texto: `${c.procedimiento} — ${c.paciente?.nombre || 's/d'} (${c.cirujano}). Meta institucional: carga en menos de 2 horas tras la cirugía.`,
      cuando: `Plazo ${humanoRestante(limite - ahora)}`,
    });
  });

  /* ---- 7. Anatomía Patológica: muestras sin envío confirmado ---- */
  DB.cirugias.filter((c) => ['realizada', 'en_curso'].includes(c.estado) && (c.muestras || []).some((m) => !m.enviada))
    .forEach((c) => {
      const pend = (c.muestras || []).filter((m) => !m.enviada);
      const congelacion = pend.some((m) => m.tipo && m.tipo.indexOf('congelación') >= 0);
      const mio = u && c.cirujanoEmail === u.email;
      if (!jefe && !mio) return;
      add({
        key: 'ap-' + c.id, nivel: congelacion ? 'crit' : 'warn', vista: mio ? 'mis' : 'programacion', cirugia: c.id,
        titulo: `${pend.length} muestra(s) sin envío a Anatomía Patológica`,
        texto: `${c.procedimiento} — ${c.paciente?.nombre || 's/d'}. ${congelacion ? 'Incluye biopsia por congelación: el envío es inmediato.' : 'Confirme el envío y el rótulo de cada muestra.'}`,
        cuando: c.horaFinReal ? fmtDT(c.horaFinReal) : fmtFecha(c.fecha),
      });
    });

  /* ---- 8. Incidencias sin tratar (plazos 2 h / 24 h) ---- */
  if (jefe) {
    const urg = DB.incidencias.filter((i) => CATS[i.categoria]?.urgente && i.estado === 'Pendiente');
    if (urg.length) {
      add({
        key: 'inc-urgentes', nivel: 'crit', vista: 'confidenciales',
        titulo: `${urg.length} incidencia(s) A–C sin revisar`,
        texto: 'Las categorías A, B y C exigen tratamiento inmediato y notificación a Jefatura del SQC, Jefe de Servicio y Dirección Médica. Las categorías A y B abren expediente de evento adverso.',
        cuando: 'Plazo de reporte: 2 h',
      });
    }
    const dif = DB.incidencias.filter((i) => !CATS[i.categoria]?.urgente && i.estado === 'Pendiente'
      && diasEntre(i.fechaReporte || i.fechaIncidencia, hoy) >= 1);
    if (dif.length) {
      add({
        key: 'inc-diferidas', nivel: 'warn', vista: 'confidenciales',
        titulo: `${dif.length} incidencia(s) D–F pendientes hace más de 24 h`,
        texto: 'Revise y avance el estado de las incidencias de proceso, gestión y bioseguridad para el análisis de mejora continua.',
        cuando: 'Plazo de reporte: 24 h',
      });
    }
  }

  /* ---- 9. Reclamos: dirigidos a quien debe contestar o leer la respuesta ----
     Un reclamo genera aviso únicamente para sus dos partes —el autor y la
     Jefatura—, y solo mientras haya algo que hacer: mensajes sin leer, o una
     respuesta pendiente dentro del plazo de 48 horas hábiles. Los avisos llevan
     `notif: true` para que lleguen al dispositivo aunque no sean críticos: si el
     destinatario no los ve, el circuito formal se detiene. */
  DB.reclamos.forEach((r) => {
    const rol = rolEnReclamo(r);
    // Un reclamo cerrado deja de reclamar atención, aunque queden mensajes sin abrir.
    if (!rol || r.estado === 'cerrado') return;
    const nuevos = reclamoNoLeidos(r);
    if (nuevos) {
      add({
        key: 'reclamo-leer-' + r.id, nivel: 'warn', notif: true, vista: 'reclamos', reclamo: r.id,
        titulo: rol === 'autor'
          ? `Respuesta sin leer en su reclamo`
          : `${nuevos} mensaje(s) sin leer en un reclamo`,
        texto: `"${r.asunto}" — ${r.de}. ${rol === 'autor'
          ? 'La Jefatura de Quirófanos respondió: lea la respuesta y cierre el reclamo o replique.'
          : 'Le corresponde a la Jefatura leer y responder dentro de las 48 horas hábiles.'}`,
        cuando: `Último mensaje ${fmtDT(ultimaActividad(r))}`,
      });
      return;
    }
    if (turnoDeReclamo(r) !== rol) return;
    if (rol === 'autor') {
      // Ya leyó la respuesta: queda el trámite de cerrarlo o replicar. Se avisa
      // sin insistir —nivel informativo y sin notificación del dispositivo—.
      add({
        key: 'reclamo-cerrar-' + r.id, nivel: 'info', vista: 'reclamos', reclamo: r.id,
        titulo: `Reclamo respondido y sin cerrar`,
        texto: `"${r.asunto}". Si la respuesta de la Jefatura lo satisface, dé el reclamo por cerrado; si no, replique en el mismo hilo.`,
        cuando: `Respondido ${fmtDT(ultimaActividad(r))}`,
      });
      return;
    }
    const falta = venceReclamo(r) - ahora;
    add({
      key: 'reclamo-resp-' + r.id,
      nivel: falta < 0 ? 'crit' : (falta <= 8 * 36e5 ? 'warn' : 'info'),
      notif: falta <= 8 * 36e5, vista: 'reclamos', reclamo: r.id,
      titulo: falta < 0 ? `Reclamo sin responder — plazo vencido` : `Reclamo pendiente de respuesta`,
      texto: `"${r.asunto}" — ${r.de}, ${r.autor}. El plazo formal de respuesta Jefe a Jefe es de 48 horas hábiles.`,
      cuando: `Vence ${humanoRestante(falta)}`,
    });
  });

  /* ---- 10. Lista de espera extendida (> 90 días) ---- */
  const espera90 = DB.cirugias.filter((c) => ['borrador', 'pendiente', 'validada'].includes(c.estado) && esperaDias(c) > 90);
  if (espera90.length && (jefe || (u && espera90.some((c) => c.cirujanoEmail === u.email)))) {
    add({
      key: 'espera90', nivel: 'warn', vista: jefe ? 'programacion' : 'mis',
      titulo: `${espera90.length} paciente(s) con más de 90 días de espera`,
      texto: 'Alerta automática de lista de espera extendida: estas solicitudes ascienden a prioridad P5 en el orden de prelación.',
      cuando: `Máxima espera: ${Math.max(...espera90.map(esperaDias))} días`,
    });
  }

  /* ---- 11. Habilitación del profesional (vigencias) ---- */
  if (u) {
    const h = habilitacion(u);
    const faltantes = h.reqs.filter((r) => !r.ok);
    if (faltantes.length) {
      add({
        key: 'hab-incompleta', nivel: 'crit', vista: 'perfil',
        titulo: 'Habilitación incompleta — no puede cargar solicitudes',
        texto: 'Requisitos pendientes: ' + faltantes.map((r) => r.label).join('; ') + '.',
        cuando: `${faltantes.length} de ${h.reqs.length} sin cumplir`,
      });
    }
    if (u.seguro?.vence && u.seguro.vence >= hoy) {
      const dias = diasEntre(hoy, u.seguro.vence);
      if (dias <= 30) add({
        key: 'hab-seguro', nivel: dias <= 7 ? 'crit' : 'warn', vista: 'perfil',
        titulo: `Seguro de responsabilidad civil vence en ${dias} día(s)`,
        texto: 'Sin seguro vigente la habilitación caduca automáticamente y el sistema bloquea la carga de solicitudes quirúrgicas.',
        cuando: `Vence ${fmtFecha(u.seguro.vence)}`,
      });
    }
    if (u.rcp?.fecha) {
      const restan = 730 - diasEntre(u.rcp.fecha, hoy);
      if (restan <= 60) add({
        key: 'hab-rcp', nivel: restan <= 0 ? 'crit' : 'warn', vista: 'perfil',
        titulo: restan <= 0 ? 'Certificación de RCP vencida' : `RCP a revalidar en ${restan} día(s)`,
        texto: `La formación en RCP (${u.rcp.tipo || 'sin tipo'}) requiere revalidación bienal. Última certificación: ${fmtFecha(u.rcp.fecha)}.`,
        cuando: restan <= 0 ? 'Revalidación vencida' : `Quedan ${restan} días`,
      });
    }
  }
  if (jefe) {
    const porAutorizar = DB.usuarios.filter((x) => estadoCuenta(x) === 'pendiente');
    if (porAutorizar.length) {
      add({
        key: 'cuentas-pend', nivel: 'crit', vista: 'usuarios',
        titulo: `${porAutorizar.length} profesional(es) esperando autorización de la Jefatura`,
        texto: 'Altas registradas que todavía no pueden programar cirugías: ' + porAutorizar.map((x) => x.nombre).join('; ') + '.',
        cuando: 'Pendiente de resolución',
      });
    }
    const incompletos = DB.usuarios.filter((x) => !habilitacion(x).ok);
    if (incompletos.length) {
      add({
        key: 'hab-plantel', nivel: 'warn', vista: 'usuarios',
        titulo: `${incompletos.length} profesional(es) con habilitación incompleta`,
        texto: 'Auditoría de vigencias: matrícula, título de especialista, seguro de responsabilidad civil, RCP bienal y esquema de vacunación.',
        cuando: `${DB.usuarios.length - incompletos.length} de ${DB.usuarios.length} habilitados`,
      });
    }
  }

  const orden = { crit: 0, warn: 1, info: 2 };
  R.sort((a, b) => orden[a.nivel] - orden[b.nivel]);
  return R;
}

function revisarRecordatorios() {
  remLista = calcRecordatorios();
  pintarCampana();
  if (view === 'recordatorios') renderRecordatorios();
  notificarCriticos();
}
function pintarCampana() {
  const badge = $('bell-badge');
  if (!badge) return;
  const crit = remLista.filter((r) => r.nivel === 'crit').length;
  const n = remLista.length;
  badge.style.display = n ? 'block' : 'none';
  badge.textContent = n > 99 ? '99+' : String(n);
  badge.classList.toggle('crit', crit > 0);
  badge.style.background = crit ? 'var(--red)' : 'var(--amber)';
  const bn = $('bn-badge-rec');
  if (bn) { bn.style.display = n ? 'block' : 'none'; bn.textContent = n > 9 ? '9+' : String(n); }
  renderSidebar();
}
function notificarCriticos() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const hoy = hoyISO();
  // Además de los críticos, se avisan los recordatorios marcados con `notif`:
  // los del canal de reclamos, que están dirigidos a una persona concreta.
  remLista.filter((r) => r.nivel === 'crit' || r.notif).forEach((r) => {
    if (remNotificados[r.key] === hoy) return;
    remNotificados[r.key] = hoy;
    try {
      const n = new Notification('HRU Quirófanos — ' + r.titulo, {
        body: r.texto, icon: 'icon-192.png', badge: 'icon-192.png', tag: r.key,
      });
      n.onclick = () => {
        window.focus();
        if (r.reclamo) { reclamoAbierto = reclamoPermitido(r.reclamo) ? r.reclamo : null; go('reclamos'); marcarReclamoLeido(r.reclamo); }
        else go(r.vista || 'recordatorios');
        n.close();
      };
    } catch (e) { /* algunos navegadores exigen ServiceWorkerRegistration.showNotification */ }
  });
  guardarNotificados();
}
async function pedirPermisoNotif() {
  if (!('Notification' in window)) { alert('Este navegador no admite notificaciones del sistema. Los recordatorios seguirán visibles en la campana del encabezado.'); return; }
  const p = await Notification.requestPermission();
  if (p === 'granted') { remNotificados = {}; guardarNotificados(); notificarCriticos(); }
  renderRecordatorios();
}

function refreshView() {
  // No se re-renderizan las vistas con formularios en curso para no perder lo tipeado
  const conFormulario = ['nueva', 'acceso', 'perfil', 'consentimientos'];
  if (conFormulario.includes(view)) return;
  // En Módulos solo hay campos editables para la Dirección: si está tipeando
  // uno de ellos, un cambio remoto no se lo puede borrar.
  if (view === 'modulos' && document.activeElement && document.activeElement.tagName === 'INPUT') return;
  // Los reclamos sí se refrescan en vivo, salvo que haya un asunto o un mensaje
  // a medio escribir: un cambio de otro usuario en la nube no puede borrarlo.
  if (view === 'reclamos' && hayTextoCargado()) return;
  go(view, true);
}

/* ================= NAVEGACIÓN ================= */
const VIEWS = {};
const TITULOS = {
  panel: 'Panel', grilla: 'Programación Diaria', parte: 'Parte Quirúrgico', recordatorios: 'Recordatorios',
  nueva: 'Nueva Incidencia', confidenciales: 'Incidencias Confidenciales',
  solicitud: 'Solicitud Quirúrgica', mis: 'Mis Solicitudes', reclamos: 'Reclamos',
  perfil: 'Mi Perfil', programacion: 'Programación', confidenciales: 'Incidencias Confidenciales',
  kpis: 'Indicadores', usuarios: 'Profesionales', acceso: 'Acceso Profesional',
  comunicados: 'Comunicados',
  estadisticas: 'Estadísticas Quirúrgicas', consentimientos: 'Consentimientos Médicos Informados',
  modulos: 'Módulos Quirúrgicos',
};
function go(v, silencioso) {
  if (v === 'confidenciales' && !jefe) { closeDrawer(); openJefeModal(); return; }
  if (['programacion', 'kpis', 'usuarios', 'comunicados'].includes(v) && !jefe) { closeDrawer(); openJefeModal(); return; }
  if (['solicitud', 'mis', 'perfil', 'consentimientos'].includes(v) && !usuarioActual() && !jefe) { v = 'acceso'; }
  if (v === 'reclamos' && !usuarioActual() && !jefe) { v = 'acceso'; }
  // Los módulos los consulta el profesional acreditado (solo su servicio) o la
  // Dirección Médica (todo el hospital, con su propia clave).
  if (v === 'modulos' && !usuarioActual() && !director) { closeDrawer(); openDirectorModal(); return; }
  // Las estadísticas las consulta cualquier profesional acreditado; el desglose
  // nominal completo queda reservado a la Jefatura dentro de la propia vista.
  if (v === 'estadisticas' && !usuarioActual() && !jefe) { v = 'acceso'; }
  view = v;
  closeDrawer();
  const t = $('topbar-title');
  if (t) t.textContent = TITULOS[v] || 'HRU Quirófanos';
  renderSidebar();
  (VIEWS[v] || VIEWS.panel)();
  if (!silencioso) {
    // Ruta en el hash: habilita los accesos directos del icono instalado,
    // el botón "atrás" del teléfono y compartir un enlace a una sección.
    if (location.hash.slice(1) !== v) {
      try { history.pushState({ v }, '', '#' + v); } catch (e) {}
    }
    window.scrollTo(0, 0);
  }
}
function vistaDelHash() {
  const h = location.hash.replace('#', '');
  return VIEWS[h] ? h : 'panel';
}

function renderPanel() {
  const total = DB.incidencias.length;
  const por = (e) => DB.incidencias.filter((i) => i.estado === e).length;
  const hoy = hoyISO();
  const cirHoy = DB.cirugias.filter((c) => c.fecha === hoy && ['confirmada', 'en_curso', 'realizada'].includes(c.estado)).length;
  const enCurso = DB.cirugias.filter((c) => c.estado === 'en_curso').length;
  const pendVal = DB.cirugias.filter((c) => ['pendiente', 'validada'].includes(c.estado)).length;
  const suspMes = DB.cirugias.filter((c) => c.estado === 'suspendida' && (c.fecha || '').startsWith(mesActual())).length;

  const statsCir = [
    { n: cirHoy, l: 'Cirugías en el parte de hoy', icon: ICONS.calendarBig, bg: 'var(--green-soft)', fg: 'var(--green)' },
    { n: enCurso, l: 'En curso ahora', icon: ICONS.play, bg: '#ffedd5', fg: '#f97316' },
    { n: pendVal, l: 'Solicitudes en circuito de validación', icon: ICONS.clock, bg: 'var(--amber-soft)', fg: 'var(--amber)' },
    { n: suspMes, l: 'Suspendidas este mes', icon: ICONS.x, bg: 'var(--red-soft)', fg: 'var(--red)' },
  ];
  const statsInc = [
    { n: total, l: 'Total<br>Incidencias', icon: ICONS.alertTri, bg: 'var(--red-soft)', fg: 'var(--red)' },
    { n: por('Pendiente'), l: 'Pendientes', icon: ICONS.clock, bg: 'var(--amber-soft)', fg: 'var(--amber)' },
    { n: por('En Revisión'), l: 'En Revisión', icon: ICONS.eye, bg: 'var(--blue-soft)', fg: 'var(--blue)' },

function barChart() {
  const counts = Object.keys(CATS).map((k) => DB.incidencias.filter((i) => i.categoria === k).length);
  const max = Math.max(4, ...counts);
  const W = 460, H = 240, padL = 30, padB = 28, padT = 10;
  const cw = (W - padL - 10) / 6;
  let bars = '', grid = '', labels = '';
  for (let t = 0; t <= max; t++) {
    if (max > 6 && t % 2 !== 0) continue;
    const y = padT + (H - padT - padB) * (1 - t / max);
    grid += `<line x1="${padL}" y1="${y}" x2="${W - 6}" y2="${y}" stroke="#d8dde3" stroke-dasharray="4 4" stroke-width="1"/>
             <text x="${padL - 8}" y="${y + 4}" font-size="11" fill="#8b929c" text-anchor="end">${t}</text>`;
  }
  Object.keys(CATS).forEach((k, idx) => {
    const c = counts[idx];
    const bh = (H - padT - padB) * (c / max);
    const x = padL + idx * cw + cw * 0.22;
    bars += `<rect x="${x}" y="${H - padB - bh}" width="${cw * 0.56}" height="${Math.max(bh, 0)}" rx="5" fill="${getComputedStyle(document.documentElement).getPropertyValue('--cat-' + k.toLowerCase()).trim() || '#888'}"/>`;
    labels += `<text x="${padL + idx * cw + cw / 2}" y="${H - 8}" font-size="12" font-weight="700" fill="#4b5563" text-anchor="middle">${k}</text>`;
  });
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">${grid}${bars}${labels}</svg></div>
    <div class="legend">${Object.keys(CATS).map((k) => `<span><span class="dot" style="background:${CATS[k].color}"></span>${k} — ${CATS[k].nombre}</span>`).join('')}</div>`;
}

function donutChart() {
  const total = DB.incidencias.length;
  const R = 74, CX = 110, CY = 105, SW = 34;
  const circ = 2 * Math.PI * R;
  let segs = '', off = 0;
  const partes = ESTADOS.map((e) => ({ e, n: DB.incidencias.filter((i) => i.estado === e).length })).filter((p) => p.n > 0);
  if (!total) {
    segs = `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#e5e7eb" stroke-width="${SW}"/>`;
  } else {
    partes.forEach((p) => {
      const frac = p.n / total;
      segs += `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none"
        stroke="${p.e === 'Pendiente' ? '#f0a92e' : p.e === 'En Revisión' ? '#2980d9' : '#1fa971'}"
        stroke-width="${SW}" stroke-dasharray="${frac * circ} ${circ}" stroke-dashoffset="${-off * circ}"
        transform="rotate(-90 ${CX} ${CY})"/>`;
      off += frac;
    });
  }
  return `<div style="display:flex;justify-content:center"><svg viewBox="0 0 220 210" style="width:220px">
      ${segs}
      <text x="${CX}" y="${CY - 2}" text-anchor="middle" font-size="30" font-weight="800" fill="#171c24">${total}</text>
      <text x="${CX}" y="${CY + 20}" text-anchor="middle" font-size="11" fill="#8b929c">incidencias</text>
    </svg></div>
    <div class="legend" style="justify-content:center">
      ${ESTADOS.map((e) => `<span><span class="dot" style="background:${ESTADO_COLOR[e]};border-radius:50%"></span>${e} (${DB.incidencias.filter((i) => i.estado === e).length})</span>`).join('')}
    </div>`;
}

  $('main').innerHTML = `

/* ================= SOLICITUD QUIRÚRGICA (cirujano) =================
   La solicitud se carga siempre sobre una franja concreta de la grilla: así
   ningún turno queda fuera de la programación diaria ni del parte. Esta vista
   busca las franjas libres del día elegido y delega en el modal de turno. */
function renderSolicitud() {
  const u = usuarioActual();
  if (!u) { go('acceso'); return; }
  if (!cuentaAprobada(u)) {
    const e = estadoCuenta(u);
    $('main').innerHTML = `
      <div class="page-head"><div>
        <h1 class="page-title">Solicitud Quirúrgica</h1>
        <p class="page-sub">Carga de solicitudes al ciclo de programación</p>
      </div></div>
      <div class="banner ${e === 'baja' ? 'banner-red' : 'banner-amber'}">${ico(ICONS.alertTri, 20)}
        <div><strong>${e === 'baja' ? 'Cuenta dada de baja por la Jefatura de Quirófanos' : 'Cuenta pendiente de autorización de la Jefatura de Quirófanos'}</strong>
        ${e === 'baja'
          ? `Su acceso fue dado de baja${u.cuentaMotivo ? ': <b>' + esc(u.cuentaMotivo) + '</b>' : '.'} No puede cargar solicitudes quirúrgicas. Comuníquese con la Jefatura de Quirófanos.`
          : 'Su alta fue registrada y está a la espera del visto de la Jefatura de Quirófanos. Hasta que la Jefatura la autorice no puede cargar solicitudes quirúrgicas. Mientras tanto puede completar su documentación de habilitación.'}</div></div>
      <button class="btn btn-outline" onclick="go('perfil')">${ICONS.user.replace('14', '16')} Ver mi perfil</button>`;
    return;
  }
  const hab = habilitacion(u);
  if (!hab.ok) {
    $('main').innerHTML = `
      <div class="page-head"><div>
        <h1 class="page-title">Solicitud Quirúrgica</h1>
        <p class="page-sub">Carga de solicitudes al ciclo de programación</p>
      </div></div>
      <div class="banner banner-red">${ICONS.alertTri.replace(/22/g, '20')}
        <div><strong>Habilitación incompleta</strong>
        Para cargar solicitudes quirúrgicas debe tener su perfil de habilitación completo y vigente. Requisitos faltantes:
        <ul style="margin:8px 0 0 18px">${hab.reqs.filter((r) => !r.ok).map((r) => `<li>${esc(r.label)}</li>`).join('')}</ul></div></div>
      <button class="btn btn-blue" onclick="go('perfil')">${ICONS.user.replace('14', '16')} Completar mi perfil</button>`;
    return;
  }

  if (!solFecha) solFecha = sumarDias(hoyISO(), 1);
  const d = solFecha;
  const cerrado = new Date() > limiteCierre(d);
  const dOn = diaHabilitado(d);

  const libres = SALAS.map((s) => {
    const fs = s.franjas.filter((f) => turnoHabilitado(d, s.id, f.p)
      && !turnoEn(d, s.id, f.id) && puedeReservar(d, f, s.urgencias));
    return fs.length ? { s, fs } : null;
  }).filter(Boolean);

  $('main').innerHTML = `
    <div class="page-head">
      <div class="head-row">
        <div class="head-icon">${ICONS.calPlus}</div>
        <div>
          <h1 class="page-title">Solicitud Quirúrgica</h1>
          <p class="page-sub">${esc(u.nombre)} — ${esc(u.servicio)} · elija una franja libre para cargar el turno</p>
        </div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="go('grilla')">${ICONS.grid.replace('18', '15')} Ver la grilla completa</button>
    </div>

    <div class="banner ${cerrado ? 'banner-amber' : 'banner-blue'}">${ICONS.clockSm.replace('14', '18')}
      <div><strong>${cerrado ? 'Cierre de solicitudes superado para esta fecha' : 'Ciclo de programación'}</strong>
      Las solicitudes del ${fmtFecha(d)} cerraban a las <b>${BLOQUE.cierreSolicitudes} h</b> del ${fmtFecha(sumarDias(d, -1))} y el parte se publica a las <b>${BLOQUE.publicacionParte} h</b>.
      ${cerrado ? 'Pasado el cierre solo ingresan emergencias y urgencias diferibles (P1–P2) por el Quirófano 1.' : `Anticipación mínima: ${HORAS_ANTICIPACION} h.`}</div></div>

    <div class="dia-bar">
      <button class="dia-nav" onclick="moverSolFecha(-1)" aria-label="Día anterior">‹</button>
      <button class="dia-nav" onclick="moverSolFecha(1)" aria-label="Día siguiente">›</button>
      <div class="dia-disp ${esLaborable(d) ? '' : 'finde'}">${fmtDiaLargo(d)}</div>
      <div style="margin-left:auto"><input type="date" value="${d}" min="${hoyISO()}" onchange="solFecha=this.value;renderSolicitud()"></div>
    </div>

    ${!dOn ? `<div class="dia-banner">${ICONS.lock}<div><b>Bloque programado cerrado para este día.</b>
      Los quirófanos 2, 3 y 4 y Endoscopía se habilitan desde la Jefatura de Quirófanos, por turno y por sala.
      Abajo solo aparecen el Quirófano 1 (urgencias) y Obstetricia, que no requieren habilitación.</div></div>` : ''}
    ${!esLaborable(d) ? `<div class="dia-banner">${ICONS.alertTri.replace(/22/g, '18')} Día no laborable: solo urgencias y emergencias.</div>` : ''}

    ${libres.length ? libres.map(({ s, fs }) => `
      <div class="sala-card" style="margin-bottom:14px">
        <div class="sala-hdr">
          <h3>${esc(s.nombre)}</h3>
          ${s.etiqueta ? `<span class="badge-sala ${s.clase}">${s.etiqueta}</span>` : ''}
          <span class="sala-estado"><span class="sd"></span>${fs.length} FRANJA(S) LIBRE(S)</span>
        </div>
        <div class="franjas-wrap">
          <div class="${s.tipo === 'endo' ? 'franjas-endo' : 'franjas-row'}" style="padding:0">
            ${fs.map((f) => `<button type="button" class="slot slot-libre" onclick="openSlot('${d}','${s.id}','${f.id}')">
              <span class="slot-hora">${f.t}</span><span class="slot-mas">+</span><span class="slot-hint">Solicitar</span></button>`).join('')}
          </div>
        </div>
      </div>`).join('')
      : `<div class="empty">No hay franjas disponibles para el ${fmtFecha(d)}. Pruebe con otra fecha o consulte con la Jefatura de Quirófanos.</div>`}`;
}
let solFecha = null;
function moverSolFecha(n) {
  const nueva = sumarDias(solFecha || hoyISO(), n);
  if (nueva < hoyISO()) return;
  solFecha = nueva;
  renderSolicitud();
}

function leyendaEstados() {
  return `<div class="card" style="padding:16px 20px">

      ${Object.keys(ESTC).map((k) => `<span title="${ESTC[k].desc}"><span class="dot" style="background:${ESTC[k].color};border-radius:50%"></span>${ESTC[k].label}</span>`).join('')}

/* ================= TARJETA DE CIRUGÍA + ACCIONES ================= */
function cirCard(c, rol) {
  const acciones = accionesCirugia(c, rol);
  return `
    <div class="inc-card" onclick="openCirugia(${c.id})">
      <div class="inc-top">
        ${estChip(c)}
        ${prioChip(c)}
        <span class="chip">${ICONS.calendar} ${fmtFecha(c.fecha)} · ${c.horaProg || '—'} h</span>
        <span class="chip">${esc(c.quirofano || 'Sin quirófano')}</span>
        <div class="inc-actions"><span class="chev">${ICONS.chevron}</span></div>
      </div>
      <div class="inc-desc" style="-webkit-line-clamp:1"><b>${esc(c.procedimiento)}</b> — ${esc(c.paciente?.nombre)}${c.paciente?.pediatrico ? ' (pediátrico)' : ''}</div>
      <div class="inc-meta">
        <span>${ICONS.steth} ${esc(c.cirujano)}</span>
        <span>${ICONS.user} ${esc(c.servicio)}</span>
        ${c.estado === 'realizada' && !c.informe ? `<span style="color:var(--red);font-weight:700">${ICONS.clockSm} Informe operatorio pendiente (plazo 2 h)</span>` : ''}
      </div>
      ${acciones.length ? `<div class="cir-actions" onclick="event.stopPropagation()">${acciones.join('')}</div>` : ''}
    </div>`;
}

function accionesCirugia(c, rol) {
  const u = usuarioActual();
  const esDueno = u && c.cirujanoEmail === u.email;
  const a = [];
  if (c.estado === 'borrador' && esDueno) {
    a.push(c.sala && c.franja
      ? `<button class="btn btn-sm btn-outline" onclick="openSlot('${diaDeGrilla(c)}','${c.sala}','${c.franja}')">${ICONS.edit} Editar</button>`
      : `<button class="btn btn-sm btn-outline" onclick="go('solicitud')">${ICONS.edit} Elegir franja</button>`);
    a.push(`<button class="btn btn-sm btn-red" onclick="delCirugia(${c.id})">${ICONS.trash} Eliminar</button>`);
  }
  if (c.estado === 'pendiente' && jefe) {
    a.push(`<button class="btn btn-sm btn-blue" onclick="validarCirugia(${c.id})">${ICONS.check} Validar</button>`);
  }
  if (c.estado === 'validada' && jefe) {
    a.push(`<button class="btn btn-sm btn-green" onclick="confirmarCirugia(${c.id})">${ICONS.check} Confirmar en el parte</button>`);
  }
  if (c.estado === 'confirmada' && (jefe || esDueno)) {
    a.push(`<button class="btn btn-sm btn-orange" onclick="openLVQ(${c.id}, 'inicio')">${ICONS.play} Iniciar (LVQ Entrada + Pausa)</button>`);
  }
  if (c.estado === 'en_curso' && (jefe || esDueno)) {
    a.push(`<button class="btn btn-sm btn-darkgreen" onclick="openLVQ(${c.id}, 'salida')">${ICONS.flag} Finalizar (LVQ Salida)</button>`);
  }
  if (['pendiente', 'validada', 'confirmada', 'en_curso'].includes(c.estado) && jefe) {
    a.push(`<button class="btn btn-sm btn-red" onclick="openSuspender(${c.id})">${ICONS.x} Suspender</button>`);
  }
  if (c.estado === 'realizada' && !c.informe && (jefe || esDueno)) {
    a.push(`<button class="btn btn-sm btn-blue" onclick="openCirugia(${c.id})">${ICONS.fileText} Cargar informe operatorio</button>`);
  }
  if (jefe && ['borrador', 'suspendida'].includes(c.estado)) {
    a.push(`<button class="btn btn-sm btn-outline" onclick="delCirugia(${c.id})">${ICONS.trash} Eliminar</button>`);
  }
  return a;
}

function delCirugia(id) {
  if (!confirm('¿Eliminar esta solicitud de forma permanente?')) return;
  removeDoc('cirugias', id);
  refreshView();
}

function validarCirugia(id) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c) return;
  const faltan = coordFaltantes(c);
  if (faltan.length) {
    openCirugia(id);
    setTimeout(() => alert('No se puede validar: faltan verificaciones de coordinación.\n\n· ' + faltan.join('\n· ') + '\n\nComplete las verificaciones en el detalle de la cirugía.'), 100);
    return;
  }
  c.estado = 'validada';
  pushHist(c, 'Validada por áreas técnicas (Farmacia, Esterilización, Anestesiología' + (c.recursos?.hemoderivados ? ', Hemoterapia' : '') + ')');
  upsert('cirugias', c);
  refreshView();
}

function confirmarCirugia(id) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c) return;
  // Un turno no entra al parte oficial sin la autorización de Admisión y Egresos.
  if (!authOk(c)) {
    alert('No se puede confirmar en el parte: el turno no tiene la autorización de Admisión y Egresos.\n\nEstado actual: ' + (c.auth || 'PENDIENTE') + '.'
      + (c.auth === 'NO AUTORIZADO' ? '\nMotivo del rechazo: ' + (c.authMotivo || 'sin motivo registrado') : '')
      + '\nSolicite la autorización desde la grilla de Programación Diaria.');
    return;
  }
  c.estado = 'confirmada';
  pushHist(c, 'Confirmada por jefatura — turno oficial en el parte');
  upsert('cirugias', c);
  refreshView();
}

/* ================= LVQ ================= */
let lvqCirId = null, lvqModo = null;
function openLVQ(id, modo) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c) return;
  lvqCirId = id; lvqModo = modo;
  const fases = modo === 'inicio' ? ['entrada', 'pausa'] : ['salida'];
  $('lvq-modal').innerHTML = `
    <button class="modal-close" onclick="closeLVQ()" aria-label="Cerrar">✕</button>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <div class="head-icon" style="background:#e8f4fb;border-color:#c8dcf3">${ICONS.clipboard}</div>
      <div>
        <div style="font-weight:800;font-size:1.15rem">Lista de Verificación Quirúrgica</div>
        <div style="font-size:0.82rem;color:var(--muted)">OMS / RM 28/2012 — ${esc(c.procedimiento)} · ${esc(c.paciente?.nombre)}</div>
      </div>
    </div>
    <p style="font-size:0.85rem;color:var(--muted);margin-bottom:16px">${modo === 'inicio'
      ? 'Complete la fase de <b>Entrada</b> (antes de la inducción) y la <b>Pausa Quirúrgica</b> (antes de la incisión) para registrar el inicio del procedimiento.'
      : 'Complete la fase de <b>Salida</b> (antes de salir de quirófano) para cerrar el procedimiento. El conteo de gasas e instrumental es obligatorio.'}</p>
    ${fases.map((f) => `
      <div class="lvq-phase" id="lvq-f-${f}">
        <div class="lvq-head">${ICONS.clipboard.replace('18', '16')} ${LVQ[f].titulo}</div>
        <div class="lvq-resp">Responsables: ${LVQ[f].resp}</div>
        ${LVQ[f].items.map((it, i) => `
          <label class="lvq-item"><input type="checkbox" class="lvq-chk" data-fase="${f}" onchange="checkLVQReady()"> ${it}</label>`).join('')}
      </div>`).join('')}
    <div class="form-actions" style="margin-top:14px">
      <button class="btn ${modo === 'inicio' ? 'btn-orange' : 'btn-darkgreen'}" id="lvq-confirm" disabled onclick="confirmLVQ()">
        ${modo === 'inicio' ? ICONS.play + ' Confirmar LVQ e iniciar procedimiento' : ICONS.flag + ' Confirmar LVQ y cerrar procedimiento'}
      </button>
      <p class="form-note">Todos los ítems deben verificarse en voz alta con el equipo presente.</p>
    </div>`;
  $('lvq-overlay').classList.add('open');
}
function checkLVQReady() {
  const chks = [...document.querySelectorAll('.lvq-chk')];
  $('lvq-confirm').disabled = !chks.every((c) => c.checked);
}
function confirmLVQ() {
  const c = DB.cirugias.find((x) => x.id === lvqCirId);
  if (!c) return;
  c.lvq = c.lvq || {};
  const t = nowDT();
  if (lvqModo === 'inicio') {
    c.lvq.entrada = { done: true, hora: t };
    c.lvq.pausa = { done: true, hora: t };
    c.estado = 'en_curso';
    c.horaInicioReal = t;
    pushHist(c, 'LVQ Entrada y Pausa completadas — inicio del procedimiento');
  } else {
    c.lvq.salida = { done: true, hora: t };
    c.estado = 'realizada';
    c.horaFinReal = t;
    pushHist(c, 'LVQ Salida completada (conteo verificado) — procedimiento finalizado');
  }
  upsert('cirugias', c);
  closeLVQ();
  if (lvqModo === 'salida') {
    setTimeout(() => {
      openCirugia(c.id);
      setTimeout(() => alert('Procedimiento cerrado. Recuerde cargar el informe operatorio dentro de las 2 horas (meta de cumplimiento ≥ 95 %).'), 100);
    }, 100);
  } else {
    refreshView();
  }
}
function closeLVQ() { $('lvq-overlay').classList.remove('open'); refreshView(); }

/* ================= SUSPENSIÓN ================= */
let suspCirId = null;
function openSuspender(id) {

    <p style="font-size:0.88rem;color:var(--muted);margin:6px 0 18px">${esc(c.procedimiento)} — ${esc(c.paciente?.nombre)} · ${fmtFecha(c.fecha)}. La carga de la causa es <b>obligatoria</b>.</p>
    <div class="field" style="margin-bottom:14px">
      <label>Causa de suspensión *</label>
      <select id="susp-causa">${CAUSAS_SUSP.map((x) => `<option>${x}</option>`).join('')}</select>
    </div>
    <div class="field" style="margin-bottom:18px">

    </div>
    <div class="form-actions" style="margin-top:0">

      <button class="btn btn-outline" onclick="closeSuspender()">Cancelar</button>
    </div>
    <p class="form-note" style="margin-top:14px">${ICONS.info.replace('18', '13')} La suspensión no planificada genera automáticamente una incidencia de <b>categoría D</b> en el módulo de mejora continua.</p>`;
  $('susp-overlay').classList.add('open');
}
function closeSuspender() { $('susp-overlay').classList.remove('open'); }
function confirmSuspender() {
  const c = DB.cirugias.find((x) => x.id === suspCirId);
  if (!c) return;
  const causa = $('susp-causa').value;
  const det = $('susp-det').value.trim();
  c.estado = 'suspendida';
  c.suspension = { causa, detalle: det, fechaHora: nowDT() };

  upsert('cirugias', c);

    id: Date.now(),
    categoria: 'D', estado: 'Pendiente',
    fechaIncidencia: hoyISO(), horaIncidencia: nowDT().slice(11, 16), fechaReporte: hoyISO(),
    personal: c.cirujano || '—', servicio: c.servicio || '—',
    desglose: `[Generada automáticamente por el sistema] Suspensión no planificada de cirugía: ${c.procedimiento} (${c.paciente?.nombre}, ${fmtFecha(c.fecha)}, ${c.quirofano}). Causa registrada: ${causa}. ${det}`,
    informante: { nombre: 'Sistema HRU Quirófanos', dni: '—', telefono: '—', mail: 'sistema@hru.gob.ar' },
  });
  closeSuspender();
  refreshView();
}

    { id: 'todas', label: 'Todas' },
  ];

  if (progTab === 'flujo') {
    const grupos = [
      { est: 'pendiente', titulo: 'Pendientes de validación', hint: 'Verificar coordinación de áreas antes de validar' },
      { est: 'validada', titulo: 'Validadas — esperan confirmación de jefatura', hint: 'Al confirmar entran al parte oficial' },
      { est: 'confirmada', titulo: 'Confirmadas en el parte', hint: 'El inicio requiere LVQ de Entrada y Pausa' },
      { est: 'en_curso', titulo: 'En curso', hint: 'El cierre requiere LVQ de Salida con conteo completo' },
      { est: 'realizada', titulo: 'Realizadas recientes', hint: 'Controlar carga del informe operatorio (≤ 2 h)', limite: 5 },
      { est: 'suspendida', titulo: 'Suspendidas', hint: 'Con causa registrada', limite: 5 },
    ];
    cuerpo = grupos.map((g) => {
      let lista = DB.cirugias.filter((c) => c.estado === g.est).sort(ordenPrelacion);
      if (g.est === 'realizada' || g.est === 'suspendida') lista = lista.sort((a, b) => String(b.fecha).localeCompare(String(a.fecha))).slice(0, g.limite);
      if (!lista.length) return '';
      return `<div class="q-group">
        <div class="q-group-title"><span class="est-dot" style="background:${ESTC[g.est].color};width:12px;height:12px"></span> ${g.titulo} <span style="color:var(--muted);font-weight:500;font-size:0.8rem">· ${g.hint}</span></div>
        ${lista.map((c) => cirCard(c, 'jefe')).join('')}
      </div>`;
    }).join('') || '<div class="empty">No hay solicitudes en el circuito.</div>';
  } else {
    const lista = DB.cirugias
      .filter((c) => !progEstado || c.estado === progEstado)
      .sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')) || ordenPrelacion(a, b));
    cuerpo = `
      <div class="toolbar">
        <select onchange="progEstado=this.value;renderProgramacion()">
          <option value="">Todos los estados</option>
          ${Object.keys(ESTC).map((k) => `<option value="${k}" ${progEstado === k ? 'selected' : ''}>${ESTC[k].label}</option>`).join('')}
        </select>
      </div>
      <div class="result-count">${lista.length} solicitud(es)</div>
      ${lista.length ? lista.map((c) => cirCard(c, 'jefe')).join('') : '<div class="empty">Sin resultados.</div>'}`;
  }

  $('main').innerHTML = `
    <div class="page-head">
      <div class="head-row">
        <div class="head-icon">${ICONS.clipboard}</div>
        <div>
          <h1 class="page-title">Programación Quirúrgica</h1>
          <p class="page-sub">Circuito completo: Borrador → Pendiente → Validada → Confirmada → En curso → Realizada</p>
        </div>
      </div>
    </div>
    ${leyendaEstados()}
    <div class="tabs">
      ${tabs.map((t) => `<button class="tab ${progTab === t.id ? 'active' : ''}" onclick="progTab='${t.id}';renderProgramacion()">${t.label}</button>`).join('')}
      <span class="tab" style="cursor:default;border-style:dashed">Pendientes <span class="n">${n('pendiente')}</span></span>
      <span class="tab" style="cursor:default;border-style:dashed">Validadas <span class="n">${n('validada')}</span></span>
      <span class="tab" style="cursor:default;border-style:dashed">Confirmadas <span class="n">${n('confirmada')}</span></span>
    </div>
    ${cuerpo}`;
}

function setCoord(id, k, val) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c) return;
  c.coordinacion = c.coordinacion || {};
  c.coordinacion[k] = val;
  pushHist(c, (val ? 'Verificado: ' : 'Desmarcado: ') + (COORD_ITEMS.find((i) => i.k === k)?.label || k));
  upsert('cirugias', c);
}
/* ---- Anatomía Patológica ---- */
function agregarMuestra(id) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c) return;
  const tipo = $('mu-tipo-' + id).value;
  const rotulo = $('mu-rot-' + id).value.trim();
  if (!rotulo) { alert('Indique el rótulo o identificación de la muestra. El rotulado correcto es obligatorio en la LVQ de Salida.'); return; }
  c.muestras = c.muestras || [];
  c.muestras.push({ tipo, rotulo, enviada: false, fechaEnvio: '', registrada: nowDT() });
  pushHist(c, `Muestra registrada para Anatomía Patológica: ${tipo} (${rotulo})`);
  upsert('cirugias', c);
  openCirugia(id);
}
function toggleMuestra(id, idx) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c || !c.muestras || !c.muestras[idx]) return;
  const m = c.muestras[idx];
  m.enviada = !m.enviada;
  m.fechaEnvio = m.enviada ? nowDT() : '';
  pushHist(c, (m.enviada ? 'Muestra enviada a Anatomía Patológica: ' : 'Envío revertido: ') + m.tipo + ' (' + m.rotulo + ')');
  upsert('cirugias', c);
  openCirugia(id);
}
function delMuestra(id, idx) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c || !c.muestras || !c.muestras[idx]) return;
  if (!confirm('¿Eliminar el registro de esta muestra?')) return;
  const m = c.muestras.splice(idx, 1)[0];
  pushHist(c, 'Registro de muestra eliminado: ' + m.tipo);
  upsert('cirugias', c);
  openCirugia(id);
}

function guardarInforme(id) {
  const c = DB.cirugias.find((x) => x.id === id);
  const texto = $('inf-texto').value.trim();
  if (!c || !texto) { alert('Escriba el informe operatorio.'); return; }
  c.informe = { texto, fechaHora: nowDT() };
  pushHist(c, 'Informe operatorio cargado');
  upsert('cirugias', c);
  openCirugia(id);
}

/* ================= INDICADORES DE GESTIÓN (KPIs) ================= */
function calcKPIs(ym) {
  const delMes = DB.cirugias.filter((c) => (c.fecha || '').startsWith(ym));
  const realizadas = delMes.filter((c) => c.estado === 'realizada');
  const suspendidas = delMes.filter((c) => c.estado === 'suspendida');
  const programadas = delMes.filter((c) => ['confirmada', 'en_curso', 'realizada', 'suspendida'].includes(c.estado));

  // 1) Utilización del bloque: minutos operados / minutos disponibles
  const minOperados = realizadas.reduce((s, c) => {
    if (c.horaInicioReal && c.horaFinReal) return s + Math.max(0, diffMin(c.horaInicioReal, c.horaFinReal));
    return s + (c.duracionMin || 0);
  }, 0);
  const minDisponibles = horasDisponiblesMes(ym) * 60;
  const utilizacion = minDisponibles ? (minOperados / minDisponibles) * 100 : 0;

  // 2) Tasa de suspensiones sobre el total programado
  const tasaSusp = programadas.length ? (suspendidas.length / programadas.length) * 100 : 0;

  // 3) Recambio (turnover): minutos entre el fin de una cirugía y el inicio de la siguiente en el mismo quirófano
  const turnovers = [];
  BLOQUE.quirofanos.forEach((q) => {
    const porDia = {};
    realizadas.filter((c) => c.quirofano === q && c.horaInicioReal && c.horaFinReal)
      .forEach((c) => { (porDia[c.fecha] = porDia[c.fecha] || []).push(c); });
    Object.values(porDia).forEach((arr) => {
      arr.sort((a, b) => String(a.horaInicioReal).localeCompare(String(b.horaInicioReal)));
      for (let i = 1; i < arr.length; i++) {
        const t = diffMin(arr[i - 1].horaFinReal, arr[i].horaInicioReal);
        if (t >= 0 && t < 600) turnovers.push(t);
      }
    });
  });
  const turnover = turnovers.length ? turnovers.reduce((a, b) => a + b, 0) / turnovers.length : null;

  // 4) Cumplimiento del informe operatorio en menos de 2 h
  const conInforme = realizadas.filter((c) => c.informe && c.horaFinReal);
  const enPlazo = conInforme.filter((c) => diffMin(c.horaFinReal, c.informe.fechaHora) <= 120).length;
  const cumplInforme = realizadas.length ? (enPlazo / realizadas.length) * 100 : 0;

  // Causas de suspensión del mes
  const causas = {};
  suspendidas.forEach((c) => { const k = c.suspension?.causa || 'Sin causa registrada'; causas[k] = (causas[k] || 0) + 1; });

  return {
    utilizacion, tasaSusp, turnover, cumplInforme,
    realizadas: realizadas.length, suspendidas: suspendidas.length, programadas: programadas.length,
    minOperados, minDisponibles, turnovers: turnovers.length, conInforme: conInforme.length, enPlazo, causas,
  };
}

function kpiCard(label, icon, valor, texto, ok, meta, pct, goalPct) {
  return `<div class="kpi">
    <div class="kpi-label">${icon} ${label}</div>
    <div class="kpi-val" style="color:${ok ? 'var(--green)' : 'var(--red)'}">${valor}</div>
    <div class="kpi-meta">${texto}</div>
    <div class="bar-track">
      <div class="bar-fill" style="width:${Math.min(100, Math.max(0, pct))}%;background:${ok ? 'var(--green)' : 'var(--red)'}"></div>
      <div class="bar-goal" style="left:${Math.min(100, Math.max(0, goalPct))}%" title="Meta"></div>
    </div>
    <div class="kpi-status ${ok ? 'kpi-ok' : 'kpi-bad'}">${ok ? ICONS.check + ' Cumple' : ICONS.x + ' No cumple'} · Meta ${meta}</div>
  </div>`;
}

function renderKPIs() {
  if (!kpiMes) kpiMes = mesActual();
  const k = calcKPIs(kpiMes);
  const [y, m] = kpiMes.split('-').map(Number);
  const sinDatos = k.programadas === 0;

  const turnoverTxt = k.turnover === null ? '—' : Math.round(k.turnover) + ' min';
  const turnoverOk = k.turnover !== null && k.turnover <= 30;

  const causasArr = Object.entries(k.causas).sort((a, b) => b[1] - a[1]);
  const maxCausa = causasArr.length ? causasArr[0][1] : 1;

  $('main').innerHTML = `
    <div class="page-head">
      <div class="head-row">
        <div class="head-icon">${ICONS.chart}</div>
        <div>
          <h1 class="page-title">Indicadores de Gestión</h1>
          <p class="page-sub">KPIs mensuales del bloque quirúrgico — ${MESES_FULL[m - 1]} ${y}</p>
        </div>
      </div>
      <input type="month" value="${kpiMes}" onchange="kpiMes=this.value;renderKPIs()">
    </div>

    ${sinDatos ? `<div class="banner banner-amber">${ICONS.info}<div><strong>Sin actividad registrada en el mes seleccionado</strong>Los indicadores se calculan sobre las cirugías confirmadas, realizadas y suspendidas del período.</div></div>` : ''}

    <div class="kpi-grid">
      ${kpiCard('Tasa de utilización del bloque', ICONS.chart.replace('18', '15'),
        k.utilizacion.toFixed(1) + ' %',

/* ================= ESTADÍSTICAS QUIRÚRGICAS (por servicio y cirujano) =================
   "Indicadores" mide el bloque como un todo contra las metas institucionales.
   Esta vista, en cambio, compara la producción entre equipos sobre un período
   libre: volumen, horas de quirófano, suspensiones, cumplimiento del informe
   operatorio y de la lista de verificación, y lista de espera.

   Alcance de la información: la Jefatura ve el plantel completo. Un profesional
   con sesión iniciada ve el agregado por servicio y, en el desglose nominal,
   solamente sus propios datos: el rendimiento individual de un colega no es
   información de acceso general. */

function estRango() {
  if (!estDesde || !estHasta) {
    const hoy = hoyISO();
    estDesde = hoy.slice(0, 8) + '01';
    estHasta = hoy;
  }
  return [estDesde, estHasta];
}
function estIso(y, m, d) { return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`; }
function estPreset(p) {
  const hoy = hoyISO();
  const [y, m] = hoy.split('-').map(Number);
  const ultDia = (yy, mm) => new Date(yy, mm, 0).getDate();
  if (p === 'mes') { estDesde = estIso(y, m, 1); estHasta = hoy; }
  else if (p === 'mesant') {
    const my = m === 1 ? y - 1 : y, mm = m === 1 ? 12 : m - 1;
    estDesde = estIso(my, mm, 1); estHasta = estIso(my, mm, ultDia(my, mm));
  } else if (p === 'trim') {
    const d = new Date(y, m - 1, 1); d.setMonth(d.getMonth() - 2);
    estDesde = estIso(d.getFullYear(), d.getMonth() + 1, 1); estHasta = hoy;
  } else if (p === 'anio') { estDesde = estIso(y, 1, 1); estHasta = hoy; }
  else if (p === '12m') {
    const d = new Date(y, m - 1, 1); d.setMonth(d.getMonth() - 11);
    estDesde = estIso(d.getFullYear(), d.getMonth() + 1, 1); estHasta = hoy;
  }
  renderEstadisticas();
}
function estSort(col) {
  if (estOrden === col) estAsc = !estAsc;
  else { estOrden = col; estAsc = col === 'nombre'; }
  renderEstadisticas();
}
function estVerCirujanos(servEnc) {
  estServicio = decodeURIComponent(servEnc);
  estTab = 'cirujano';
  renderEstadisticas();
}

function estGrupoVacio(nombre) {
  return {
    nombre, servicios: {}, salas: {}, causas: {}, espera: [],
    programadas: 0, realizadas: 0, suspendidas: 0, minutos: 0,
    urgencias: 0, pediatricos: 0, conInforme: 0, informeEnPlazo: 0, lvqOk: 0,
    enEspera: 0, esperaMax: 0, mails: {},
  };
}

/* Agrupa la actividad del período por servicio o por cirujano.
   Se consideran "programadas" las cirugías que llegaron al parte (confirmadas,
   en curso, realizadas y suspendidas): los borradores y las solicitudes en
   circuito de validación todavía no consumieron quirófano. */
function calcEstadisticas(clave) {
  const [desde, hasta] = estRango();
  const G = {};
  const grupo = (c) => {
    const k = (clave === 'servicio' ? c.servicio : c.cirujano) || 'Sin asignar';
    const g = G[k] || (G[k] = estGrupoVacio(k));
    if (c.servicio) g.servicios[c.servicio] = (g.servicios[c.servicio] || 0) + 1;
    if (c.cirujanoEmail) g.mails[c.cirujanoEmail] = true;
    return g;
  };

  DB.cirugias
    .filter((c) => c.fecha && c.fecha >= desde && c.fecha <= hasta)
    .filter((c) => ['confirmada', 'en_curso', 'realizada', 'suspendida'].includes(c.estado))
    .forEach((c) => {
      const g = grupo(c);
      g.programadas++;
      if (c.quirofano) g.salas[c.quirofano] = (g.salas[c.quirofano] || 0) + 1;
      if (c.estado === 'suspendida') {
        g.suspendidas++;
        const causa = c.suspension?.causa || 'Sin causa registrada';
        g.causas[causa] = (g.causas[causa] || 0) + 1;
        return;
      }
      if (c.estado !== 'realizada') return;
      g.realizadas++;
      g.minutos += minutosCirugia(c);
      if (prioridadEfectiva(c) <= 2) g.urgencias++;
      if (c.paciente?.pediatrico) g.pediatricos++;
      if (lvqIntegra(c)) g.lvqOk++;
      if (c.informe) {
        g.conInforme++;
        if (c.horaFinReal && diffMin(c.horaFinReal, c.informe.fechaHora) <= 120) g.informeEnPlazo++;
      }
      if (c.fechaSolicitud) g.espera.push(Math.max(0, diasEntre(c.fechaSolicitud, c.fecha)));
    });

  // Lista de espera: es una foto del estado actual, no del período elegido.
  DB.cirugias.filter((c) => ['borrador', 'pendiente', 'validada'].includes(c.estado)).forEach((c) => {
    const g = grupo(c);
    g.enEspera++;
    g.esperaMax = Math.max(g.esperaMax, esperaDias(c));
  });

  const arr = Object.values(G).map((g) => {
    g.horas = g.minutos / 60;
    g.tasaSusp = g.programadas ? (g.suspendidas / g.programadas) * 100 : 0;
    g.durMedia = g.realizadas ? g.minutos / g.realizadas : 0;
    g.cumplInforme = g.realizadas ? (g.informeEnPlazo / g.realizadas) * 100 : 0;
    g.cumplLVQ = g.realizadas ? (g.lvqOk / g.realizadas) * 100 : 0;
    g.esperaMedia = g.espera.length ? g.espera.reduce((a, b) => a + b, 0) / g.espera.length : null;
    g.servicioPrinc = Object.entries(g.servicios).sort((a, b) => b[1] - a[1])[0]?.[0] || '';
    g.salaPrinc = Object.entries(g.salas).sort((a, b) => b[1] - a[1])[0]?.[0] || '';
    return g;
  });
  const totMin = arr.reduce((s, g) => s + g.minutos, 0);
  arr.forEach((g) => { g.share = totMin ? (g.minutos / totMin) * 100 : 0; });
  return arr;
}

function estOrdenar(arr) {
  const dir = estAsc ? 1 : -1;
  return arr.slice().sort((a, b) => {
    if (estOrden === 'nombre') return a.nombre.localeCompare(b.nombre) * dir;
    const va = a[estOrden] === null || a[estOrden] === undefined ? -1 : a[estOrden];
    const vb = b[estOrden] === null || b[estOrden] === undefined ? -1 : b[estOrden];
    return (va - vb) * dir || a.nombre.localeCompare(b.nombre);
  });
}
function estPill(valor, buenoDesde, regularDesde) {
  const cls = valor >= buenoDesde ? 'ok' : valor >= regularDesde ? 'mid' : 'bad';
  return `<span class="est-pill ${cls}">${valor.toFixed(0)} %</span>`;
}
function estPillInv(valor, maloDesde, regularDesde) {
  const cls = valor >= maloDesde ? 'bad' : valor >= regularDesde ? 'mid' : 'ok';
  return `<span class="est-pill ${cls}">${valor.toFixed(1)} %</span>`;
}

const EST_COLUMNAS = [
  { k: 'realizadas', t: 'Realizadas' },
  { k: 'suspendidas', t: 'Suspend.' },
  { k: 'tasaSusp', t: '% susp.' },
  { k: 'horas', t: 'Horas qx' },
  { k: 'share', t: '% del bloque' },
  { k: 'durMedia', t: 'Dur. media' },
  { k: 'cumplInforme', t: 'Informe ≤ 2 h' },
  { k: 'cumplLVQ', t: 'LVQ completa' },
  { k: 'esperaMedia', t: 'Espera media' },
  { k: 'enEspera', t: 'En espera' },
];

function estFila(g, clave, propia, maxRealizadas) {
  const nMails = Object.keys(g.mails).length;
  const sub = clave === 'cirujano'
    ? [g.servicioPrinc, g.salaPrinc].filter(Boolean).join(' · ')
    : `${nMails ? nMails + ' cirujano(s) con cuenta' : 'sin cirujanos con cuenta'} · ${g.salaPrinc || 'sin sala predominante'}`;
  const drill = clave === 'servicio'
    ? ` class="clic" onclick="estVerCirujanos('${attr(g.nombre)}')" title="Ver el desglose por cirujano de este servicio"`
    : (propia ? ' class="propia"' : '');
  return `<tr${drill}>
    <td><div class="est-nom">${esc(g.nombre)}${propia ? ' <span class="est-pill ok">Usted</span>' : ''}<small>${esc(sub)}</small></div></td>
    <td class="num"><b>${g.realizadas}</b>
      <span class="est-mini"><i style="width:${maxRealizadas ? (g.realizadas / maxRealizadas) * 100 : 0}%"></i></span></td>
    <td class="num">${g.suspendidas}</td>
    <td class="num">${g.programadas ? estPillInv(g.tasaSusp, 10, 5) : '—'}</td>
    <td class="num">${g.horas ? g.horas.toFixed(1) : '—'}</td>
    <td class="num">${g.share ? g.share.toFixed(1) + ' %' : '—'}</td>
    <td class="num">${g.durMedia ? Math.round(g.durMedia) + ' min' : '—'}</td>
    <td class="num">${g.realizadas ? estPill(g.cumplInforme, 95, 80) : '—'}</td>
    <td class="num">${g.realizadas ? estPill(g.cumplLVQ, 95, 80) : '—'}</td>
    <td class="num">${g.esperaMedia === null ? '—' : Math.round(g.esperaMedia) + ' d'}</td>
    <td class="num">${g.enEspera || '—'}${g.esperaMax > 90 ? `<small style="display:block;color:var(--red);font-weight:700">máx. ${g.esperaMax} d</small>` : ''}</td>
  </tr>`;
}

function exportarEstadisticas() {
  const clave = estTab;
  const [desde, hasta] = estRango();
  const filas = [[clave === 'servicio' ? 'Servicio' : 'Cirujano', 'Servicio principal', 'Programadas',
    'Realizadas', 'Suspendidas', '% suspensión', 'Horas de quirófano', '% del bloque',
    'Duración media (min)', 'Urgencias P1-P2', 'Pediátricos', '% informe ≤ 2 h', '% LVQ completa',
    'Espera media (días)', 'En lista de espera', 'Espera máxima (días)']];
  estOrdenar(estVisibles(clave)).forEach((g) => filas.push([
    g.nombre, g.servicioPrinc, g.programadas, g.realizadas, g.suspendidas, g.tasaSusp.toFixed(1),
    g.horas.toFixed(1), g.share.toFixed(1), Math.round(g.durMedia), g.urgencias, g.pediatricos,
    g.cumplInforme.toFixed(1), g.cumplLVQ.toFixed(1),
    g.esperaMedia === null ? '' : Math.round(g.esperaMedia), g.enEspera, g.esperaMax,
  ]));
  filas.push([]);
  filas.push([`Período ${desde} a ${hasta}`, `Exportado ${nowDT().replace('T', ' ')}`]);
  descargarCSV(`hru-estadisticas-${clave}-${desde}_${hasta}.csv`, filas);
}

/* Grupos visibles según quién mira: el desglose nominal solo lo ve completo la
   Jefatura; el profesional ve su propia fila. */
function estVisibles(clave) {
  const u = usuarioActual();
  let arr = calcEstadisticas(clave);
  if (clave === 'cirujano') {
    if (estServicio) arr = arr.filter((g) => g.servicioPrinc === estServicio || g.servicios[estServicio]);
    if (!jefe) arr = arr.filter((g) => u && (g.nombre === u.nombre || g.mails[u.email]));
  }
  return arr;
}

function renderEstadisticas() {
  const u = usuarioActual();
  const [desde, hasta] = estRango();
  const clave = estTab;
  const todos = calcEstadisticas(clave);
  const visibles = estOrdenar(estVisibles(clave));
  const maxReal = Math.max(1, ...visibles.map((g) => g.realizadas));

  // Totales del período, siempre sobre el universo completo.
  const porServ = calcEstadisticas('servicio');
  const tot = porServ.reduce((s, g) => ({
    realizadas: s.realizadas + g.realizadas, suspendidas: s.suspendidas + g.suspendidas,
    programadas: s.programadas + g.programadas, minutos: s.minutos + g.minutos,
    urgencias: s.urgencias + g.urgencias,
  }), { realizadas: 0, suspendidas: 0, programadas: 0, minutos: 0, urgencias: 0 });
  const nCirujanos = calcEstadisticas('cirujano').filter((g) => g.realizadas > 0).length;
  const nServicios = porServ.filter((g) => g.realizadas > 0).length;

  const th = (c) => `<th class="num orden ${estOrden === c.k ? 'on' : ''}" onclick="estSort('${c.k}')">${c.t}${estOrden === c.k ? ' ' + (estAsc ? ICONS.arrowUp : ICONS.arrowDown) : ''}</th>`;

  // Ranking de causas de suspensión del período (agregado de todos los grupos)
  const causas = {};
  porServ.forEach((g) => Object.entries(g.causas).forEach(([c, n]) => { causas[c] = (causas[c] || 0) + n; }));
  const causasArr = Object.entries(causas).sort((a, b) => b[1] - a[1]);
  const maxCausa = causasArr.length ? causasArr[0][1] : 1;

  const topHoras = porServ.slice().sort((a, b) => b.minutos - a.minutos).slice(0, 8);
  const maxHoras = topHoras.length ? topHoras[0].minutos : 1;

        <button class="est-preset" onclick="estPreset('mesant')">Mes anterior</button>
        <button class="est-preset" onclick="estPreset('trim')">Últimos 3 meses</button>
        <button class="est-preset" onclick="estPreset('anio')">Año en curso</button>
        <button class="est-preset" onclick="estPreset('12m')">Últimos 12 meses</button>
      </div>

        <div class="kpi-meta">${tot.programadas} llegaron al parte en el período</div></div>
      <div class="kpi"><div class="kpi-label">${ICONS.clockSm} Horas de quirófano</div>
        <div class="kpi-val">${(tot.minutos / 60).toFixed(1)}</div>
        <div class="kpi-meta">Tiempo real medido; si falta, la duración estimada</div></div>
      <div class="kpi"><div class="kpi-label">${ICONS.layers.replace('18', '15')} Equipos con actividad</div>
        <div class="kpi-val">${nServicios} <span style="font-size:1rem;font-weight:600;color:var(--muted)">servicios</span></div>
        <div class="kpi-meta">${nCirujanos} cirujano(s) con al menos una cirugía realizada</div></div>
      <div class="kpi"><div class="kpi-label">${ICONS.zap.replace('16', '15')} Urgencias P1–P2</div>
        <div class="kpi-val">${tot.urgencias}</div>
        <div class="kpi-meta">${tot.realizadas ? ((tot.urgencias / tot.realizadas) * 100).toFixed(1) : '0.0'} % de la producción del período</div></div>
    </div>

    <div class="tabs">

      <button class="tab ${clave === 'cirujano' ? 'active' : ''}" onclick="estTab='cirujano';renderEstadisticas()">${ICONS.steth} Por cirujano <span class="n">${estVisibles('cirujano').length}</span></button>
      ${clave === 'cirujano' && estServicio ? `<button class="tab" onclick="estServicio='';renderEstadisticas()">${ICONS.x} Quitar filtro: ${esc(estServicio)}</button>` : ''}
    </div>

    ${clave === 'cirujano' && !jefe ? `<div class="banner banner-blue">${ICONS.lock.replace('18', '16')}

    ${clave === 'servicio' ? `<div class="banner banner-blue">${ICONS.info}

      </div>
      <div class="chart-card">
