/* ================= ESTADÍSTICAS QUIRÚRGICAS (por servicio y cirujano) =================
   "Indicadores" mide el bloque como un todo contra las metas institucionales.
   Esta vista, en cambio, compara la producción entre equipos sobre un período
   libre: volumen, horas de quirófano, suspensiones, cumplimiento del informe
   operatorio y de la lista de verificación, y lista de espera.

   Alcance de la información: la Jefatura ve el plantel completo. Un profesional
   con sesión iniciada ve el agregado por servicio y, en el desglose nominal,
   solamente sus propios datos: el rendimiento individual de un colega no es
   información de acceso general. */

function estRango() {
  if (!estDesde || !estHasta) {
    const hoy = hoyISO();
    estDesde = hoy.slice(0, 8) + '01';
    estHasta = hoy;
  }
  return [estDesde, estHasta];
}
function estIso(y, m, d) { return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`; }
function estPreset(p) {
  const hoy = hoyISO();
  const [y, m] = hoy.split('-').map(Number);
  const ultDia = (yy, mm) => new Date(yy, mm, 0).getDate();
  if (p === 'mes') { estDesde = estIso(y, m, 1); estHasta = hoy; }
  else if (p === 'mesant') {
    const my = m === 1 ? y - 1 : y, mm = m === 1 ? 12 : m - 1;
    estDesde = estIso(my, mm, 1); estHasta = estIso(my, mm, ultDia(my, mm));
  } else if (p === 'trim') {
    const d = new Date(y, m - 1, 1); d.setMonth(d.getMonth() - 2);
    estDesde = estIso(d.getFullYear(), d.getMonth() + 1, 1); estHasta = hoy;
  } else if (p === 'anio') { estDesde = estIso(y, 1, 1); estHasta = hoy; }
  else if (p === '12m') {
    const d = new Date(y, m - 1, 1); d.setMonth(d.getMonth() - 11);
    estDesde = estIso(d.getFullYear(), d.getMonth() + 1, 1); estHasta = hoy;
  }
  renderEstadisticas();
}
function estSort(col) {
  if (estOrden === col) estAsc = !estAsc;
  else { estOrden = col; estAsc = col === 'nombre'; }
  renderEstadisticas();
}
function estVerCirujanos(servEnc) {
  estServicio = decodeURIComponent(servEnc);
  estTab = 'cirujano';
  renderEstadisticas();
}

function estGrupoVacio(nombre) {
  return {
    nombre, servicios: {}, salas: {}, causas: {}, espera: [],
    programadas: 0, realizadas: 0, suspendidas: 0, minutos: 0,
    urgencias: 0, pediatricos: 0, conInforme: 0, informeEnPlazo: 0, lvqOk: 0,
    enEspera: 0, esperaMax: 0, mails: {},
  };
}

/* Agrupa la actividad del período por servicio o por cirujano.
   Se consideran "programadas" las cirugías que llegaron al parte (confirmadas,
   en curso, realizadas y suspendidas): los borradores y las solicitudes en
   circuito de validación todavía no consumieron quirófano. */
function calcEstadisticas(clave) {
  const [desde, hasta] = estRango();
  const G = {};
  // Se agrupa por la clave canónica —sin tildes, sin mayúsculas, sin
  // tratamientos y admitiendo el nombre incompleto— y se rotula con el nombre
  // bien escrito. Así un mismo cirujano no aparece repartido en cuatro filas.
  const grupo = (c) => {
    const bruto = (clave === 'servicio' ? c.servicio : c.cirujano) || '';
    const nombre = (clave === 'servicio' ? servicioCanonico(bruto) : profesionalCanonico(bruto)) || 'Sin asignar';
    const k = (clave === 'servicio' ? claveServicio(bruto) : claveProfesional(bruto)) || '__sin_asignar__';
    const g = G[k] || (G[k] = estGrupoVacio(nombre));
    if (c.servicio) { const sv = servicioCanonico(c.servicio); g.servicios[sv] = (g.servicios[sv] || 0) + 1; }
    if (c.cirujanoEmail) g.mails[c.cirujanoEmail] = true;
    return g;
  };

  DB.cirugias
    .filter((c) => c.fecha && c.fecha >= desde && c.fecha <= hasta)
    .filter((c) => ['confirmada', 'en_curso', 'realizada', 'finalizada', 'suspendida'].includes(c.estado))
    .forEach((c) => {
      const g = grupo(c);
      g.programadas++;
      if (c.quirofano) g.salas[c.quirofano] = (g.salas[c.quirofano] || 0) + 1;
      if (c.estado === 'suspendida') {
        g.suspendidas++;
        const causa = c.suspension?.causa || 'Sin causa registrada';
        g.causas[causa] = (g.causas[causa] || 0) + 1;
        return;
      }
      if (!cirugiaCerrada(c)) return;
      g.realizadas++;
      g.minutos += minutosCirugia(c);
      if (prioridadEfectiva(c) <= 2) g.urgencias++;
      if (c.paciente?.pediatrico) g.pediatricos++;
      if (lvqIntegra(c)) g.lvqOk++;
      if (c.informe) {
        g.conInforme++;
        if (c.horaFinReal && diffMin(c.horaFinReal, c.informe.fechaHora) <= 120) g.informeEnPlazo++;
      }
      if (c.fechaSolicitud) g.espera.push(Math.max(0, diasEntre(c.fechaSolicitud, c.fecha)));
    });

  // Lista de espera: es una foto del estado actual, no del período elegido.
  DB.cirugias.filter((c) => ['borrador', 'pendiente', 'validada'].includes(c.estado)).forEach((c) => {
    const g = grupo(c);
    g.enEspera++;
    g.esperaMax = Math.max(g.esperaMax, esperaDias(c));
  });

  const arr = Object.values(G).map((g) => {
    g.horas = g.minutos / 60;
    g.tasaSusp = g.programadas ? (g.suspendidas / g.programadas) * 100 : 0;
    g.durMedia = g.realizadas ? g.minutos / g.realizadas : 0;
    g.cumplInforme = g.realizadas ? (g.informeEnPlazo / g.realizadas) * 100 : 0;
    g.cumplLVQ = g.realizadas ? (g.lvqOk / g.realizadas) * 100 : 0;
    g.esperaMedia = g.espera.length ? g.espera.reduce((a, b) => a + b, 0) / g.espera.length : null;
    g.servicioPrinc = Object.entries(g.servicios).sort((a, b) => b[1] - a[1])[0]?.[0] || '';
    g.salaPrinc = Object.entries(g.salas).sort((a, b) => b[1] - a[1])[0]?.[0] || '';
    return g;
  });
  const totMin = arr.reduce((s, g) => s + g.minutos, 0);
  arr.forEach((g) => { g.share = totMin ? (g.minutos / totMin) * 100 : 0; });
  return arr;
}

function estOrdenar(arr) {
  const dir = estAsc ? 1 : -1;
  return arr.slice().sort((a, b) => {
    if (estOrden === 'nombre') return a.nombre.localeCompare(b.nombre) * dir;
    const va = a[estOrden] === null || a[estOrden] === undefined ? -1 : a[estOrden];
    const vb = b[estOrden] === null || b[estOrden] === undefined ? -1 : b[estOrden];
    return (va - vb) * dir || a.nombre.localeCompare(b.nombre);
  });
}
function estPill(valor, buenoDesde, regularDesde) {
  const cls = valor >= buenoDesde ? 'ok' : valor >= regularDesde ? 'mid' : 'bad';
  return `<span class="est-pill ${cls}">${valor.toFixed(0)} %</span>`;
}
function estPillInv(valor, maloDesde, regularDesde) {
  const cls = valor >= maloDesde ? 'bad' : valor >= regularDesde ? 'mid' : 'ok';
  return `<span class="est-pill ${cls}">${valor.toFixed(1)} %</span>`;
}

const EST_COLUMNAS = [
  { k: 'realizadas', t: 'Realizadas' },
  { k: 'suspendidas', t: 'Suspend.' },
  { k: 'tasaSusp', t: '% susp.' },
  { k: 'horas', t: 'Horas qx' },
  { k: 'share', t: '% del bloque' },
  { k: 'durMedia', t: 'Dur. media' },
  { k: 'cumplInforme', t: 'Informe ≤ 2 h' },
  { k: 'cumplLVQ', t: 'LVQ completa' },
  { k: 'esperaMedia', t: 'Espera media' },
  { k: 'enEspera', t: 'En espera' },
];

function estFila(g, clave, propia, maxRealizadas) {
  const nMails = Object.keys(g.mails).length;
  const sub = clave === 'cirujano'
    ? [g.servicioPrinc, g.salaPrinc].filter(Boolean).join(' · ')
    : `${nMails ? nMails + ' cirujano(s) con cuenta' : 'sin cirujanos con cuenta'} · ${g.salaPrinc || 'sin sala predominante'}`;
  const drill = clave === 'servicio'
    ? ` class="clic" onclick="estVerCirujanos('${attr(g.nombre)}')" title="Ver el desglose por cirujano de este servicio"`
    : (propia ? ' class="propia"' : '');
  return `<tr${drill}>
    <td><div class="est-nom">${esc(g.nombre)}${propia ? ' <span class="est-pill ok">Usted</span>' : ''}<small>${esc(sub)}</small></div></td>
    <td class="num"><b>${g.realizadas}</b>
      <span class="est-mini"><i style="width:${maxRealizadas ? (g.realizadas / maxRealizadas) * 100 : 0}%"></i></span></td>
    <td class="num">${g.suspendidas}</td>
    <td class="num">${g.programadas ? estPillInv(g.tasaSusp, 10, 5) : '—'}</td>
    <td class="num">${g.horas ? g.horas.toFixed(1) : '—'}</td>
    <td class="num">${g.share ? g.share.toFixed(1) + ' %' : '—'}</td>
    <td class="num">${g.durMedia ? Math.round(g.durMedia) + ' min' : '—'}</td>
    <td class="num">${g.realizadas ? estPill(g.cumplInforme, 95, 80) : '—'}</td>
    <td class="num">${g.realizadas ? estPill(g.cumplLVQ, 95, 80) : '—'}</td>
    <td class="num">${g.esperaMedia === null ? '—' : Math.round(g.esperaMedia) + ' d'}</td>
    <td class="num">${g.enEspera || '—'}${g.esperaMax > 90 ? `<small style="display:block;color:var(--red);font-weight:700">máx. ${g.esperaMax} d</small>` : ''}</td>
  </tr>`;
}

function exportarEstadisticas() {
  const clave = estTab;
  const [desde, hasta] = estRango();
  if (clave === 'tipo') { exportarPorTipo(); return; }
  const filas = [[clave === 'servicio' ? 'Servicio' : 'Cirujano', 'Servicio principal', 'Programadas',
    'Realizadas', 'Suspendidas', '% suspensión', 'Horas de quirófano', '% del bloque',
    'Duración media (min)', 'Urgencias P1-P2', 'Pediátricos', '% informe ≤ 2 h', '% LVQ completa',
    'Espera media (días)', 'En lista de espera', 'Espera máxima (días)']];
  estOrdenar(estVisibles(clave)).forEach((g) => filas.push([
    g.nombre, g.servicioPrinc, g.programadas, g.realizadas, g.suspendidas, g.tasaSusp.toFixed(1),
    g.horas.toFixed(1), g.share.toFixed(1), Math.round(g.durMedia), g.urgencias, g.pediatricos,
    g.cumplInforme.toFixed(1), g.cumplLVQ.toFixed(1),
    g.esperaMedia === null ? '' : Math.round(g.esperaMedia), g.enEspera, g.esperaMax,
  ]));
  filas.push([]);
  filas.push([`Período ${desde} a ${hasta}`, `Exportado ${nowDT().replace('T', ' ')}`]);
  descargarCSV(`hru-estadisticas-${clave}-${desde}_${hasta}.csv`, filas);
}

/* El CSV del cuadro por tipo de cirugía sale con una fila por práctica —la
   misma descripción y el mismo módulo que usa la solapa de Módulos— y el
   desglose de servicios y de cirujanos en esa misma fila. */
function exportarPorTipo() {
  const [desde, hasta] = estRango();
  const arr = calcPorTipo();
  const filas = [['Práctica / intervención', 'Capítulo y sección del nomenclador', 'Módulo',
    'Programadas', 'Realizadas', 'Suspendidas', '% suspensión',
    'Horas de quirófano', '% del total', 'Duración media (min)', 'Servicios', 'Cirujanos',
    'Detalle por servicio', 'Detalle por cirujano']];
  arr.forEach((t) => filas.push([
    t.nombre, t.contexto, t.modulo, t.programadas, t.realizadas, t.suspendidas, t.tasaSusp.toFixed(1),
    t.horas.toFixed(1), t.share.toFixed(1), Math.round(t.durMedia),
    t.listaServicios.length, t.nCirujanos,
    t.listaServicios.map(([n, v]) => `${n} (${v})`).join(' | '),
    t.listaCirujanos.map(([n, v]) => `${n} (${v})`).join(' | '),
  ]));
  filas.push([]);
  const alc = estTipoAlcanceEfectivo();
  const u = usuarioActual();
  filas.push([`Período ${desde} a ${hasta}`,
    alc === 'hospital' ? 'Alcance: todo el bloque quirúrgico'
      : alc === 'propio' ? `Alcance: cirugías de ${(u && u.nombre) || ''}`
      : `Alcance: servicio de ${(u && u.servicio) || ''}`,
    `Exportado ${nowDT().replace('T', ' ')}`]);
  descargarCSV(`hru-estadisticas-tipo-cirugia-${desde}_${hasta}.csv`, filas);
}

/* ---- Quién ve qué en Estadísticas ----
   La regla es una sola y vale para las tres solapas: el Jefe de Quirófanos y la
   Dirección Médica ven todo el bloque; el cirujano acreditado ve lo suyo y lo
   de su servicio, y nada de los demás servicios. Del propio servicio ve el
   agregado, no el rendimiento nominal de cada colega. */
function estTodoElBloque() { return jefe || director; }
function estServicioPropio() {
  const u = usuarioActual();
  return estTodoElBloque() ? '' : ((u && u.servicio) || '');
}
/* Filtro de un grupo (servicio o cirujano) contra el servicio de quien mira. */
function estDeSuServicio(g) {
  const serv = estServicioPropio();
  if (!serv) return true;
  if (mismoServicio(g.nombre, serv)) return true;
  if (g.servicioPrinc && mismoServicio(g.servicioPrinc, serv)) return true;
  return Object.keys(g.servicios || {}).some((x) => mismoServicio(x, serv));
}

/* Grupos visibles según quién mira: el desglose nominal solo lo ven completo la
   Jefatura y la Dirección; el profesional ve su propia fila y su servicio. */
function estVisibles(clave) {
  const u = usuarioActual();
  let arr = calcEstadisticas(clave);
  if (!estTodoElBloque()) arr = arr.filter(estDeSuServicio);
  if (clave === 'cirujano') {
    if (estServicio) arr = arr.filter((g) => g.servicioPrinc === estServicio || g.servicios[estServicio]);
    if (!estTodoElBloque()) arr = arr.filter((g) => u && (mismoProfesional(g.nombre, u.nombre) || g.mails[u.email]));
  }
  return arr;
}

/* ================= ESTADÍSTICAS SEGÚN TIPO DE CIRUGÍA =================
   Las dos solapas anteriores miran quién opera (servicio y cirujano). Esta
   mira qué se opera: agrupa la producción del período por la **práctica** del
   Nomenclador Modulado 2025 elegida en el turno —«colecistectomía
   videolaparoscópica», «hernia inguinal unilateral»— que es exactamente la
   misma descripción que fija el módulo A, B o C en la solapa de Módulos
   Quirúrgicos. Los turnos declarados fuera del nomenclador entran con el texto
   libre del procedimiento, igual que en Módulos.

   Una práctica puede repartirse entre varios servicios y cirujanos (una hernia
   la opera Cirugía General, pero una eventración posparto puede caer en
   Ginecología), así que el cuadro engloba a ambos en lugar de reemplazarlos.

   Alcance: la Jefatura y la Dirección Médica ven todo el bloque; el
   profesional acreditado ve sus propias cirugías y las de su servicio, igual
   que en el resto de la vista. */

/* Nombre legible del capítulo del nomenclador, para el renglón de contexto que
   acompaña a cada práctica. Dos secciones se separan de su capítulo porque en
   el HRU son actividad de otro equipo. */
const TIPO_CX_NOMBRE = {
  'ABDOMEN': 'Abdomen',
  'PROCTOLOGIA': 'Proctología',
  'TORAX': 'Tórax',
  'ENDOCRINAS': 'Endocrinas',
  'GINECOLOGIA': 'Ginecología',
  'OBSTETRICIA': 'Obstetricia',
  'UROLOGIA': 'Urología',
  'ORTOPEDIA': 'Ortopedia y Traumatología',
  'OTORRINOLARINGOLOGIA': 'Otorrinolaringología',
  'OFTALMOLOGIA': 'Oftalmología',
  'NEUROCIRUGIA': 'Neurocirugía',
  'CARDIOVASCULAR': 'Cardiovascular',
  'VASOS Y GANGLIOS LINFATICOS': 'Vasos y ganglios linfáticos',
  'CIRUGIA REPARADORA': 'Cirugía reparadora',
  'CIRUGÍAS ESTÉTICAS REPARADORAS autorizadas por la Obra Social': 'Estéticas reparadoras',
};
const TIPO_CX_FUERA = 'Fuera del nomenclador';
/* Cuántas prácticas entran en la torta con color propio; el resto se agrupa en
   una porción final. Con una lista de cientos de prácticas, el gráfico solo se
   lee si el detalle largo queda en el cuadro de abajo. */
const TIPO_CX_TOP = 10;
/* Paleta del gráfico de torta. La última posición es el gris de "otras
   prácticas", que nunca se usa para una práctica con nombre propio. */
const TIPO_CX_COLORES = ['#2980d9', '#1fa971', '#f0a92e', '#8b5cf6', '#e8543f', '#0ea5a4',
  '#d946a0', '#6b7ad9', '#7c9c2f', '#c2703a'];
const TIPO_CX_GRIS = '#9aa3ad';

/* El "tipo de cirugía" es la práctica tal como quedó escrita en el turno: si
   salió del nomenclador es el texto exacto del listado (el mismo que decide el
   módulo), y si se declaró a mano, el procedimiento escrito por el cirujano. */
function tipoDeCirugia(c) {
  const pr = c.practica;
  if (pr && pr.p) return pr.p;
  return String(c.procedimiento || '').trim() || 'Sin práctica declarada';
}
/* Renglón de contexto de la práctica: capítulo y sección del nomenclador, o el
   aviso de que la práctica se declaró fuera del listado. */
function tipoContexto(c) {
  const pr = c.practica;
  if (!pr || !pr.g) return TIPO_CX_FUERA;
  const cap = TIPO_CX_NOMBRE[pr.g] || pr.g;
  if (pr.g === 'ORTOPEDIA' && pr.s === 'Neurocirugía de Columna') return 'Neurocirugía de columna';
  if (pr.s === 'Endoscopias abdominales') return 'Abdomen · Endoscopías abdominales';
  return pr.s ? `${cap} · ${pr.s}` : cap;
}
/* Mayúscula inicial: el nomenclador viene en minúsculas y en el cuadro cada
   práctica encabeza su fila. */
function tipoTitulo(n) { return n ? n.charAt(0).toUpperCase() + n.slice(1) : n; }

/* Alcances disponibles para quien mira. La Jefatura y la Dirección tienen el
   hospital entero; el profesional, lo suyo y lo de su servicio. */
function estTipoAlcances() {
  const u = usuarioActual();
  const opciones = [];
  if (u) {
    opciones.push({ k: 'propio', label: 'Mis cirugías' });
    if (u.servicio) opciones.push({ k: 'servicio', label: 'Mi servicio' });
  }
  if (estTodoElBloque()) opciones.push({ k: 'hospital', label: 'Todo el bloque' });
  return opciones;
}
function estTipoAlcanceEfectivo() {
  const ops = estTipoAlcances();
  if (!ops.length) return 'hospital';
  return ops.some((o) => o.k === estTipoAlcance) ? estTipoAlcance : ops[ops.length - 1].k;
}
function estTipoAlcanceSet(k) { estTipoAlcance = k; estTipoSel = ''; renderEstadisticas(); }
function estTipoVer(nombreEnc) {
  const n = decodeURIComponent(nombreEnc);
  estTipoSel = (estTipoSel === n) ? '' : n;
  renderEstadisticas();
}
/* Qué cirugías entran en el cuadro según el alcance elegido. */
function estTipoAlcanza(c) {
  const alc = estTipoAlcanceEfectivo();
  if (alc === 'hospital') return true;
  const u = usuarioActual();
  if (!u) return false;
  if (alc === 'propio') return (c.cirujanoEmail && c.cirujanoEmail === u.email) || mismoProfesional(c.cirujano, u.nombre);
  return mismoServicio(c.servicio, u.servicio);
}

/* Quién figura en el desglose por cirujano. La Jefatura y la Dirección ven el
   plantel con nombre y apellido; el profesional ve su propia barra y el resto
   de su servicio agrupado, igual que en la solapa "Por cirujano". */
function estTipoNombreCirujano(c) {
  const nombre = profesionalCanonico(c.cirujano) || 'Sin cirujano';
  if (estTodoElBloque()) return nombre;
  const u = usuarioActual();
  const propio = !!u && ((c.cirujanoEmail && c.cirujanoEmail === u.email) || mismoProfesional(c.cirujano, u.nombre));
  return propio ? nombre : 'Otros profesionales del servicio';
}

function calcPorTipo() {
  const [desde, hasta] = estRango();
  const T = {};
  DB.cirugias
    .filter((c) => c.fecha && c.fecha >= desde && c.fecha <= hasta)
    .filter((c) => ['confirmada', 'en_curso', 'realizada', 'finalizada', 'suspendida'].includes(c.estado))
    .filter(estTipoAlcanza)
    .forEach((c) => {
      const k = tipoDeCirugia(c);
      const t = T[k] || (T[k] = {
        nombre: tipoTitulo(k), contexto: tipoContexto(c), fuera: !(c.practica && c.practica.g),
        programadas: 0, realizadas: 0, suspendidas: 0, minutos: 0,
        servicios: {}, cirujanos: {}, cirujanosReales: {}, modulos: {},
      });
      t.programadas++;
      // El módulo lo fija la práctica; se cuenta también en las suspendidas
      // para que el cuadro coincida con la letra que muestra la ficha del turno.
      if (c.modulo) t.modulos[c.modulo] = (t.modulos[c.modulo] || 0) + 1;
      if (c.estado === 'suspendida') { t.suspendidas++; return; }
      if (!cirugiaCerrada(c)) return;
      t.realizadas++;
      t.minutos += minutosCirugia(c);
      // Servicio y cirujano se cuentan sobre lo efectivamente realizado: es lo
      // que sostiene el porcentaje de la torta.
      const serv = servicioCanonico(c.servicio) || 'Sin servicio';
      t.servicios[serv] = (t.servicios[serv] || 0) + 1;
      t.cirujanosReales[profesionalCanonico(c.cirujano) || 'Sin cirujano'] = true;
      const cir = estTipoNombreCirujano(c);
      t.cirujanos[cir] = (t.cirujanos[cir] || 0) + 1;
    });
  const arr = Object.values(T);
  const tot = arr.reduce((n, t) => n + t.realizadas, 0);
  arr.forEach((t) => {
    t.horas = t.minutos / 60;
    t.share = tot ? (t.realizadas / tot) * 100 : 0;
    t.tasaSusp = t.programadas ? (t.suspendidas / t.programadas) * 100 : 0;
    t.durMedia = t.realizadas ? t.minutos / t.realizadas : 0;
    t.listaServicios = Object.entries(t.servicios).sort((a, b) => b[1] - a[1]);
    t.listaCirujanos = Object.entries(t.cirujanos).sort((a, b) => b[1] - a[1]);
    // El recuento va sobre los nombres reales aunque el desglose se muestre agrupado.
    t.nCirujanos = Object.keys(t.cirujanosReales).length;
    // Letra del módulo de la práctica: la dominante, que salvo carga manual
    // dispar es la única que aparece.
    t.modulo = MOD_LETRAS.filter((m) => t.modulos[m]).sort((a, b) => t.modulos[b] - t.modulos[a])[0] || '';
  });
  // El orden fija el color de cada porción: la práctica más operada queda
  // primero y las declaradas fuera del nomenclador, al final del cuadro.
  arr.sort((a, b) => (a.fuera - b.fuera)
    || b.realizadas - a.realizadas || a.nombre.localeCompare(b.nombre));
  // Solo las primeras prácticas llevan color propio en la torta.
  let n = 0;
  arr.forEach((t) => {
    t.color = t.realizadas > 0 && n < TIPO_CX_TOP ? TIPO_CX_COLORES[n++] : TIPO_CX_GRIS;
  });
  return arr;
}

/* Torta de tipos de cirugía, con el mismo trazo que la de incidencias del
   Panel: un anillo de segmentos y el total en el centro. */
function donutTipos(arr, total) {
  const R = 74, CX = 110, CY = 105, SW = 34;
  const circ = 2 * Math.PI * R;
  let segs = '', off = 0;
  const conDatos = arr.filter((t) => t.realizadas > 0);
  // Las prácticas que no entran en la torta con color propio se suman en una
  // única porción gris: sin esto, un período largo dibuja cien hilos ilegibles.
  const conColor = conDatos.filter((t) => t.color !== TIPO_CX_GRIS);
  const resto = conDatos.filter((t) => t.color === TIPO_CX_GRIS);
  const restoN = resto.reduce((n, t) => n + t.realizadas, 0);
  const porciones = conColor.map((t) => ({ nombre: t.nombre, n: t.realizadas, color: t.color }));
  if (restoN) porciones.push({ nombre: `Otras ${resto.length} práctica(s)`, n: restoN, color: TIPO_CX_GRIS });

  if (!total || !porciones.length) {
    segs = `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#e5e7eb" stroke-width="${SW}"/>`;
  } else {
    porciones.forEach((p) => {
      const frac = p.n / total;
      segs += `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${p.color}"
        stroke-width="${SW}" stroke-dasharray="${frac * circ} ${circ}" stroke-dashoffset="${-off * circ}"
        transform="rotate(-90 ${CX} ${CY})"><title>${esc(p.nombre)} — ${p.n} (${(frac * 100).toFixed(1)} %)</title></circle>`;
      off += frac;
    });
  }
  return `<div style="display:flex;justify-content:center"><svg viewBox="0 0 220 210" style="width:220px">
      ${segs}
      <text x="${CX}" y="${CY - 2}" text-anchor="middle" font-size="30" font-weight="800" fill="#171c24">${total}</text>
      <text x="${CX}" y="${CY + 20}" text-anchor="middle" font-size="11" fill="#8b929c">cirugías</text>
    </svg></div>
    <div class="legend" style="justify-content:center">
      ${porciones.length
        ? porciones.map((p) => `<span><span class="dot" style="background:${p.color};border-radius:50%"></span>${esc(p.nombre)} (${p.n} · ${((p.n / total) * 100).toFixed(1)} %)</span>`).join('')
        : '<span style="color:var(--muted)">Sin cirugías realizadas en el período</span>'}
    </div>`;
}

/* Detalle de un tipo: qué servicios y qué cirujanos lo componen. */
function tipoDetalle(t) {
  const barras = (lista, color) => {
    const max = lista.length ? lista[0][1] : 1;
    return lista.map(([n, v]) => `
      <div class="barra-fila">
        <div class="barra-top"><span>${esc(n)}</span><b>${v}</b></div>
        <div class="bar-track" style="margin-top:0"><div class="bar-fill" style="width:${(v / max) * 100}%;background:${color}"></div></div>
      </div>`).join('');
  };
  return `<div class="charts" style="margin-top:4px">
    <div class="chart-card">
      <div class="card-title" style="margin-bottom:6px">${esc(t.nombre)} — por servicio</div>
      <div class="card-sub">${esc(t.contexto)}${t.modulo ? ` · ${MODULOS[t.modulo].label}` : ''} — ${t.realizadas} cirugía(s) realizada(s) · ${t.horas.toFixed(1)} h de quirófano</div>
      ${t.listaServicios.length ? barras(t.listaServicios, 'var(--blue)') : '<div class="empty" style="padding:16px 0">Sin datos.</div>'}
    </div>
    <div class="chart-card">
      <div class="card-title" style="margin-bottom:6px">${esc(t.nombre)} — por cirujano</div>
      <div class="card-sub">${t.nCirujanos} profesional(es) con actividad en esta práctica</div>
      ${t.listaCirujanos.length ? barras(t.listaCirujanos, '#1fa971') : '<div class="empty" style="padding:16px 0">Sin datos.</div>'}
    </div>
  </div>`;
}

/* La letra del módulo con el mismo distintivo que usa la solapa de Módulos
   Quirúrgicos. Si un mismo texto llegara con dos letras distintas —solo pasa
   con prácticas declaradas a mano— se muestran todas. */
function modTagsTipo(t) {
  const ls = MOD_LETRAS.filter((m) => t.modulos[m]);
  if (!ls.length) return '<small style="color:var(--muted)">sin módulo</small>';
  return `<span style="display:inline-flex;gap:4px;justify-content:flex-end">${ls.map((m) =>
    `<span class="mod-tag mod-${m}" style="width:22px;height:22px;font-size:0.78rem" title="${MODULOS[m].label} — ${MODULOS[m].desc}">${m}</span>`).join('')}</span>`;
}

  // cirujano los lee sobre su servicio, la Jefatura y la Dirección sobre todo
  // el bloque. El universo completo se conserva únicamente como denominador
  // del "% del bloque", que es un dato institucional y no de otro equipo.
  const todoElBloque = estTodoElBloque();
  const servPropio = estServicioPropio();
  const porServTodos = calcEstadisticas('servicio');
  const porServ = todoElBloque ? porServTodos : porServTodos.filter(estDeSuServicio);
  const sumar = (arr) => arr.reduce((s, g) => ({
    realizadas: s.realizadas + g.realizadas, suspendidas: s.suspendidas + g.suspendidas,
    programadas: s.programadas + g.programadas, minutos: s.minutos + g.minutos,
    urgencias: s.urgencias + g.urgencias,
  }), { realizadas: 0, suspendidas: 0, programadas: 0, minutos: 0, urgencias: 0 });
  const tot = sumar(porServ);
  const totBloque = sumar(porServTodos);
  const shareBloque = totBloque.minutos ? (tot.minutos / totBloque.minutos) * 100 : 0;
  const nCirujanos = calcEstadisticas('cirujano')
    .filter((g) => g.realizadas > 0 && (todoElBloque || estDeSuServicio(g))).length;
  const nServicios = porServ.filter((g) => g.realizadas > 0).length;

  const th = (c) => `<th class="num orden ${estOrden === c.k ? 'on' : ''}" onclick="estSort('${c.k}')">${c.t}${estOrden === c.k ? ' ' + (estAsc ? ICONS.arrowUp : ICONS.arrowDown) : ''}</th>`;

/* ================= RECLAMOS (canal Jefe a Jefe) ================= */
const JEFATURA = 'Jefatura de Quirófanos';

/* El reclamo dejó de ser un mensaje con una única respuesta: ahora es un hilo.
   Los registros anteriores (asunto + texto + respuesta) se leen como un hilo de
   uno o dos mensajes, sin necesidad de migrar nada en la base. */
function hiloReclamo(r) {
  if (Array.isArray(r.mensajes) && r.mensajes.length) return r.mensajes;
  const h = [{ rol: 'autor', nombre: r.autor, email: r.autorMail || '', de: r.de, texto: r.texto, t: r.fechaHora }];
  if (r.respuesta) h.push({ rol: 'jefatura', nombre: JEFATURA, email: '', de: JEFATURA, texto: r.respuesta, t: r.fechaRespuesta || r.fechaHora });
  return h;
}
/* Papel de quien está mirando dentro de este reclamo. Si el jefe es además el
   autor, manda su condición de autor: es quien espera la respuesta. */
function rolEnReclamo(r) {
  const u = usuarioActual();
  if (u && r.autorMail && r.autorMail === u.email) return 'autor';
  if (jefe) return 'jefatura';
  return null;
}
function claveLector(r) {
  const rol = rolEnReclamo(r);
  if (rol === 'autor') return claveMail(usuarioActual().email);
  return rol === 'jefatura' ? '__jefatura' : '';
}
/* A quién le toca actuar: tras un mensaje del autor responde la Jefatura; tras
   una respuesta de la Jefatura, el autor debe leerla y cerrar o replicar. */
function turnoDeReclamo(r) {
  if (r.estado === 'cerrado') return null;
  const ult = hiloReclamo(r).slice(-1)[0];
  if (!ult) return null;
  return ult.rol === 'autor' ? 'jefatura' : 'autor';
}
function venceReclamo(r) {
  const delAutor = hiloReclamo(r).filter((m) => m.rol === 'autor').slice(-1)[0];
  return addHorasHabiles((delAutor && delAutor.t) || r.fechaHora, 48);
}
/* Cuántos mensajes leyó ya quien mira. Se guarda la cantidad de mensajes vistos
   y no la hora del último: `nowDT()` tiene precisión de minuto, y dos mensajes
   del mismo minuto harían que una respuesta se diera por leída sin serlo. */
function leidosPor(r) {
  const clave = claveLector(r);
  return clave ? (Number((r.leido || {})[clave]) || 0) : 0;
}
function reclamoNoLeidos(r) {
  const rol = rolEnReclamo(r);
  if (!rol) return 0;
  return hiloReclamo(r).slice(leidosPor(r)).filter((m) => m.rol !== rol).length;
}
/* ---- Quién ve un reclamo ----
   Un reclamo es un asunto entre dos partes: lo ven su autor y la Jefatura de
   Quirófanos, y nadie más. Otro profesional con sesión abierta no entra al hilo
   ni se entera de que el reclamo existe. Los registros antiguos sin `autorMail`
   no se pueden atribuir a nadie, así que quedan solo para la Jefatura. */
function puedeVerReclamo(r) { return !!rolEnReclamo(r); }
function reclamosVisibles() { return DB.reclamos.filter(puedeVerReclamo); }

/* Avisos de reclamos que le corresponden a quien está mirando: los que debe
   contestar y los que tienen respuestas sin leer. */
function reclamosPendientes() {
  return DB.reclamos.filter((r) => {
    const mio = rolEnReclamo(r);
    if (!mio || r.estado === 'cerrado') return false;
    return turnoDeReclamo(r) === mio || reclamoNoLeidos(r) > 0;
  }).length;
}
/* Las dos entradas al hilo revalidan el permiso: un enlace viejo de la campana
   o una llamada suelta no pueden abrir el reclamo de otro profesional. */
function reclamoPermitido(id) {
  const r = DB.reclamos.find((x) => String(x.id) === String(id));
  return r && puedeVerReclamo(r) ? r : null;
}
function verReclamo(id) {
  if (!reclamoPermitido(id)) { reclamoAbierto = null; renderReclamos(); return; }
  reclamoAbierto = (String(reclamoAbierto) === String(id)) ? null : id;
  if (reclamoAbierto !== null) marcarReclamoLeido(id);
  renderReclamos();
}
function abrirReclamo(id) {
  if (!reclamoPermitido(id)) { reclamoAbierto = null; renderReclamos(); return; }
  reclamoAbierto = id;
  marcarReclamoLeido(id);
  renderReclamos();
  const el = document.getElementById('msg-' + id);
  if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
function marcarReclamoLeido(id) {
  const r = DB.reclamos.find((x) => String(x.id) === String(id));
  if (!r || !puedeVerReclamo(r)) return;
  const clave = claveLector(r);
  if (!clave) return;
  const total = hiloReclamo(r).length;
  // Idempotente: sin esto, cada re-render volvería a escribir en la nube.
  if (leidosPor(r) >= total) return;
  r.leido = Object.assign({}, r.leido, { [clave]: total });
  upsert('reclamos', r);
}

function renderReclamos() {
  const u = usuarioActual();
  // Punto único de filtrado: todo lo que se muestra abajo sale de acá.
  const propios = reclamosVisibles();
  const aResponder = propios.filter((r) => turnoDeReclamo(r) === rolEnReclamo(r));
  const sinLeer = propios.filter((r) => r.estado !== 'cerrado' && reclamoNoLeidos(r) > 0);
  const cerrados = propios.filter((r) => r.estado === 'cerrado');
  const permiso = ('Notification' in window) ? Notification.permission : 'unsupported';
  const lista = propios.slice().sort((a, b) => {
    // Primero lo que exige acción de quien mira, después por antigüedad.
    // Los cerrados —que van plegados— cierran siempre la lista.
    const pa = (a.estado === 'cerrado' ? 10 : 0) + (rolEnReclamo(a) && turnoDeReclamo(a) === rolEnReclamo(a) ? 0 : 2) - (reclamoNoLeidos(a) ? 1 : 0);
    const pb = (b.estado === 'cerrado' ? 10 : 0) + (rolEnReclamo(b) && turnoDeReclamo(b) === rolEnReclamo(b) ? 0 : 2) - (reclamoNoLeidos(b) ? 1 : 0);
    return pa - pb || String(ultimaActividad(b)).localeCompare(String(ultimaActividad(a)));
  });
  $('main').innerHTML = `
    <div class="page-head">
      <div class="head-row">
        <div class="head-icon">${ICONS.mail.replace('16', '20')}</div>
        <div>
          <h1 class="page-title">Canal de Reclamos</h1>
          <p class="page-sub">Comunicación formal Jefe a Jefe — plazo de respuesta: 48 horas hábiles</p>
        </div>
      </div>
    </div>

    ${aResponder.length ? `<div class="banner banner-amber">${ICONS.reply.replace('15', '18')}
      <div><strong>${aResponder.length} reclamo(s) esperan su respuesta</strong>
      ${aResponder.map((r) => `<div style="margin-top:6px">· <a href="#reclamos" onclick="event.preventDefault();abrirReclamo(${r.id})" style="color:inherit;font-weight:700">${esc(r.asunto)}</a> — ${esc(r.de)}, ${fmtDT(ultimaActividad(r))}</div>`).join('')}</div></div>` : ''}

    ${sinLeer.length ? `<div class="banner banner-green">${ICONS.mailOpen.replace('16', '18')}
      <div><strong>${sinLeer.length} reclamo(s) con mensajes sin leer</strong>
      ${sinLeer.map((r) => `<div style="margin-top:6px">· <a href="#reclamos" onclick="event.preventDefault();abrirReclamo(${r.id})" style="color:inherit;font-weight:700">${esc(r.asunto)}</a> — ${reclamoNoLeidos(r)} mensaje(s) nuevo(s)</div>`).join('')}</div></div>` : ''}

    ${permiso === 'granted' ? '' : `<div class="banner banner-blue">${ICONS.bell.replace('16', '18')}
      <div><strong>Active las notificaciones del dispositivo</strong>
      Recibirá un aviso cuando le toque responder un reclamo o cuando le respondan uno propio, sin depender de que revise la app.
      <div style="margin-top:10px"><button class="btn btn-blue btn-sm" onclick="pedirPermisoNotif()">${ICONS.bell} Activar notificaciones</button></div></div></div>`}

    <div class="banner banner-blue">${ICONS.lock}
      <div><strong>${jefe && !u ? 'Vista de Jefatura' : 'Su reclamo es confidencial'}</strong>
      ${jefe && !u
        ? 'Como Jefatura de Quirófanos usted ve todos los reclamos del hospital. Cada profesional, en cambio, solo ve los suyos.'
        : 'Cada reclamo lo ven únicamente <b>usted</b>, como autor, y la <b>Jefatura de Quirófanos</b>. Ningún otro profesional puede leerlo ni sabe que existe.'}</div></div>

    <div class="banner banner-blue">${ICONS.info}
      <div><strong>Principio de Cultura Justa</strong>
      El canal de reclamos es para desacuerdos formales entre jefaturas de servicio. No reemplaza el reporte de incidencias: los eventos adversos, cuasi-accidentes y fallas de proceso se cargan en <b>Nueva Incidencia</b>.</div></div>

    ${u ? `<div class="card">
      <div class="card-title">Nuevo reclamo</div>
      <div class="card-sub">Se registra a nombre de ${esc(u.nombre)} (${esc(u.servicio)}) y se dirige a la Jefatura de Quirófanos</div>
      <div class="form-grid">
        <div class="field full"><label>Asunto *</label><input type="text" id="r-asunto" placeholder="Motivo del reclamo"></div>
        <div class="field full"><label>Detalle *</label><textarea id="r-texto" placeholder="Describa la situación, los antecedentes y la solución solicitada..."></textarea></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-blue" onclick="enviarReclamo()">${ICONS.send} Enviar reclamo</button>
        <p class="form-note">La Jefatura debe responder dentro de las <b>48 horas hábiles</b>. Mientras el reclamo siga abierto, ambas partes reciben recordatorios en la campana y en el dispositivo.</p>
      </div>
    </div>` : ''}

    <div class="result-count">${lista.length} reclamo(s) ${jefe && !u ? 'registrado(s) en el hospital' : 'suyo(s)'}${aResponder.length ? ` · ${aResponder.length} a su cargo` : ''}${cerrados.length ? ` · ${cerrados.length} cerrado(s) en un renglón, toque para desplegar` : ''}</div>
    ${lista.length ? `<div class="fila-lista">${lista.map((r) => (r.estado === 'cerrado' ? reclamoRenglon(r) : reclamoCard(r))).join('')}</div>`
      : `<div class="empty">${jefe && !u ? 'No hay reclamos registrados.' : 'Usted no tiene reclamos registrados. Los reclamos de otros profesionales no se muestran acá.'}</div>`}`;
}

function ultimaActividad(r) {
  const h = hiloReclamo(r);
  return (h.length ? h[h.length - 1].t : r.fechaHora) || r.fechaHora;
}

function mensajeHTML(m, nuevo) {
  const quien = m.nombre || (m.rol === 'jefatura' ? JEFATURA : 'Autor');
  return `<div class="msg ${m.rol === 'jefatura' ? 'jefatura' : ''} ${nuevo ? 'nuevo' : ''}">
    <div class="msg-head">
      <span class="quien">${m.rol === 'jefatura' ? ICONS.shield.replace('18', '13') : ICONS.user.replace('14', '13')} ${esc(quien)}</span>
      <span>${m.de && m.de !== quien ? esc(m.de) : ''}</span>
      <span style="margin-left:auto">${fmtDT(m.t)}</span>
      ${nuevo ? '<span class="sin-leer">Nuevo</span>' : ''}
    </div>
    <div class="msg-txt">${esc(m.texto)}</div>
  </div>`;
}

/* Un reclamo cerrado ya no exige nada: queda como renglón y se despliega
   entero —ficha, hilo y botón de reabrir— con un solo clic. */
function plegReclamo(id) {
  if (!reclamoPermitido(id)) { PLEGADOS.rec.delete(String(id)); renderReclamos(); return; }
  if (plegAbierto('rec', id)) {
    PLEGADOS.rec.delete(String(id));
    if (String(reclamoAbierto) === String(id)) reclamoAbierto = null;
  } else {
    plegAbrir('rec', id);
    reclamoAbierto = id;          // desplegar el renglón abre también la conversación
    marcarReclamoLeido(id);
  }
  renderReclamos();
}
function reclamoRenglon(r) {
  // Si algo externo —la campana, un recordatorio, un enlace del banner— pidió
  // abrir este reclamo, el renglón nace desplegado.
  if (String(reclamoAbierto) === String(r.id)) plegAbrir('rec', r.id);
  const nuevos = reclamoNoLeidos(r);
  const hilo = hiloReclamo(r);
  const cerrado = r.fechaCierre || ultimaActividad(r);
  const marcas = [r.autor, r.de, `${hilo.length} mensaje(s)`, `cerrado el ${fmtDT(cerrado)}`];
  if (r.cerradoPor) marcas.push(`por ${r.cerradoPor}`);
  return bloquePleg({
    grupo: 'rec', id: r.id, pendiente: nuevos > 0,
    accion: `plegReclamo(${JSON.stringify(r.id)})`,
    titulo: esc(r.asunto),
    sub: marcas.map((x) => esc(x)).join(' · '),
    badge: `${nuevos ? `<span class="badge-pend">${nuevos} sin leer</span>` : ''}<span class="chip">Cerrado</span>`,
  }, () => reclamoCard(r));
}
function reclamoCard(r) {
  const rol = rolEnReclamo(r);
  const turno = turnoDeReclamo(r);
  const nuevos = reclamoNoLeidos(r);
  const hilo = hiloReclamo(r);
  const leidos = leidosPor(r);
  const vence = venceReclamo(r);
  const vencido = turno === 'jefatura' && new Date() > vence;
  const abierto = String(reclamoAbierto) === String(r.id);
  const estadoChip = r.estado === 'cerrado'
    ? 'background:#eef1f4;color:#4b5563;border-color:var(--line)'
    : turno === 'jefatura' ? 'background:var(--amber-soft);color:#92600a;border-color:#f3ddb0'
      : 'background:var(--green-soft);color:#166b4a;border-color:#b9e8d2';
  const estadoTxt = r.estado === 'cerrado' ? 'Cerrado' : turno === 'jefatura' ? 'Esperando respuesta' : 'Respondido';

  return `<div class="inc-card" style="cursor:default">
    <div class="inc-top">
      <span class="chip" style="${estadoChip}">${estadoTxt}</span>
      <span class="chip">${ICONS.calendar} ${fmtDT(r.fechaHora)}</span>
      ${turno ? `<span class="turno-de">${ICONS.reply.replace('15', '12')} Debe responder: ${turno === 'jefatura' ? JEFATURA : esc(r.autor)}${turno === rol ? ' (usted)' : ''}</span>` : ''}
      ${nuevos ? `<span class="sin-leer">${ICONS.msg.replace('16', '12')} ${nuevos} sin leer</span>` : ''}
      ${turno === 'jefatura' ? `<span class="chip" style="${vencido ? 'background:var(--red-soft);color:var(--red);border-color:#f3c8c8' : ''}">${ICONS.clockSm} ${vencido ? 'Plazo vencido' : 'Vence ' + fmtDT(dateToDT(vence))}</span>` : ''}
    </div>
    <div style="font-weight:700;font-size:0.98rem;margin-bottom:6px">${esc(r.asunto)}</div>
    ${abierto ? '' : `<div class="inc-desc" style="-webkit-line-clamp:3">${esc(hilo[hilo.length - 1].texto)}</div>`}
    <div class="inc-meta"><span>${ICONS.user} ${esc(r.autor)} · ${esc(r.de)}</span><span>${ICONS.mail.replace('16', '14')} ${esc(r.para)}</span><span>${ICONS.msg.replace('16', '14')} ${hilo.length} mensaje(s)</span></div>

    <div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:8px">
      <button class="btn btn-sm btn-outline" onclick="verReclamo(${r.id})">${ICONS.msg} ${abierto ? 'Ocultar conversación' : `Ver conversación (${hilo.length})`}</button>
      ${rol && r.estado !== 'cerrado' ? `<button class="btn btn-sm btn-outline" onclick="cerrarReclamo(${r.id})">${ICONS.archive} Dar por cerrado</button>` : ''}
      ${rol && r.estado === 'cerrado' ? `<button class="btn btn-sm btn-outline" onclick="reabrirReclamo(${r.id})">${ICONS.refresh} Reabrir</button>` : ''}
      ${rol === 'jefatura' && r.autorMail ? `<a class="btn btn-sm btn-outline" href="${avisoMailto(r)}">${ICONS.mail.replace('16', '15')} Avisar por correo</a>` : ''}
    </div>

    ${abierto ? `<div style="margin-top:16px">
      ${hilo.map((m, i) => mensajeHTML(m, !!rol && m.rol !== rol && i >= leidos)).join('')}
      ${rol && r.estado !== 'cerrado' ? `<div class="field" style="margin-top:12px">
        <label>${rol === 'jefatura' ? 'Respuesta de la Jefatura' : 'Su réplica'}</label>
        <textarea id="msg-${r.id}" style="min-height:84px" placeholder="${rol === 'jefatura' ? 'Respuesta formal...' : 'Agregue información o responda a la Jefatura...'}"></textarea>
      </div>
      <button class="btn btn-sm btn-blue" style="margin-top:10px" onclick="enviarMensajeReclamo(${r.id})">${ICONS.send} Enviar ${rol === 'jefatura' ? 'respuesta' : 'mensaje'}</button>` : ''}
      ${!rol ? `<p class="form-note" style="margin-top:10px">Solo el autor del reclamo y la Jefatura de Quirófanos pueden escribir en este hilo.</p>` : ''}
    </div>` : ''}
  </div>`;
}

/* Aviso por correo: abre un borrador en el cliente de correo del dispositivo.
   El envío lo hace la persona, la app no manda nada por su cuenta. */
function avisoMailto(r) {
  const asunto = `HRU Quirófanos — respuesta a su reclamo: ${r.asunto}`;
  const cuerpo = `Estimado/a ${r.autor}:\n\nLa Jefatura de Quirófanos registró una respuesta a su reclamo "${r.asunto}".\nPuede leerla en la app, en la sección Reclamos.\n\n${location.origin}${location.pathname}#reclamos\n`;
  return `mailto:${encodeURIComponent(r.autorMail)}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
}

function enviarReclamo() {
  const u = usuarioActual();
  const asunto = $('r-asunto').value.trim();
  const texto = $('r-texto').value.trim();
  if (!u || !asunto || !texto) { alert('Complete el asunto y el detalle del reclamo.'); return; }
  const t = nowDT();
  const id = Date.now();
  upsert('reclamos', {
    id, de: u.servicio, para: JEFATURA, asunto, texto,
    autor: u.nombre, autorMail: u.email, fechaHora: t,
    estado: 'abierto', respuesta: '', fechaRespuesta: '',
    mensajes: [{ rol: 'autor', nombre: u.nombre, email: u.email, de: u.servicio, texto, t }],
    leido: { [claveMail(u.email)]: 1 },
  });
  reclamoAbierto = id;
  renderReclamos();
}

function enviarMensajeReclamo(id) {
  const r = DB.reclamos.find((x) => String(x.id) === String(id));
  if (!r) return;
  const rol = rolEnReclamo(r);
  if (!rol) { alert('Solo el autor del reclamo y la Jefatura pueden escribir en este hilo.'); return; }
  const ta = $('msg-' + id);
  const texto = ta ? ta.value.trim() : '';
  if (!texto) { alert('Escriba el mensaje.'); return; }
  const u = usuarioActual();
  const t = nowDT();
  const hilo = hiloReclamo(r).slice();
  hilo.push({
    rol, texto, t,
    nombre: rol === 'jefatura' ? JEFATURA : (u ? u.nombre : r.autor),
    email: rol === 'jefatura' ? '' : (u ? u.email : r.autorMail || ''),
    de: rol === 'jefatura' ? JEFATURA : (u ? u.servicio : r.de),
  });
  r.mensajes = hilo;
  r.estado = rol === 'jefatura' ? 'respondido' : 'abierto';
  // Espejo de la primera respuesta en los campos de la versión anterior.
  if (rol === 'jefatura' && !r.respuesta) { r.respuesta = texto; r.fechaRespuesta = t; }
  // Quien escribe leyó todo el hilo, incluido su propio mensaje.
  r.leido = Object.assign({}, r.leido, { [claveLector(r)]: hilo.length });
  if (ta) ta.value = '';
  upsert('reclamos', r);
  reclamoAbierto = r.id;
  renderReclamos();
}

async function cerrarReclamo(id) {
  const r = DB.reclamos.find((x) => String(x.id) === String(id));
  if (!r || !rolEnReclamo(r)) return;
  if (!await preguntar('Dejarán de emitirse recordatorios por este reclamo. Se puede reabrir en cualquier momento.',
    { titulo: '¿Dar por cerrado el reclamo?', tono: 'pregunta', si: 'Sí, cerrarlo' })) return;
  r.estado = 'cerrado';
  r.cerradoPor = rolEnReclamo(r) === 'jefatura' ? JEFATURA : (usuarioActual()?.nombre || r.autor);
  r.fechaCierre = nowDT();
  upsert('reclamos', r);
  // Cerrado ya no exige nada: se pliega en su renglón al pie de la lista.
  PLEGADOS.rec.delete(String(r.id));
  if (String(reclamoAbierto) === String(r.id)) reclamoAbierto = null;
  renderReclamos();
}
function reabrirReclamo(id) {
  const r = DB.reclamos.find((x) => String(x.id) === String(id));
  if (!r || !rolEnReclamo(r)) return;
  PLEGADOS.rec.delete(String(r.id));  // vuelve a ser una ficha entera
  r.estado = hiloReclamo(r).slice(-1)[0]?.rol === 'autor' ? 'abierto' : 'respondido';
  r.cerradoPor = ''; r.fechaCierre = '';
  upsert('reclamos', r);
  renderReclamos();
}

async function doLogin() {
  const mail = $('l-mail').value.trim().toLowerCase();
  const pass = $('l-pass').value;
  const u = DB.usuarios.find((x) => x.email.toLowerCase() === mail);
  const h = await hashPass(pass);
  if (!u || u.passHash !== h) {
    $('login-error').textContent = 'Correo o contraseña incorrectos.';
    $('login-error').style.display = 'block';
    return;
  }
  if (estadoCuenta(u) === 'baja') {
    $('login-error').textContent = 'Su cuenta fue dada de baja por la Jefatura de Quirófanos'
      + motivoCuenta(u) + ' Comuníquese con la Jefatura de Quirófanos.';
    $('login-error').style.display = 'block';
    return;
  }
  sessionStorage.setItem('hru_user', u.email);
  if (!cuentaAprobada(u)) {
    alert('Su cuenta está PENDIENTE DE AUTORIZACIÓN por la Jefatura de Quirófanos.\n\nPuede consultar la grilla y completar su documentación, pero no programar cirugías hasta que la Jefatura la autorice.');
  }
  go('mis');
  // Recién ahora hay identidad de lectura: pueden esperarlo comunicados sin confirmar.
  setTimeout(revisarComunicados, 400);
}

async function doAlta() {
  const err = $('alta-error');
  const nombre = $('a-nombre').value.trim(), dni = $('a-dni').value.trim();
  // Canónico: escrito a mano, «Cirugia General» y «Cirugía General» quedaban
  // como dos servicios distintos y el cirujano no veía sus propios módulos.
  const mail = $('a-mail').value.trim().toLowerCase(), serv = servicioCanonico($('a-serv').value);
  const p1 = $('a-pass').value, p2 = $('a-pass2').value;
  const fail = (m) => { err.textContent = m; err.style.display = 'block'; };
  if (!nombre || !dni || !mail || !serv || !p1) return fail('Complete todos los campos.');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) return fail('Ingrese un correo institucional válido.');
  if (p1.length < 6) return fail('La contraseña debe tener al menos 6 caracteres.');
  if (p1 !== p2) return fail('Las contraseñas no coinciden.');
  if (DB.usuarios.some((u) => u.email.toLowerCase() === mail)) return fail('Ya existe una cuenta con ese correo.');
  const u = {
    id: mail.replace(/[.#$/\[\]]/g, ','),
    email: mail, nombre, dni, servicio: serv,
    matricula: { numero: '', vigente: false },
    especialista: { titulo: '', si: false },
    seguro: { vence: '' },
    rcp: { tipo: '', fecha: '' },
    vacunas: { hepB: false, dobleAdultos: false, influenza: false, covid: false },
    // Toda alta queda a la espera del visto de la Jefatura de Quirófanos.
    cuenta: 'pendiente', cuentaMotivo: '', cuentaFecha: nowDT(),
    passHash: await hashPass(p1), creado: hoyISO(),
  };
  upsert('usuarios', u);
  sessionStorage.setItem('hru_user', u.email);
  alert('Cuenta creada correctamente.\n\nSu acceso queda PENDIENTE DE AUTORIZACIÓN por la Jefatura de Quirófanos: hasta que la Jefatura lo habilite no podrá programar cirugías.\n\nMientras tanto, complete su documentación de habilitación en Mi Perfil.');
  go('perfil');
}

/* ---- Acciones de la Jefatura sobre una cuenta ----
   Todas piden la clave 0112 aunque la sesión de Jefatura ya esté abierta: dar de
   baja a un cirujano lo deja fuera del sistema y no puede salir de un clic
   distraído en una terminal compartida del quirófano. */
function usuarioPorId(id) { return DB.usuarios.find((u) => String(u.id) === String(id)) || null; }

/* Coletilla honesta para las acciones que cambian quién puede trabajar: si el
   dispositivo no llegó a la base, el resto del hospital todavía no se enteró. */
function avisoEnvio(enviado, que) {
  if (enviado) return '';
  return `\n\n⚠ ATENCIÓN: este dispositivo no está llegando a la base compartida.` +
    `\n${que} quedó guardada acá y se enviará sola al recuperar la conexión, pero HASTA ENTONCES el resto de los equipos NO la ve.` +
    `\n\nDeje la app abierta con señal hasta que el indicador de arriba diga «Sincronizado».`;
}

function autorizarCuenta(id) {
  const u = usuarioPorId(id);
  if (!u) return;
  const alta = estadoCuenta(u) === 'baja';
  pedirClave('Jefatura de Quirófanos', `${alta ? 'Reactivar' : 'Autorizar'} la cuenta de ${u.nombre}. Ingrese la clave de Jefatura.`, JEFE_CLAVE, async () => {
    u.cuenta = 'aprobado';
    u.cuentaMotivo = '';
    u.cuentaFecha = nowDT();
    // Se espera la confirmación de la nube: un alta que quedó guardada solo en
    // este dispositivo no habilita a nadie, y decir lo contrario es peor que
    // no decir nada.
    const enviado = await upsert('usuarios', u);
    renderUsuarios();
    alert(`${u.nombre} quedó ${alta ? 'reactivado' : 'autorizado'} por la Jefatura de Quirófanos.` +
      (habilitacion(u).ok ? '' : '\n\nAtención: su habilitación documental sigue incompleta, así que todavía no podrá programar hasta que cargue los requisitos faltantes en Mi Perfil.') +
      avisoEnvio(enviado, 'La autorización'));
  });
}

function darDeBajaCuenta(id) {
  const u = usuarioPorId(id);
  if (!u) return;
  pedirClave('Jefatura de Quirófanos', `Dar de baja la cuenta de ${u.nombre}. Ingrese la clave de Jefatura.`, JEFE_CLAVE, async () => {
    const motivo = await pedirTexto(`Queda registrado y se le muestra a ${u.nombre} cuando intente ingresar.`, {
      titulo: `Baja de ${u.nombre}`, tono: 'peligro', si: 'Dar de baja', no: 'Cancelar',
      campo: { label: 'Motivo de la baja', multilinea: true, requerido: true,
        placeholder: 'Ej: cese de funciones, licencia prolongada, sanción vigente…',
        error: 'La baja exige un motivo escrito.' },
    });
    if (motivo === null) return;
    u.cuenta = 'baja';

    alert(`${u.nombre} fue dado de baja. No podrá ingresar ni programar cirugías.\n\nLos turnos que ya haya programado se conservan: revíselos en Programación.` +

/* Eliminar borra el registro de la base. Se ofrece sobre todo para limpiar los
   datos de prueba; los turnos ya cargados por esa persona no se tocan. */
function eliminarProfesional(id) {

/* ================= DATOS DE PRUEBA (Jefatura) =================
   Alta y baja de un juego de profesionales y cirugías marcados con `prueba: true`
   para recorrer el circuito completo en la base real. Se guardan en Firebase
   como cualquier otro registro —esa es la idea: probar contra la base
   compartida— y la Jefatura los borra de un clic cuando termina de mirarlos. */
const CLAVE_PRUEBA = 'prueba123';

function hayDatosPrueba() {
  return DB.usuarios.some((u) => u.prueba) || DB.cirugias.some((c) => c.prueba);
}

function cardDatosPrueba() {

          <div><strong>Hay datos de prueba cargados</strong>

      : `<p class="form-note" style="margin:0 0 12px">Carga cuatro profesionales (uno autorizado, uno pendiente, uno sin documentación completa y uno dado de baja) y cinco cirugías que cubren los cuatro estados de autorización: pendiente, autorizada, no autorizada con motivo y urgencia exenta. Abre además la agenda de los días que usan esos turnos.</p>`}
    <div class="cir-actions" style="margin:0">

    </div>
    <p class="form-note" style="margin-top:10px">Los profesionales de prueba ingresan con su correo y la contraseña <b>${CLAVE_PRUEBA}</b>.</p>
  </div>

/* ================= PUESTA EN CERO DE LA BASE =================
   Antes de empezar con pacientes reales hay que vaciar lo que se cargó
   probando. Borra el movimiento operativo —cirugías, incidencias, reclamos,
   consentimientos y comunicados— y **no toca** las cuentas de los
   profesionales, la agenda de días habilitados ni el listado de obras
   sociales, que es trabajo que conviene conservar.

   Es irreversible y alcanza a todas las computadoras: por eso pide la clave de
   Jefatura y además que se escriba la palabra completa. */
const COLS_PUESTA_EN_CERO = ['cirugias', 'incidencias', 'reclamos', 'consentimientos', 'comunicados'];
function conteoPuestaEnCero() {
  return COLS_PUESTA_EN_CERO.reduce((o, col) => { o[col] = (DB[col] || []).length; o.total += o[col]; return o; }, { total: 0 });
}
function cardPuestaEnCero() {
  const n = conteoPuestaEnCero();
  return `<div class="card" style="margin-top:18px;border:1px solid #f0c6c6">
    <div class="card-title" style="color:var(--red)">Puesta en cero de la base</div>
    <div class="card-sub">Vaciar el movimiento operativo antes de arrancar con pacientes reales</div>
    <div class="banner banner-red" style="margin:0 0 12px">${ico(ICONS.alertTri, 18)}
      <div><strong>Se borra en todas las computadoras y no se puede deshacer</strong>
      Hoy hay ${n.cirugias} cirugía(s), ${n.incidencias} incidencia(s), ${n.reclamos} reclamo(s),
      ${n.consentimientos} consentimiento(s) y ${n.comunicados} comunicado(s).
      <b>No se tocan</b> las cuentas de los profesionales, la agenda de días habilitados ni el listado de obras sociales.</div></div>
    <div class="cir-actions" style="margin:0">
      <button class="btn btn-red" ${n.total ? '' : 'disabled'} onclick="puestaEnCero()">${ico(ICONS.trash, 16)} Vaciar la base y empezar de cero</button>
    </div>
    <p class="form-note" style="margin-top:10px">Conviene hacerlo <b>antes</b> de dar de alta a los médicos y de cerrar las reglas de la base de datos.</p>
  </div>`;
}
async function puestaEnCero() {
  if (!jefe) return;
  const n = conteoPuestaEnCero();
  if (!n.total) { alert('La base ya está vacía: no hay cirugías, incidencias, reclamos, consentimientos ni comunicados.'); return; }
  pedirClave('Jefatura de Quirófanos',
    `Se van a borrar ${n.total} registro(s) de la base compartida. Ingrese la clave de Jefatura.`,
    JEFE_CLAVE, async () => {
      const palabra = await pedirTexto(
        `Se borran ${n.cirugias} cirugía(s), ${n.incidencias} incidencia(s), ${n.reclamos} reclamo(s), ${n.consentimientos} consentimiento(s) y ${n.comunicados} comunicado(s) de todas las computadoras.\n\n`
        + 'Las cuentas de los profesionales, la agenda y las obras sociales se conservan.\n\n'
        + 'Para confirmar, escriba la palabra VACIAR.', {
          titulo: '¿Vaciar la base del bloque quirúrgico?', tono: 'peligro', si: 'Vaciar la base', no: 'Cancelar',
          campo: { label: 'Escriba VACIAR', placeholder: 'VACIAR', requerido: true, error: 'Escriba VACIAR para confirmar.' },
        });
      if (palabra === null) return;
      if (String(palabra).trim().toUpperCase() !== 'VACIAR') { alert('No se borró nada: la palabra de confirmación no coincide.'); return; }
      let borrados = 0;
      COLS_PUESTA_EN_CERO.forEach((col) => {
        (DB[col] || []).slice().forEach((x) => { removeDoc(col, x.id); borrados++; });
      });
      // Los recordatorios leídos y los estados de pantalla apuntan a registros
      // que ya no existen: se descartan para que no queden avisos fantasma.
      try { localStorage.removeItem(REM_LEIDOS_KEY); } catch (e) {}
      progAbierto = {}; ciAbierto = {};
      refreshView();
      alert(`Base vaciada: ${borrados} registro(s) borrados.\n\nQuedan intactas las cuentas de los profesionales, la agenda de días habilitados y el listado de obras sociales.\n\nYa puede dar de alta a los médicos y cerrar las reglas de Firebase.`);
    });
}

/* Primera franja de la sala que no tenga turno cargado ese día. */
function franjaLibre(d, sid, desde) {
  const fr = sala(sid).franjas;
  const i0 = Math.max(0, fr.findIndex((f) => f.id === desde));
  for (let i = i0; i < fr.length; i++) if (!turnoEn(d, sid, fr[i].id)) return fr[i];
  for (let i = 0; i < i0; i++) if (!turnoEn(d, sid, fr[i].id)) return fr[i];
  return null;
}

/* Baja efectiva de los registros marcados como prueba (sin confirmaciones).
   Arrastra también los consentimientos que se hayan generado desde esos turnos:
   quedarían huérfanos y ensuciando la solapa de Consentimientos. */
function quitarDatosPrueba() {
  const ids = DB.cirugias.filter((c) => c.prueba).map((c) => String(c.id));
  DB.consentimientos.filter((x) => x.prueba || ids.includes(String(x.turnoId)))
    .forEach((x) => removeDoc('consentimientos', x.id));
  DB.cirugias.filter((c) => c.prueba).forEach((c) => removeDoc('cirugias', c.id));
  DB.usuarios.filter((u) => u.prueba).forEach((u) => removeDoc('usuarios', u.id));
}

function borrarDatosPrueba() {
  const nu = DB.usuarios.filter((u) => u.prueba).length;
  const nc = DB.cirugias.filter((c) => c.prueba).length;
  if (!nu && !nc) { alert('No hay datos de prueba cargados.'); return; }
  pedirClave('Jefatura de Quirófanos', 'Borrar los datos de prueba. Ingrese la clave de Jefatura.', JEFE_CLAVE, async () => {
    if (!await preguntar(`Se borran ${nu} profesional(es) y ${nc} cirugía(s) de prueba de la base compartida.\n\nNo se toca ningún registro real.`,
      { titulo: '¿Borrar los datos de prueba?', tono: 'peligro', si: 'Sí, borrarlos' })) return;
    quitarDatosPrueba();
    renderUsuarios();
    alert('Datos de prueba eliminados. La agenda que se abrió para ellos se conserva: ciérrela desde el panel de Jefatura si no la necesita.');
  });
}
