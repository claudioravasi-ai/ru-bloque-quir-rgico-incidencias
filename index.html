<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16191f">
<meta name="description" content="Plataforma centralizada de gestión quirúrgica, endoscópica y de incidencias del Hospital Regional Ushuaia.">
<title>HRU Quirófanos — Gestión Quirúrgica e Incidencias</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HRU Quirófanos">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #a9ecd3;
    --sidebar: #16191f;
    --sidebar-card: #22262e;
    --sidebar-border: #2c313a;
    --blue: #2980d9;
    --blue-dark: #2270c2;
    --teal: #2fb9c9;
    --card: #ffffff;
    --ink: #171c24;
    --muted: #6b7280;
    --line: #e5e7eb;
    --green: #1fa971;
    --green-soft: #dcf5ea;
    --amber: #f0a92e;
    --amber-soft: #fdf3dd;
    --red: #d94848;
    --red-soft: #fbe5e5;
    --blue-soft: #e3eefb;
    --radius: 14px;
    --cat-a: #dc2626;
    --cat-b: #ea7a17;
    --cat-c: #16a34a;
    --cat-d: #2563eb;
    --cat-e: #8b5cf6;
    --cat-f: #d97706;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  svg { display: block; }

  /* ============ LAYOUT ============ */
  .app { display: flex; min-height: 100vh; }

  /* ============ SIDEBAR ============ */
  .sidebar {
    width: 275px;
    min-width: 275px;
    background: var(--sidebar);
    color: #e5e7eb;
    display: flex;
    flex-direction: column;
    padding: 18px 14px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  /* La barra lateral es una columna flex con scroll propio: sin flex-shrink: 0
     sus bloques se comprimen en pantallas bajas en lugar de dejar scrollear. */
  .sidebar > * { flex-shrink: 0; }
  .brand { display: flex; align-items: center; gap: 12px; padding: 6px 8px 20px; border-bottom: 1px solid var(--sidebar-border); }
  .brand-icon {
    width: 42px; height: 42px; border-radius: 11px;
    background: linear-gradient(135deg, #1f6f7e, #2fb9c9);
    display: flex; align-items: center; justify-content: center;
    color: #d9f6fa;
  }
  .brand-name { font-weight: 700; font-size: 1.05rem; color: #fff; }
  .brand-sub { font-size: 0.78rem; color: #9ca3af; }

  /* ---- Acceso al Libro Blanco de Quirófanos ---- */
  .libro-btn {
    display: flex; align-items: center; gap: 12px; width: 100%;
    margin-top: 16px; padding: 12px 13px; border-radius: 12px;
    background: linear-gradient(135deg, #1f6f7e 0%, #2fb9c9 55%, #35d0c4 100%);
    border: 1px solid rgba(255,255,255,0.22); cursor: pointer;
    font-family: inherit; text-align: left; color: #fff;
    box-shadow: 0 6px 18px rgba(47,185,201,0.28);
    transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    position: relative; overflow: hidden;
  }
  .libro-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(47,185,201,0.42); filter: brightness(1.05); }
  .libro-btn:active { transform: translateY(0); }
  .libro-btn::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.28) 50%, transparent 60%);
    transform: translateX(-120%);
    animation: libro-brillo 4.5s ease-in-out infinite;
  }
  @keyframes libro-brillo {
    0%, 72% { transform: translateX(-120%); }
    88%, 100% { transform: translateX(120%); }
  }
  @media (prefers-reduced-motion: reduce) { .libro-btn::after { animation: none; } }
  .libro-ico {
    width: 40px; min-width: 40px; height: 40px; border-radius: 10px;
    background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.3);
    display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .libro-txt { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
  .libro-tag {
    font-size: 0.58rem; font-weight: 800; letter-spacing: 0.09em;
    background: rgba(255,255,255,0.9); color: #10505c; padding: 2px 7px; border-radius: 4px; margin-bottom: 4px;
  }
  .libro-tit { display: block; font-size: 0.9rem; font-weight: 800; line-height: 1.2; }
  .libro-sub { display: block; font-size: 0.68rem; line-height: 1.25; color: rgba(255,255,255,0.85); margin-top: 3px; }

  /* ---- Visor del Libro Blanco ---- */
  /* Se cualifica con .modal para ganarle a .modal-white, que se define después. */
  .modal.pdf-modal { max-width: 1080px; width: 96vw; height: 92vh; max-height: 92vh; padding: 0; overflow: hidden; display: flex; flex-direction: column; }
  .pdf-hdr {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 52px 14px 18px; background: linear-gradient(135deg, #1f6f7e, #2fb9c9); color: #fff;
  }
  .pdf-hdr .pdf-ico { width: 38px; min-width: 38px; height: 38px; border-radius: 9px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; }
  .pdf-hdr h2 { text-align: left; font-size: 0.98rem; font-weight: 800; line-height: 1.25; color: #fff; margin: 0; }
  .pdf-hdr .sb { text-align: left; font-size: 0.74rem; color: rgba(255,255,255,0.86); }
  .pdf-acc { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 18px; border-bottom: 1px solid var(--line); background: #f8fafc; }
  .pdf-visor { flex: 1; min-height: 0; border: none; width: 100%; background: #f1f3f5; }
  .pdf-nota { padding: 10px 18px; font-size: 0.76rem; color: var(--muted); border-top: 1px solid var(--line); background: #f8fafc; }

  .nav { margin-top: 18px; display: flex; flex-direction: column; gap: 6px; }
  .nav-sep { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: #6b7280; padding: 12px 14px 4px; font-weight: 700; }
  .nav-btn {
    display: flex; align-items: center; gap: 11px;
    padding: 12px 14px;
    background: none; border: none; cursor: pointer;
    color: #cbd2da; font-size: 0.93rem; font-weight: 500;
    border-radius: 10px; text-align: left; width: 100%;
    transition: background 0.15s, color 0.15s;
    font-family: inherit;
  }
  .nav-btn:hover { background: #21252d; color: #fff; }
  .nav-btn.active { background: var(--blue); color: #fff; font-weight: 600; }
  .nav-badge { margin-left: auto; background: var(--red); color: #fff; font-size: 0.7rem; font-weight: 700; border-radius: 99px; padding: 2px 8px; }

  .sidebar-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding-top: 14px; }
  .jefe-access {
    display: flex; align-items: center; gap: 9px;
    background: none; border: none; cursor: pointer;
    color: #8b929c; font-size: 0.9rem; font-weight: 600;
    padding: 8px 10px; border-radius: 8px; font-family: inherit;
  }
  .jefe-access:hover { color: #d1d5db; }
  .jefe-session {
    background: #1b2733; border: 1px solid #24435a; border-radius: 10px; padding: 12px 14px;
  }
  .jefe-session-name { display: flex; align-items: center; gap: 8px; color: var(--teal); font-weight: 600; font-size: 0.9rem; }
  .jefe-session-sub { font-size: 0.75rem; color: #8b929c; margin-top: 3px; }
  .jefe-logout {
    display: flex; align-items: center; gap: 8px;
    background: none; border: none; cursor: pointer; font-family: inherit;
    color: #9ca3af; font-size: 0.83rem; margin-top: 8px; padding: 0;
  }
  .jefe-logout:hover { color: #e5e7eb; }
  .confidential-note {
    background: var(--sidebar-card); border-radius: 10px; padding: 13px 15px;
    font-size: 0.82rem; color: #9ca3af; line-height: 1.5;
  }

  /* ============ MAIN ============ */
  .main { flex: 1; padding: 34px 44px 60px; max-width: 1160px; }
  .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .page-title { font-size: 1.85rem; font-weight: 800; letter-spacing: -0.02em; }
  .page-sub { color: #47555a; margin-top: 4px; font-size: 0.95rem; }
  .head-row { display: flex; align-items: center; gap: 14px; }
  .head-icon {
    width: 44px; height: 44px; border-radius: 50%;
    background: #d7f6e9; color: var(--blue);
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #bfeeda;
  }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    border: none; cursor: pointer; font-family: inherit;
    font-size: 0.92rem; font-weight: 600;
    padding: 11px 18px; border-radius: 9px;
    transition: filter 0.15s, transform 0.1s;
    text-decoration: none;
  }
  a.btn { color: inherit; }
  .btn:active { transform: translateY(1px); }
  .btn-blue { background: var(--blue); color: #fff; }
  .btn-blue:hover { filter: brightness(1.07); }
  .btn-teal { background: #4fb3c6; color: #fff; width: 100%; justify-content: center; }
  .btn-teal:hover { filter: brightness(1.05); }
  .btn-green { background: var(--green); color: #fff; }
  .btn-orange { background: #f97316; color: #fff; }
  .btn-red { background: var(--red); color: #fff; }
  .btn-darkgreen { background: #0e6b47; color: #fff; }
  .btn-gray { background: #eceef1; color: #374151; }
  .btn-outline { background: #fff; border: 1px solid #d7dce2; color: #374151; }
  .btn-sm { padding: 7px 13px; font-size: 0.82rem; border-radius: 8px; }
  /* `.btn-teal` nació como el botón a todo el ancho de los modales de clave, y
     por eso lleva width:100%. En su variante chica va dentro de una fila junto a
     un texto: estirado lo aplastaba contra el margen. */
  .btn-sm.btn-teal { width: auto; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ============ CARDS ============ */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 24px 26px;
    box-shadow: 0 1px 3px rgba(23, 28, 36, 0.07);
    margin-bottom: 22px;
  }
  .card-title { font-size: 1.08rem; font-weight: 700; margin-bottom: 4px; }
  .card-sub { color: var(--muted); font-size: 0.88rem; margin-bottom: 16px; }

  /* Restricted banner */
  .restricted {
    background: #c8f2df;
    border: 1px solid #9fe3c6;
    border-radius: var(--radius);
    padding: 16px 20px;
    display: flex; gap: 12px; align-items: flex-start;
    margin-bottom: 24px;
  }
  .restricted-icon { color: var(--red); margin-top: 2px; }
  .restricted-title { color: var(--red); font-weight: 700; font-size: 0.93rem; margin-bottom: 3px; }
  .restricted-text { font-size: 0.87rem; color: #33413c; line-height: 1.5; }

  /* Info / warning banners */
  .banner { border-radius: var(--radius); padding: 15px 19px; display: flex; gap: 12px; align-items: flex-start; margin-bottom: 20px; font-size: 0.88rem; line-height: 1.55; }
  .banner strong { display: block; margin-bottom: 2px; }
  .banner-blue { background: var(--blue-soft); border: 1px solid #c8dcf3; color: #1e3a5f; }
  .banner-amber { background: var(--amber-soft); border: 1px solid #f3ddb0; color: #92600a; }
  .banner-red { background: var(--red-soft); border: 1px solid #f3c8c8; color: #7c2d2d; }
  .banner-green { background: var(--green-soft); border: 1px solid #b9e8d2; color: #14532d; }

  /* Stat cards */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 18px; margin-bottom: 24px; }
  .stat {
    background: var(--card); border-radius: var(--radius);
    padding: 22px 20px; display: flex; align-items: center; gap: 15px;
    box-shadow: 0 1px 3px rgba(23, 28, 36, 0.07);
  }
  .stat-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .stat-num { font-size: 1.7rem; font-weight: 800; line-height: 1.1; }
  .stat-label { font-size: 0.84rem; color: var(--muted); line-height: 1.3; }

  /* Charts */
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  @media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }
  .chart-card { background: var(--card); border-radius: var(--radius); padding: 24px 26px; box-shadow: 0 1px 3px rgba(23,28,36,0.07); }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; font-size: 0.8rem; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  /* ============ CATEGORY SELECTOR ============ */
  .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 900px) { .cat-grid { grid-template-columns: 1fr; } }
  .cat-card {
    border: 1.5px solid var(--line); border-radius: 12px;
    padding: 16px; cursor: pointer; background: #fff;
    transition: border-color 0.15s, box-shadow 0.15s;
    font-family: inherit; text-align: left;
  }
  .cat-card:hover { border-color: #b9c2cc; }
  .cat-card.selected { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(41, 128, 217, 0.15); }
  .cat-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .cat-letter {
    width: 30px; height: 30px; border-radius: 8px; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.95rem; flex-shrink: 0;
  }
  .cat-name { font-weight: 700; font-size: 0.92rem; line-height: 1.25; }
  .cat-desc { font-size: 0.82rem; color: var(--muted); line-height: 1.45; }
  .cat-plazo { margin-top: 10px; font-size: 0.75rem; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 99px; }
  .plazo-urgente { background: var(--red-soft); color: var(--red); }
  .plazo-diferido { background: var(--blue-soft); color: var(--cat-d); }

  .cat-info { border-radius: 12px; padding: 16px 18px; margin-top: 18px; font-size: 0.87rem; line-height: 1.55; display: flex; gap: 12px; }
  .cat-info.urgente { background: var(--red-soft); border: 1px solid #f3c8c8; color: #7c2d2d; }
  .cat-info.diferido { background: var(--blue-soft); border: 1px solid #c8dcf3; color: #1e3a5f; }
  .cat-info.nearmiss { background: var(--green-soft); border: 1px solid #b9e8d2; color: #14532d; }
  .cat-info strong { display: block; margin-bottom: 4px; }

  /* ============ FORMS ============ */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 26px; }
  @media (max-width: 800px) { .form-grid { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-weight: 600; font-size: 0.88rem; }
  .field input, .field textarea, .field select {
    font-family: inherit; font-size: 0.92rem; color: var(--ink);
    padding: 11px 13px; border: 1px solid #d7dce2; border-radius: 9px;
    background: #fff; transition: border-color 0.15s, box-shadow 0.15s;
    width: 100%;
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(41,128,217,0.13);
  }
  .field input:disabled { background: #f3f4f6; color: #9ca3af; }
  .field textarea { resize: vertical; min-height: 130px; line-height: 1.5; }
  .field .hint { font-size: 0.78rem; color: var(--muted); }
  .form-actions { margin-top: 26px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .form-note { font-size: 0.8rem; color: var(--muted); line-height: 1.5; }
  .check-row { display: flex; align-items: flex-start; gap: 10px; font-size: 0.88rem; line-height: 1.4; padding: 6px 0; }
  .check-row input { margin-top: 2px; width: 16px; height: 16px; flex-shrink: 0; }

  /* ============ LIST ============ */
  .toolbar { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .search-box { flex: 1; min-width: 240px; position: relative; }
  .search-box svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: #9ca3af; }
  .search-box input {
    width: 100%; padding: 11px 14px 11px 40px;
    border: none; border-radius: 10px; font-family: inherit; font-size: 0.9rem;
    background: #fff; box-shadow: 0 1px 3px rgba(23,28,36,0.06);
  }
  .search-box input:focus { outline: 2px solid var(--blue); }
  .toolbar select, .toolbar input[type="date"], .toolbar input[type="month"] {
    padding: 11px 14px; border: none; border-radius: 10px;
    font-family: inherit; font-size: 0.88rem; font-weight: 600; color: var(--ink);
    background: #fff; box-shadow: 0 1px 3px rgba(23,28,36,0.06); cursor: pointer;
  }
  .result-count { font-size: 0.85rem; color: #3d4b50; margin-bottom: 14px; }

  .inc-card {
    background: var(--card); border-radius: var(--radius);
    padding: 20px 22px; margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(23,28,36,0.07);
    cursor: pointer; transition: box-shadow 0.15s;
  }
  .inc-card:hover { box-shadow: 0 4px 14px rgba(23,28,36,0.13); }
  .inc-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.78rem; font-weight: 600;
    padding: 5px 11px; border-radius: 8px; border: 1px solid var(--line);
    background: #f8fafc; color: #374151;
  }
  .chip-estado-Pendiente { background: var(--amber-soft); color: #92600a; border-color: #f3ddb0; }
  .chip-estado-En\ Revisión { background: var(--blue-soft); color: #1d4f8c; border-color: #c8dcf3; }
  .chip-estado-Resuelta { background: var(--green-soft); color: #166b4a; border-color: #b9e8d2; }
  .inc-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .btn-del {
    display: inline-flex; align-items: center; gap: 5px;
    background: none; border: none; cursor: pointer; font-family: inherit;
    color: var(--red); font-size: 0.83rem; font-weight: 600; padding: 4px 6px; border-radius: 6px;
  }
  .btn-del:hover { background: var(--red-soft); }
  .inc-desc {
    font-size: 0.93rem; line-height: 1.55; color: #2b3440; margin-bottom: 13px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .inc-meta { display: flex; gap: 20px; flex-wrap: wrap; font-size: 0.82rem; color: var(--muted); }
  .inc-meta span { display: inline-flex; align-items: center; gap: 6px; }
  .chev { color: #b3bac2; }

  /* ============ CIRUGÍAS ============ */
  .est-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 700; padding: 5px 11px; border-radius: 8px; }
  .est-dot { width: 9px; height: 9px; border-radius: 50%; }
  .prio-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 0.74rem; font-weight: 700; padding: 4px 10px; border-radius: 99px; color: #fff; }
  .alert90 { display: inline-flex; align-items: center; gap: 5px; font-size: 0.74rem; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: #fef3c7; color: #92400e; border: 1px solid #fde08a; }
  .cir-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .tab {
    padding: 9px 16px; border-radius: 99px; border: 1px solid #cfd6dd; background: #fff;
    cursor: pointer; font-family: inherit; font-size: 0.84rem; font-weight: 600; color: #374151;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .tab.active { background: var(--sidebar); color: #fff; border-color: var(--sidebar); }
  .tab .n { background: rgba(0,0,0,0.08); border-radius: 99px; padding: 1px 8px; font-size: 0.75rem; }
  .tab.active .n { background: rgba(255,255,255,0.2); }

  .q-group { margin-bottom: 26px; }
  .q-group-title { font-weight: 800; font-size: 1rem; margin-bottom: 12px; display: flex; align-items: center; gap: 9px; }

  /* Coordinación */
  .coord-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; }
  @media (max-width: 700px) { .coord-grid { grid-template-columns: 1fr; } }
  .coord-item { display: flex; align-items: center; gap: 9px; font-size: 0.87rem; padding: 7px 0; }
  .coord-item input { width: 16px; height: 16px; }
  .coord-item .who { margin-left: auto; font-size: 0.72rem; color: var(--muted); text-align: right; }

  /* LVQ */
  .lvq-phase { border: 1.5px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
  .lvq-phase.done { border-color: #b9e8d2; background: #f4fbf8; }
  .lvq-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-weight: 700; font-size: 0.95rem; }
  .lvq-resp { font-size: 0.78rem; color: var(--muted); margin-bottom: 10px; }
  .lvq-item { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-size: 0.88rem; line-height: 1.4; }
  .lvq-item input { margin-top: 2px; width: 16px; height: 16px; flex-shrink: 0; }

  /* KPIs */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; margin-bottom: 24px; }
  .kpi { background: var(--card); border-radius: var(--radius); padding: 22px; box-shadow: 0 1px 3px rgba(23,28,36,0.07); }
  .kpi-label { font-size: 0.84rem; font-weight: 600; color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .kpi-val { font-size: 1.9rem; font-weight: 800; line-height: 1.1; }
  .kpi-meta { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
  .kpi-status { font-size: 0.78rem; font-weight: 700; margin-top: 8px; display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 99px; }
  .kpi-ok { background: var(--green-soft); color: #166b4a; }
  .kpi-bad { background: var(--red-soft); color: var(--red); }
  .bar-track { height: 8px; background: #eef1f4; border-radius: 99px; margin-top: 12px; position: relative; overflow: visible; }
  .bar-fill { height: 100%; border-radius: 99px; }
  .bar-goal { position: absolute; top: -3px; width: 2.5px; height: 14px; background: #171c24; border-radius: 2px; }

  /* Estadísticas quirúrgicas */
  .est-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 18px; }
  .est-toolbar .field { margin: 0; }
  .est-toolbar label { font-size: 0.76rem; font-weight: 600; color: var(--muted); display: block; margin-bottom: 4px; }
  .est-toolbar input[type=date] { padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; font-family: inherit; font-weight: 600; font-size: 0.86rem; }
  .est-presets { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
  .est-preset { background: #fff; border: 1px solid var(--line); border-radius: 99px; padding: 7px 13px; font-size: 0.78rem; font-weight: 600; cursor: pointer; font-family: inherit; color: #3d4b50; }
  .est-preset:hover { border-color: var(--blue); color: var(--blue); }
  .tbl th.orden { cursor: pointer; user-select: none; white-space: nowrap; }
  .tbl th.orden:hover { color: var(--blue); }
  .tbl th.orden.on { color: var(--blue); }
  .tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tbl tr.clic { cursor: pointer; }
  .tbl tr.clic:hover td { background: #f8fafc; }
  .tbl tr.propia td { background: var(--blue-soft); }
  .est-mini { display: block; height: 6px; border-radius: 99px; background: #eef1f4; margin-top: 5px; overflow: hidden; }
  .est-mini i { display: block; height: 100%; border-radius: 99px; background: var(--blue); }
  .est-nom { font-weight: 600; }
  .est-nom small { display: block; font-weight: 500; color: var(--muted); font-size: 0.76rem; margin-top: 2px; }
  .est-pill { font-size: 0.72rem; font-weight: 700; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
  .est-pill.ok { background: var(--green-soft); color: #166b4a; }
  .est-pill.mid { background: var(--amber-soft); color: #92600a; }
  .est-pill.bad { background: var(--red-soft); color: var(--red); }

  /* Hilo de reclamos */
  .msg { border-radius: 12px; padding: 13px 16px; margin-bottom: 10px; font-size: 0.9rem; line-height: 1.55; border: 1px solid var(--line); background: #f8fafc; }
  .msg.jefatura { background: var(--blue-soft); border-color: #c8dcf3; }
  .msg.nuevo { box-shadow: 0 0 0 3px rgba(240,169,46,0.28); }
  .msg-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 0.78rem; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
  .msg-head .quien { color: #171c24; }
  .msg-txt { white-space: pre-wrap; }
  .sin-leer { display: inline-flex; align-items: center; gap: 5px; background: var(--amber); color: #3b2a05; font-size: 0.72rem; font-weight: 800; padding: 3px 9px; border-radius: 99px; }
  .turno-de { display: inline-flex; align-items: center; gap: 5px; font-size: 0.72rem; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--red-soft); color: var(--red); }

  /* Aviso de nueva versión */
  .update-bar {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px; z-index: 120;
    display: none; align-items: center; gap: 14px; max-width: min(560px, calc(100vw - 32px));
    background: #171c24; color: #fff; border-radius: 14px; padding: 13px 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.28); font-size: 0.88rem;
  }
  .update-bar.open { display: flex; }
  .update-bar button { background: var(--green); color: #fff; border: none; border-radius: 9px; padding: 9px 15px; font-family: inherit; font-weight: 700; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }
  @media (max-width: 900px) { .update-bar { bottom: 78px; } }

  /* Perfil / habilitación */
  .req-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid #f0f2f4; font-size: 0.9rem; }
  .req-row:last-child { border-bottom: none; }
  .req-name { flex: 1; }
  .req-sub { font-size: 0.78rem; color: var(--muted); }
  .badge-ok, .badge-no, .badge-pend { font-size: 0.76rem; font-weight: 700; padding: 4px 11px; border-radius: 99px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .badge-pend { background: var(--amber-soft); color: #92600a; }
  .badge-ok { background: var(--green-soft); color: #166b4a; }
  .badge-no { background: var(--red-soft); color: var(--red); }

  /* Tabla usuarios */
  .tbl-wrap { background: var(--card); border-radius: var(--radius); box-shadow: 0 1px 3px rgba(23,28,36,0.07); overflow-x: auto; margin-bottom: 22px; }
  .tbl { width: 100%; min-width: 680px; border-collapse: collapse; }
  .tbl th { text-align: left; font-size: 0.73rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .tbl td { padding: 13px 16px; border-bottom: 1px solid #f0f2f4; font-size: 0.87rem; vertical-align: middle; }
  .tbl tr:last-child td { border-bottom: none; }

  /* Historial */
  .hist { border-left: 2px solid var(--line); padding-left: 16px; margin-left: 4px; }
  .hist-item { position: relative; padding-bottom: 12px; font-size: 0.84rem; }
  .hist-item::before { content: ''; position: absolute; left: -21px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); }
  .hist-item .t { color: var(--muted); font-size: 0.76rem; }

  /* ============ MODALS ============ */
  .overlay {
    position: fixed; inset: 0; background: rgba(10, 14, 12, 0.66);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .overlay.open { display: flex; }
  .modal {
    background: #a9ecd3; border-radius: 18px; padding: 30px 34px;
    width: 100%; max-width: 420px; position: relative;
    animation: pop 0.18s ease;
  }
  .modal-white { background: #fff; max-width: 640px; max-height: 88vh; overflow-y: auto; }
  @keyframes pop { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  .modal-close {
    position: absolute; top: 14px; right: 16px;
    background: none; border: none; cursor: pointer; color: #3d4b50; padding: 4px;
  }
  .modal-shield {
    width: 52px; height: 52px; border-radius: 50%; margin: 0 auto 14px;
    background: #cfeaf5; color: var(--blue);
    display: flex; align-items: center; justify-content: center;
  }
  .modal h2 { text-align: center; font-size: 1.25rem; margin-bottom: 8px; }
  .modal-sub { text-align: center; font-size: 0.88rem; color: #33514a; line-height: 1.5; margin-bottom: 20px; }
  .pass-wrap { position: relative; margin-bottom: 16px; }
  .pass-wrap input {
    width: 100%; padding: 11px 42px 11px 13px;
    border: 1.5px solid var(--blue); border-radius: 9px;
    font-family: inherit; font-size: 1rem; letter-spacing: 2px; background: #fff;
  }
  .pass-wrap input:focus { outline: none; box-shadow: 0 0 0 3px rgba(41,128,217,0.18); }
  .pass-toggle { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #6b7280; }
  .pass-label { font-weight: 600; font-size: 0.88rem; margin-bottom: 7px; display: block; }
  .pass-error { color: var(--red); font-size: 0.83rem; margin: -8px 0 12px; display: none; }

  /* ---- Comunicados de la Jefatura ---- */
  /* El emergente se apoya sobre un fondo más opaco que el resto de los modales:
     es una interrupción deliberada, no una ventana más. */
  #com-overlay { background: rgba(10, 14, 12, 0.82); z-index: 200; }
  .com-modal { border-top: 6px solid var(--blue); }
  .com-modal.p-urgente { border-top-color: var(--red); }
  .com-modal.p-importante { border-top-color: var(--amber); }
  .com-modal.p-informativo { border-top-color: var(--blue); }
  .com-kicker {
    display: flex; align-items: center; gap: 9px; font-size: 0.75rem; font-weight: 800;
    letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px;
  }
  .com-modal.p-urgente .com-kicker { color: var(--red); }
  .com-modal.p-importante .com-kicker { color: #a5700c; }
  .com-modal.p-informativo .com-kicker { color: var(--blue); }
  /* El latido solo acompaña a lo urgente; se anula si el sistema pide menos
     movimiento (mareos, sensibilidad vestibular). */
  .com-modal.p-urgente .com-kicker svg { animation: comlat 1.5s ease-in-out infinite; }
  @keyframes comlat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.16); } }
  @media (prefers-reduced-motion: reduce) { .com-modal.p-urgente .com-kicker svg { animation: none; } }
  .com-modal h2 { text-align: left; font-size: 1.3rem; line-height: 1.35; margin-bottom: 10px; }
  .com-meta { font-size: 0.82rem; color: var(--muted); margin-bottom: 16px; }
  .com-cuerpo {
    background: #f8fafc; border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; font-size: 0.97rem; line-height: 1.65;
    white-space: pre-wrap; word-break: break-word; margin-bottom: 18px;
  }
  .com-acciones { display: flex; flex-direction: column; gap: 10px; }
  .com-pila { font-size: 0.8rem; color: var(--muted); text-align: center; margin-top: 4px; }
  /* Lista de lecturas en el panel de la Jefatura */
  .com-lect-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 0;
    border-bottom: 1px solid var(--line); font-size: 0.88rem;
  }
  .com-lect-row:last-child { border-bottom: none; }
  .com-lect-row .cl-n { font-weight: 650; }
  .com-lect-row .cl-s { color: var(--muted); font-size: 0.82rem; }
  .com-lect-row .cl-t { margin-left: auto; font-size: 0.8rem; white-space: nowrap; }
  .com-barra {
    height: 9px; border-radius: 99px; background: var(--line);
    overflow: hidden; margin: 10px 0 6px;
  }
  .com-barra > i { display: block; height: 100%; background: var(--green); border-radius: 99px; transition: width 0.3s ease; }

  /* Detail modal */
  .det-section { margin-bottom: 18px; }
  .det-section h4 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px; }
  .det-row { display: flex; gap: 8px; font-size: 0.9rem; padding: 4px 0; }
  .det-row b { min-width: 150px; font-weight: 600; }
  .det-desc { background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; font-size: 0.9rem; line-height: 1.6; }

  /* Success */
  .success-icon { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 16px; background: var(--green-soft); color: var(--green); display: flex; align-items: center; justify-content: center; }
  .notify-list { background: #f0faf5; border: 1px solid #c4ebd8; border-radius: 10px; padding: 14px 18px; font-size: 0.87rem; line-height: 1.7; margin: 14px 0; text-align: left; }

  .empty { text-align: center; color: #47555a; padding: 40px 0; font-size: 0.93rem; }

  /* ============ GRILLA DE PROGRAMACIÓN DIARIA ============ */
  .dia-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--card); border-radius: var(--radius); padding: 12px 16px;
    margin-bottom: 18px; box-shadow: 0 1px 3px rgba(23,28,36,0.07);
  }
  .dia-nav {
    background: #f1f4f7; border: none; border-radius: 9px; width: 38px; height: 38px;
    cursor: pointer; font-size: 1.1rem; font-weight: 800; color: #374151; font-family: inherit;
  }
  .dia-nav:hover { background: #e4e9ef; }
  .dia-disp { font-weight: 800; font-size: 1rem; }
  .dia-disp.finde { color: var(--red); }
  .dia-bar input[type=date] { padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; font-family: inherit; font-weight: 600; }

  .salas-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .sala-card {
    background: var(--card); border-radius: var(--radius); overflow: hidden;
    box-shadow: 0 1px 3px rgba(23,28,36,0.07); border: 1px solid var(--line);
  }
  .sala-card.off { opacity: 0.55; }
  .sala-hdr {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: #f8fafc;
  }
  .sala-hdr h3 { font-size: 0.95rem; font-weight: 800; }
  .sala-estado { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.03em; }
  .sala-estado .sd { width: 9px; height: 9px; border-radius: 50%; background: var(--green); }
  .sala-estado.off { color: var(--red); }
  .sala-estado.off .sd { background: var(--red); }
  .badge-sala { font-size: 0.64rem; font-weight: 800; padding: 3px 8px; border-radius: 5px; letter-spacing: 0.04em; }
  .badge-urg { background: var(--red-soft); color: var(--red); }
  .badge-endo { background: #e6f3fb; color: #1d6fa5; }
  .badge-obs { background: #f2e8fd; color: #7c3aed; }

  .franjas-wrap { padding: 12px 14px; }
  .periodo-hdr {
    display: flex; align-items: baseline; gap: 8px; font-size: 0.74rem; font-weight: 800;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 4px 0 8px;
  }
  .periodo-hdr .ph-t { font-weight: 600; letter-spacing: 0; text-transform: none; }
  /* Estado del turno: la llave del bloque es el turno, no la sala entera. */
  .turno-estado {
    margin-left: auto; display: inline-flex; align-items: center; gap: 4px;
    font-size: 0.68rem; font-weight: 800; letter-spacing: 0.03em; color: var(--green);
  }
  .turno-estado.off { color: var(--red); }
  .franjas-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .franjas-endo { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 14px; }
  /* Guardia de 24 h del Quirófano 1: seis franjas de una hora por fila. */
  .franjas-row.franjas-24 { grid-template-columns: repeat(6, 1fr); }
  .sala-24 { border-color: #f0c6c6; }
  .sala-24 .sala-hdr { background: #fdf3f3; }
  .sala-nota-24 {
    display: flex; align-items: flex-start; gap: 8px; padding: 10px 16px;
    background: #fff8f8; border-bottom: 1px solid var(--line);
    font-size: 0.78rem; color: #7a3b3b; line-height: 1.45;
  }
  .slot-nd {
    margin-left: 5px; font-size: 0.56rem; font-weight: 800; letter-spacing: 0.03em;
    background: #ede9fe; color: #5b21b6; padding: 1px 5px; border-radius: 4px; vertical-align: middle;
  }
  .slot-ci { font-size: 0.6rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; }
  .ci-ok { background: var(--green-soft); color: #166b4a; }
  .ci-falta { background: #ede9fe; color: #5b21b6; }

  .slot {
    border-radius: 10px; border: 1px solid var(--line); min-height: 92px;
    position: relative; overflow: hidden; text-align: left; width: 100%;
    font-family: inherit; padding: 9px 10px; cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
    display: flex; flex-direction: column; gap: 3px; background: #fff;
  }
  .slot:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(23,28,36,0.12); }
  .slot-libre {
    align-items: center; justify-content: center; text-align: center;
    background: #f7fafc; border-style: dashed; border-color: #cbd5e1; color: var(--muted);
  }
  .slot-libre:hover { background: #eef6f2; border-color: var(--green); color: var(--green); }
  .slot-bloq { background: #f1f3f5; border-style: dashed; cursor: not-allowed; opacity: 0.7; }
  .slot-bloq:hover { transform: none; box-shadow: none; }
  .slot-hora { font-size: 0.72rem; font-weight: 800; color: var(--blue); letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
  .slot-mas { font-size: 1.5rem; line-height: 1; font-weight: 300; }
  .slot-hint { font-size: 0.66rem; font-weight: 700; }
  .slot-cir { font-size: 0.79rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot-pac { font-size: 0.73rem; color: #4b5563; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot-cx { font-size: 0.7rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot-chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
  .slot-est { font-size: 0.62rem; font-weight: 800; padding: 2px 7px; border-radius: 99px; }
  .slot-prio { font-size: 0.62rem; font-weight: 800; padding: 2px 7px; border-radius: 99px; color: #fff; }
  .slot-auth { font-size: 0.6rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; }
  .auth-ok { background: var(--green-soft); color: #166b4a; }
  .auth-no { background: var(--red-soft); color: var(--red); }
  .auth-pend { background: var(--amber-soft); color: #92600a; }
  .auth-exe { background: #ede9fe; color: #5b21b6; }
  .slot-urg-tag {
    position: absolute; top: 6px; right: 6px; font-size: 0.58rem; font-weight: 800;
    background: var(--red); color: #fff; padding: 2px 6px; border-radius: 4px; letter-spacing: 0.04em;
  }
  .dia-banner {
    background: #2b2f36; color: #e5e7eb; border-radius: var(--radius);
    padding: 14px 18px; font-weight: 700; font-size: 0.9rem; margin-bottom: 16px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  /* El icono conserva su tamaño, el texto se queda con el resto del ancho y el
     botón baja a una segunda línea antes que dejar el texto en una columna. */
  .dia-banner > svg { flex: none; }
  .dia-banner > div { flex: 1 1 260px; min-width: 0; }
  .dia-banner .btn { flex: none; margin-left: auto; }
  .jefatura-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 11px 0; border-bottom: 1px solid #f0f2f4;
  }
  .jefatura-row:last-child { border-bottom: none; }
  .jefatura-row .jn { font-weight: 700; font-size: 0.89rem; }
  .jefatura-row .jb { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

  /* ============ TOPBAR / DRAWER / BOTTOM NAV ============ */
  .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 44px; padding-top: calc(10px + env(safe-area-inset-top));
    background: rgba(169, 236, 211, 0.92);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(23, 28, 36, 0.07);
  }
  .hamburger {
    display: none; background: #fff; border: none; border-radius: 10px;
    padding: 9px; cursor: pointer; color: var(--ink);
    box-shadow: 0 1px 3px rgba(23,28,36,0.1);
  }
  .topbar-title { font-weight: 700; font-size: 0.95rem; display: none; }
  .topbar-spacer { flex: 1; }
  .top-btn {
    position: relative; display: inline-flex; align-items: center; gap: 7px;
    background: #fff; border: none; border-radius: 10px; padding: 9px 12px;
    cursor: pointer; font-family: inherit; font-size: 0.85rem; font-weight: 600; color: var(--ink);
    box-shadow: 0 1px 3px rgba(23,28,36,0.1);
  }
  .top-btn:hover { background: #f6fbf9; }
  .top-btn .lbl { display: inline; }
  .top-badge {
    position: absolute; top: -5px; right: -5px; min-width: 19px; height: 19px;
    background: var(--red); color: #fff; border-radius: 99px;
    font-size: 0.68rem; font-weight: 800; line-height: 19px; text-align: center; padding: 0 5px;
    border: 2px solid #a9ecd3;
  }
  .top-badge.crit { animation: pulseBadge 1.6s ease-in-out infinite; }

    display: inline-flex; align-items: center; gap: 6px;

  @media (max-width: 1180px) {

  @media (print) {

  /* El icono de los avisos no debe encogerse cuando el texto es largo. */

  /* ================= NOMENCLADOR Y MÓDULOS QUIRÚRGICOS ================= */
  .nom-box { position: relative; }

  }
  .mod-tag {
    flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
    font-weight: 800; font-size: 0.84rem; color: #fff; background: #9ca3af;
  }
  .mod-pill {

  }
  /* Después de .mod-tag y .mod-pill: con la misma especificidad gana el último,

  .mod-A { background: #8b5cf6; }
  .mod-B { background: #2980d9; }
  .mod-C { background: #1fa971; }

    display: grid; grid-template-columns: 1fr 190px; gap: 12px; align-items: end;

<body>
<div class="app">
  <div class="drawer-backdrop" id="drawer-backdrop" onclick="closeDrawer()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon" id="i-activity"></div>
      <div>
        <div class="brand-name">HRU Quirófanos</div>
        <div class="brand-sub">Gestión Quirúrgica e Incidencias</div>
      </div>
    </div>
    <!-- Acceso destacado al Libro Blanco de Quirófanos (PDF institucional) -->
    <button class="libro-btn" id="libro-btn" onclick="openLibroBlanco()" aria-label="Abrir el Libro Blanco de Quirófanos">
      <span class="libro-ico" id="libro-ico"></span>

      <button class="top-btn" id="bell-btn" onclick="openRecordatorios()" aria-label="Recordatorios"><span id="bell-ico"></span><span class="lbl">Recordatorios</span><span class="top-badge" id="bell-badge" style="display:none">0</span></button>

</div>

<nav class="bottomnav" id="bottomnav"></nav>

<!-- Aviso de versión nueva publicada -->

</div>

/* ================= SALAS Y FRANJAS HORARIAS =================
   Estructura de turnos del bloque quirúrgico del HRU: cuatro quirófanos
   generales con franjas de mañana (08–14) y tarde (14–20), la Sala de
   Endoscopía Digestiva con franjas horarias, y el quirófano de Obstetricia
   para cesáreas. El Quirófano 1 admite urgencias, que saltean la restricción
   de programación con 24 horas de anticipación. */
const FRANJAS_QX = [
  { id: 'T1', t: '08:00', p: 'M' }, { id: 'T2', t: '10:00', p: 'M' }, { id: 'T3', t: '12:00', p: 'M' },
  { id: 'T4', t: '14:00', p: 'T' }, { id: 'T5', t: '16:00', p: 'T' }, { id: 'T6', t: '18:00', p: 'T' },
];
/* Quirófano 1 — guardia de urgencias y emergencias. A diferencia del resto del
   bloque, su jornada no va de 08 a 20 h: cubre las 24 horas corridas de 08:00 a
   08:00 del día siguiente, todos los días del año, sábados y domingos incluidos.
   Las franjas de 00:00 a 07:00 llevan `nd: 1` porque pertenecen a la guardia del
   día mostrado pero ocurren en la fecha calendario siguiente.
   Los identificadores T1–T6 se conservan en 08, 10, 12, 14, 16 y 18 h para que
   los turnos cargados con la grilla anterior sigan apareciendo en su franja. */
const FRANJAS_Q1 = (() => {
  const HEREDADOS = { '08:00': 'T1', '10:00': 'T2', '12:00': 'T3', '14:00': 'T4', '16:00': 'T5', '18:00': 'T6' };
  const out = [];
  for (let i = 0; i < 24; i++) {
    const abs = 8 + i;                       // 8, 9, … 31
    const h = abs % 24;                      // hora del reloj
    const nd = abs >= 24 ? 1 : 0;            // 00:00–07:00 caen en el día siguiente
    const t = String(h).padStart(2, '0') + ':00';
    const p = nd || h >= 20 ? 'N' : (h < 14 ? 'M' : 'T');
    out.push({ id: HEREDADOS[t] || ('H' + String(h).padStart(2, '0')), t, p, nd });
  }
  return out;
})();

const OBRAS = OBRAS_GRUPOS.reduce((a, x) => a.concat(x.o), []);

/* Financiadores agregados a mano por el hospital (colección `config`, doc `obras`). */
function obrasAgregadas() {
  const c = DB.config.find((x) => String(x.id) === 'obras');
  return (c && Array.isArray(c.lista)) ? c.lista.slice() : [];
}
function obrasTodas() { return OBRAS.concat(obrasAgregadas()); }
/* Agrega un financiador al listado compartido y devuelve el nombre canónico
   (si ya existía con otra combinación de mayúsculas, gana el que ya estaba). */
function agregarObraSocial(nombre) {
  const n = String(nombre || '').trim().replace(/\s+/g, ' ');
  if (!n) return '';
  const ya = obrasTodas().find((o) => o.toLowerCase() === n.toLowerCase());
  if (ya) return ya;
  const lista = obrasAgregadas().concat([n]).sort((a, b) => a.localeCompare(b, 'es'));
  upsert('config', { id: 'obras', lista, actualizado: nowDT() });
  return n;
}
/* <option>s del selector de cobertura, con el valor actual siempre presente
   aunque venga de un registro anterior a este listado. */
function opcionesObra(sel) {
  const extra = obrasAgregadas();
  const opt = (o) => `<option value="${esc(o)}" ${sel === o ? 'selected' : ''}>${esc(o)}</option>`;
  let html = '<option value="">Seleccionar…</option>';
  html += OBRAS_GRUPOS.map((gr) => `<optgroup label="${esc(gr.g)}">${gr.o.map(opt).join('')}</optgroup>`).join('');
  if (extra.length) html += `<optgroup label="Agregadas por el hospital">${extra.map(opt).join('')}</optgroup>`;
  if (sel && !obrasTodas().some((o) => o === sel)) html += `<optgroup label="Registro anterior">${opt(sel)}</optgroup>`;
  html += '<optgroup label="No figura en el listado"><option value="__nueva__">＋ Agregar otra obra social / prepaga…</option></optgroup>';
  return html;
}

/* Capítulo del nomenclador → servicio del HRU. Define qué prácticas se le
   ofrecen primero a cada cirujano en el buscador. El módulo, en cambio, se

const NOM_SERVICIO = {
  'ABDOMEN': 'Cirugía General',
  'PROCTOLOGIA': 'Cirugía General',
  'TORAX': 'Cirugía General',
  'ENDOCRINAS': 'Cirugía General',

  'CIRUGIA REPARADORA': 'Cirugía Plástica',
  'CIRUGÍAS ESTÉTICAS REPARADORAS autorizadas por la Obra Social': 'Cirugía Plástica',
};
function servicioDePractica(pr) {
  if (!pr) return '';
  if (pr.g === 'ORTOPEDIA' && pr.s === 'Neurocirugía de Columna') return 'Neurocirugía';
  if (pr.s === 'Endoscopias abdominales') return 'Endoscopía Digestiva';
  return NOM_SERVICIO[pr.g] || 'Otro';
}

const MOD_VALORES_DEF = { A: 120000, B: 80000, C: 45000 };

/* ---- Identidad de los servicios ----
   El servicio se escribió a mano durante el alta de cada profesional, así que
   en la base conviven «Cirugía General», «Cirugia General» y «CIRUGIA GRAL».
   Comparándolos con === un cirujano no veía sus propios módulos. De acá en más
   dos servicios son el mismo si coinciden ignorando tildes, mayúsculas,
   puntuación, espacios de más y palabras de enlace («y», «de», «la»): así
   «Traumatologia» y «Traumatología y Ortopedia» son el mismo servicio. */
const SERV_ENLACES = ['y', 'e', 'de', 'del', 'la', 'el', 'los', 'las'];
function servicioTokens(s) {
  return sinTildes(String(s || ''))
    .replace(/[^a-z0-9\s]/g, ' ')
    .split(/\s+/)
    .filter((w) => w && SERV_ENLACES.indexOf(w) < 0);
}
/* Sinónimos de uso corriente en el hospital que no comparten ninguna palabra
   con el nombre del listado oficial. */
const SERV_SINONIMOS = {
  otorrinolaringologia: 'ORL',
  otorrino: 'ORL',
  ginecologia: 'Ginecología',
  obstetricia: 'Obstetricia',
  tocoginecologia: 'Obstetricia',
};
const SERV_CANON = {};      // clave normalizada → nombre oficial
function servicioCanonico(s) {
  const t = servicioTokens(s);
  if (!t.length) return '';
  const k = t.join(' ');
  if (SERV_CANON[k]) return SERV_CANON[k];
  if (SERV_SINONIMOS[k]) return SERV_SINONIMOS[k];
  // Nombre incompleto o de más: vale si señala a un solo servicio del listado.
  // «traumatologia» → «Traumatología y Ortopedia»; «cirugia», a cuatro, no.
  const cand = SERVICIOS_HRU.filter((x) => {
    const o = servicioTokens(x);
    return o.every((w) => t.indexOf(w) >= 0) || t.every((w) => o.indexOf(w) >= 0);
  });
  return cand.length === 1 ? cand[0] : String(s || '').trim();
}
const claveServicio = (s) => servicioTokens(servicioCanonico(s)).join(' ');
const mismoServicio = (a, b) => claveServicio(a) === claveServicio(b);

/* Búsqueda sin tildes y por palabras sueltas: «hernia ing» encuentra
   «hernia inguinal en adultos (no complicadas) unilateral». */
const sinTildes = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const NOM_INDICE = NOMENCLADOR.map((r) => sinTildes(r.p));
const NOM_INDICE_CTX = NOMENCLADOR.map((r) => sinTildes(r.p + ' ' + r.s + ' ' + r.g));
/* Prioridad de los resultados: primero lo que coincide en el nombre de la
   práctica (y dentro de eso, lo del propio servicio); recién después lo que
   coincide solo por el capítulo o la sección del nomenclador. Sin esta
   distinción, buscar «cesarea» devolvería toda la sección «Parto - Cesáreas». */
function buscarPracticas(q, servicio, limite) {
  const t = sinTildes(q).split(/\s+/).filter(Boolean);
  if (!t.length) return [];
  const cubos = [[], [], [], []];
  for (let i = 0; i < NOMENCLADOR.length; i++) {
    const enNombre = t.every((w) => NOM_INDICE[i].indexOf(w) >= 0);
    if (!enNombre && !t.every((w) => NOM_INDICE_CTX[i].indexOf(w) >= 0)) continue;
    const propia = servicioDePractica(NOMENCLADOR[i]) === servicio;
    cubos[(enNombre ? 0 : 2) + (propia ? 0 : 1)].push(NOMENCLADOR[i]);
  }
  return cubos[0].concat(cubos[1], cubos[2], cubos[3]).slice(0, limite || 40);
}
SERVICIOS_HRU.forEach((s) => { SERV_CANON[servicioTokens(s).join(' ')] = s; });

/* ================= ALMACENAMIENTO (Firebase + respaldo local persistente) =================
   Reglas de persistencia:
   1. Toda escritura se aplica primero en memoria y se espeja en localStorage.
      Los datos sobreviven al cierre del navegador aunque no haya red.
   2. Si hay nube disponible, la escritura se envía además a Firebase.
   3. Si la nube está caída, la escritura se encola y se reenvía al reconectar.
   4. Cada snapshot de la nube también se espeja en localStorage, de modo que
      la próxima apertura sin red muestre los últimos datos conocidos. */
const COLS = ['incidencias', 'cirugias', 'usuarios', 'reclamos', 'agenda', 'consentimientos', 'config', 'comunicados'];
/* Espejo local con prefijo propio. La app de incidencias embebida corre en el
   mismo origen de GitHub Pages y usa la clave 'hru_incidencias_v2': si ambas
   escribieran ahí se pisarían. Comparten los datos por Firebase (nodo
   'incidencias'), no por localStorage. */
const LOCAL_KEYS = { incidencias: 'hruq_incidencias_v1', cirugias: 'hruq_cirugias_v1', usuarios: 'hruq_usuarios_v1', reclamos: 'hruq_reclamos_v1', agenda: 'hruq_agenda_v1', consentimientos: 'hruq_consentimientos_v1', config: 'hruq_config_v1', comunicados: 'hruq_comunicados_v1' };
const LEGACY_KEYS = { incidencias: 'hru_incidencias_v2', cirugias: 'hru_cirugias_v1', usuarios: 'hru_usuarios_v1', reclamos: 'hru_reclamos_v1', agenda: '', consentimientos: '', config: '', comunicados: '' };
const QUEUE_KEY = 'hruq_cola_v1';
const DB = { incidencias: [], cirugias: [], usuarios: [], reclamos: [], agenda: [], consentimientos: [], config: [], comunicados: [] };
const refs = {};
const forceLocal = new URLSearchParams(location.search).has('local');
const cloudOn = !forceLocal && typeof firebase !== 'undefined' && !!FIREBASE_CONFIG.databaseURL;
let conectado = false;      // hay enlace vivo con Firebase
let colaPendiente = [];     // escrituras esperando reconexión

function ordenarInc(arr) {
  return arr.sort((a, b) =>
    String(b.fechaIncidencia || '').localeCompare(String(a.fechaIncidencia || '')) || b.id - a.id);
}
function loadLocal(col) {
  try {
    const raw = localStorage.getItem(LOCAL_KEYS[col]);
    if (raw) return JSON.parse(raw);
    // Migración desde las claves de la versión anterior de la app.
    const viejo = localStorage.getItem(LEGACY_KEYS[col]);
    if (viejo) {
      const datos = JSON.parse(viejo);
      localStorage.setItem(LOCAL_KEYS[col], viejo);
      return datos;
    }
  } catch (e) { /* localStorage no disponible */ }
  return null;
}
function saveLocal(col) {
  try { localStorage.setItem(LOCAL_KEYS[col], JSON.stringify(DB[col])); } catch (e) {}
}
function saveAllLocal() { COLS.forEach(saveLocal); }
function loadCola() {
  try { colaPendiente = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch (e) { colaPendiente = []; }
}
function saveCola() {
  try { localStorage.setItem(QUEUE_KEY, JSON.stringify(colaPendiente)); } catch (e) {}
}
function encolar(op) {
  // Una sola operación pendiente por documento: la última gana.
  colaPendiente = colaPendiente.filter((x) => !(x.col === op.col && String(x.id) === String(op.id)));
  colaPendiente.push(op);
  saveCola();
  pintarConexion();
}
function vaciarCola() {
  if (!conectado || !colaPendiente.length) return;
  const pend = colaPendiente.slice();
  colaPendiente = [];
  saveCola();
  pend.forEach((op) => {
    const r = refs[op.col];
    if (!r) { colaPendiente.push(op); return; }
    if (op.tipo === 'set') r.child(op.id).set(op.obj).catch(() => { encolar(op); });
    else r.child(op.id).remove().catch(() => { encolar(op); });
  });
  saveCola();
  pintarConexion();
}
async function seedLocal(col) {
  if (col === 'incidencias') return ordenarInc(SEED.slice());
  if (col === 'cirugias') return SEED_CIR.slice();
  if (col === 'reclamos') return SEED_RECLAMOS.slice();
  if (col === 'usuarios') {
    const u = JSON.parse(JSON.stringify(SEED_USER));
    u.passHash = await hashPass('demo123');
    return [u];
  }
  return [];
}
async function initStore(onReady) {
  loadCola();
  if (!cloudOn) {
    for (const col of COLS) {
      DB[col] = loadLocal(col) || await seedLocal(col);
      saveLocal(col);
    }
    ordenarInc(DB.incidencias);
    pintarConexion();
    onReady();
    return;
  }

  // Arranque inmediato con la última copia local conocida: la app abre
  // aunque el dispositivo esté sin red y luego se sincroniza sola.
  COLS.forEach((col) => { DB[col] = loadLocal(col) || []; });
  ordenarInc(DB.incidencias);

  firebase.initializeApp(FIREBASE_CONFIG);
  try { firebase.database().ref('.info/connected').on('value', (s) => {
    conectado = s.val() === true;
    pintarConexion();
    if (conectado) vaciarCola();
  }); } catch (e) {}

  let pending = COLS.length;
  let ready = false;
  const listo = () => { if (!ready) { ready = true; onReady(); } };
  // Si la nube no responde en 6 s, se arranca con los datos locales.
  const guarda = setTimeout(() => { pending = 0; listo(); }, 6000);

  COLS.forEach((col) => {
    refs[col] = firebase.database().ref(col);
    let first = true;
    refs[col].on('value', (snap) => {
      const val = snap.val();
      if (!val) {
        // Solo las incidencias se siembran en la nube (comportamiento original);
        // el resto de las colecciones comienza vacío en producción.
        if (first && col === 'incidencias') SEED.forEach((s) => refs[col].child(s.id).set(s));
        DB[col] = col === 'incidencias' ? ordenarInc(SEED.slice()) : [];
      } else {
        DB[col] = Object.values(val).filter(Boolean);
        if (col === 'incidencias') ordenarInc(DB[col]);
      }
      saveLocal(col); // espejo local de cada snapshot
      if (first) { first = false; if (--pending === 0) { clearTimeout(guarda); listo(); } }
      // Un comunicado recién emitido llega por este mismo canal: se revisa acá
      // para que emerja en el momento, sin esperar la ronda del minuto.
      else if (ready) { refreshView(); revisarRecordatorios(); revisarComunicados(); }
    }, () => {
      // Sin permiso o sin conexión: se conserva lo que ya está en memoria/local.
      refs[col] = null;
      conectado = false;
      pintarConexion();
      if (first) { first = false; if (--pending === 0) { clearTimeout(guarda); listo(); } }
    });
  });
}
function upsert(col, obj) {
  const plano = JSON.parse(JSON.stringify(obj));
  // 1) memoria + localStorage (siempre, haya o no red)
  const i = DB[col].findIndex((x) => String(x.id) === String(obj.id));
  if (i >= 0) DB[col][i] = obj; else DB[col].push(obj);
  if (col === 'incidencias') ordenarInc(DB[col]);
  saveLocal(col);
  // 2) nube, o cola si no hay enlace
  if (cloudOn) {
    if (refs[col] && conectado) refs[col].child(obj.id).set(plano).catch(() => encolar({ tipo: 'set', col, id: obj.id, obj: plano }));
    else encolar({ tipo: 'set', col, id: obj.id, obj: plano });
  }
  refreshView();
  revisarRecordatorios();
}
function removeDoc(col, id) {
  DB[col] = DB[col].filter((x) => String(x.id) !== String(id));
  saveLocal(col);
  if (cloudOn) {
    if (refs[col] && conectado) refs[col].child(id).remove().catch(() => encolar({ tipo: 'del', col, id }));
    else encolar({ tipo: 'del', col, id });
  }
  refreshView();
  revisarRecordatorios();
}
function pintarConexion() {
  const chip = $('conn-chip'), txt = $('conn-text');
  if (!chip || !txt) return;
  chip.classList.remove('off', 'local');
  if (!cloudOn) { chip.classList.add('local'); txt.textContent = 'Modo local'; chip.title = 'Los datos se guardan solo en este dispositivo.'; return; }
  if (conectado && !colaPendiente.length) { txt.textContent = 'Sincronizado'; chip.title = 'Datos compartidos en tiempo real con el resto del hospital.'; return; }
  chip.classList.add('off');
  txt.textContent = colaPendiente.length ? `${colaPendiente.length} sin sincronizar` : 'Sin conexión';
  chip.title = 'Los cambios quedan guardados en este dispositivo y se envían al recuperar la conexión.';
}

const ico = (svg, n) => String(svg).replace(/width="\d+" height="\d+"/, `width="${n}" height="${n}"`);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const MESES_FULL = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
function fmtFecha(iso) {
  if (!iso) return '—';
  const [y, m, d] = iso.split('-').map(Number);
  return `${d} ${MESES[m - 1]} ${y}`;
}
function fmtDT(dt) {
  if (!dt) return '—';
  const [f, h] = dt.split('T');
  return `${fmtFecha(f)} · ${(h || '').slice(0, 5)} h`;
}
function hoyISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function nowDT() {
  const d = new Date();
  return `${hoyISO()}T${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function mesActual() { return hoyISO().slice(0, 7); }
function diffMin(a, b) { return Math.round((new Date(b) - new Date(a)) / 60000); }
function diasEntre(isoA, isoB) { return Math.floor((new Date(isoB) - new Date(isoA)) / 86400000); }
function sumarDias(iso, n) {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function limiteCierre(fechaCir) { return new Date(sumarDias(fechaCir, -1) + 'T' + BLOQUE.cierreSolicitudes + ':00'); }
function limitePublicacion(fechaCir) { return new Date(sumarDias(fechaCir, -1) + 'T' + BLOQUE.publicacionParte + ':00'); }
function partePublicado(fechaCir) { return new Date() >= limitePublicacion(fechaCir); }
function addHorasHabiles(desdeDT, horas) {
  const d = new Date(desdeDT);
  let rem = horas;
  while (rem > 0) {
    d.setHours(d.getHours() + 1);
    if (d.getDay() !== 0 && d.getDay() !== 6) rem--;
  }
  return d;
}
function dateToDT(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}T${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function diasDelMes(ym) {
  const [y, m] = ym.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
/* Horas-quirófano disponibles en el mes: el Quirófano 1 aporta 24 h todos los
   días (guardia permanente) y el resto del bloque, la jornada de 08 a 20 h de
   cada día hábil. */
function horasDisponiblesMes(ym) {
  const jornada = BLOQUE.horaCierre - BLOQUE.horaApertura;
  return SALAS.reduce((h, s) => h + (s.guardia24 ? diasDelMes(ym) * 24 : diasHabilesMes(ym) * jornada), 0);
}
function diasHabilesMes(ym) {
  const [y, m] = ym.split('-').map(Number);
  let n = 0;
  const d = new Date(y, m - 1, 1);
  while (d.getMonth() === m - 1) {
    if (d.getDay() > 0 && d.getDay() < 6) n++;
    d.setDate(d.getDate() + 1);
  }
  return n;
}
async function hashPass(p) {
  const texto = 'hru|' + p;
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
    return [...new Uint8Array(buf)].map((x) => x.toString(16).padStart(2, '0')).join('');
  }
  // Fallback simple para contextos sin crypto.subtle
  let h = 5381;
  for (let i = 0; i < texto.length; i++) h = ((h << 5) + h + texto.charCodeAt(i)) >>> 0;
  return 'x' + h.toString(16);
}
function plazoChip(cat) {
  return CATS[cat].urgente
    ? `<span class="cat-plazo plazo-urgente">${ICONS.clockSm.replace('14', '12').replace('14', '12')} Reporte inmediato · 2 h</span>`
    : `<span class="cat-plazo plazo-diferido">${ICONS.clockSm.replace('14', '12').replace('14', '12')} Reporte diferido · 24 h</span>`;
}

/* ---- helpers de cirugías ---- */
function prioridadEfectiva(c) {
  if (c.prioridad === 6 && c.fechaSolicitud && diasEntre(c.fechaSolicitud, hoyISO()) > 90) return 5;
  return c.prioridad;
}
function esperaDias(c) { return c.fechaSolicitud ? diasEntre(c.fechaSolicitud, hoyISO()) : 0; }
function ordenPrelacion(a, b) {
  return prioridadEfectiva(a) - prioridadEfectiva(b)
    || String(a.horaProg || '').localeCompare(String(b.horaProg || ''))
    || String(a.fechaSolicitud || '').localeCompare(String(b.fechaSolicitud || ''));
}
function estChip(c) {
  const e = ESTC[c.estado];
  return `<span class="est-chip" style="background:${e.soft};color:${e.text}"><span class="est-dot" style="background:${e.color}"></span>${e.label}</span>`;
}
function prioChip(c) {
  const pe = prioridadEfectiva(c);
  const p = PRIOS[pe];
  let html = `<span class="prio-chip" style="background:${p.color}" title="${esc(p.desc)}">P${pe} · ${p.label}</span>`;
  if (pe === 5 && c.prioridad === 6) {
    html += ` <span class="alert90" title="Alerta automática: paciente con más de 90 días en lista de espera">${ICONS.bell.replace('16', '12')} ${esperaDias(c)} días de espera</span>`;
  }
  return html;
}
function lvqCompleta(c, fase) { return !!(c.lvq && c.lvq[fase] && c.lvq[fase].done); }
function pushHist(c, accion) {
  c.historial = c.historial || [];
  c.historial.push({ t: nowDT(), a: accion });
}
function coordFaltantes(c) {
  const faltan = [];
  if (!c.coordinacion?.insumos) faltan.push('Farmacia: implantes/insumos sin verificar');
  if (!c.coordinacion?.esterilizacion) faltan.push('Esterilización: instrumental sin confirmar');
  if (c.recursos?.hemoderivados && !c.coordinacion?.hemoterapia) faltan.push('Hemoterapia: hemoderivados sin reservar');
  if (!c.coordinacion?.anestesia) faltan.push('Anestesiología: evaluación pre-anestésica pendiente');
  if (!c.hce?.preop) faltan.push('HCE: estudios preoperatorios incompletos');
  if (!c.hce?.consentimiento) faltan.push('HCE: consentimiento informado sin registrar');
  return faltan;
}
/* Minutos de quirófano de una cirugía: se prefiere el tiempo real medido y, si
   no está cargado, la duración estimada de la solicitud. */
function minutosCirugia(c) {
  if (c.horaInicioReal && c.horaFinReal) {
    const m = diffMin(c.horaInicioReal, c.horaFinReal);
    if (m > 0 && m < 24 * 60) return m;
  }
  return c.duracionMin || 0;
}
function lvqIntegra(c) { return ['entrada', 'pausa', 'salida'].every((f) => lvqCompleta(c, f)); }

/* ---- helpers varios ---- */
/* Valor listo para interpolar dentro de un atributo onclick con comillas
   simples: encodeURIComponent no escapa el apóstrofo, que sí rompería la
   cadena (por ejemplo en "Dr. O'Connor"). */
const attr = (s) => encodeURIComponent(String(s ?? '')).replace(/'/g, '%27');
/* Las claves de Firebase no admiten . # $ [ ] / — el correo se normaliza igual
   que el id de usuario de la app. */
const claveMail = (m) => String(m || '').replace(/[.#$[\]/]/g, ',');
function descargarCSV(nombre, filas) {
  const csv = filas.map((f) => f.map((v) => {
    const s = String(v ?? '');
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(';')).join('\r\n');
  // BOM: Excel en español abre el archivo con los acentos correctos.
  const url = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' }));
  const a = document.createElement('a');
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
