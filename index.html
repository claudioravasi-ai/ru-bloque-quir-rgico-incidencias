/* ---- Identidad del profesional ----
   El nombre del cirujano se escribe a mano en cada turno, en cada consentimiento
   y en cada equipo quirúrgico. Así conviven «Dr. Hugo Díaz», «hugo diaz»,
   «DIAZ, HUGO» y «Hugo Díaz» —la misma persona— y, comparados con ===, la
   producción de un cirujano aparecía repartida en cuatro filas de estadísticas
   y de módulos.

   Mismo criterio que con los servicios: se ignoran tildes, mayúsculas,
   puntuación, tratamientos («Dr.», «Dra.», «Lic.») y el orden de las palabras.
   Un nombre incompleto vale si señala a un solo profesional registrado:
   «Díaz» → «Dr. Hugo Díaz» si es el único Díaz del hospital. El rótulo que se
   muestra es siempre el de la ficha del profesional, que es el bien escrito. */
const PROF_TRATAMIENTOS = ['dr', 'dra', 'doctor', 'doctora', 'prof', 'lic', 'md', 'sr', 'sra'];
function profesionalTokens(n) {
  return sinTildes(String(n || ''))
    .replace(/[^a-z0-9\s]/g, ' ')
    .split(/\s+/)
    .filter((w) => w && PROF_TRATAMIENTOS.indexOf(w) < 0)

let PROF_CANON = {}, PROF_CANON_GEN = -1;
function profesionalCanonico(n) {
  const t = profesionalTokens(n);
  if (!t.length) return String(n || '').trim();
  if (PROF_CANON_GEN !== DB.usuarios.length) { PROF_CANON = {}; PROF_CANON_GEN = DB.usuarios.length; }
  const k = t.join(' ');
  if (PROF_CANON[k]) return PROF_CANON[k];
  const padron = DB.usuarios.map((u) => u.nombre).filter(Boolean);
  const exacto = padron.find((x) => profesionalTokens(x).join(' ') === k);
  let out;
  if (exacto) out = exacto;
  else {
    // Nombre incompleto o con una palabra de más: vale si apunta a uno solo.
    const cand = padron.filter((x) => {
      const o = profesionalTokens(x);
      return o.every((w) => t.indexOf(w) >= 0) || t.every((w) => o.indexOf(w) >= 0);
    });
    out = cand.length === 1 ? cand[0] : String(n || '').replace(/\s+/g, ' ').trim();
  }
  PROF_CANON[k] = out;
  return out;
}
const claveProfesional = (n) => profesionalTokens(profesionalCanonico(n)).join(' ');

function apellidoDe(nombre) {

  return sinTildes(partes.length ? partes[partes.length - 1] : String(nombre || ''));

/* Prioridad de los resultados: primero lo que coincide en el nombre de la
   práctica (y dentro de eso, lo del propio servicio); recién después lo que
   coincide solo por el capítulo o la sección del nomenclador. Sin esta
   distinción, buscar «cesarea» devolvería toda la sección «Parto - Cesáreas». */
function buscarPracticas(q, servicio, limite) {
  const t = sinTildes(q).split(/\s+/).filter(Boolean);
  if (!t.length) return [];
  const cubos = [[], [], [], []];
  for (let i = 0; i < NOMENCLADOR.length; i++) {
    const enNombre = t.every((w) => NOM_INDICE[i].indexOf(w) >= 0);
    if (!enNombre && !t.every((w) => NOM_INDICE_CTX[i].indexOf(w) >= 0)) continue;
    const propia = servicioDePractica(NOMENCLADOR[i]) === servicio;
    cubos[(enNombre ? 0 : 2) + (propia ? 0 : 1)].push(NOMENCLADOR[i]);

/* ================= ALMACENAMIENTO (Firebase + respaldo local persistente) =================
   Reglas de persistencia:
   1. Toda escritura se aplica primero en memoria y se espeja en localStorage.
      Los datos sobreviven al cierre del navegador aunque no haya red.
   2. Si hay nube disponible, la escritura se envía además a Firebase.
   3. Si la nube está caída, la escritura se encola y se reenvía al reconectar.
   4. Cada snapshot de la nube también se espeja en localStorage, de modo que
      la próxima apertura sin red muestre los últimos datos conocidos. */
const COLS = ['incidencias', 'cirugias', 'usuarios', 'reclamos', 'agenda', 'consentimientos', 'config', 'comunicados'];
/* Espejo local con prefijo propio. La app de incidencias embebida corre en el
   mismo origen de GitHub Pages y usa la clave 'hru_incidencias_v2': si ambas
   escribieran ahí se pisarían. Comparten los datos por Firebase (nodo
   'incidencias'), no por localStorage. */
const LOCAL_KEYS = { incidencias: 'hruq_incidencias_v1', cirugias: 'hruq_cirugias_v1', usuarios: 'hruq_usuarios_v1', reclamos: 'hruq_reclamos_v1', agenda: 'hruq_agenda_v1', consentimientos: 'hruq_consentimientos_v1', config: 'hruq_config_v1', comunicados: 'hruq_comunicados_v1' };
const LEGACY_KEYS = { incidencias: 'hru_incidencias_v2', cirugias: 'hru_cirugias_v1', usuarios: 'hru_usuarios_v1', reclamos: 'hru_reclamos_v1', agenda: '', consentimientos: '', config: '', comunicados: '' };
const QUEUE_KEY = 'hruq_cola_v1';
const DB = { incidencias: [], cirugias: [], usuarios: [], reclamos: [], agenda: [], consentimientos: [], config: [], comunicados: [] };
const refs = {};
const forceLocal = new URLSearchParams(location.search).has('local');
const cloudOn = !forceLocal && typeof firebase !== 'undefined' && !!FIREBASE_CONFIG.databaseURL;
let conectado = false;      // hay enlace vivo con Firebase
let colaPendiente = [];     // escrituras esperando reconexión

function ordenarInc(arr) {
  return arr.sort((a, b) =>
    String(b.fechaIncidencia || '').localeCompare(String(a.fechaIncidencia || '')) || b.id - a.id);
}
function loadLocal(col) {
  try {
    const raw = localStorage.getItem(LOCAL_KEYS[col]);
    if (raw) return JSON.parse(raw);
    // Migración desde las claves de la versión anterior de la app.
    const viejo = localStorage.getItem(LEGACY_KEYS[col]);
    if (viejo) {
      const datos = JSON.parse(viejo);
      localStorage.setItem(LOCAL_KEYS[col], viejo);
      return datos;
    }
  } catch (e) { /* localStorage no disponible */ }
  return null;
}
function saveLocal(col) {
  try { localStorage.setItem(LOCAL_KEYS[col], JSON.stringify(DB[col])); } catch (e) {}
}
function saveAllLocal() { COLS.forEach(saveLocal); }
/* ---- Hora de referencia ----
   Cada escritura se sella con la hora para poder decidir, más tarde, si un
   cambio que estuvo esperando en la cola sigue siendo el más nuevo. Se usa la
   hora del servidor de Firebase (Date.now() más el desfasaje que informa la
   propia base) porque el reloj de un teléfono puede estar corrido y eso
   alcanzaría para que un cambio viejo se creyera el último. */
let servidorOffset = 0;
function ahoraServidor() { return Date.now() + servidorOffset; }

function loadCola() {
  try { colaPendiente = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch (e) { colaPendiente = []; }
}
function saveCola() {
  try { localStorage.setItem(QUEUE_KEY, JSON.stringify(colaPendiente)); } catch (e) {}
}
function encolar(op) {
  // Una sola operación pendiente por documento: la última gana.
  colaPendiente = colaPendiente.filter((x) => !(x.col === op.col && String(x.id) === String(op.id)));
  colaPendiente.push(op);
  saveCola();
  pintarConexion();
}
/* Descarga de la cola. Cada operación se envía dentro de una transacción que
   primero mira qué hay en la nube: si alguien editó ese mismo registro después
   de que este cambio se guardara acá, el cambio viejo se descarta y se adopta
   el de la nube. Sin esta comparación, un alta hecha sin señal podía volver
   días después y pisar lo que el resto del hospital ya había corregido: gana
   el último cambio, no el último envío. */
/* La decisión, aparte y sin efectos: ¿este cambio guardado sin señal sigue
   siendo el más nuevo? Devuelve lo que hay que escribir, o undefined para
   dejar la nube como está. Los registros anteriores a esta versión no tienen
   sello (_m): ante la duda se los considera viejos y el cambio se aplica. */
function resolverCola(actual, op) {
  if (actual && Number(actual._m || 0) > Number(op.m || 0)) return undefined;
  return op.tipo === 'set' ? op.obj : null;
}

function vaciarCola() {
  if (!conectado || !colaPendiente.length) return;
  const pend = colaPendiente.slice();
  colaPendiente = [];
  saveCola();
  pend.forEach((op) => {
    const r = refs[op.col];
    if (!r) { colaPendiente.push(op); return; }
    r.child(op.id).transaction(
      // undefined aborta la transacción y deja la nube intacta.
      (actual) => resolverCola(actual, op),
      (err, hecho, snap) => {
        if (err) { encolar(op); return; }
        if (hecho) return;
        // Descartado por viejo: este dispositivo se pone al día con la nube.
        const val = snap && snap.val();
        const i = DB[op.col].findIndex((x) => String(x.id) === String(op.id));
        if (val) { if (i >= 0) DB[op.col][i] = val; else DB[op.col].push(val); }
        else if (i >= 0) DB[op.col].splice(i, 1);
        saveLocal(op.col);
        refreshView();
      },
      false, // sin estado intermedio local: evita parpadeos en la vista
    );
  });
  saveCola();
  pintarConexion();
}
async function seedLocal(col) {
  if (col === 'incidencias') return ordenarInc(SEED.slice());
  if (col === 'cirugias') return SEED_CIR.slice();
  if (col === 'reclamos') return SEED_RECLAMOS.slice();
  if (col === 'usuarios') {
    const u = JSON.parse(JSON.stringify(SEED_USER));
    u.passHash = await hashPass('demo123');
    return [u];
  }
  return [];
}
async function initStore(onReady) {
  loadCola();
  if (!cloudOn) {
    for (const col of COLS) {
      DB[col] = loadLocal(col) || await seedLocal(col);
      saveLocal(col);
    }
    ordenarInc(DB.incidencias);
    pintarConexion();
    onReady();
    return;
  }

  // Arranque inmediato con la última copia local conocida: la app abre
  // aunque el dispositivo esté sin red y luego se sincroniza sola.
  COLS.forEach((col) => { DB[col] = loadLocal(col) || []; });
  ordenarInc(DB.incidencias);

  firebase.initializeApp(FIREBASE_CONFIG);
  try { firebase.database().ref('.info/connected').on('value', (s) => {
    conectado = s.val() === true;
    pintarConexion();
    if (conectado) vaciarCola();
  }); } catch (e) {}
  // Reloj de referencia: cuánto se aparta este dispositivo de la hora del servidor.
  try { firebase.database().ref('.info/serverTimeOffset').on('value', (s) => {
    servidorOffset = Number(s.val()) || 0;
  }); } catch (e) {}

  let pending = COLS.length;
  let ready = false;
  const listo = () => { if (!ready) { ready = true; onReady(); } };
  // Si la nube no responde en 6 s, se arranca con los datos locales.
  const guarda = setTimeout(() => { pending = 0; listo(); }, 6000);

  COLS.forEach((col) => {
    refs[col] = firebase.database().ref(col);
    let first = true;
    refs[col].on('value', (snap) => {
      const val = snap.val();
      if (!val) {
        // Solo las incidencias se siembran en la nube (comportamiento original);
        // el resto de las colecciones comienza vacío en producción.
        if (first && col === 'incidencias') SEED.forEach((s) => refs[col].child(s.id).set(s));
        DB[col] = col === 'incidencias' ? ordenarInc(SEED.slice()) : [];
      } else {
        DB[col] = Object.values(val).filter(Boolean);
        if (col === 'incidencias') ordenarInc(DB[col]);
      }
      saveLocal(col); // espejo local de cada snapshot
      if (first) { first = false; if (--pending === 0) { clearTimeout(guarda); listo(); } }
      // Un comunicado recién emitido llega por este mismo canal: se revisa acá
      // para que emerja en el momento, sin esperar la ronda del minuto.
      else if (ready) { refreshView(); revisarRecordatorios(); revisarComunicados(); }
    }, () => {
      // Sin permiso o sin conexión: se conserva lo que ya está en memoria/local.
      refs[col] = null;
      conectado = false;
      pintarConexion();
      if (first) { first = false; if (--pending === 0) { clearTimeout(guarda); listo(); } }
    });
  });
}
/* Devuelve una promesa que dice si el cambio quedó confirmado en la nube
   (true) o solamente guardado en este dispositivo, a la espera de red (false).
   Quien necesite darle una respuesta franca al usuario —autorizar una cuenta,
   por ejemplo— la espera; el resto la ignora y sigue como siempre. */
function upsert(col, obj) {
  obj._m = ahoraServidor();
  const plano = JSON.parse(JSON.stringify(obj));
  // 1) memoria + localStorage (siempre, haya o no red)
  const i = DB[col].findIndex((x) => String(x.id) === String(obj.id));
  if (i >= 0) DB[col][i] = obj; else DB[col].push(obj);
  if (col === 'incidencias') ordenarInc(DB[col]);
  saveLocal(col);
  // 2) nube, o cola si no hay enlace
  let envio = Promise.resolve(!cloudOn);
  if (cloudOn) {
    const op = { tipo: 'set', col, id: obj.id, obj: plano, m: plano._m };
    if (refs[col] && conectado) {
      envio = refs[col].child(obj.id).set(plano).then(() => true).catch(() => { encolar(op); return false; });
    } else { encolar(op); envio = Promise.resolve(false); }
  }
  refreshView();
  revisarRecordatorios();
  return envio;
}
function removeDoc(col, id) {
  DB[col] = DB[col].filter((x) => String(x.id) !== String(id));
  saveLocal(col);
  let envio = Promise.resolve(!cloudOn);
  if (cloudOn) {
    const op = { tipo: 'del', col, id, m: ahoraServidor() };
    if (refs[col] && conectado) {
      envio = refs[col].child(id).remove().then(() => true).catch(() => { encolar(op); return false; });
    } else { encolar(op); envio = Promise.resolve(false); }
  }
  refreshView();
  revisarRecordatorios();
  return envio;
}
function pintarConexion() {

  if (!cloudOn) { chip.classList.add('local', 'alerta'); txt.textContent = 'Modo local'; chip.title = 'Los datos se guardan solo en este dispositivo.'; return; }
  if (conectado && !colaPendiente.length) { txt.textContent = 'Sincronizado'; chip.title = 'Datos compartidos en tiempo real con el resto del hospital.'; return; }

/* Al tocar el chip: qué está pasando y, si hay algo trabado, un reintento. */
async function explicarConexion() {

  if (!n) { alert('Sin conexión\n\nEste dispositivo no está llegando a la base compartida. Puede seguir trabajando: lo que cargue se guarda acá y se envía solo al recuperar la señal.'); return; }
  const detalle = colaPendiente.slice(0, 6).map((op) => `· ${COLA_NOMBRES[op.col] || op.col}`).join('\n');
  if (await preguntar(`Estos cambios están guardados en ESTE dispositivo pero todavía no llegaron al hospital, así que nadie más los ve:\n\n${detalle}${n > 6 ? `\n· y ${n - 6} más` : ''}\n\n¿Reintentar el envío ahora?`,
    { titulo: `${n} cambio(s) sin enviar`, tono: 'aviso', si: 'Reintentar ahora', no: 'Más tarde' })) {

      ? `Quedan ${colaPendiente.length} cambio(s) sin enviar. Verifique la conexión y reintente.`
      : 'Listo: los cambios pendientes se enviaron al hospital.'), 900);
  }
}

/* ================= CIERRE DEL CASO =================
   Una cirugía termina en dos tiempos.

   Primero el quirófano: las tres etapas de la Lista de Verificación —Entrada,
   Pausa y Salida— y el parte quirúrgico cargado.

   Después el circuito administrativo: la aceptación de Admisión y Egresos y la
   validación de la Jefatura de Quirófanos.

   En la cirugía programada el circuito administrativo ya se cumplió ANTES de
   operar, así que el caso se cierra solo apenas se guarda el parte quirúrgico.
   En la urgencia de la madrugada no hay nadie de Admisión ni de Jefatura en el
   hospital: el cirujano opera y cierra la LVQ igual, pero el caso queda en
   «Operada — pendiente de cierre» hasta que las dos validaciones se asienten.
   Recién entonces pasa a FINALIZADA, y recién entonces computa en las
   estadísticas y en los módulos quirúrgicos. */
const EST_OPERADA = ['realizada', 'finalizada'];

/* Qué le falta a un caso ya operado para poder cerrarse. */
function cierreFaltantes(c) {
  const f = [];
  if (!c) return f;
  if (!lvqCompleta(c, 'entrada') || !lvqCompleta(c, 'pausa')) f.push('Lista de Verificación Quirúrgica: faltan las etapas de Entrada y Pausa');
  if (!lvqCompleta(c, 'salida')) f.push('Lista de Verificación Quirúrgica: falta la etapa de Salida (conteo de gasas e instrumental)');
  if (!c.informe) f.push('Parte quirúrgico (informe operatorio) sin cargar');
  if (c.auth === 'NO AUTORIZADO') f.push('Admisión y Egresos: dictamen NO AUTORIZADO sin rectificar');
  else if (c.auth !== 'AUTORIZADO') f.push('Admisión y Egresos: aceptación pendiente');
  if (jefaturaPendienteDiferida(c)) f.push('Jefatura de Quirófanos: validación diferida sin regularizar');
  return f;
}
/* Caso cerrado. Se calcula, no se cree: sirve también para los turnos viejos
   que quedaron guardados como «realizada» antes de que existiera el cierre. */
function cirugiaCerrada(c) { return operada(c) && !cierreFaltantes(c).length; }

   mismo incluso en esos turnos viejos. */
function estadoVisible(c) {
  if (!c) return 'borrador';
  return (c.estado === 'realizada' && cirugiaCerrada(c)) ? 'finalizada' : c.estado;

/* Único lugar donde el caso se cierra o se reabre. Se llama después de cada
   paso que puede completar el cierre —parte quirúrgico, dictamen de Admisión,
   regularización de la Jefatura— y devuelve true si el estado cambió.
   El que llama es el que guarda. */
function revisarCierre(c) {
  if (!c) return false;
  const faltan = cierreFaltantes(c);
  if (c.estado === 'realizada' && !faltan.length) {
    c.estado = 'finalizada';
    c.cierre = { t: nowDT() };
    pushHist(c, 'Caso cerrado — LVQ completa, parte quirúrgico cargado, aceptación de Admisión y Egresos y validación de la Jefatura asentadas. La cirugía queda FINALIZADA y computa en estadísticas y módulos');
    return true;
  }
  if (c.estado === 'finalizada' && faltan.length) {
    c.estado = 'realizada';
    c.cierre = null;
    pushHist(c, 'Caso reabierto — dejó de cumplir un requisito de cierre: ' + faltan.join('; '));
    return true;
  }

}

function minutosCirugia(c) {

/* Renglón plegado. `titulo` y `sub` llegan ya escapados; `badge` es HTML.
   `accion` permite que un grupo haga algo más al desplegar —el reclamo cerrado
   abre además su conversación— sin duplicar el renglón. */
function filaPleg(o) {
  return `<button class="fila${o.pendiente ? ' fila-pend' : ''}" aria-expanded="${o.abierto ? 'true' : 'false'}"
      onclick="${o.accion || `plegToggle('${o.grupo}','${attr(o.id)}')`}" title="${o.abierto ? 'Plegar' : 'Ver el detalle completo'}">
    <span class="fila-chev">${ico(ICONS.chevron, 16)}</span>
    <span class="fila-txt"><span class="fila-t">${o.titulo}</span><span class="fila-s">${o.sub}</span></span>
    <span class="fila-est">${o.badge || ''}</span>
  </button>`;
}
/* Envoltorio completo: renglón + ficha desplegada + pie para volver a plegar. */
function bloquePleg(o, fichaHTML) {
  const abierto = plegAbierto(o.grupo, o.id);
  const fila = filaPleg(Object.assign({}, o, { abierto }));
  if (!abierto) return fila;
  return `<div class="pleg-abierta">${fila}
    <div class="pleg-body">${fichaHTML()}
      <div class="pleg-cerrar"><button class="btn btn-sm btn-outline" onclick="${o.accion || `plegToggle('${o.grupo}','${attr(o.id)}')`}">Plegar</button></div>
    </div></div>`;
}
function descargarCSV(nombre, filas) {
  const csv = filas.map((f) => f.map((v) => {
    const s = String(v ?? '');
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(';')).join('\r\n');
  // BOM: Excel en español abre el archivo con los acentos correctos.
  const url = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' }));
  const a = document.createElement('a');
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ================= HABILITACIÓN DE CIRUJANOS ================= */
function habilitacion(u) {
  const hoy = hoyISO();
  const reqs = [
    { k: 'matricula', label: 'Matrícula profesional vigente en la provincia', ok: !!(u.matricula?.numero && u.matricula?.vigente), det: u.matricula?.numero || 'Sin cargar' },
    { k: 'especialista', label: 'Título de especialista reconocido', ok: !!(u.especialista?.si && u.especialista?.titulo), det: u.especialista?.titulo || 'Sin cargar' },
    { k: 'seguro', label: 'Seguro de responsabilidad civil médica vigente', ok: !!(u.seguro?.vence && u.seguro.vence >= hoy), det: u.seguro?.vence ? 'Vence ' + fmtFecha(u.seguro.vence) : 'Sin cargar' },
    { k: 'rcp', label: 'Formación en RCP con revalidación bienal', ok: !!(u.rcp?.fecha && diasEntre(u.rcp.fecha, hoy) <= 730), det: u.rcp?.fecha ? `${u.rcp.tipo || 'RCP'} · ${fmtFecha(u.rcp.fecha)}` : 'Sin cargar' },
    { k: 'vacunas', label: 'Esquema de vacunación completo', ok: !!(u.vacunas?.hepB && u.vacunas?.dobleAdultos && u.vacunas?.influenza && u.vacunas?.covid), det: 'Hep. B · Doble adultos · Influenza · COVID-19' },
  ];
  return { reqs, ok: reqs.every((r) => r.ok) };
}

/* ================= AUTORIZACIÓN DE LA CUENTA POR LA JEFATURA =================
   La habilitación documental (matrícula, seguro, RCP…) la carga el propio
   profesional. La autorización de la cuenta, en cambio, la otorga la Jefatura de
   Quirófanos: toda alta nace PENDIENTE y no puede programar hasta que la
   Jefatura la apruebe. La Jefatura también puede dar de baja una cuenta en
   cualquier momento, con motivo registrado. Las cuentas anteriores a esta
   versión no traen el campo y se tratan como pendientes: la Jefatura las revisa
   una vez y quedan resueltas. */
const CUENTAS = {
  pendiente: { label: 'Pendiente de autorización', badge: 'badge-pend', color: 'var(--amber)' },
  aprobado:  { label: 'Autorizado por Jefatura',   badge: 'badge-ok',   color: 'var(--green)' },
  baja:      { label: 'Dado de baja',              badge: 'badge-no',   color: 'var(--red)' },
};
function estadoCuenta(u) {
  const e = u && u.cuenta;
  return (e === 'aprobado' || e === 'baja') ? e : 'pendiente';
}
function cuentaAprobada(u) { return estadoCuenta(u) === 'aprobado'; }
/* El motivo lo escribe la Jefatura a mano: puede venir con punto final o sin él. */
function motivoCuenta(u) {
  const m = String((u && u.cuentaMotivo) || '').trim();
  if (!m) return '.';
  return ': ' + (/[.!?]$/.test(m) ? m : m + '.');
}
/* Motivo por el que un profesional no puede programar, o cadena vacía si puede. */
function bloqueoCuenta(u) {
  const e = estadoCuenta(u);
  if (e === 'aprobado') return '';
  if (e === 'baja') {
    return 'Su cuenta fue dada de baja por la Jefatura de Quirófanos' + motivoCuenta(u)
      + '\n\nNo puede programar cirugías. Comuníquese con la Jefatura de Quirófanos para regularizar la situación.';
  }
  return 'Su cuenta está PENDIENTE DE AUTORIZACIÓN por la Jefatura de Quirófanos.'
    + '\n\nHasta que la Jefatura la autorice no puede programar cirugías. Mientras tanto puede completar su documentación de habilitación en Mi Perfil.';
}

/* ================= MOTOR DE RECORDATORIOS =================
   Los recordatorios se derivan del estado real de los datos y del reloj: no se
   guardan como registros, se recalculan. Se muestran en la campana del
   encabezado, en la vista "Recordatorios" y —si el profesional dio permiso— como
   notificación del sistema mientras la app esté abierta en el dispositivo. */
const REM_NOTIF_KEY = 'hru_rem_notificados_v1';
let remLista = [];
let remNotificados = {};
let remTimer = null;
let comTimer = null;  // ronda de revisión de los comunicados de la Jefatura

function cargarNotificados() {
  try { remNotificados = JSON.parse(localStorage.getItem(REM_NOTIF_KEY) || '{}'); } catch (e) { remNotificados = {}; }
  // Se purgan las marcas de días anteriores para que el aviso se repita cada jornada.
  const hoy = hoyISO();
  Object.keys(remNotificados).forEach((k) => { if (remNotificados[k] !== hoy) delete remNotificados[k]; });
  cargarLeidos();
}
function guardarNotificados() {
  try { localStorage.setItem(REM_NOTIF_KEY, JSON.stringify(remNotificados)); } catch (e) {}
}

/* ================= RECORDATORIOS LEÍDOS =================
   Un recordatorio no es un mensaje guardado: se recalcula a partir del estado
   real de los datos. Existe mientras exista el problema que lo origina. Por eso
   «leído» no lo borra, solo lo silencia por la jornada: deja de contar en la
   campana y queda atenuado en la lista. Si al día siguiente el problema sigue
   sin resolverse, vuelve a contar. Así un informe operatorio sin cargar no se
   puede silenciar para siempre con un clic.

   La marca es por dispositivo y por persona: la clave lleva el correo de quien
   la puso, de modo que si dos profesionales comparten la computadora del
   quirófano cada uno mantiene su propia lista. */
const REM_LEIDOS_KEY = 'hruq_rem_leidos_v1';
let remLeidos = {};
/* Nombre con prefijo `rem` a propósito: el módulo de reclamos ya define su
   propio `claveLector(r)`, y dos declaraciones con el mismo nombre se pisan. */
function remClaveLector() {
  const u = usuarioActual();
  if (u) return claveMail(u.email);
  if (jefe) return '__jefatura__';
  if (director) return '__direccion__';
  return '__anonimo__';
}
function cargarLeidos() {
  try { remLeidos = JSON.parse(localStorage.getItem(REM_LEIDOS_KEY) || '{}'); } catch (e) { remLeidos = {}; }
  const hoy = hoyISO();
  Object.keys(remLeidos).forEach((k) => { if (remLeidos[k] !== hoy) delete remLeidos[k]; });
  guardarLeidos();
}
function guardarLeidos() {
  try { localStorage.setItem(REM_LEIDOS_KEY, JSON.stringify(remLeidos)); } catch (e) {}
}
function remEsLeido(r) { return remLeidos[remClaveLector() + '|' + r.key] === hoyISO(); }
function remSinLeer() { return remLista.filter((r) => !remEsLeido(r)); }
function marcarRemLeido(key, silencioso) {
  remLeidos[remClaveLector() + '|' + key] = hoyISO();
  guardarLeidos();
  if (!silencioso) { pintarCampana(); if (view === 'recordatorios') renderRecordatorios(); }
}
function marcarTodosRemLeidos() {
  remLista.forEach((r) => { remLeidos[remClaveLector() + '|' + r.key] = hoyISO(); });
  guardarLeidos();
  pintarCampana();
  if (view === 'recordatorios') renderRecordatorios();
}
function humanoRestante(ms) {
  const neg = ms < 0;
  let m = Math.round(Math.abs(ms) / 60000);
  const d = Math.floor(m / 1440); m -= d * 1440;
  const h = Math.floor(m / 60); m -= h * 60;
  let s;
  if (d > 0) s = `${d} d ${h} h`;
  else if (h > 0) s = `${h} h ${String(m).padStart(2, '0')} min`;
  else s = `${m} min`;
  return (neg ? 'hace ' : 'en ') + s;
}
function creadaEn(c) {
  return (c.historial && c.historial[0] && c.historial[0].t) || ((c.fechaSolicitud || hoyISO()) + 'T08:00');
}

/* ¿Le corresponde a quien está mirando el aviso de esta cirugía?
   Un recordatorio quirúrgico solo tiene sentido para quien puede actuar sobre
   él: el cirujano dueño del turno y la Jefatura, que necesita la vista global.
   Si a todos les suena todo, el aviso deja de leerse.
   Las cirugías sin `cirujanoEmail` —cargadas por la Jefatura o anteriores a que
   se registrara el dato— quedan solo en manos de la Jefatura, que puede
   averiguar de quién son. */
function remMia(c) {
  if (jefe) return true;
  const u = usuarioActual();
  return !!(u && c.cirujanoEmail && c.cirujanoEmail === u.email);
}

function calcRecordatorios() {
  const R = [];
  const ahora = new Date();
  const hoy = hoyISO();
  const manana = sumarDias(hoy, 1);
  const u = usuarioActual();
  const add = (o) => R.push(o);

  /* ---- 1. Ciclo de programación: cierre 13:00 y publicación 14:00 ---- */
  const cierreHoy = new Date(hoy + 'T' + BLOQUE.cierreSolicitudes + ':00');
  const publicHoy = new Date(hoy + 'T' + BLOQUE.publicacionParte + ':00');
  if (ahora < cierreHoy) {
    const falta = cierreHoy - ahora;
    add({
      key: 'ciclo-cierre', nivel: falta <= 2 * 36e5 ? 'warn' : 'info', vista: 'solicitud',
      titulo: `Cierre de solicitudes ${humanoRestante(falta)}`,
      texto: `Las solicitudes para el parte del ${fmtFecha(manana)} cierran hoy a las ${BLOQUE.cierreSolicitudes} h. Pasado ese horario solo ingresan emergencias y urgencias diferibles (P1–P2).`,
      cuando: `Hoy ${BLOQUE.cierreSolicitudes} h`,
    });
  }
  if (jefe) {
    const sinConfirmarManana = DB.cirugias.filter((c) => c.fecha === manana && ['pendiente', 'validada'].includes(c.estado));
    if (sinConfirmarManana.length && ahora >= cierreHoy) {
      add({
        key: 'ciclo-publicacion', nivel: ahora >= publicHoy ? 'crit' : 'warn', vista: 'programacion',
        titulo: `${sinConfirmarManana.length} turno(s) sin confirmar para mañana`,
        texto: ahora >= publicHoy
          ? `El parte del ${fmtFecha(manana)} ya debía estar publicado (${BLOQUE.publicacionParte} h). Confirme o suspenda los turnos pendientes.`
          : `El parte del ${fmtFecha(manana)} se publica hoy a las ${BLOQUE.publicacionParte} h. Quedan turnos en circuito de validación.`,
        cuando: `Hoy ${BLOQUE.publicacionParte} h`,
      });
    }
  }

  /* ---- 2. Emergencias (< 30 min a incisión) y urgencias diferibles (< 6 h) ---- */
  DB.cirugias.filter((c) => c.prioridad === 1 && ['borrador', 'pendiente', 'validada', 'confirmada'].includes(c.estado))
    .filter(remMia)
    .forEach((c) => {
      const limite = new Date(new Date(creadaEn(c)).getTime() + 30 * 60000);
      add({
        key: 'emerg-' + c.id, nivel: 'crit', vista: 'programacion', cirugia: c.id,
        titulo: `EMERGENCIA sin incisión — ${c.paciente?.nombre || 's/d'}`,
        texto: `${c.procedimiento} (${c.servicio}). Meta institucional: incisión en menos de 30 minutos desde la solicitud.`,
        cuando: ahora > limite ? `Meta vencida ${humanoRestante(limite - ahora)}` : `Meta ${humanoRestante(limite - ahora)}`,
      });
    });
  DB.cirugias.filter((c) => c.prioridad === 2 && ['borrador', 'pendiente', 'validada', 'confirmada'].includes(c.estado))
    .filter(remMia)
    .forEach((c) => {
      const limite = new Date(new Date(creadaEn(c)).getTime() + 6 * 36e5);
      add({
        key: 'urg-' + c.id, nivel: ahora > limite ? 'crit' : 'warn', vista: 'programacion', cirugia: c.id,
        titulo: `Urgencia diferible — ${c.paciente?.nombre || 's/d'}`,
        texto: `${c.procedimiento} (${c.servicio}). Debe resolverse dentro de las 6 horas de la solicitud.`,
        cuando: `Plazo ${humanoRestante(limite - ahora)}`,
      });
    });

  /* ---- 3. Coordinación de áreas: verificar 48–72 h antes ---- */
  DB.cirugias.filter((c) => ['borrador', 'pendiente', 'validada', 'confirmada'].includes(c.estado) && c.fecha >= hoy)
    .filter(remMia)
    .forEach((c) => {
      const inicio = new Date(c.fecha + 'T' + (c.horaProg || '08:00') + ':00');
      const horas = (inicio - ahora) / 36e5;
      if (horas > 72 || horas < -2) return;
      const faltan = coordFaltantes(c);
      if (!faltan.length) return;
      add({
        key: 'coord-' + c.id, nivel: horas <= 48 ? 'crit' : 'warn', vista: jefe ? 'programacion' : 'mis', cirugia: c.id,
        titulo: `Coordinación incompleta — ${c.procedimiento}`,
        texto: `${c.paciente?.nombre || 's/d'} · ${fmtFecha(c.fecha)} ${c.horaProg || ''} h. Pendiente: ${faltan.join('; ')}.`,
        cuando: `Cirugía ${humanoRestante(inicio - ahora)}`,
      });
    });

  /* ---- 2 bis. El paciente ya se operó de urgencia y el turno sigue en pie ----
     Es la red de seguridad del cierre por anticipación: si nadie vinculó la
     urgencia con el turno programado, la franja quedaría ocupada por una
     cirugía que no se va a hacer y el paciente figuraría dos veces. */
  DB.cirugias.filter((c) => c.urgencia && ['confirmada', 'en_curso', 'realizada', 'finalizada'].includes(c.estado) && !c.resuelveTurno)
    .forEach((urg) => {
      turnosQueResuelve(urg).filter(remMia).forEach((p) => {
        const inicio = new Date(p.fecha + 'T' + (p.horaProg || '08:00') + ':00');
        add({
          key: 'antic-' + p.id, nivel: 'warn', vista: jefe ? 'programacion' : 'mis', cirugia: p.id,
          titulo: `Turno en pie de un paciente ya operado de urgencia — ${p.paciente?.nombre || 's/d'}`,
          texto: `Tiene turno el ${fmtFecha(p.fecha)} (${p.quirofano || 's/d'}, ${p.horaProg || '—'} h) para ${p.procedimiento}, y el ${fmtFecha(urg.fecha)} se le registró una urgencia: ${urg.procedimiento}. Si la urgencia resolvió esa misma cirugía, ciérrela como «resuelta por urgencia»: el turno deja de figurar y la franja vuelve a estar disponible.`,
          cuando: `Turno ${humanoRestante(inicio - ahora)}`,
        });
      });
    });

  /* ---- 3 bis. Autorización de Admisión y Egresos pendiente ---- */
  DB.cirugias.filter((c) => ['pendiente', 'validada'].includes(c.estado) && !authOk(c) && c.fecha >= hoy)
    .forEach((c) => {
      const inicio = new Date(c.fecha + 'T' + (c.horaProg || '08:00') + ':00');
      const horas = (inicio - ahora) / 36e5;
      if (horas > 48) return;
      const mio = u && c.cirujanoEmail === u.email;
      if (!jefe && !mio) return;
      add({
        key: 'auth-' + c.id, nivel: c.auth === 'NO AUTORIZADO' ? 'crit' : (horas <= 24 ? 'crit' : 'warn'),
        vista: 'grilla', cirugia: c.id,
        titulo: c.auth === 'NO AUTORIZADO' ? `Turno NO AUTORIZADO en el parte` : `Turno sin autorización de Admisión`,
        texto: c.auth === 'NO AUTORIZADO'
          ? `${c.procedimiento} — ${c.paciente?.nombre || 's/d'} (${c.quirofano}, ${c.horaProg} h). Motivo del rechazo: ${c.authMotivo || 'sin motivo registrado'}.`
          : `${c.procedimiento} — ${c.paciente?.nombre || 's/d'} (${c.quirofano}, ${c.horaProg} h). Sin la autorización de Admisión y Egresos la Jefatura no puede validar el turno, así que tampoco llega al parte.`,
        cuando: `Cirugía ${humanoRestante(inicio - ahora)}`,
      });
    });

  /* ---- 3 ter. Trámite administrativo diferido, todavía sin regularizar ----
     Vale también para las cirugías ya realizadas: la excepción libera de pedir
     la autorización antes, no de dejarla asentada alguna vez. */
  DB.cirugias.filter((c) => authPendienteDiferida(c) && ['confirmada', 'en_curso', 'realizada', 'finalizada'].includes(c.estado))
    .filter((c) => c.fecha >= sumarDias(hoy, -30))
    .filter(remMia)
    .forEach((c) => {
      const hecha = operada(c);
      add({
        key: 'authdif-' + c.id, nivel: hecha && c.fecha < hoy ? 'warn' : 'info', vista: 'grilla', cirugia: c.id,
        titulo: `Admisión y Egresos sin regularizar — ${c.paciente?.nombre || 's/d'}`,
        texto: `${c.procedimiento} (${c.quirofano || 's/d'}, ${fmtFecha(c.fecha)}). Salteó la autorización previa por ${authMotivoExencion(c)}${hecha ? ' y la cirugía ya se realizó' : ''}. El trámite administrativo sigue abierto: se cierra desde el propio turno, con la clave de Admisión y Egresos.`,
        cuando: hecha ? 'Trámite pendiente' : `Cirugía ${fmtFecha(c.fecha)}`,
      });
    });

  /* ---- 3 quater. Validación de Jefatura diferida, todavía sin regularizar ----
     La urgencia se operó sin el visto previo, que es exactamente lo que la
     excepción habilita. Lo que no habilita es que nunca quede asentado. */
  DB.cirugias.filter((c) => jefaturaPendienteDiferida(c) && ['en_curso', 'realizada', 'finalizada'].includes(c.estado))
    .filter((c) => c.fecha >= sumarDias(hoy, -30))
    .filter(remMia)
    .forEach((c) => {
      const hecha = operada(c);
      add({
        key: 'jefdif-' + c.id, nivel: hecha && c.fecha < hoy ? 'warn' : 'info', vista: jefe ? 'programacion' : 'mis', cirugia: c.id,
        titulo: `Validación de Jefatura sin regularizar — ${c.paciente?.nombre || 's/d'}`,
        texto: `${c.procedimiento} (${c.quirofano || 's/d'}, ${fmtFecha(c.fecha)}). Entró por ${(c.jefaturaDiferida && c.jefaturaDiferida.motivo) || 'urgencia'} y se operó sin la validación previa de la ${JEFATURA}. Repase la lista de verificación de coordinación y cierre el trámite desde la ficha de la cirugía.`,
        cuando: hecha ? 'Trámite pendiente' : `Cirugía ${fmtFecha(c.fecha)}`,
      });
    });

  /* ---- 3 quinquies. Caso operado que no termina de cerrarse ----
     La cirugía se hizo, pero el caso sigue abierto: falta el parte quirúrgico,
     la aceptación de Admisión o la validación de la Jefatura. Mientras siga
     así no se archiva ni computa en las estadísticas ni en los módulos, que es
     justamente lo que nadie quiere descubrir a fin de mes. */
  DB.cirugias.filter((c) => c.estado === 'realizada' && !cirugiaCerrada(c))
    .filter((c) => c.fecha >= sumarDias(hoy, -60))
    .filter(remMia)
    .forEach((c) => {
      const pend = cierreFaltantes(c);
      const dias = Math.max(0, diasEntre(c.fecha, hoy));
      add({
        key: 'cierre-' + c.id, nivel: dias >= 2 ? 'crit' : 'warn', vista: jefe ? 'programacion' : 'mis', cirugia: c.id,
        titulo: `Cirugía sin cerrar — ${c.paciente?.nombre || 's/d'}`,
        texto: `${c.procedimiento} (${c.quirofano || 's/d'}, ${fmtFecha(c.fecha)}). Se operó pero el caso no está finalizado. Falta: ${pend.join('; ')}. Hasta que se cierre no computa en las estadísticas ni en los módulos quirúrgicos.`,
        cuando: dias ? `Operada hace ${dias} día(s)` : 'Operada hoy',
      });
    });

  /* ---- 4. Retraso de inicio > 60 min (incidencia D reportable) ---- */
  DB.cirugias.filter((c) => c.estado === 'confirmada' && c.fecha === hoy).filter(remMia).forEach((c) => {
    const prog = new Date(hoy + 'T' + (c.horaProg || '08:00') + ':00');
    const atraso = (ahora - prog) / 60000;
    if (atraso < 60) return;
    add({
      key: 'atraso-' + c.id, nivel: 'crit', vista: jefe ? 'programacion' : 'mis', cirugia: c.id,
      titulo: `Retraso de ${Math.round(atraso)} min en el inicio`,
      texto: `${c.procedimiento} — ${c.paciente?.nombre || 's/d'} (${c.quirofano}). Programada ${c.horaProg} h y aún no iniciada. Un atraso mayor a 60 minutos debe reportarse como incidencia de categoría D.`,
      cuando: `Programada ${c.horaProg} h`,
    });
  });

  /* ---- 5. Cirugía en curso excedida ---- */
  DB.cirugias.filter((c) => c.estado === 'en_curso' && c.horaInicioReal).filter(remMia).forEach((c) => {
    const transcurrido = diffMin(c.horaInicioReal, dateToDT(ahora));
    const estimado = c.duracionMin || 90;
    if (transcurrido <= estimado + 30) return;
    add({
      key: 'excedida-' + c.id, nivel: 'warn', vista: jefe ? 'programacion' : 'mis', cirugia: c.id,
      titulo: `Procedimiento excedido en ${transcurrido - estimado} min`,
      texto: `${c.procedimiento} lleva ${transcurrido} min sobre ${estimado} min estimados. Afecta el recambio del ${c.quirofano} y los turnos siguientes.`,
      cuando: `Inicio ${fmtDT(c.horaInicioReal)}`,
    });
  });

  /* ---- 6. Informe operatorio: meta ≤ 2 h (cumplimiento ≥ 95 %) ---- */
  DB.cirugias.filter((c) => c.estado === 'realizada' && !c.informe).forEach((c) => {
    const mio = u && c.cirujanoEmail === u.email;
    if (!jefe && !mio) return;
    const fin = c.horaFinReal ? new Date(c.horaFinReal) : new Date(c.fecha + 'T12:00:00');
    const limite = new Date(fin.getTime() + 2 * 36e5);
    add({
      key: 'informe-' + c.id, nivel: ahora > limite ? 'crit' : 'warn', vista: mio ? 'mis' : 'programacion', cirugia: c.id,
      titulo: ahora > limite ? `Parte quirúrgico fuera de plazo` : `Parte quirúrgico pendiente`,
      texto: `${c.procedimiento} — ${c.paciente?.nombre || 's/d'} (${c.cirujano}). Quedó sin parte quirúrgico y por eso el caso no se cierra. Meta institucional: carga en menos de 2 horas tras la cirugía.`,
      cuando: `Plazo ${humanoRestante(limite - ahora)}`,
    });
  });

  /* ---- 7. Anatomía Patológica: muestras sin envío confirmado ---- */
  DB.cirugias.filter((c) => ['realizada', 'finalizada', 'en_curso'].includes(c.estado) && (c.muestras || []).some((m) => !m.enviada))
    .forEach((c) => {
      const pend = (c.muestras || []).filter((m) => !m.enviada);
      const congelacion = pend.some((m) => m.tipo && m.tipo.indexOf('congelación') >= 0);
      const mio = u && c.cirujanoEmail === u.email;
      if (!jefe && !mio) return;
      add({
        key: 'ap-' + c.id, nivel: congelacion ? 'crit' : 'warn', vista: mio ? 'mis' : 'programacion', cirugia: c.id,
        titulo: `${pend.length} muestra(s) sin envío a Anatomía Patológica`,
        texto: `${c.procedimiento} — ${c.paciente?.nombre || 's/d'}. ${congelacion ? 'Incluye biopsia por congelación: el envío es inmediato.' : 'Confirme el envío y el rótulo de cada muestra.'}`,
        cuando: c.horaFinReal ? fmtDT(c.horaFinReal) : fmtFecha(c.fecha),
      });
    });

  /* ---- 8. Incidencias sin tratar (plazos 2 h / 24 h) ---- */
  if (jefe) {
    const urg = DB.incidencias.filter((i) => CATS[i.categoria]?.urgente && i.estado === 'Pendiente');
    if (urg.length) {
      add({
        key: 'inc-urgentes', nivel: 'crit', vista: 'confidenciales',
        titulo: `${urg.length} incidencia(s) A–C sin revisar`,
        texto: 'Las categorías A, B y C exigen tratamiento inmediato y notificación a Jefatura del SQC, Jefe de Servicio y Dirección Médica. Las categorías A y B abren expediente de evento adverso.',
        cuando: 'Plazo de reporte: 2 h',
      });
    }
    const dif = DB.incidencias.filter((i) => !CATS[i.categoria]?.urgente && i.estado === 'Pendiente'
      && diasEntre(i.fechaReporte || i.fechaIncidencia, hoy) >= 1);
    if (dif.length) {
      add({
        key: 'inc-diferidas', nivel: 'warn', vista: 'confidenciales',
        titulo: `${dif.length} incidencia(s) D–F pendientes hace más de 24 h`,
        texto: 'Revise y avance el estado de las incidencias de proceso, gestión y bioseguridad para el análisis de mejora continua.',
        cuando: 'Plazo de reporte: 24 h',
      });
    }
  }

  /* ---- 9. Reclamos: dirigidos a quien debe contestar o leer la respuesta ----
     Un reclamo genera aviso únicamente para sus dos partes —el autor y la
     Jefatura—, y solo mientras haya algo que hacer: mensajes sin leer, o una
     respuesta pendiente dentro del plazo de 48 horas hábiles. Los avisos llevan
     `notif: true` para que lleguen al dispositivo aunque no sean críticos: si el
     destinatario no los ve, el circuito formal se detiene. */
  DB.reclamos.forEach((r) => {
    const rol = rolEnReclamo(r);
    // Un reclamo cerrado deja de reclamar atención, aunque queden mensajes sin abrir.
    if (!rol || r.estado === 'cerrado') return;
    const nuevos = reclamoNoLeidos(r);
    if (nuevos) {
      add({
        key: 'reclamo-leer-' + r.id, nivel: 'warn', notif: true, vista: 'reclamos', reclamo: r.id,
        titulo: rol === 'autor'
          ? `Respuesta sin leer en su reclamo`
          : `${nuevos} mensaje(s) sin leer en un reclamo`,
        texto: `"${r.asunto}" — ${r.de}. ${rol === 'autor'
          ? 'La Jefatura de Quirófanos respondió: lea la respuesta y cierre el reclamo o replique.'
          : 'Le corresponde a la Jefatura leer y responder dentro de las 48 horas hábiles.'}`,
        cuando: `Último mensaje ${fmtDT(ultimaActividad(r))}`,
      });
      return;
    }
    if (turnoDeReclamo(r) !== rol) return;
    if (rol === 'autor') {
      // Ya leyó la respuesta: queda el trámite de cerrarlo o replicar. Se avisa
      // sin insistir —nivel informativo y sin notificación del dispositivo—.
      add({
        key: 'reclamo-cerrar-' + r.id, nivel: 'info', vista: 'reclamos', reclamo: r.id,
        titulo: `Reclamo respondido y sin cerrar`,
        texto: `"${r.asunto}". Si la respuesta de la Jefatura lo satisface, dé el reclamo por cerrado; si no, replique en el mismo hilo.`,
        cuando: `Respondido ${fmtDT(ultimaActividad(r))}`,
      });
      return;
    }
    const falta = venceReclamo(r) - ahora;
    add({
      key: 'reclamo-resp-' + r.id,
      nivel: falta < 0 ? 'crit' : (falta <= 8 * 36e5 ? 'warn' : 'info'),
      notif: falta <= 8 * 36e5, vista: 'reclamos', reclamo: r.id,
      titulo: falta < 0 ? `Reclamo sin responder — plazo vencido` : `Reclamo pendiente de respuesta`,
      texto: `"${r.asunto}" — ${r.de}, ${r.autor}. El plazo formal de respuesta Jefe a Jefe es de 48 horas hábiles.`,
      cuando: `Vence ${humanoRestante(falta)}`,
    });
  });

  /* ---- 10. Lista de espera extendida (> 90 días) ---- */
  const espera90 = DB.cirugias.filter((c) => ['borrador', 'pendiente', 'validada'].includes(c.estado) && esperaDias(c) > 90);
  if (espera90.length && (jefe || (u && espera90.some((c) => c.cirujanoEmail === u.email)))) {
    add({
      key: 'espera90', nivel: 'warn', vista: jefe ? 'programacion' : 'mis',
      titulo: `${espera90.length} paciente(s) con más de 90 días de espera`,
      texto: 'Alerta automática de lista de espera extendida: estas solicitudes ascienden a prioridad P5 en el orden de prelación.',
      cuando: `Máxima espera: ${Math.max(...espera90.map(esperaDias))} días`,
    });
  }

  /* ---- 11. Habilitación del profesional (vigencias) ---- */
  if (u) {
    const h = habilitacion(u);
    const faltantes = h.reqs.filter((r) => !r.ok);
    if (faltantes.length) {
      add({
        key: 'hab-incompleta', nivel: 'crit', vista: 'perfil',
        titulo: 'Habilitación incompleta — no puede cargar solicitudes',
        texto: 'Requisitos pendientes: ' + faltantes.map((r) => r.label).join('; ') + '.',
        cuando: `${faltantes.length} de ${h.reqs.length} sin cumplir`,
      });
    }
    if (u.seguro?.vence && u.seguro.vence >= hoy) {
      const dias = diasEntre(hoy, u.seguro.vence);
      if (dias <= 30) add({
        key: 'hab-seguro', nivel: dias <= 7 ? 'crit' : 'warn', vista: 'perfil',
        titulo: `Seguro de responsabilidad civil vence en ${dias} día(s)`,
        texto: 'Sin seguro vigente la habilitación caduca automáticamente y el sistema bloquea la carga de solicitudes quirúrgicas.',
        cuando: `Vence ${fmtFecha(u.seguro.vence)}`,
      });
    }
    if (u.rcp?.fecha) {
      const restan = 730 - diasEntre(u.rcp.fecha, hoy);
      if (restan <= 60) add({
        key: 'hab-rcp', nivel: restan <= 0 ? 'crit' : 'warn', vista: 'perfil',
        titulo: restan <= 0 ? 'Certificación de RCP vencida' : `RCP a revalidar en ${restan} día(s)`,
        texto: `La formación en RCP (${u.rcp.tipo || 'sin tipo'}) requiere revalidación bienal. Última certificación: ${fmtFecha(u.rcp.fecha)}.`,
        cuando: restan <= 0 ? 'Revalidación vencida' : `Quedan ${restan} días`,
      });
    }
  }
  if (jefe) {
    const porAutorizar = DB.usuarios.filter((x) => estadoCuenta(x) === 'pendiente');
    if (porAutorizar.length) {
      add({
        key: 'cuentas-pend', nivel: 'crit', vista: 'usuarios',
        titulo: `${porAutorizar.length} profesional(es) esperando autorización de la Jefatura`,
        texto: 'Altas registradas que todavía no pueden programar cirugías: ' + porAutorizar.map((x) => x.nombre).join('; ') + '.',
        cuando: 'Pendiente de resolución',
      });
    }
    const incompletos = DB.usuarios.filter((x) => !habilitacion(x).ok);
    if (incompletos.length) {
      add({
        key: 'hab-plantel', nivel: 'warn', vista: 'usuarios',
        titulo: `${incompletos.length} profesional(es) con habilitación incompleta`,
        texto: 'Auditoría de vigencias: matrícula, título de especialista, seguro de responsabilidad civil, RCP bienal y esquema de vacunación.',
        cuando: `${DB.usuarios.length - incompletos.length} de ${DB.usuarios.length} habilitados`,
      });
    }
  }

  const orden = { crit: 0, warn: 1, info: 2 };
  R.sort((a, b) => orden[a.nivel] - orden[b.nivel]);
  return R;
}

function revisarRecordatorios() {
  remLista = calcRecordatorios();
  pintarCampana();
  if (view === 'recordatorios') renderRecordatorios();
  notificarCriticos();
}
function pintarCampana() {
  const badge = $('bell-badge');
  if (!badge) return;
  // La campana cuenta lo que falta mirar, no lo que existe: los ya leídos
  // siguen en la lista pero dejan de reclamar atención.
  const pend = remSinLeer();
  const crit = pend.filter((r) => r.nivel === 'crit').length;
  const n = pend.length;
  badge.style.display = n ? 'block' : 'none';
  badge.textContent = n > 99 ? '99+' : String(n);
  badge.classList.toggle('crit', crit > 0);
  badge.style.background = crit ? 'var(--red)' : 'var(--amber)';
  const bn = $('bn-badge-rec');
  if (bn) { bn.style.display = n ? 'block' : 'none'; bn.textContent = n > 9 ? '9+' : String(n); }
  renderSidebar();
}
function notificarCriticos() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const hoy = hoyISO();
  // Además de los críticos, se avisan los recordatorios marcados con `notif`:
  // los del canal de reclamos, que están dirigidos a una persona concreta.
  remLista.filter((r) => r.nivel === 'crit' || r.notif).forEach((r) => {
    if (remNotificados[r.key] === hoy) return;
    if (remEsLeido(r)) return;   // ya lo miró: no se le vuelve a saltar al dispositivo
    remNotificados[r.key] = hoy;
    try {
      const n = new Notification('HRU Quirófanos — ' + r.titulo, {
        body: r.texto, icon: 'icon-192.png', badge: 'icon-192.png', tag: r.key,
      });
      n.onclick = () => {
        window.focus();
        if (r.reclamo) { reclamoAbierto = reclamoPermitido(r.reclamo) ? r.reclamo : null; go('reclamos'); marcarReclamoLeido(r.reclamo); }
        else go(r.vista || 'recordatorios');
        n.close();
      };
    } catch (e) { /* algunos navegadores exigen ServiceWorkerRegistration.showNotification */ }
  });
  guardarNotificados();
}
async function pedirPermisoNotif() {
  if (!('Notification' in window)) { alert('Este navegador no admite notificaciones del sistema. Los recordatorios seguirán visibles en la campana del encabezado.'); return; }
  const p = await Notification.requestPermission();
  if (p === 'granted') { remNotificados = {}; guardarNotificados(); notificarCriticos(); }
  renderRecordatorios();
}

function refreshView() {
  // No se re-renderizan las vistas con formularios en curso para no perder lo tipeado
  const conFormulario = ['nueva', 'acceso', 'perfil', 'consentimientos', 'excepcion'];
  if (conFormulario.includes(view)) return;
  // En Módulos solo hay campos editables para la Dirección: si está tipeando
  // uno de ellos, un cambio remoto no se lo puede borrar.
  if (view === 'modulos' && document.activeElement && document.activeElement.tagName === 'INPUT') return;
  // Los reclamos sí se refrescan en vivo, salvo que haya un asunto o un mensaje
  // a medio escribir: un cambio de otro usuario en la nube no puede borrarlo.
  if (view === 'reclamos' && hayTextoCargado()) return;
  go(view, true);
}

/* ================= DIÁLOGOS PROPIOS DE LA APP =================
   Los `alert()` y `confirm()` del navegador salían encabezados por el nombre
   del sitio —«claudioravasi-ai.github.io dice…»—, con la tipografía del sistema
   operativo y el aspecto de un error técnico. En una app clínica eso resta
   autoridad al mensaje: el cirujano no distingue un aviso del bloque quirúrgico
   de un cartel del navegador.

   Estos diálogos son propios: cabecera de color según el tono, ícono, trama de
   fondo, tipografía distinta a la del resto de la app y botones grandes.

   Cómo se usan:
     avisar(texto, opciones)     → informa y devuelve una promesa
     preguntar(texto, opciones)  → devuelve true/false, se usa con `await`
     pedirTexto(texto, opciones) → devuelve el texto escrito, o null si cancela

   `window.alert` queda apuntando a `avisar`, así que los cincuenta y pico de
   avisos repartidos por la app pasaron a la ventana nueva sin tocar una línea.
   `confirm` no se puede reemplazar igual —el del navegador frena la ejecución y
   el nuestro no—, así que cada pregunta se convirtió a `await preguntar(...)`.

   Los diálogos se encolan: si llega uno mientras otro está abierto, espera su
   turno en lugar de pisarlo. */
const DLG_TONOS = {
  info:     { c1: '#2980d9', c2: '#2fb9c9', soft: '#eef6fd', ring: 'rgba(41,128,217,0.24)',  kicker: 'Aviso',        icono: 'info',        titulo: 'Aviso' },
  ok:       { c1: '#1fa971', c2: '#4cc79a', soft: '#eefaf4', ring: 'rgba(31,169,113,0.24)',  kicker: 'Listo',        icono: 'checkCircle', titulo: 'Operación registrada' },
  aviso:    { c1: '#dd8c10', c2: '#f4c04e', soft: '#fdf6e8', ring: 'rgba(221,140,16,0.24)',  kicker: 'Atención',     icono: 'alertTri',    titulo: 'Atención' },
  peligro:  { c1: '#c62f2f', c2: '#ec6060', soft: '#fdeeee', ring: 'rgba(198,47,47,0.24)',   kicker: 'Cuidado',      icono: 'alertTri',    titulo: 'Confirme la acción' },
  pregunta: { c1: '#3b53c4', c2: '#7c3aed', soft: '#f1f0fe', ring: 'rgba(93,63,211,0.24)',   kicker: 'Confirmación', icono: 'info',        titulo: '¿Confirma?' },
  jefatura: { c1: '#0f766e', c2: '#2fb9c9', soft: '#eafaf8', ring: 'rgba(15,118,110,0.24)',  kicker: 'Jefatura de Quirófanos', icono: 'shield', titulo: 'Jefatura de Quirófanos' },
};
let dlgEl = null;          // overlay, se crea una sola vez
let dlgCola = [];          // diálogos esperando turno
let dlgActivo = null;      // { op, resolver }

/* Texto plano a HTML: respeta los saltos de línea y destaca los renglones que
   empiezan con «· », que es como está escrita media app. */
function dlgTexto(t) {
  return String(t == null ? '' : t).split('\n').map((l) => {
    const s = esc(l);
    return /^\s*·\s/.test(l) ? `<span style="display:block;padding-left:2px">${s}</span>` : s;
  }).join('<br>');
}
/* Muchos mensajes ya venían escritos como «Título\n\ncuerpo». Cuando es así, esa
   primera línea pasa a ser el título del diálogo en vez de repetirse adentro. */
function dlgPartir(texto) {
  const t = String(texto == null ? '' : texto);
  const i = t.indexOf('\n\n');
  if (i > 0 && i <= 78 && t.slice(0, i).indexOf('\n') < 0) {
    return { titulo: t.slice(0, i).trim(), cuerpo: t.slice(i + 2).trim() };
  }
  return { titulo: '', cuerpo: t };
}

function dlgNodo() {
  if (dlgEl) return dlgEl;
  dlgEl = document.createElement('div');
  dlgEl.className = 'dlg-ov';
  dlgEl.id = 'dlg-ov';
  document.body.appendChild(dlgEl);
  // En captura, para poder frenar el Escape global: mientras hay un diálogo
  // arriba, esa tecla le pertenece y no debe cerrar los modales de atrás.
  document.addEventListener('keydown', (e) => {
    if (!dlgActivo) return;
    if (e.key === 'Escape') {
      e.stopPropagation(); e.preventDefault();
      dlgCerrar(dlgActivo.op.tipo === 'aviso' ? true : null);
    } else if (e.key === 'Enter' && dlgActivo.op.tipo !== 'texto') {
      e.stopPropagation(); e.preventDefault();
      dlgCerrar(true);
    }
  }, true);
  return dlgEl;
}

function dlgAbrir(op) {
  return new Promise((resolver) => {
    dlgCola.push({ op, resolver });
    if (!dlgActivo) dlgPintar();
  });
}
function dlgPintar() {
  const sig = dlgCola.shift();
  if (!sig) {
    dlgActivo = null;
    if (dlgEl) dlgEl.classList.remove('open');
    return;
  }
  dlgActivo = sig;
  const op = sig.op;
  const T = DLG_TONOS[op.tono] || DLG_TONOS.info;
  const ov = dlgNodo();
  const campo = op.campo;
  ov.innerHTML = `
    <div class="dlg" role="dialog" aria-modal="true" style="--dlg-c1:${T.c1};--dlg-c2:${T.c2};--dlg-soft:${T.soft};--dlg-ring:${T.ring}">
      <div class="dlg-hdr">
        <div class="dlg-ico">${ico(ICONS[op.icono || T.icono] || ICONS.info, 26)}</div>
        <div>
          <div class="dlg-k">${esc(op.kicker || T.kicker)}</div>
          <div class="dlg-t">${esc(op.titulo || T.titulo)}</div>
        </div>
      </div>
      <div class="dlg-body">
        ${dlgTexto(op.cuerpo)}
        ${campo ? `<div class="dlg-campo">
          ${campo.label ? `<label for="dlg-inp">${esc(campo.label)}</label>` : ''}
          ${campo.multilinea
            ? `<textarea id="dlg-inp" placeholder="${esc(campo.placeholder || '')}">${esc(campo.valor || '')}</textarea>`
            : `<input type="text" id="dlg-inp" placeholder="${esc(campo.placeholder || '')}" value="${esc(campo.valor || '')}">`}
          <div class="dlg-err" id="dlg-err"></div>
        </div>` : ''}
      </div>
      <div class="dlg-pie">
        ${op.tipo === 'aviso' ? '' : `<button class="dlg-btn dlg-btn-no" id="dlg-no">${esc(op.no || 'Cancelar')}</button>`}
        <button class="dlg-btn dlg-btn-ok" id="dlg-si">${esc(op.si || 'Entendido')}</button>
      </div>
    </div>`;
  ov.classList.add('open');
  const si = $('dlg-si'), no = $('dlg-no'), inp = $('dlg-inp');
  si.onclick = () => dlgCerrar(true);
  if (no) no.onclick = () => dlgCerrar(null);
  if (inp) {
    setTimeout(() => { inp.focus(); if (inp.select) inp.select(); }, 60);
    if (!campo.multilinea) inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); dlgCerrar(true); } });
  } else {
    setTimeout(() => si.focus(), 60);
  }
}
function dlgCerrar(aceptado) {
  if (!dlgActivo) return;
  const { op, resolver } = dlgActivo;
  let valor;
  if (op.tipo === 'texto') {
    const inp = $('dlg-inp');
    const txt = inp ? inp.value.trim() : '';
    if (aceptado && op.campo && op.campo.requerido && !txt) {
      const err = $('dlg-err');
      if (err) { err.textContent = op.campo.error || 'Este dato es obligatorio.'; err.style.display = 'block'; }
      if (inp) inp.focus();
      return;   // no cierra: falta lo que se pidió
    }
    valor = aceptado ? txt : null;
  } else if (op.tipo === 'pregunta') {
    valor = aceptado === true;
  } else {
    valor = true;
  }
  dlgActivo = null;
  resolver(valor);
  // Encadena el siguiente de la cola, si lo hay.
  if (dlgCola.length) dlgPintar();
  else if (dlgEl) dlgEl.classList.remove('open');
}

/* ---- API pública ---- */
function avisar(texto, op) {
  const p = dlgPartir(texto);
  return dlgAbrir(Object.assign({ tipo: 'aviso', tono: 'info', si: 'Entendido' }, p, op || {}));
}
function preguntar(texto, op) {
  const p = dlgPartir(texto);
  return dlgAbrir(Object.assign({ tipo: 'pregunta', tono: 'pregunta', si: 'Sí, continuar', no: 'Cancelar' }, p, op || {}));
}
function pedirTexto(texto, op) {
  const p = dlgPartir(texto);
  return dlgAbrir(Object.assign({ tipo: 'texto', tono: 'pregunta', si: 'Guardar', no: 'Cancelar' }, p, op || {}));
}
/* Todo `alert(...)` de la app entra por acá. Se conserva el nombre para no
   reescribir cincuenta llamadas y para que cualquier aviso futuro herede solo
   la ventana nueva. */
window.alert = function (m) { avisar(m); };

const VIEWS = {};
const TITULOS = {
  panel: 'Panel', grilla: 'Programación Diaria', parte: 'Parte Quirúrgico', recordatorios: 'Recordatorios',
  nueva: 'Nueva Incidencia', confidenciales: 'Incidencias Confidenciales',
  solicitud: 'Solicitud Quirúrgica', mis: 'Mis Solicitudes', reclamos: 'Reclamos',
  perfil: 'Mi Perfil', programacion: 'Programación', confidenciales: 'Incidencias Confidenciales',
  kpis: 'Indicadores', usuarios: 'Profesionales', acceso: 'Acceso Profesional',
  comunicados: 'Comunicados', excepcion: 'Programación Fuera de Horario',
  estadisticas: 'Estadísticas Quirúrgicas', consentimientos: 'Consentimientos Médicos Informados',
  modulos: 'Módulos Quirúrgicos',
};
function go(v, silencioso) {
  if (v === 'confidenciales' && !jefe) { closeDrawer(); openJefeModal(); return; }
  if (['programacion', 'kpis', 'usuarios', 'comunicados', 'excepcion'].includes(v) && !jefe) { closeDrawer(); openJefeModal(); return; }
  if (['solicitud', 'mis', 'perfil', 'consentimientos'].includes(v) && !usuarioActual() && !jefe) { v = 'acceso'; }
  if (v === 'reclamos' && !usuarioActual() && !jefe) { v = 'acceso'; }
  // Los módulos los consulta el profesional acreditado (solo su servicio) o la
  // Dirección Médica (todo el hospital, con su propia clave).
  if (v === 'modulos' && !usuarioActual() && !director) { closeDrawer(); openDirectorModal(); return; }
  // Las estadísticas las consulta cualquier profesional acreditado; el desglose
  // nominal completo queda reservado a la Jefatura dentro de la propia vista.
  if (v === 'estadisticas' && !usuarioActual() && !jefe && !director) { v = 'acceso'; }
  view = v;
  closeDrawer();
  const t = $('topbar-title');
  if (t) t.textContent = TITULOS[v] || 'HRU Quirófanos';
  renderSidebar();
  (VIEWS[v] || VIEWS.panel)();
  if (!silencioso) {
    // Ruta en el hash: habilita los accesos directos del icono instalado,
    // el botón "atrás" del teléfono y compartir un enlace a una sección.
    if (location.hash.slice(1) !== v) {
      try { history.pushState({ v }, '', '#' + v); } catch (e) {}
    }
    window.scrollTo(0, 0);
  }
}
function vistaDelHash() {
  const h = location.hash.replace('#', '');
  return VIEWS[h] ? h : 'panel';
}

function barChart() {
  const counts = Object.keys(CATS).map((k) => DB.incidencias.filter((i) => i.categoria === k).length);
  const max = Math.max(4, ...counts);
  const W = 460, H = 240, padL = 30, padB = 28, padT = 10;
  const cw = (W - padL - 10) / 6;
  let bars = '', grid = '', labels = '';
  for (let t = 0; t <= max; t++) {
    if (max > 6 && t % 2 !== 0) continue;
    const y = padT + (H - padT - padB) * (1 - t / max);
    grid += `<line x1="${padL}" y1="${y}" x2="${W - 6}" y2="${y}" stroke="#d8dde3" stroke-dasharray="4 4" stroke-width="1"/>
             <text x="${padL - 8}" y="${y + 4}" font-size="11" fill="#8b929c" text-anchor="end">${t}</text>`;
  }
  Object.keys(CATS).forEach((k, idx) => {
    const c = counts[idx];
    const bh = (H - padT - padB) * (c / max);
    const x = padL + idx * cw + cw * 0.22;
    bars += `<rect x="${x}" y="${H - padB - bh}" width="${cw * 0.56}" height="${Math.max(bh, 0)}" rx="5" fill="${getComputedStyle(document.documentElement).getPropertyValue('--cat-' + k.toLowerCase()).trim() || '#888'}"/>`;
    labels += `<text x="${padL + idx * cw + cw / 2}" y="${H - 8}" font-size="12" font-weight="700" fill="#4b5563" text-anchor="middle">${k}</text>`;
  });
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">${grid}${bars}${labels}</svg></div>
    <div class="legend">${Object.keys(CATS).map((k) => `<span><span class="dot" style="background:${CATS[k].color}"></span>${k} — ${CATS[k].nombre}</span>`).join('')}</div>`;
}

function donutChart() {
  const total = DB.incidencias.length;
  const R = 74, CX = 110, CY = 105, SW = 34;
  const circ = 2 * Math.PI * R;
  let segs = '', off = 0;
  const partes = ESTADOS.map((e) => ({ e, n: DB.incidencias.filter((i) => i.estado === e).length })).filter((p) => p.n > 0);
  if (!total) {
    segs = `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#e5e7eb" stroke-width="${SW}"/>`;
  } else {
    partes.forEach((p) => {
      const frac = p.n / total;
      segs += `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none"
        stroke="${p.e === 'Pendiente' ? '#f0a92e' : p.e === 'En Revisión' ? '#2980d9' : '#1fa971'}"
        stroke-width="${SW}" stroke-dasharray="${frac * circ} ${circ}" stroke-dashoffset="${-off * circ}"
        transform="rotate(-90 ${CX} ${CY})"/>`;
      off += frac;
    });
  }
  return `<div style="display:flex;justify-content:center"><svg viewBox="0 0 220 210" style="width:220px">
      ${segs}
      <text x="${CX}" y="${CY - 2}" text-anchor="middle" font-size="30" font-weight="800" fill="#171c24">${total}</text>
      <text x="${CX}" y="${CY + 20}" text-anchor="middle" font-size="11" fill="#8b929c">incidencias</text>
    </svg></div>
    <div class="legend" style="justify-content:center">
      ${ESTADOS.map((e) => `<span><span class="dot" style="background:${ESTADO_COLOR[e]};border-radius:50%"></span>${e} (${DB.incidencias.filter((i) => i.estado === e).length})</span>`).join('')}
    </div>`;
}

      La categoría ${k} requiere <b>apertura simultánea de un expediente de evento adverso</b>.</div></div>`;
  } else {
    html = `<div class="cat-info diferido">${ICONS.info}<div>
      <strong>Reporte diferido — dentro de las 24 horas del evento</strong>
      El <b>Jefe del Servicio implicado</b> y la <b>Jefatura del SQC</b> son co-responsables del reporte.</div></div>`;
  }
  $('cat-info-slot').innerHTML = html;
}

function submitIncidencia(e) {
  e.preventDefault();
  if (!formCat) {
    $('cat-info-slot').innerHTML = `<div class="cat-info urgente">${ICONS.alertTri.replace('22','18').replace('22','18')}<div><strong>Seleccione una categoría</strong>Debe elegir la categoría de la incidencia (A–F) antes de enviar el reporte.</div></div>`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  const inc = {
    id: Date.now(),
    categoria: formCat,
    estado: 'Pendiente',
    fechaIncidencia: $('f-fecha').value,
    horaIncidencia: $('f-hora').value,
    fechaReporte: hoyISO(),
    personal: $('f-personal').value.trim(),
    servicio: $('f-servicio').value.trim(),
    desglose: $('f-desglose').value.trim(),
    informante: {
      nombre: $('f-nombre').value.trim(),
      dni: $('f-dni').value.trim(),
      telefono: $('f-tel').value.trim(),
      mail: $('f-mail').value.trim(),
    },
  };
  upsert('incidencias', inc);
  showSuccess(inc);
}

function showSuccess(inc) {
  const cat = CATS[inc.categoria];
  let plazoNote = '';
  if (inc.horaIncidencia) {
    const evento = new Date(`${inc.fechaIncidencia}T${inc.horaIncidencia}`);
    const horas = (Date.now() - evento.getTime()) / 36e5;
    const limite = cat.urgente ? 2 : 24;
    plazoNote = horas <= limite
      ? `<div style="color:var(--green);font-weight:600">✓ Reportada dentro del plazo (${cat.urgente ? '2 h' : '24 h'})</div>`
      : `<div style="color:var(--red);font-weight:600">⚠ Reportada fuera del plazo de ${cat.urgente ? '2 h' : '24 h'} (${horas.toFixed(1)} h transcurridas)</div>`;
  }
  $('ok-modal').innerHTML = `
    <button class="modal-close" onclick="closeOk()" aria-label="Cerrar">✕</button>
    <div class="success-icon">${ICONS.checkCircle.replace('22','30').replace('22','30')}</div>
    <h2>Incidencia registrada</h2>
    <p class="modal-sub" style="color:var(--muted)">Categoría <b style="color:${cat.color}">${inc.categoria}</b> — ${cat.nombre}</p>
    <div class="notify-list">
      <b>${ICONS.bell.replace('16','14')} Notificación automática enviada a:</b><br>
      · Jefatura del Servicio de Quirófanos Centrales (SQC)<br>
      · Jefe del Servicio implicado (${esc(inc.servicio)})<br>
      ${cat.urgente ? '· Dirección Médica<br>' : ''}
      ${cat.expediente ? '· <b>Se abre expediente de evento adverso</b><br>' : ''}
      ${plazoNote}
    </div>
    <p class="form-note" style="text-align:center;margin-bottom:16px">La respuesta será enviada a ${esc(inc.informante.mail)}</p>
    <button class="btn btn-blue" style="width:100%;justify-content:center" onclick="closeOk()">Volver al panel</button>`;
  $('ok-overlay').classList.add('open');
}
function closeOk() {
  $('ok-overlay').classList.remove('open');
  go('panel');
}

/* ================= CONFIDENCIALES (jefe) ================= */
function renderConfidenciales() {
  const list = DB.incidencias.filter((i) => {
    const q = filtros.q.toLowerCase();
    const matchQ = !q || i.desglose.toLowerCase().includes(q) || i.personal.toLowerCase().includes(q) || i.servicio.toLowerCase().includes(q) || i.informante.nombre.toLowerCase().includes(q);
    const matchC = !filtros.cat || i.categoria === filtros.cat;
    const matchE = !filtros.estado || i.estado === filtros.estado;
    return matchQ && matchC && matchE;
  });

  $('main').innerHTML = `
    <div class="page-head">
      <div class="head-row">
        <div class="head-icon">${ICONS.shieldCheck}</div>
        <div>
          <h1 class="page-title">Incidencias Confidenciales</h1>
          <p class="page-sub">Acceso exclusivo — Jefe de Quirófanos</p>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-box">
        ${ICONS.search}
        <input type="text" id="filter-q" placeholder="Buscar por descripción, médico, servicio..." value="${esc(filtros.q)}" oninput="setFiltro('q', this.value)">
      </div>
      <select onchange="setFiltro('cat', this.value)">
        <option value="">Todas las categorías</option>
        ${Object.keys(CATS).map((k) => `<option value="${k}" ${filtros.cat === k ? 'selected' : ''}>${k} — ${CATS[k].nombre}</option>`).join('')}
      </select>
      <select onchange="setFiltro('estado', this.value)">
        <option value="">Todos los estados</option>
        ${ESTADOS.map((e) => `<option ${filtros.estado === e ? 'selected' : ''}>${e}</option>`).join('')}
      </select>
    </div>
    <div class="result-count">${list.length} incidencia(s) encontrada(s)</div>
    ${list.length ? list.map(incCard).join('') : '<div class="empty">No se encontraron incidencias con los filtros aplicados.</div>'}`;

  // Solo se devuelve el foco si el usuario venía escribiendo en el buscador;
  // enfocarlo siempre abría el teclado en el móvil al entrar a la vista.
  const q = $('filter-q');
  if (q && incFocus) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  incFocus = false;
}
let incFocus = false;

function incCard(i) {
  const cat = CATS[i.categoria];
  return `
    <div class="inc-card" onclick="openDetalle(${i.id})">
      <div class="inc-top">
        <span class="chip"><span class="cat-letter" style="background:${cat.color};width:20px;height:20px;font-size:0.72rem;border-radius:6px">${i.categoria}</span> ${cat.nombre}</span>
        <span class="chip chip-estado-${i.estado.replace(' ', '\\ ')}">${i.estado === 'Resuelta' ? ICONS.checkCircle.replace('22','13').replace('22','13') : i.estado === 'En Revisión' ? ICONS.eyeSm.replace('16','13') : ICONS.clockSm.replace('14','13')} ${i.estado}</span>
        ${cat.urgente ? '<span class="chip" style="background:var(--red-soft);color:var(--red);border-color:#f3c8c8">2 h</span>' : ''}
        <div class="inc-actions">
          <button class="btn-del" onclick="event.stopPropagation();delIncidencia(${i.id})">${ICONS.trash} Limpiar</button>
          <span class="chev">${ICONS.chevron}</span>
        </div>
      </div>
      <div class="inc-desc">${esc(i.desglose)}</div>
      <div class="inc-meta">
        <span>${ICONS.calendar} ${fmtFecha(i.fechaIncidencia)}</span>
        <span>${ICONS.steth} ${esc(i.personal)}</span>
        <span>${ICONS.user} ${esc(i.informante.nombre)}</span>
      </div>
    </div>`;
}

function setFiltro(k, v) {
  filtros[k] = v;
  if (k === 'q') incFocus = true;
  renderConfidenciales();
}

async function delIncidencia(id) {
  if (!await preguntar('Se borra el registro completo de la incidencia y no se puede recuperar.',
    { titulo: '¿Eliminar la incidencia?', tono: 'peligro', si: 'Sí, eliminar' })) return;
  removeDoc('incidencias', id);
  renderConfidenciales();
}

function openDetalle(id) {

  if (!i) return;
  const cat = CATS[i.categoria];
  $('det-modal').innerHTML = `
    <button class="modal-close" onclick="closeDetalle()" aria-label="Cerrar">✕</button>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">

      <h4>Datos de la incidencia</h4>

      <div class="det-row"><b>Fecha del reporte</b> ${fmtFecha(i.fechaReporte)}</div>
      <div class="det-row"><b>Personal implicado</b> ${esc(i.personal)}</div>
      <div class="det-row"><b>Servicio implicado</b> ${esc(i.servicio)}</div>

      <div class="det-row"><b>Nombre y apellido</b> ${esc(i.informante.nombre)}</div>
      <div class="det-row"><b>DNI</b> ${esc(i.informante.dni)}</div>
      <div class="det-row"><b>Teléfono</b> ${esc(i.informante.telefono)}</div>
      <div class="det-row"><b>Mail institucional</b> ${esc(i.informante.mail)}</div>
    </div>

    <div class="det-section">
      <h4>Estado de la incidencia</h4>
      <div class="field" style="max-width:260px">
        <select onchange="setEstado(${i.id}, this.value)">
          ${ESTADOS.map((e) => `<option ${i.estado === e ? 'selected' : ''}>${e}</option>`).join('')}
        </select>
      </div>
    </div>`;
  $('det-overlay').classList.add('open');
}
function closeDetalle() { $('det-overlay').classList.remove('open'); }
function setEstado(id, estado) {
  const i = DB.incidencias.find((x) => x.id === id);
  if (!i) return;
  i.estado = estado;
  upsert('incidencias', i);

/* ================= PARTE QUIRÚRGICO (agenda pública) ================= */
function renderParte() {
  if (!parteFecha) parteFecha = hoyISO();
  const f = parteFecha;
  const publicado = partePublicado(f) || jefe;
  const lista = DB.cirugias
    .filter((c) => c.fecha === f && ['confirmada', 'en_curso', 'realizada', 'finalizada', 'suspendida'].includes(c.estado))
    .sort(ordenPrelacion);

  let contenido;
  if (!publicado) {
    contenido = `<div class="banner banner-amber">${ICONS.clockSm.replace('14', '18')}
      <div><strong>Parte aún no publicado</strong>
      El parte quirúrgico del ${fmtFecha(f)} se publica a las <b>${BLOQUE.publicacionParte} h</b> del día previo (${fmtFecha(sumarDias(f, -1))}).</div></div>`;
  } else if (!lista.length) {
    contenido = `<div class="empty">No hay cirugías confirmadas en el parte del ${fmtFecha(f)}.</div>`;
  } else {
    contenido = BLOQUE.quirofanos.map((q) => {
      const deQ = lista.filter((c) => c.quirofano === q);
      if (!deQ.length) return '';
      return `<div class="q-group">
        <div class="q-group-title">${ICONS.grid} ${esc(q)}</div>
        ${deQ.map((c) => parteCard(c)).join('')}
      </div>`;
    }).join('') || `<div class="empty">Sin cirugías asignadas a quirófanos.</div>`;
  }

  $('main').innerHTML = `
    <div class="page-head">
      <div>
        <h1 class="page-title">Parte Quirúrgico</h1>
        <p class="page-sub">Agenda oficial del bloque quirúrgico — ordenada por prioridad de prelación</p>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button class="btn btn-outline btn-sm" onclick="setParteFecha('${hoyISO()}')">Hoy</button>
        <button class="btn btn-outline btn-sm" onclick="setParteFecha('${sumarDias(hoyISO(), 1)}')">Mañana</button>
        <input type="date" value="${f}" onchange="setParteFecha(this.value)" style="padding:9px 13px;border:none;border-radius:10px;font-family:inherit;font-weight:600;box-shadow:0 1px 3px rgba(23,28,36,0.06)">
      </div>
    </div>

    <div class="banner banner-blue">${ICONS.info}
      <div><strong>Plazos del ciclo de programación</strong>
      Cierre de solicitudes: <b>${BLOQUE.cierreSolicitudes} h del día previo</b> · Publicación del parte: <b>${BLOQUE.publicacionParte} h del día previo</b> · Emergencias: ingreso directo con meta de incisión &lt; 30 min.</div></div>

    ${contenido}`;
}
function setParteFecha(f) { parteFecha = f; renderParte(); }

function parteCard(c) {
