        <div class="card-sub">${tot.suspendidas} suspensión(es) sobre ${tot.programadas} cirugías que llegaron al parte</div>
        ${causasArr.length ? causasArr.map(([c, n]) => `
          <div style="margin-bottom:12px">
            <div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:4px"><span>${esc(c)}</span><b>${n}</b></div>
            <div class="bar-track" style="margin-top:0"><div class="bar-fill" style="width:${(n / maxCausa) * 100}%;background:var(--red)"></div></div>
          </div>`).join('') : '<div class="empty" style="padding:20px 0">Sin suspensiones registradas en el período.</div>'}
      </div>
    </div>`;
}

/* ================= RECLAMOS (canal Jefe a Jefe) ================= */
const JEFATURA = 'Jefatura de Quirófanos';

/* El reclamo dejó de ser un mensaje con una única respuesta: ahora es un hilo.
   Los registros anteriores (asunto + texto + respuesta) se leen como un hilo de
   uno o dos mensajes, sin necesidad de migrar nada en la base. */
function hiloReclamo(r) {
  if (Array.isArray(r.mensajes) && r.mensajes.length) return r.mensajes;
  const h = [{ rol: 'autor', nombre: r.autor, email: r.autorMail || '', de: r.de, texto: r.texto, t: r.fechaHora }];
  if (r.respuesta) h.push({ rol: 'jefatura', nombre: JEFATURA, email: '', de: JEFATURA, texto: r.respuesta, t: r.fechaRespuesta || r.fechaHora });
  return h;
}
/* Papel de quien está mirando dentro de este reclamo. Si el jefe es además el
   autor, manda su condición de autor: es quien espera la respuesta. */
function rolEnReclamo(r) {
  const u = usuarioActual();
  if (u && r.autorMail && r.autorMail === u.email) return 'autor';
  if (jefe) return 'jefatura';
  return null;
}
function claveLector(r) {
  const rol = rolEnReclamo(r);
  if (rol === 'autor') return claveMail(usuarioActual().email);
  return rol === 'jefatura' ? '__jefatura' : '';
}
/* A quién le toca actuar: tras un mensaje del autor responde la Jefatura; tras
   una respuesta de la Jefatura, el autor debe leerla y cerrar o replicar. */
function turnoDeReclamo(r) {
  if (r.estado === 'cerrado') return null;
  const ult = hiloReclamo(r).slice(-1)[0];
  if (!ult) return null;
  return ult.rol === 'autor' ? 'jefatura' : 'autor';
}
function venceReclamo(r) {
  const delAutor = hiloReclamo(r).filter((m) => m.rol === 'autor').slice(-1)[0];
  return addHorasHabiles((delAutor && delAutor.t) || r.fechaHora, 48);
}
/* Cuántos mensajes leyó ya quien mira. Se guarda la cantidad de mensajes vistos
   y no la hora del último: `nowDT()` tiene precisión de minuto, y dos mensajes
   del mismo minuto harían que una respuesta se diera por leída sin serlo. */
function leidosPor(r) {
  const clave = claveLector(r);
  return clave ? (Number((r.leido || {})[clave]) || 0) : 0;
}
function reclamoNoLeidos(r) {
  const rol = rolEnReclamo(r);
  if (!rol) return 0;
  return hiloReclamo(r).slice(leidosPor(r)).filter((m) => m.rol !== rol).length;
}
/* ---- Quién ve un reclamo ----
   Un reclamo es un asunto entre dos partes: lo ven su autor y la Jefatura de
   Quirófanos, y nadie más. Otro profesional con sesión abierta no entra al hilo
   ni se entera de que el reclamo existe. Los registros antiguos sin `autorMail`
   no se pueden atribuir a nadie, así que quedan solo para la Jefatura. */
function puedeVerReclamo(r) { return !!rolEnReclamo(r); }
function reclamosVisibles() { return DB.reclamos.filter(puedeVerReclamo); }

/* Avisos de reclamos que le corresponden a quien está mirando: los que debe
   contestar y los que tienen respuestas sin leer. */
function reclamosPendientes() {
  return DB.reclamos.filter((r) => {
    const mio = rolEnReclamo(r);
    if (!mio || r.estado === 'cerrado') return false;
    return turnoDeReclamo(r) === mio || reclamoNoLeidos(r) > 0;
  }).length;
}
/* Las dos entradas al hilo revalidan el permiso: un enlace viejo de la campana
   o una llamada suelta no pueden abrir el reclamo de otro profesional. */
function reclamoPermitido(id) {
  const r = DB.reclamos.find((x) => String(x.id) === String(id));
  return r && puedeVerReclamo(r) ? r : null;
}
function verReclamo(id) {
  if (!reclamoPermitido(id)) { reclamoAbierto = null; renderReclamos(); return; }
  reclamoAbierto = (String(reclamoAbierto) === String(id)) ? null : id;
  if (reclamoAbierto !== null) marcarReclamoLeido(id);
  renderReclamos();
}
function abrirReclamo(id) {
  if (!reclamoPermitido(id)) { reclamoAbierto = null; renderReclamos(); return; }
  reclamoAbierto = id;
  marcarReclamoLeido(id);
  renderReclamos();
  const el = document.getElementById('msg-' + id);
  if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
function marcarReclamoLeido(id) {
  const r = DB.reclamos.find((x) => String(x.id) === String(id));
  if (!r || !puedeVerReclamo(r)) return;
  const clave = claveLector(r);
  if (!clave) return;
  const total = hiloReclamo(r).length;
  // Idempotente: sin esto, cada re-render volvería a escribir en la nube.
  if (leidosPor(r) >= total) return;
  r.leido = Object.assign({}, r.leido, { [clave]: total });
  upsert('reclamos', r);
}

function renderReclamos() {
  const u = usuarioActual();
  // Punto único de filtrado: todo lo que se muestra abajo sale de acá.
  const propios = reclamosVisibles();
  const aResponder = propios.filter((r) => turnoDeReclamo(r) === rolEnReclamo(r));
  const sinLeer = propios.filter((r) => r.estado !== 'cerrado' && reclamoNoLeidos(r) > 0);
  const permiso = ('Notification' in window) ? Notification.permission : 'unsupported';
  const lista = propios.slice().sort((a, b) => {
    // Primero lo que exige acción de quien mira, después por antigüedad.
    const pa = (rolEnReclamo(a) && turnoDeReclamo(a) === rolEnReclamo(a) ? 0 : 2) - (reclamoNoLeidos(a) ? 1 : 0);
    const pb = (rolEnReclamo(b) && turnoDeReclamo(b) === rolEnReclamo(b) ? 0 : 2) - (reclamoNoLeidos(b) ? 1 : 0);
    return pa - pb || String(ultimaActividad(b)).localeCompare(String(ultimaActividad(a)));
  });
  $('main').innerHTML = `
    <div class="page-head">
      <div class="head-row">
        <div class="head-icon">${ICONS.mail.replace('16', '20')}</div>
        <div>
          <h1 class="page-title">Canal de Reclamos</h1>
          <p class="page-sub">Comunicación formal Jefe a Jefe — plazo de respuesta: 48 horas hábiles</p>
        </div>
      </div>
    </div>

    ${aResponder.length ? `<div class="banner banner-amber">${ICONS.reply.replace('15', '18')}
      <div><strong>${aResponder.length} reclamo(s) esperan su respuesta</strong>
      ${aResponder.map((r) => `<div style="margin-top:6px">· <a href="#reclamos" onclick="event.preventDefault();abrirReclamo(${r.id})" style="color:inherit;font-weight:700">${esc(r.asunto)}</a> — ${esc(r.de)}, ${fmtDT(ultimaActividad(r))}</div>`).join('')}</div></div>` : ''}

    ${sinLeer.length ? `<div class="banner banner-green">${ICONS.mailOpen.replace('16', '18')}
      <div><strong>${sinLeer.length} reclamo(s) con mensajes sin leer</strong>
      ${sinLeer.map((r) => `<div style="margin-top:6px">· <a href="#reclamos" onclick="event.preventDefault();abrirReclamo(${r.id})" style="color:inherit;font-weight:700">${esc(r.asunto)}</a> — ${reclamoNoLeidos(r)} mensaje(s) nuevo(s)</div>`).join('')}</div></div>` : ''}

    ${permiso === 'granted' ? '' : `<div class="banner banner-blue">${ICONS.bell.replace('16', '18')}
      <div><strong>Active las notificaciones del dispositivo</strong>
      Recibirá un aviso cuando le toque responder un reclamo o cuando le respondan uno propio, sin depender de que revise la app.
      <div style="margin-top:10px"><button class="btn btn-blue btn-sm" onclick="pedirPermisoNotif()">${ICONS.bell} Activar notificaciones</button></div></div></div>`}

    <div class="banner banner-blue">${ICONS.lock}
      <div><strong>${jefe && !u ? 'Vista de Jefatura' : 'Su reclamo es confidencial'}</strong>
      ${jefe && !u
        ? 'Como Jefatura de Quirófanos usted ve todos los reclamos del hospital. Cada profesional, en cambio, solo ve los suyos.'
        : 'Cada reclamo lo ven únicamente <b>usted</b>, como autor, y la <b>Jefatura de Quirófanos</b>. Ningún otro profesional puede leerlo ni sabe que existe.'}</div></div>

    <div class="banner banner-blue">${ICONS.info}
      <div><strong>Principio de Cultura Justa</strong>
      El canal de reclamos es para desacuerdos formales entre jefaturas de servicio. No reemplaza el reporte de incidencias: los eventos adversos, cuasi-accidentes y fallas de proceso se cargan en <b>Nueva Incidencia</b>.</div></div>

    ${u ? `<div class="card">
      <div class="card-title">Nuevo reclamo</div>
      <div class="card-sub">Se registra a nombre de ${esc(u.nombre)} (${esc(u.servicio)}) y se dirige a la Jefatura de Quirófanos</div>
      <div class="form-grid">
        <div class="field full"><label>Asunto *</label><input type="text" id="r-asunto" placeholder="Motivo del reclamo"></div>
        <div class="field full"><label>Detalle *</label><textarea id="r-texto" placeholder="Describa la situación, los antecedentes y la solución solicitada..."></textarea></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-blue" onclick="enviarReclamo()">${ICONS.send} Enviar reclamo</button>
        <p class="form-note">La Jefatura debe responder dentro de las <b>48 horas hábiles</b>. Mientras el reclamo siga abierto, ambas partes reciben recordatorios en la campana y en el dispositivo.</p>
      </div>
    </div>` : ''}

    <div class="result-count">${lista.length} reclamo(s) ${jefe && !u ? 'registrado(s) en el hospital' : 'suyo(s)'}${aResponder.length ? ` · ${aResponder.length} a su cargo` : ''}</div>
    ${lista.length ? lista.map(reclamoCard).join('') : `<div class="empty">${jefe && !u ? 'No hay reclamos registrados.' : 'Usted no tiene reclamos registrados. Los reclamos de otros profesionales no se muestran acá.'}</div>`}`;
}

function ultimaActividad(r) {
  const h = hiloReclamo(r);
  return (h.length ? h[h.length - 1].t : r.fechaHora) || r.fechaHora;
}

function mensajeHTML(m, nuevo) {
  const quien = m.nombre || (m.rol === 'jefatura' ? JEFATURA : 'Autor');
  return `<div class="msg ${m.rol === 'jefatura' ? 'jefatura' : ''} ${nuevo ? 'nuevo' : ''}">
    <div class="msg-head">
      <span class="quien">${m.rol === 'jefatura' ? ICONS.shield.replace('18', '13') : ICONS.user.replace('14', '13')} ${esc(quien)}</span>
      <span>${m.de && m.de !== quien ? esc(m.de) : ''}</span>
      <span style="margin-left:auto">${fmtDT(m.t)}</span>
      ${nuevo ? '<span class="sin-leer">Nuevo</span>' : ''}
    </div>
    <div class="msg-txt">${esc(m.texto)}</div>
  </div>`;
}

function reclamoCard(r) {
  const rol = rolEnReclamo(r);
  const turno = turnoDeReclamo(r);
  const nuevos = reclamoNoLeidos(r);
  const hilo = hiloReclamo(r);
  const leidos = leidosPor(r);
  const vence = venceReclamo(r);
  const vencido = turno === 'jefatura' && new Date() > vence;
  const abierto = String(reclamoAbierto) === String(r.id);
  const estadoChip = r.estado === 'cerrado'
    ? 'background:#eef1f4;color:#4b5563;border-color:var(--line)'
    : turno === 'jefatura' ? 'background:var(--amber-soft);color:#92600a;border-color:#f3ddb0'
      : 'background:var(--green-soft);color:#166b4a;border-color:#b9e8d2';
  const estadoTxt = r.estado === 'cerrado' ? 'Cerrado' : turno === 'jefatura' ? 'Esperando respuesta' : 'Respondido';

  return `<div class="inc-card" style="cursor:default">
    <div class="inc-top">
      <span class="chip" style="${estadoChip}">${estadoTxt}</span>
      <span class="chip">${ICONS.calendar} ${fmtDT(r.fechaHora)}</span>
      ${turno ? `<span class="turno-de">${ICONS.reply.replace('15', '12')} Debe responder: ${turno === 'jefatura' ? JEFATURA : esc(r.autor)}${turno === rol ? ' (usted)' : ''}</span>` : ''}
      ${nuevos ? `<span class="sin-leer">${ICONS.msg.replace('16', '12')} ${nuevos} sin leer</span>` : ''}
      ${turno === 'jefatura' ? `<span class="chip" style="${vencido ? 'background:var(--red-soft);color:var(--red);border-color:#f3c8c8' : ''}">${ICONS.clockSm} ${vencido ? 'Plazo vencido' : 'Vence ' + fmtDT(dateToDT(vence))}</span>` : ''}
    </div>
    <div style="font-weight:700;font-size:0.98rem;margin-bottom:6px">${esc(r.asunto)}</div>
    ${abierto ? '' : `<div class="inc-desc" style="-webkit-line-clamp:3">${esc(hilo[hilo.length - 1].texto)}</div>`}
    <div class="inc-meta"><span>${ICONS.user} ${esc(r.autor)} · ${esc(r.de)}</span><span>${ICONS.mail.replace('16', '14')} ${esc(r.para)}</span><span>${ICONS.msg.replace('16', '14')} ${hilo.length} mensaje(s)</span></div>

    <div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:8px">
      <button class="btn btn-sm btn-outline" onclick="verReclamo(${r.id})">${ICONS.msg} ${abierto ? 'Ocultar conversación' : `Ver conversación (${hilo.length})`}</button>
      ${rol && r.estado !== 'cerrado' ? `<button class="btn btn-sm btn-outline" onclick="cerrarReclamo(${r.id})">${ICONS.archive} Dar por cerrado</button>` : ''}
      ${rol && r.estado === 'cerrado' ? `<button class="btn btn-sm btn-outline" onclick="reabrirReclamo(${r.id})">${ICONS.refresh} Reabrir</button>` : ''}
      ${rol === 'jefatura' && r.autorMail ? `<a class="btn btn-sm btn-outline" href="${avisoMailto(r)}">${ICONS.mail.replace('16', '15')} Avisar por correo</a>` : ''}
    </div>

    ${abierto ? `<div style="margin-top:16px">
      ${hilo.map((m, i) => mensajeHTML(m, !!rol && m.rol !== rol && i >= leidos)).join('')}
      ${rol && r.estado !== 'cerrado' ? `<div class="field" style="margin-top:12px">
        <label>${rol === 'jefatura' ? 'Respuesta de la Jefatura' : 'Su réplica'}</label>
        <textarea id="msg-${r.id}" style="min-height:84px" placeholder="${rol === 'jefatura' ? 'Respuesta formal...' : 'Agregue información o responda a la Jefatura...'}"></textarea>
      </div>
      <button class="btn btn-sm btn-blue" style="margin-top:10px" onclick="enviarMensajeReclamo(${r.id})">${ICONS.send} Enviar ${rol === 'jefatura' ? 'respuesta' : 'mensaje'}</button>` : ''}
      ${!rol ? `<p class="form-note" style="margin-top:10px">Solo el autor del reclamo y la Jefatura de Quirófanos pueden escribir en este hilo.</p>` : ''}
    </div>` : ''}
  </div>`;
}

/* Aviso por correo: abre un borrador en el cliente de correo del dispositivo.
   El envío lo hace la persona, la app no manda nada por su cuenta. */
function avisoMailto(r) {
  const asunto = `HRU Quirófanos — respuesta a su reclamo: ${r.asunto}`;
  const cuerpo = `Estimado/a ${r.autor}:\n\nLa Jefatura de Quirófanos registró una respuesta a su reclamo "${r.asunto}".\nPuede leerla en la app, en la sección Reclamos.\n\n${location.origin}${location.pathname}#reclamos\n`;
  return `mailto:${encodeURIComponent(r.autorMail)}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
}

function enviarReclamo() {
  const u = usuarioActual();
  const asunto = $('r-asunto').value.trim();
  const texto = $('r-texto').value.trim();
  if (!u || !asunto || !texto) { alert('Complete el asunto y el detalle del reclamo.'); return; }
  const t = nowDT();
  const id = Date.now();
  upsert('reclamos', {
    id, de: u.servicio, para: JEFATURA, asunto, texto,
    autor: u.nombre, autorMail: u.email, fechaHora: t,
    estado: 'abierto', respuesta: '', fechaRespuesta: '',
    mensajes: [{ rol: 'autor', nombre: u.nombre, email: u.email, de: u.servicio, texto, t }],
    leido: { [claveMail(u.email)]: 1 },
  });
  reclamoAbierto = id;
  renderReclamos();
}

function enviarMensajeReclamo(id) {
  const r = DB.reclamos.find((x) => String(x.id) === String(id));
  if (!r) return;
  const rol = rolEnReclamo(r);
  if (!rol) { alert('Solo el autor del reclamo y la Jefatura pueden escribir en este hilo.'); return; }
  const ta = $('msg-' + id);
  const texto = ta ? ta.value.trim() : '';
  if (!texto) { alert('Escriba el mensaje.'); return; }
  const u = usuarioActual();
  const t = nowDT();
  const hilo = hiloReclamo(r).slice();
  hilo.push({
    rol, texto, t,
    nombre: rol === 'jefatura' ? JEFATURA : (u ? u.nombre : r.autor),
    email: rol === 'jefatura' ? '' : (u ? u.email : r.autorMail || ''),
    de: rol === 'jefatura' ? JEFATURA : (u ? u.servicio : r.de),
  });
  r.mensajes = hilo;
  r.estado = rol === 'jefatura' ? 'respondido' : 'abierto';
  // Espejo de la primera respuesta en los campos de la versión anterior.
  if (rol === 'jefatura' && !r.respuesta) { r.respuesta = texto; r.fechaRespuesta = t; }
  // Quien escribe leyó todo el hilo, incluido su propio mensaje.
  r.leido = Object.assign({}, r.leido, { [claveLector(r)]: hilo.length });
  if (ta) ta.value = '';
  upsert('reclamos', r);
  reclamoAbierto = r.id;
  renderReclamos();
}

function cerrarReclamo(id) {
  const r = DB.reclamos.find((x) => String(x.id) === String(id));
  if (!r || !rolEnReclamo(r)) return;
  if (!confirm('¿Dar por cerrado este reclamo? Dejarán de emitirse recordatorios. Puede reabrirse después.')) return;
  r.estado = 'cerrado';
  r.cerradoPor = rolEnReclamo(r) === 'jefatura' ? JEFATURA : (usuarioActual()?.nombre || r.autor);
  r.fechaCierre = nowDT();
  upsert('reclamos', r);
  renderReclamos();
}
function reabrirReclamo(id) {
  const r = DB.reclamos.find((x) => String(x.id) === String(id));
  if (!r || !rolEnReclamo(r)) return;
  r.estado = hiloReclamo(r).slice(-1)[0]?.rol === 'autor' ? 'abierto' : 'respondido';
  r.cerradoPor = ''; r.fechaCierre = '';
  upsert('reclamos', r);
  renderReclamos();
}

async function doLogin() {
  const mail = $('l-mail').value.trim().toLowerCase();
  const pass = $('l-pass').value;
  const u = DB.usuarios.find((x) => x.email.toLowerCase() === mail);
  const h = await hashPass(pass);
  if (!u || u.passHash !== h) {
    $('login-error').textContent = 'Correo o contraseña incorrectos.';
    $('login-error').style.display = 'block';
    return;
  }
  if (estadoCuenta(u) === 'baja') {
    $('login-error').textContent = 'Su cuenta fue dada de baja por la Jefatura de Quirófanos'
      + motivoCuenta(u) + ' Comuníquese con la Jefatura de Quirófanos.';
    $('login-error').style.display = 'block';
    return;
  }
  sessionStorage.setItem('hru_user', u.email);
  if (!cuentaAprobada(u)) {
    alert('Su cuenta está PENDIENTE DE AUTORIZACIÓN por la Jefatura de Quirófanos.\n\nPuede consultar la grilla y completar su documentación, pero no programar cirugías hasta que la Jefatura la autorice.');
  }
  go('mis');
  // Recién ahora hay identidad de lectura: pueden esperarlo comunicados sin confirmar.
  setTimeout(revisarComunicados, 400);
}

async function doAlta() {
  const err = $('alta-error');
  const nombre = $('a-nombre').value.trim(), dni = $('a-dni').value.trim();
  // Canónico: escrito a mano, «Cirugia General» y «Cirugía General» quedaban
  // como dos servicios distintos y el cirujano no veía sus propios módulos.
  const mail = $('a-mail').value.trim().toLowerCase(), serv = servicioCanonico($('a-serv').value);
  const p1 = $('a-pass').value, p2 = $('a-pass2').value;
  const fail = (m) => { err.textContent = m; err.style.display = 'block'; };
  if (!nombre || !dni || !mail || !serv || !p1) return fail('Complete todos los campos.');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) return fail('Ingrese un correo institucional válido.');
  if (p1.length < 6) return fail('La contraseña debe tener al menos 6 caracteres.');
  if (p1 !== p2) return fail('Las contraseñas no coinciden.');
  if (DB.usuarios.some((u) => u.email.toLowerCase() === mail)) return fail('Ya existe una cuenta con ese correo.');
  const u = {
    id: mail.replace(/[.#$/\[\]]/g, ','),
    email: mail, nombre, dni, servicio: serv,
    matricula: { numero: '', vigente: false },
    especialista: { titulo: '', si: false },
    seguro: { vence: '' },
    rcp: { tipo: '', fecha: '' },
    vacunas: { hepB: false, dobleAdultos: false, influenza: false, covid: false },
    // Toda alta queda a la espera del visto de la Jefatura de Quirófanos.
    cuenta: 'pendiente', cuentaMotivo: '', cuentaFecha: nowDT(),
    passHash: await hashPass(p1), creado: hoyISO(),
  };
  upsert('usuarios', u);
  sessionStorage.setItem('hru_user', u.email);
  alert('Cuenta creada correctamente.\n\nSu acceso queda PENDIENTE DE AUTORIZACIÓN por la Jefatura de Quirófanos: hasta que la Jefatura lo habilite no podrá programar cirugías.\n\nMientras tanto, complete su documentación de habilitación en Mi Perfil.');
  go('perfil');
}

function userLogout() {
  sessionStorage.removeItem('hru_user');
  cerrarComunicado();  // sin identidad no hay a quién registrarle la lectura
  go('panel');
}

/* ---- Acciones de la Jefatura sobre una cuenta ----
   Todas piden la clave 0112 aunque la sesión de Jefatura ya esté abierta: dar de
   baja a un cirujano lo deja fuera del sistema y no puede salir de un clic
   distraído en una terminal compartida del quirófano. */
function usuarioPorId(id) { return DB.usuarios.find((u) => String(u.id) === String(id)) || null; }

function autorizarCuenta(id) {
  const u = usuarioPorId(id);
  if (!u) return;
  const alta = estadoCuenta(u) === 'baja';
  pedirClave('Jefatura de Quirófanos', `${alta ? 'Reactivar' : 'Autorizar'} la cuenta de ${u.nombre}. Ingrese la clave de Jefatura.`, JEFE_CLAVE, () => {
    u.cuenta = 'aprobado';
    u.cuentaMotivo = '';
    u.cuentaFecha = nowDT();
    upsert('usuarios', u);
    renderUsuarios();
    alert(`${u.nombre} quedó ${alta ? 'reactivado' : 'autorizado'} por la Jefatura de Quirófanos.` +
      (habilitacion(u).ok ? '' : '\n\nAtención: su habilitación documental sigue incompleta, así que todavía no podrá programar hasta que cargue los requisitos faltantes en Mi Perfil.'));
  });
}

function darDeBajaCuenta(id) {
  const u = usuarioPorId(id);
  if (!u) return;
  pedirClave('Jefatura de Quirófanos', `Dar de baja la cuenta de ${u.nombre}. Ingrese la clave de Jefatura.`, JEFE_CLAVE, () => {
    const motivo = prompt(`Motivo de la baja de ${u.nombre}:\n\n(Queda registrado y se le muestra al profesional cuando intente ingresar.)`, '');
    if (motivo === null) return;
    if (!motivo.trim()) { alert('La baja exige un motivo escrito.'); return; }
    u.cuenta = 'baja';
    u.cuentaMotivo = motivo.trim();
    u.cuentaFecha = nowDT();
    upsert('usuarios', u);
    renderUsuarios();
    alert(`${u.nombre} fue dado de baja. No podrá ingresar ni programar cirugías.\n\nLos turnos que ya haya programado se conservan: revíselos en Programación.`);
  });
}

/* Eliminar borra el registro de la base. Se ofrece sobre todo para limpiar los
   datos de prueba; los turnos ya cargados por esa persona no se tocan. */
function eliminarProfesional(id) {
  const u = usuarioPorId(id);
  if (!u) return;
  const suyos = DB.cirugias.filter((c) => c.cirujanoEmail === u.email).length;
  pedirClave('Jefatura de Quirófanos', `Eliminar definitivamente la cuenta de ${u.nombre}. Ingrese la clave de Jefatura.`, JEFE_CLAVE, () => {
    if (!confirm(`¿Eliminar la cuenta de ${u.nombre} (${u.email})?\n\n` +
      (suyos ? `Tiene ${suyos} turno(s) cargado(s), que NO se eliminan.\n\n` : '') +
      'Esta acción no se puede deshacer. Si solo quiere impedirle el acceso, use "Dar de baja".')) return;
    removeDoc('usuarios', u.id);
    renderUsuarios();
  });
}

/* ================= DATOS DE PRUEBA (Jefatura) =================
   Alta y baja de un juego de profesionales y cirugías marcados con `prueba: true`
   para recorrer el circuito completo en la base real. Se guardan en Firebase
   como cualquier otro registro —esa es la idea: probar contra la base
   compartida— y la Jefatura los borra de un clic cuando termina de mirarlos. */
const CLAVE_PRUEBA = 'prueba123';

function hayDatosPrueba() {
  return DB.usuarios.some((u) => u.prueba) || DB.cirugias.some((c) => c.prueba);
}

function cardDatosPrueba() {
  const nu = DB.usuarios.filter((u) => u.prueba).length;
  const nc = DB.cirugias.filter((c) => c.prueba).length;
  return `<div class="card" style="margin-top:18px">
    <div class="card-title">Datos de prueba</div>
    <div class="card-sub">Juego de profesionales y cirugías para recorrer el circuito completo</div>
    ${hayDatosPrueba()
      ? `<div class="banner banner-amber" style="margin:0 0 12px">${ico(ICONS.alertTri, 18)}
          <div><strong>Hay datos de prueba cargados</strong>
          ${nu} profesional(es) y ${nc} cirugía(s) marcados como PRUEBA, guardados en la base compartida. Bórrelos cuando termine de verificar el funcionamiento.</div></div>`
      : `<p class="form-note" style="margin:0 0 12px">Carga cuatro profesionales (uno autorizado, uno pendiente, uno sin documentación completa y uno dado de baja) y cinco cirugías que cubren los cuatro estados de autorización: pendiente, autorizada, no autorizada con motivo y urgencia exenta. Abre además la agenda de los días que usan esos turnos.</p>`}
    <div class="cir-actions" style="margin:0">
      <button class="btn btn-blue" onclick="cargarDatosPrueba()">${ico(ICONS.userPlus, 16)} Cargar datos de prueba</button>
      ${hayDatosPrueba() ? `<button class="btn btn-red" onclick="borrarDatosPrueba()">${ico(ICONS.trash, 16)} Borrar todos los datos de prueba</button>` : ''}
    </div>
    <p class="form-note" style="margin-top:10px">Los profesionales de prueba ingresan con su correo y la contraseña <b>${CLAVE_PRUEBA}</b>.</p>
  </div>`;
}

/* Primera franja de la sala que no tenga turno cargado ese día. */
function franjaLibre(d, sid, desde) {
  const fr = sala(sid).franjas;
  const i0 = Math.max(0, fr.findIndex((f) => f.id === desde));
  for (let i = i0; i < fr.length; i++) if (!turnoEn(d, sid, fr[i].id)) return fr[i];
  for (let i = 0; i < i0; i++) if (!turnoEn(d, sid, fr[i].id)) return fr[i];
  return null;
}

async function cargarDatosPrueba() {
  if (hayDatosPrueba() && !confirm('Ya hay datos de prueba cargados. ¿Volver a generarlos?\n\nLos anteriores se reemplazan.')) return;
  pedirClave('Jefatura de Quirófanos', 'Cargar los datos de prueba en la base compartida. Ingrese la clave de Jefatura.', JEFE_CLAVE, async () => {
    if (hayDatosPrueba()) quitarDatosPrueba();
    const hash = await hashPass(CLAVE_PRUEBA);
    const hoy = hoyISO();
    const d2 = sumarDias(hoy, 2), d3 = sumarDias(hoy, 3);

    /* ---- Profesionales ---- */
    const base = (email, nombre, dni, servicio, mat, extra) => Object.assign({
      id: 'PRUEBA-' + email.replace(/[.#$/\[\]]/g, ','),
      email, nombre, dni, servicio,
      matricula: { numero: mat, vigente: true },
      especialista: { titulo: 'Especialista en ' + servicio + ' (MSAL)', si: true },
      seguro: { vence: sumarDias(hoy, 300) },
      rcp: { tipo: 'Avanzado (ACLS)', fecha: sumarDias(hoy, -200) },
      vacunas: { hepB: true, dobleAdultos: true, influenza: true, covid: true },
      cuenta: 'pendiente', cuentaMotivo: '', cuentaFecha: nowDT(),
      passHash: hash, creado: hoy, prueba: true,
    }, extra || {});

    const usuarios = [
      base('prueba.sosa@hru.gob.ar', '[PRUEBA] Dr. Martín Sosa', '28.114.907', 'Cirugía General', 'MP 3011 (TDF)',
        { cuenta: 'aprobado' }),
      base('prueba.benitez@hru.gob.ar', '[PRUEBA] Dra. Carla Benítez', '31.220.443', 'Traumatología y Ortopedia', 'MP 3012 (TDF)',
        { cuenta: 'pendiente' }),
      // Autorizado por Jefatura pero con la documentación a medio cargar: sirve
      // para ver que los dos controles son independientes.
      base('prueba.vera@hru.gob.ar', '[PRUEBA] Dr. Ignacio Vera', '30.556.118', 'Urología', 'MP 3013 (TDF)',
        { cuenta: 'aprobado', seguro: { vence: '' }, rcp: { tipo: '', fecha: '' },
          vacunas: { hepB: true, dobleAdultos: false, influenza: false, covid: true } }),
      base('prueba.ledesma@hru.gob.ar', '[PRUEBA] Dra. Sofía Ledesma', '27.889.302', 'Ginecología', 'MP 3014 (TDF)',
        { cuenta: 'baja', cuentaMotivo: 'Baja de prueba: seguro de responsabilidad civil vencido y sin renovar.' }),
    ];
    usuarios.forEach((u) => upsert('usuarios', u));

    /* ---- Agenda: abrir los días que usan los turnos de prueba ---- */
    [d2, d3].forEach((d) => abrirDiaEnTurnos(d, ['M', 'T']));

    /* ---- Cirugías ---- */
    const sosa = usuarios[0], benitez = usuarios[1];
    let seq = 0;
    const mk = (d, sid, desdeFranja, datos) => {
      const f = franjaLibre(d, sid, desdeFranja);
      if (!f) return null;
      const c = Object.assign({
        id: Date.now() + (seq++),
        prueba: true,
        sala: sid, quirofano: sala(sid).nombre, franja: f.id,
        fecha: fechaDeFranja(d, f), diaGrilla: d, horaProg: f.t,

/* ================= PROGRAMACIÓN DIARIA (GRILLA DE TURNOS) =================
   Superficie principal de programación: una grilla por día con las seis salas
   y sus franjas horarias. Cada franja ocupada es un turno quirúrgico completo
   que recorre el circuito de estados (borrador → pendiente → validada →
   confirmada → en curso → realizada / suspendida), con su prioridad de
   prelación, su LVQ y su coordinación de áreas. */
let diaSel = null;
let slotCtx = null;

/* ================= HABILITACIÓN DEL BLOQUE =================
   El bloque programado **nace cerrado**. Todos los días, en los quirófanos 2, 3
   y 4 y en la Sala de Endoscopía, los turnos de mañana y de tarde aparecen
   bloqueados hasta que la Jefatura de Quirófanos los abra. Dos salas quedan
   fuera de la llave: el Quirófano 1 —guardia de urgencias de 08 a 08, que no se
   cierra nunca— y el Quirófano de Obstetricia —cesáreas—, abierto salvo cierre
   expreso de la Jefatura.

   Lo abierto se guarda en la colección `agenda`, un documento por fecha:
       { id: '2026-08-20', on: true, salas: { Q2: { M: true, T: false } } }
   `on` es el día; dentro de cada sala, una llave por turno ('M' mañana,
   'T' tarde). Ausente = cerrado. Como todo pasa por `upsert`, cada cambio viaja
   a Firebase y aparece en el resto de las computadoras en el momento. */
const TURNOS_BLOQUE = [
  { p: 'M', label: 'Mañana', rango: '08:00 – 14:00' },
  { p: 'T', label: 'Tarde', rango: '14:00 – 20:00' },
  { p: 'N', label: 'Guardia Nocturna', rango: '20:00 – 08:00 del día siguiente' },
];
const rotuloTurno = (p) => TURNOS_BLOQUE.find((t) => t.p === p) || TURNOS_BLOQUE[0];
/* Turnos que realmente tiene una sala, en orden de reloj. */
function turnosDeSala(s) {
  return TURNOS_BLOQUE.map((t) => t.p).filter((p) => s.franjas.some((f) => f.p === p));
}
/* Salas que la Jefatura abre y cierra (las de acceso permanente no cuentan). */
const salasProgramables = () => SALAS.filter((s) => !s.siempreAbierta);

function agendaDia(d) { return DB.agenda.find((a) => a.id === d) || null; }
function cfgSala(d, sid) { const a = agendaDia(d); return (a && a.salas && a.salas[sid]) || null; }
function diaHabilitado(d) { const a = agendaDia(d); return !!(a && a.on === true); }
function turnoHabilitado(d, sid, p) {
  const s = sala(sid);
  if (s.guardia24) return true;                       // la guardia nunca se cierra
  const cfg = cfgSala(d, sid);
  if (s.siempreAbierta) return !cfg || cfg[p] !== false;
  return !!(diaHabilitado(d) && cfg && cfg[p] === true);
}
function salaHabilitada(d, sid) {
  return turnosDeSala(sala(sid)).some((p) => turnoHabilitado(d, sid, p));
}
function franjaHabilitada(d, sid, fid) {
  const f = franjaDe(sid, fid);
  return !!f && turnoHabilitado(d, sid, f.p);
}
/* Franjas del día realmente ofrecidas: es la capacidad que abrió la Jefatura. */
function franjasAbiertas(d) {
  return SALAS.reduce((n, s) => n + s.franjas.filter((f) => turnoHabilitado(d, s.id, f.p)).length, 0);
}

function guardarAgenda(d, mut) {
  const a = agendaDia(d) || { id: d, on: false, salas: {} };
  a.salas = a.salas || {};
  mut(a);
  upsert('agenda', a);
}
/* Abrir un turno abre el día: no puede quedar una franja disponible en un día
   cerrado. Cerrar el día, en cambio, cierra todo lo que hubiera abierto. */
function setTurnoOn(d, sid, p, v) {
  guardarAgenda(d, (a) => {
    a.salas[sid] = Object.assign({}, a.salas[sid], { [p]: v });
    if (v) a.on = true;
  });
}
function setSalaOn(d, sid, v) {
  guardarAgenda(d, (a) => {
    const cfg = Object.assign({}, a.salas[sid]);
    turnosDeSala(sala(sid)).forEach((p) => { cfg[p] = v; });
    a.salas[sid] = cfg;
    if (v) a.on = true;
  });
}
function setDiaOn(d, v) {
  guardarAgenda(d, (a) => { a.on = v; if (!v) a.salas = {}; });
}
/* Abre el día completo en los turnos indicados, en todas las salas programables. */
function abrirDiaEnTurnos(d, turnos) {
  guardarAgenda(d, (a) => {
    a.on = true;
    salasProgramables().forEach((s) => {
      const cfg = Object.assign({}, a.salas[s.id]);
      turnosDeSala(s).forEach((p) => { if (turnos.indexOf(p) >= 0) cfg[p] = true; });
      a.salas[s.id] = cfg;
    });
  });
}
/* Copia la configuración de un día a un rango. Sin esto la Jefatura tendría que
   repetir la apertura día por día durante todo el año. */
function copiarAgendaA(origen, dias, soloHabiles) {
  const base = agendaDia(origen);
  if (!base) return 0;
  let n = 0;
  for (let i = 1; i <= dias; i++) {
    const d = sumarDias(origen, i);
    if (soloHabiles && !esLaborable(d)) continue;
    upsert('agenda', { id: d, on: base.on === true, salas: JSON.parse(JSON.stringify(base.salas || {})) });
    n++;
  }
  return n;
}

/* Día de grilla al que pertenece un turno. Coincide con `fecha` salvo en las
   franjas de madrugada de la guardia del Quirófano 1, que se muestran en el día
   anterior (la guardia de 08 a 08) pero se operan en la fecha siguiente. */
function diaDeGrilla(c) { return c.diaGrilla || c.fecha; }
function turnoEn(d, sid, fid) {
  return DB.cirugias.find((c) => diaDeGrilla(c) === d && c.sala === sid && c.franja === fid) || null;
}
/* Fecha y hora reales de comienzo de una franja del día `d`. */
function fechaDeFranja(d, f) { return f && f.nd ? sumarDias(d, f.nd) : d; }
function inicioDeFranja(d, f) { return new Date(fechaDeFranja(d, f) + 'T' + f.t + ':00'); }
function esLaborable(d) { const w = new Date(d + 'T12:00:00').getDay(); return w >= 1 && w <= 5; }
function fmtDiaLargo(d) {
  const dt = new Date(d + 'T12:00:00');
  return `${DIAS_S[dt.getDay()]} ${dt.getDate()} de ${MESES_FULL[dt.getMonth()]} de ${dt.getFullYear()}`;
}
/* Regla de anticipación: un turno electivo se programa con 24 h como mínimo.
   Las urgencias del Quirófano 1 y de Obstetricia la saltean. `f` es la franja
   completa, porque en la guardia de 24 h la hora sola no alcanza para saber en
   qué fecha empieza el turno. */
function puedeReservar(d, f, urgencia) {
  if (urgencia) return true;
  return inicioDeFranja(d, f).getTime() >= Date.now() + HORAS_ANTICIPACION * 36e5;
}
function anticipacionMinima() {
  const t = new Date(Date.now() + HORAS_ANTICIPACION * 36e5);
  return `${String(t.getDate()).padStart(2, '0')}/${String(t.getMonth() + 1).padStart(2, '0')}/${t.getFullYear()} ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')} h`;
}
/* El selector de cobertura abre un campo de texto cuando el financiador no
   figura en el listado; lo que se escriba ahí se suma al listado compartido. */
function onObraChange() {
  const sel = $('k-obra'), wrap = $('k-obra-nueva-wrap');
  if (!sel || !wrap) return;
  const nueva = sel.value === '__nueva__';
  wrap.style.display = nueva ? 'block' : 'none';
  if (nueva) setTimeout(() => { const i = $('k-obra-nueva'); if (i) i.focus(); }, 40);
}

/* Las urgencias y emergencias no pasan por Admisión y Egresos: quedan exentas
   y van directo a la validación de la Jefatura de Quirófanos. */
function authExenta(c) { return !!(c && c.urgencia); }
/* Un turno puede confirmarse en el parte si tiene el visto de Admisión, o si es
   una urgencia (exenta de ese trámite). */
function authOk(c) { return authExenta(c) || c.auth === 'AUTORIZADO'; }

function authChip(c) {
  if (authExenta(c)) return '<span class="slot-auth auth-exe" title="Urgencia: exenta de la autorización de Admisión y Egresos">SIN AUT. (URG)</span>';
  if (!c.auth) return '<span class="slot-auth auth-pend">PEND. AUT.</span>';
  return c.auth === 'AUTORIZADO'
    ? '<span class="slot-auth auth-ok">AUTORIZADO</span>'
    : `<span class="slot-auth auth-no" title="${esc(c.authMotivo || 'Sin motivo registrado')}">NO AUTORIZ.</span>`;
}

function slotCard(d, s, f, salaOff) {
  const c = turnoEn(d, s.id, f.id);
  const nd = f.nd ? '<span class="slot-nd" title="Corresponde a la madrugada del día siguiente">+1 día</span>' : '';
  if (c) {
    const e = ESTC[c.estado];
    const pe = prioridadEfectiva(c);
    return `<button type="button" class="slot" style="border-left:4px solid ${e.color}" onclick="openSlot('${d}','${s.id}','${f.id}')">
      ${c.urgencia ? '<span class="slot-urg-tag">URG</span>' : ''}
      <span class="slot-hora">${f.t}${nd}</span>
      <span class="slot-cir">${esc(c.cirujano || 's/d')}</span>
      <span class="slot-pac">${esc(c.paciente?.nombre || 's/d')}</span>
      <span class="slot-cx">${esc(c.procedimiento || '')}</span>
      <span class="slot-chips">
        <span class="slot-est" style="background:${e.soft};color:${e.text}">${e.label}</span>
        <span class="slot-prio" style="background:${PRIOS[pe].color}">P${pe}</span>
        ${authChip(c)}
        ${consentimientoDeTurno(c) ? '<span class="slot-ci ci-ok">CI ✓</span>' : '<span class="slot-ci ci-falta">SIN CI</span>'}
      </span>
    </button>`;
  }
  if (salaOff) {
    return `<div class="slot slot-libre slot-bloq"><span class="slot-hora">${f.t}${nd}</span>
      <span class="slot-mas">${ICONS.lock.replace('18', '16')}</span><span class="slot-hint">Bloqueado</span></div>`;
  }
  const reservable = puedeReservar(d, f, false);
  if (!reservable && !s.urgencias) {
    return `<div class="slot slot-libre slot-bloq" title="Se programa con ${HORAS_ANTICIPACION} h de anticipación (desde ${anticipacionMinima()})">
      <span class="slot-hora">${f.t}${nd}</span><span class="slot-mas">${ICONS.clockSm.replace('14', '16')}</span>
      <span class="slot-hint">&lt; ${HORAS_ANTICIPACION} h</span></div>`;
  }
  return `<button type="button" class="slot slot-libre" onclick="openSlot('${d}','${s.id}','${f.id}')">
    <span class="slot-hora">${f.t}${nd}</span><span class="slot-mas">+</span>
    <span class="slot-hint">${!reservable && s.urgencias ? 'Solo urgencia' : 'Disponible'}</span></button>`;
}

/* Bloque de franjas de un turno. El bloqueo ya no es de sala entera: cada turno
   —mañana o tarde— se abre y se cierra por separado, así que se resuelve acá. */
function periodoBloque(d, s, p, clase) {
  const fs = s.franjas.filter((f) => f.p === p);
  if (!fs.length) return '';
  const t = rotuloTurno(p);
  const off = !turnoHabilitado(d, s.id, p);
  const titulo = p === 'N' ? t.label : 'Turno ' + t.label;
  return `<div class="periodo-hdr">${titulo} <span class="ph-t">${t.rango}</span>
      <span class="turno-estado ${off ? 'off' : ''}">${off ? ico(ICONS.lock, 12) + ' Bloqueado' : 'Abierto'}</span></div>
    <div class="${clase || 'franjas-row'}">${fs.map((f) => slotCard(d, s, f, off)).join('')}</div>`;
}

function salaCard(d, s) {
  const turnos = turnosDeSala(s);
  const abiertos = turnos.filter((p) => turnoHabilitado(d, s.id, p));
  const off = !abiertos.length;
  const clase = s.tipo === 'endo' ? 'franjas-endo' : (s.guardia24 ? 'franjas-row franjas-24' : 'franjas-row');
  const cuerpo = `<div class="franjas-wrap">${turnos.map((p) => periodoBloque(d, s, p, clase)).join('')}</div>`;
  const estado = s.guardia24 ? 'GUARDIA PERMANENTE'
    : off ? 'BLOQUEADA'
    : abiertos.length === turnos.length ? 'ABIERTA'
    : 'SOLO ' + abiertos.map((p) => rotuloTurno(p).label.toUpperCase()).join(' Y ');
  return `<div class="sala-card ${off ? 'off' : ''} ${s.guardia24 ? 'sala-24' : ''}">
    <div class="sala-hdr">
      <h3>${esc(s.nombre)}</h3>
      ${s.etiqueta ? `<span class="badge-sala ${s.clase}">${s.etiqueta}</span>` : ''}
      <span class="sala-estado ${off ? 'off' : ''}"><span class="sd"></span>${estado}</span>
    </div>
    ${s.guardia24 ? `<div class="sala-nota-24">${ICONS.clockSm}<div>Disponibilidad continua de <b>08:00 a 08:00</b> — 24 franjas de una hora, todos los días del año, sábados y domingos incluidos. Destinado principalmente a la organización de cirugías de <b>urgencia y emergencia</b>.</div></div>` : ''}
    ${cuerpo}
  </div>`;
}

  const capacidad = franjasAbiertas(d);

  }
  if (!dOn) {
    cuerpo += `<div class="dia-banner">${ICONS.lock}<div><b>${fmtDiaLargo(d)} — bloque programado cerrado.</b>
      Los quirófanos 2, 3 y 4 y la Sala de Endoscopía nacen bloqueados todos los días: los abre la
      <b>Jefatura de Quirófanos</b> con su clave, por turno y por sala. El <b>Quirófano 1</b> (guardia de urgencias)

  } else if (cerradas.length) {
    cuerpo += `<div class="dia-banner">${ICONS.lock}<div>Día abierto parcialmente: ${cerradas.length} de ${salasProgramables().length} salas
      siguen bloqueadas (${cerradas.map((s) => esc(s.nombre)).join(', ')}).</div>

  }
  // La guardia de 24 h va a lo ancho: son 24 franjas y no entran en media columna.
  cuerpo += SALAS.filter((s) => s.guardia24).map((s) => `<div style="margin-bottom:16px">${salaCard(d, s)}</div>`).join('');

  // Turnos cargados antes de existir la grilla (o con la sala ya retirada del bloque):

  const huerfanos = delDia.filter((c) => !c.sala || !c.franja || !SALAS.some((s) => s.id === c.sala));

  $('main').innerHTML = `

        <button class="btn btn-outline btn-sm" onclick="setDia('${hoyISO()}')">Hoy</button>

      (mañana o tarde) desde la Jefatura de Quirófanos. El Quirófano 1 y Obstetricia no requieren habilitación.
      Anticipación mínima de <b>${HORAS_ANTICIPACION} h</b> para turnos electivos (desde ${anticipacionMinima()}). Las <b>urgencias</b> del Quirófano 1 y de Obstetricia la saltean.
      El <b>Quirófano 1</b> es la sala de guardia: grilla continua de <b>08:00 a 08:00</b>, los siete días de la semana.
      Cierre de solicitudes <b>${BLOQUE.cierreSolicitudes} h</b> y publicación del parte <b>${BLOQUE.publicacionParte} h</b> del día previo.
      Los turnos se ordenan en el parte por prelación P1–P6.</div></div>

    ${leyendaEstados()}
    ${cuerpo}`;
}

function closeSlot() { $('slot-overlay').classList.remove('open'); slotCtx = null; }

function guardarSlot() {
  const { d, sid, fid, hora } = slotCtx;
  const s = sala(sid);
  const f = franjaDe(sid, fid);
  const u = usuarioActual();
  const paciente = $('k-pac').value.trim();
  const cirujano = $('k-cir').value.trim();
  const diagnostico = $('k-diag').value.trim();
  const { procedimiento, modulo, practica } = nomLeer();
  if (!paciente || !cirujano || !diagnostico || !procedimiento) {
    alert('Complete los campos obligatorios: paciente, cirujano, diagnóstico y la cirugía a realizar (elíjala en el nomenclador).');
    return;
  }
  // Sin módulo la cirugía no puede imputarse en la solapa Módulos Quirúrgicos.
  if (!modulo) {
    alert('Indique el módulo que corresponde a la práctica (A, B o C).\n\nSi la eligió del nomenclador, el módulo se completa solo; si la cargó a mano, debe seleccionarlo.');
    return;
  }
  // Cobertura: si se eligió "agregar otra", el nombre escrito se suma al
  // listado compartido y queda como financiador del turno.
  let obraSocial = $('k-obra').value;
  if (obraSocial === '__nueva__') {
    const escrita = ($('k-obra-nueva') || {}).value || '';
    if (!escrita.trim()) {
      alert('Escriba el nombre de la obra social o prepaga que quiere agregar al listado.');
      return;
    }
    obraSocial = agregarObraSocial(escrita);
  }
  const urgEl = $('k-urg');
  const urgencia = !!(urgEl && urgEl.checked);
  const existente = turnoEn(d, sid, fid);
  // La cuenta pudo darse de baja mientras el modal estaba abierto.
  if (!existente && u && !jefe && !cuentaAprobada(u)) {
    alert(bloqueoCuenta(u));
    closeSlot(); go('perfil'); return;
  }
  if (!existente && !turnoHabilitado(d, sid, f.p)) {
    alert('Ese turno acaba de bloquearse desde la Jefatura de Quirófanos. Actualice la grilla y elija otra franja.');
    return;
  }
  if (!existente && !puedeReservar(d, f, urgencia)) {
    alert(`Este turno comienza en menos de ${HORAS_ANTICIPACION} horas.\n\nSolo puede programarse marcando "Urgencia / emergencia", y únicamente en el Quirófano 1 o en el quirófano de Obstetricia.`);
    return;
  }
  const edad = Number($('k-edad').value || 0);
  const prio = urgencia ? Math.min(Number($('k-prio').value), 2) : Number($('k-prio').value);
  const c = existente || {
    id: Date.now(), fechaSolicitud: hoyISO(), auth: null,
    historial: [{ t: nowDT(), a: 'Turno programado en la grilla' }],
    coordinacion: { insumos: false, esterilizacion: false, hemoterapia: false, anestesia: false },
    estado: 'pendiente',
  };
  Object.assign(c, {
    sala: sid, franja: fid, quirofano: s.nombre,
    // `fecha` es siempre la fecha calendario real de la cirugía; `diaGrilla` es
    // el día en que la franja se muestra (difieren en la madrugada del Q1).
    fecha: fechaDeFranja(d, f), diaGrilla: d, horaProg: hora,
    paciente: {
      nombre: paciente, dni: $('k-dni').value.trim(), edad, pediatrico: edad > 0 && edad < 15,
      nacimiento: $('k-nac').value, telefono: $('k-tel').value.trim(),
    },
    obraSocial,
    diagnostico, cie10: $('k-cie').value.trim(), procedimiento, practica, modulo,
    cirujano, cirujanoEmail: existente ? c.cirujanoEmail : (u ? u.email : ''),
    servicio: $('k-serv').value,
    anestesista: $('k-anest').value.trim(), anestesia: $('k-tanest').value,
    duracionMin: Number($('k-dur').value || 90),
    prioridad: prio, urgencia,
    recursos: {
      arcoC: [...document.querySelectorAll('.k-eq')].some((x) => x.checked && x.dataset.eq.indexOf('Arco en C') === 0),
      implante: $('k-implante').checked,
      implanteDetalle: $('k-impdet').value.trim(),
      hemoderivados: $('k-hemo').checked,
    },
    equipos: [...document.querySelectorAll('.k-eq')].filter((x) => x.checked).map((x) => x.dataset.eq),
    hce: { datos: true, preop: $('k-preop').checked, consentimiento: $('k-consent').checked },
  });
  // Urgencias y emergencias: no pasan por Admisión y Egresos. Quedan exentas
  // del trámite administrativo y siguen directo a la validación de la Jefatura.
  if (c.urgencia && c.authPor !== 'Exento — urgencia / emergencia') {
    c.auth = 'AUTORIZADO';
    c.authPor = 'Exento — urgencia / emergencia';
    c.authMotivo = '';
    c.authAgente = '';
    c.authFecha = nowDT();
    pushHist(c, 'Urgencia / emergencia: exenta de la autorización de Admisión y Egresos — pasa a validación de la Jefatura de Quirófanos');
  } else if (!c.urgencia && c.authPor === 'Exento — urgencia / emergencia') {
    // Si se quita la marca de urgencia, el turno vuelve al circuito normal.
    c.auth = null;
    c.authPor = '';
    c.authFecha = '';
    pushHist(c, 'Se quitó la marca de urgencia: el turno vuelve a requerir autorización de Admisión y Egresos');
  }
  // La pediatría y la alta complejidad se programan en los primeros horarios.
  if (c.paciente.pediatrico && c.prioridad === 6) c.prioridad = 3;
  // El cirujano queda inscripto de oficio con el módulo de la práctica; el
  // ayudante y el anestesiólogo se cargan aparte, desde el modal de equipo.
  c.equipo = equipoActualizado(c, modulo);
  if (existente) pushHist(c, 'Turno actualizado');
  upsert('cirugias', c);
  closeSlot();
  renderProgDiaria();
  // Cerrado el circuito de programación, el paso siguiente es el consentimiento
  // informado: se ofrece de inmediato, con los datos del turno ya volcados.
  if (!existente) openTurnoOk(c);
}

    </div>
    <div class="banner banner-amber" style="text-align:left;margin:0 0 14px">${ico(ICONS.alertTri, 20)}
      <div><strong>Falta cargar el cirujano ayudante</strong>
      La cirugía quedó registrada con <b>módulo ${c.modulo}</b> a nombre de ${esc(c.cirujano)}. Cargue ahora al
      <b>1er ayudante</b> —y al anestesiólogo/a si corresponde— con el módulo A, B o C que le corresponda.
      Recuerde que los módulos se imputan en la solapa <b>Módulos Quirúrgicos</b> recién cuando la cirugía
      se marque como <b>Realizada</b>.</div></div>
    <button class="btn btn-orange" style="width:100%;justify-content:center;margin-bottom:14px" onclick="closeTurnoOk();openEquipoMod(${c.id})">
      ${ico(ICONS.userPlus, 16)} Cargar cirujano ayudante y módulos</button>

    <p class="form-note" style="text-align:center;margin-bottom:14px">
      Falta también el <b>consentimiento informado</b>. Presione aquí para descargarlo: se abrirá la solapa correspondiente
      con los datos del paciente y de la cirugía ya cargados, para leerlo, completarlo y descargarlo.</p>
    <button class="btn btn-blue" style="width:100%;justify-content:center" onclick="closeTurnoOk();irAConsentimiento(${c.id})">
      ${ICONS.fileText} Descargar el consentimiento informado</button>
    <button class="btn btn-outline" style="width:100%;justify-content:center;margin-top:10px" onclick="closeTurnoOk()">Más tarde — volver a la grilla</button>`;
  $('cxok-overlay').classList.add('open');
}
function closeTurnoOk() { $('cxok-overlay').classList.remove('open'); }

function cancelarSlot(id) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c) return;
  if (['en_curso', 'realizada'].includes(c.estado)) {
    alert('No se puede cancelar un turno en curso o ya realizado. Si corresponde, registre la incidencia correspondiente.');
    return;
  }
  if (c.estado === 'confirmada') {
    alert('El turno ya está confirmado en el parte oficial: debe suspenderse con causa registrada, no cancelarse.');
    closeSlot();
    openSuspender(id);
    return;
  }
  pedirClave('Cancelar turno', 'Ingrese la clave de autorización para liberar esta franja horaria.', CLAVE_CANCELAR, () => {
    if (!confirm('¿Confirma cancelar el turno de ' + (c.paciente?.nombre || 's/d') + '?')) return;
    removeDoc('cirugias', id);
    closeSlot();
    renderProgDiaria();
  });
}

/* ================= AUTORIZACIÓN DE ADMISIÓN Y EGRESOS =================
   El sector administrativo autoriza o rechaza el turno. El rechazo exige un
   motivo escrito, que queda guardado en el turno y visible en la grilla, en la
   ficha, en el parte y en los recordatorios: sin eso el cirujano no sabe qué
   corregir para volver a presentarlo. */
let authCtx = null;

function pedirAutorizacion(id) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c) return;
  if (authExenta(c)) {
    alert('Este turno está marcado como URGENCIA / EMERGENCIA.\n\nLas urgencias no requieren autorización de Admisión y Egresos: pasan directamente a la validación de la Jefatura de Quirófanos.');
    return;
  }
  pedirClave('Autorización — Admisión y Egresos', 'Ingrese la clave del sector de Admisión y Egresos del HRU.', CLAVE_AUTORIZACION, () => openAuth(id));
}

const MOTIVOS_NO_AUT = [
  'Cobertura sin verificar o dada de baja',
  'Falta documentación administrativa del paciente',
  'Paciente sin empadronar / datos filiatorios incompletos',
  'Autorización de la obra social no otorgada',
  'Prestación no cubierta por el financiador',
  'Deuda o cobertura suspendida',
  'Duplicación de solicitud para el mismo paciente',
];

function openAuth(id) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c) return;
  authCtx = id;
  const prev = c.auth === 'NO AUTORIZADO';
  $('auth-modal').innerHTML = `
    <button class="modal-close" onclick="closeAuth()" aria-label="Cerrar">✕</button>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <div class="head-icon" style="background:#e8f4fb">${ico(ICONS.shield, 20)}</div>
      <div>
        <div style="font-weight:800;font-size:1.05rem">Admisión y Egresos</div>
        <div style="font-size:0.82rem;color:var(--muted)">Dictamen administrativo del turno</div>
      </div>
    </div>
    <div class="notify-list" style="margin:6px 0 14px">
      <b>${esc(c.procedimiento || 's/d')}</b><br>
      · Paciente: ${esc(c.paciente?.nombre || 's/d')}${c.paciente?.dni ? ` · DNI ${esc(c.paciente.dni)}` : ''}<br>
      · Cobertura: ${esc(c.obraSocial || 'sin declarar')}<br>
      · ${esc(c.quirofano || '')} — ${esc(c.horaProg || '')} h · ${fmtFecha(c.fecha)}<br>
      · Estado actual: <b>${esc(c.auth || 'PENDIENTE')}</b>
    </div>

    <div class="field" style="margin-bottom:12px">
      <label>Dictamen</label>
      <label class="check-row"><input type="radio" name="auth-r" value="1" ${c.auth === 'AUTORIZADO' ? 'checked' : ''} onchange="onAuthOpcion()"><span><b>1 — AUTORIZADO</b> · el turno puede confirmarse en el parte oficial</span></label>
      <label class="check-row" style="color:var(--red)"><input type="radio" name="auth-r" value="2" ${prev ? 'checked' : ''} onchange="onAuthOpcion()"><span><b>2 — NO AUTORIZADO</b> · el turno no entra al parte oficial y el cirujano ve el motivo</span></label>
    </div>

    <div id="auth-motivo-wrap" style="display:${prev ? 'block' : 'none'}">
      <div class="field" style="margin-bottom:10px">
        <label>Motivo del rechazo *</label>
        <select id="auth-motivo-sel" onchange="onAuthMotivoSel()">
          <option value="">Seleccionar un motivo frecuente…</option>
          ${MOTIVOS_NO_AUT.map((m) => `<option value="${esc(m)}">${esc(m)}</option>`).join('')}
          <option value="__otro__">Otro motivo (escribir)</option>
        </select>
      </div>
      <div class="field" style="margin-bottom:6px">
        <label>Detalle del motivo *</label>
        <textarea id="auth-motivo" rows="3" placeholder="Explique por qué no se autoriza el turno. El cirujano verá este texto.">${esc(c.authMotivo || '')}</textarea>
        <span class="hint">Queda visible para el cirujano, la Jefatura y en el parte quirúrgico.</span>
      </div>
    </div>

    <div class="field" style="margin-bottom:6px">
      <label>Agente que dictamina (opcional)</label>
      <input type="text" id="auth-agente" placeholder="Apellido y nombre del administrativo" value="${esc(c.authAgente || '')}">
    </div>

    <p class="pass-error" id="auth-err" style="margin:6px 0 0"></p>
    <div class="form-actions" style="margin-top:14px">
      <button class="btn btn-blue" onclick="guardarAuth()">${ico(ICONS.check, 16)} Registrar dictamen</button>
      <button class="btn btn-outline" onclick="closeAuth()">Cancelar</button>
    </div>`;
  $('auth-overlay').classList.add('open');
}
function closeAuth() { $('auth-overlay').classList.remove('open'); authCtx = null; }
function authOpcion() {
  const r = document.querySelector('input[name="auth-r"]:checked');
  return r ? r.value : '';
}
function onAuthOpcion() {
  const w = $('auth-motivo-wrap');
  if (w) w.style.display = authOpcion() === '2' ? 'block' : 'none';
}
/* El motivo frecuente precarga el detalle, que sigue siendo editable. */
function onAuthMotivoSel() {
  const sel = $('auth-motivo-sel'), t = $('auth-motivo');
  if (!sel || !t) return;
  if (sel.value && sel.value !== '__otro__') t.value = sel.value;
  else if (sel.value === '__otro__') t.value = '';
  t.focus();
}
function guardarAuth() {
  const c = DB.cirugias.find((x) => x.id === authCtx);
  if (!c) return closeAuth();
  const err = $('auth-err');
  const op = authOpcion();
  if (op !== '1' && op !== '2') {
    err.textContent = 'Elija el dictamen: 1 (autorizado) o 2 (no autorizado).';
    err.style.display = 'block';
    return;
  }
  const motivo = (($('auth-motivo') || {}).value || '').trim();
  if (op === '2' && motivo.length < 5) {
    err.textContent = 'El rechazo exige un motivo escrito: explique por qué no se autoriza el turno.';
    err.style.display = 'block';
    return;
  }
  c.auth = op === '1' ? 'AUTORIZADO' : 'NO AUTORIZADO';
  c.authMotivo = op === '2' ? motivo : '';
  c.authAgente = (($('auth-agente') || {}).value || '').trim();
  c.authFecha = nowDT();
  c.authPor = 'Admisión y Egresos';
  pushHist(c, 'Admisión y Egresos: ' + c.auth + (c.authAgente ? ' (' + c.authAgente + ')' : '') + (c.authMotivo ? ' — Motivo: ' + c.authMotivo : ''));
  upsert('cirugias', c);
  closeAuth();
  if ($('slot-overlay').classList.contains('open')) openSlot(diaDeGrilla(c), c.sala, c.franja);
  else refreshView();
}
/* Bloque reutilizable con el dictamen y —si corresponde— el motivo del rechazo. */
function authDetalle(c) {
  if (authExenta(c)) {
    return `<div class="det-row"><b>Autorización</b> <span style="color:#5b21b6;font-weight:800">NO REQUERIDA — urgencia / emergencia</span><br>
      <small>Las urgencias saltean Admisión y Egresos y pasan directo a la validación de la Jefatura de Quirófanos.</small></div>`;
  }
  const cuando = c.authFecha ? ` · ${fmtDT(c.authFecha)}` : '';
  const quien = c.authAgente ? ` · ${esc(c.authAgente)}` : '';
  if (c.auth === 'NO AUTORIZADO') {
    return `<div class="det-row"><b>Autorización</b> <span style="color:var(--red);font-weight:800">NO AUTORIZADO</span> (Admisión y Egresos${quien})${cuando}</div>
      <div class="banner banner-red" style="margin:8px 0 0;padding:10px 14px">${ico(ICONS.alertTri, 16)}
        <div><strong>Motivo del rechazo</strong>${esc(c.authMotivo || 'sin motivo registrado')}</div></div>`;
  }
  if (c.auth === 'AUTORIZADO') {
    return `<div class="det-row"><b>Autorización</b> <span style="color:var(--green);font-weight:800">AUTORIZADO</span> (Admisión y Egresos${quien})${cuando}</div>`;
  }
  return '<div class="det-row"><b>Autorización</b> PENDIENTE (Admisión y Egresos)</div>';
}

/* ---- Panel de jefatura del día: abrir el bloque turno por turno ----
   El bloque nace cerrado, así que este panel es la única llave. Se llega con la
   sesión de Jefatura, que ya exigió la clave 0112; las acciones que alcanzan a
   varios días la vuelven a pedir. */
function openJefaturaDia() {
  const d = diaSel || hoyISO();
  const prog = salasProgramables();
  const abiertas = prog.filter((s) => salaHabilitada(d, s.id)).length;
  const dOn = diaHabilitado(d);

  const filaSala = (s) => {
    const turnos = turnosDeSala(s);
    const fijo = s.guardia24;
    // Mismo rótulo que la grilla: «abierta» a secas confundiría cuando solo
    // está abierto uno de los dos turnos.
    const abiertos = turnos.filter((p) => turnoHabilitado(d, s.id, p));
    const rotulo = fijo ? 'GUARDIA PERMANENTE 08–08'
      : !abiertos.length ? 'BLOQUEADA'
      : abiertos.length === turnos.length ? 'ABIERTA — MAÑANA Y TARDE'
      : 'SOLO ' + abiertos.map((p) => rotuloTurno(p).label.toUpperCase()).join(' Y ');
    return `<div class="jefatura-row">
      <div style="min-width:170px">
        <div class="jn">${esc(s.nombre)}</div>
        <div style="font-size:0.76rem;font-weight:800;color:${abiertos.length ? 'var(--green)' : 'var(--red)'}">
          ${rotulo}</div>
        ${s.siempreAbierta && !fijo ? '<div class="hint">Cesáreas: abierta salvo cierre expreso</div>' : ''}
      </div>
      <div class="jb">
        ${fijo
          ? '<span class="hint" style="max-width:190px;text-align:right">La guardia de urgencias no se cierra</span>'
          : turnos.map((p) => {
              const on = turnoHabilitado(d, s.id, p);
              return `<button class="btn btn-sm ${on ? 'btn-green' : 'btn-outline'}" onclick="jefToggleTurno('${d}','${s.id}','${p}')">
                ${on ? ico(ICONS.check, 13) : ico(ICONS.lock, 13)} ${rotuloTurno(p).label}</button>`;
            }).join('')}
        ${fijo ? '' : `<button class="btn btn-sm btn-red" onclick="jefLimpiarSala('${d}','${s.id}')">Limpiar</button>`}
      </div>
    </div>`;
  };

  $('cir-modal').innerHTML = `
    <button class="modal-close" onclick="closeCirugia()" aria-label="Cerrar">✕</button>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
      <div class="head-icon" style="background:#e8f4fb">${ICONS.shield}</div>
      <div><div style="font-weight:800;font-size:1.1rem">Jefatura de Quirófanos — habilitación del bloque</div>
        <div style="font-size:0.82rem;color:var(--muted)">${fmtDiaLargo(d)}</div></div>
    </div>

    <div class="banner ${dOn ? 'banner-green' : 'banner-amber'}" style="margin-bottom:14px">
      ${dOn ? ico(ICONS.checkCircle, 20) : ico(ICONS.lock, 20)}
      <div><strong>${dOn ? `Día abierto — ${abiertas} de ${prog.length} salas habilitadas` : 'Día cerrado'}</strong>
      Los quirófanos 2, 3 y 4 y la Sala de Endoscopía nacen bloqueados todos los días. El Quirófano 1 (guardia)
      y el Quirófano de Obstetricia (cesáreas) no requieren habilitación.</div></div>

    <div class="det-section"><h4>Abrir el día completo</h4>
      <div class="jefatura-row">
        <div style="min-width:170px"><div class="jn">Todas las salas programables</div>
          <div class="hint">Quirófanos 2, 3 y 4 y Endoscopía</div></div>
        <div class="jb">
          <button class="btn btn-sm btn-teal" onclick="jefAbrirDia('${d}','MT')">${ico(ICONS.key, 13)} Mañana y tarde</button>
          <button class="btn btn-sm btn-outline" onclick="jefAbrirDia('${d}','M')">Solo mañana</button>
          <button class="btn btn-sm btn-outline" onclick="jefAbrirDia('${d}','T')">Solo tarde</button>
          <button class="btn btn-sm btn-red" onclick="jefCerrarDia('${d}')">Cerrar el día</button>
        </div>
      </div>
    </div>

    <div class="det-section"><h4>Sala por sala, turno por turno</h4>
      ${SALAS.map(filaSala).join('')}
      <p class="form-note">El botón en verde indica el turno abierto. Tocarlo lo cierra; los turnos ya cargados
      se conservan y, si corresponde, deben suspenderse con causa.</p>
    </div>

    <div class="det-section"><h4>Repetir esta configuración</h4>
      <p class="form-note" style="margin:0 0 10px">Copia lo abierto hoy a los días siguientes, para no repetir la
      habilitación uno por uno. Pide la clave de Jefatura porque alcanza a varias fechas.</p>
      <div class="jb" style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-sm btn-outline" onclick="jefCopiarAgenda('${d}',7,true)">Próximos 7 días hábiles</button>
        <button class="btn btn-sm btn-outline" onclick="jefCopiarAgenda('${d}',30,true)">Próximos 30 días hábiles</button>
        <button class="btn btn-sm btn-outline" onclick="jefCopiarAgenda('${d}',7,false)">Próximos 7 días corridos</button>
      </div>
    </div>

    <div class="det-section"><h4>Limpiar la programación</h4>
      <div class="jefatura-row">
        <div style="min-width:170px"><div class="jn">Turnos no confirmados del día</div>
          <div class="hint">No toca los confirmados, en curso ni realizados</div></div>
        <div class="jb"><button class="btn btn-sm btn-red" onclick="jefLimpiarDia('${d}')">Limpiar el día</button></div>
      </div>
    </div>`;
  $('cir-overlay').classList.add('open');
}
function jefToggleTurno(d, sid, p) { setTurnoOn(d, sid, p, !turnoHabilitado(d, sid, p)); openJefaturaDia(); renderProgDiaria(); }
function jefAbrirDia(d, modo) {
  abrirDiaEnTurnos(d, modo === 'MT' ? ['M', 'T'] : [modo]);
  openJefaturaDia();
  renderProgDiaria();
}
function jefCerrarDia(d) {
  if (!confirm(`¿Cerrar el bloque programado del ${fmtFecha(d)}?\n\nSe bloquean todos los turnos de los quirófanos 2, 3 y 4 y de Endoscopía. Los turnos ya cargados se conservan.`)) return;
  setDiaOn(d, false);
  openJefaturaDia();
  renderProgDiaria();
}
function jefCopiarAgenda(d, dias, soloHabiles) {
  pedirClave('Repetir la habilitación', `Se copiará lo que está abierto el ${fmtFecha(d)} a los próximos ${dias} días ${soloHabiles ? 'hábiles' : 'corridos'}. Ingrese la clave de Jefatura.`, JEFE_CLAVE, () => {
    const n = copiarAgendaA(d, dias, soloHabiles);
    alert(n ? `Habilitación copiada a ${n} día(s).` : 'No hay nada que copiar: este día todavía no tiene ninguna habilitación cargada.');
    openJefaturaDia();
    renderProgDiaria();
  });
}
function jefLimpiarDia(d) {
  pedirClave('Limpiar programación del día', 'Se eliminarán todos los turnos aún no confirmados del día.', CLAVE_CANCELAR, () => {
    const borrables = DB.cirugias.filter((c) => diaDeGrilla(c) === d && ['borrador', 'pendiente', 'validada'].includes(c.estado));
    if (!borrables.length) { alert('No hay turnos cancelables en el día. Los turnos confirmados, en curso o realizados no se eliminan.'); return; }
    if (!confirm(`¿Eliminar ${borrables.length} turno(s) no confirmado(s) del ${fmtFecha(d)}?`)) return;
    borrables.forEach((c) => removeDoc('cirugias', c.id));
    closeCirugia();
    renderProgDiaria();
  });
}
function jefLimpiarSala(d, sid) {
  pedirClave('Limpiar sala', 'Se eliminarán los turnos no confirmados de esta sala.', CLAVE_CANCELAR, () => {
    const borrables = DB.cirugias.filter((c) => diaDeGrilla(c) === d && c.sala === sid && ['borrador', 'pendiente', 'validada'].includes(c.estado));
    if (!borrables.length) { alert('No hay turnos cancelables en esta sala.'); return; }
    if (!confirm(`¿Eliminar ${borrables.length} turno(s) de ${sala(sid).nombre}?`)) return;
    borrables.forEach((c) => removeDoc('cirugias', c.id));
    openJefaturaDia();
    renderProgDiaria();
  });
}

/* ---- Modal de clave genérico ---- */
let claveCB = null;
function pedirClave(titulo, desc, esperada, onOk) {
  claveCB = { esperada, onOk };
  $('clave-titulo').textContent = titulo;
  $('clave-desc').textContent = desc;
  $('clave-inp').value = '';
  $('clave-err').style.display = 'none';
  $('clave-overlay').classList.add('open');
  setTimeout(() => $('clave-inp').focus(), 60);
}
function closeClave() { $('clave-overlay').classList.remove('open'); claveCB = null; }
function validarClave() {
  if (!claveCB) return;
  if ($('clave-inp').value === claveCB.esperada) {
    const cb = claveCB.onOk;
    closeClave();
    cb();
  } else {
    $('clave-err').style.display = 'block';
    $('clave-inp').value = '';
    $('clave-inp').focus();
  }
}

/* ================= ACTUALIZACIÓN AUTOMÁTICA =================
   La app se publica en GitHub Pages y queda instalada en teléfonos y
   computadoras del hospital. Sin esto, un dispositivo podría seguir usando la
   copia cacheada por el service worker durante días.

   Circuito: el navegador descarga el sw.js nuevo, entra en estado "waiting", la
   app avisa con una barra y —al aceptar— le ordena tomar el control y recarga.
   La comprobación se repite cada media hora y cada vez que la app vuelve al
   frente, de modo que un cambio publicado hoy llega solo, sin desinstalar nada. */
let swRegistro = null;
let swEsperando = null;

/* ¿Quedó texto cargado en la pantalla? Se ignoran las casillas y los selectores
   de fecha, que traen valor por defecto y no son trabajo del usuario. */
function hayTextoCargado() {
  return [...document.querySelectorAll('#main input, #main textarea')].some((el) => {
    if (['checkbox', 'radio', 'date', 'month'].includes(el.type)) return false;
    return String(el.value || '').trim() !== '';
  });
}
/* Hay trabajo a medio hacer si algún campo tiene texto o si hay un modal
   abierto: en ese caso la actualización no se aplica sola. */
function hayTrabajoEnCurso() {
  return !!document.querySelector('.overlay.open') || hayTextoCargado();
}
function mostrarAvisoActualizacion() {
  // Sin nada tipeado, la app se actualiza sola: es el caso habitual, con la
  // pantalla en el panel o en la grilla.
  if (!hayTrabajoEnCurso()) { aplicarActualizacion(); return; }
  const bar = $('update-bar');
  if (bar) bar.classList.add('open');
}
function aplicarActualizacion() {
  const bar = $('update-bar');
  if (bar) $('update-txt').textContent = 'Actualizando…';
  if (swEsperando) swEsperando.postMessage('skipWaiting');
  // Si el worker no responde, la recarga forzada alcanza igual.
  setTimeout(() => location.reload(), 1500);
}
function vigilarWorker(reg) {
  const nuevo = reg.installing || reg.waiting;
  if (!nuevo) return;
  const evaluar = () => {
    // Solo es una actualización si ya había una versión controlando la página:
    // en la primera instalación no hay nada que avisar.
    if (nuevo.state === 'installed' && navigator.serviceWorker.controller) {
      swEsperando = reg.waiting || nuevo;
      mostrarAvisoActualizacion();
    }
  };
  evaluar();
  nuevo.addEventListener('statechange', evaluar);
}
function initActualizaciones() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  navigator.serviceWorker.register('sw.js').then((reg) => {
    swRegistro = reg;
    vigilarWorker(reg);
    reg.addEventListener('updatefound', () => vigilarWorker(reg));
    setInterval(() => reg.update().catch(() => {}), 30 * 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    window.addEventListener('online', () => reg.update().catch(() => {}));
  }).catch(() => { /* sin SW la app funciona igual, solo pierde el modo offline */ });

  // El worker nuevo tomó el control: se recarga una sola vez para estrenar la
  // versión publicada. En la primera visita no hay nada que estrenar —el worker
  // recién se instala y reclama la página—, así que ahí no se recarga.
  const teniaControlador = !!navigator.serviceWorker.controller;
  let recargando = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (recargando || !teniaControlador) return;
    recargando = true;
    location.reload();
  });
}

/* ---- Volcado automático desde un turno de la grilla ---- */
function ciNormalizar(s) {
  return String(s || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
}
/* Busca dentro de la especialidad el procedimiento cuyo nombre se parece más al
   texto escrito en el turno. Devuelve la clave, o la entrada genérica de la
   especialidad si ninguno alcanza una coincidencia razonable. */
function ciSugerirProc(esp, texto) {
  const procs = CI_PROCEDIMIENTOS[esp];
  if (!procs) return '';
  const palabras = ciNormalizar(texto).split(' ').filter((w) => w.length > 3);
  if (!palabras.length) return '';
  let mejor = '', mejorPunt = 0;
  Object.entries(procs).forEach(([k, p]) => {
    const ref = ciNormalizar(p.label + ' ' + p.nombre);
    const punt = palabras.reduce((n, w) => n + (ref.includes(w) ? w.length : 0), 0);
    if (punt > mejorPunt) { mejorPunt = punt; mejor = k; }
  });
  if (mejorPunt >= 5) return mejor;
  return Object.keys(procs).find((k) => k.startsWith('otro')) || '';
}
function ciDesdeTurno(c) {
  const u = usuarioActual();
  const esp = CI_MAP_SERVICIO[c.servicio] || 'Otra especialidad';
  const f = { ...CI_VACIO };
  f.turnoId = c.id;
  f.p_nombre = c.paciente?.nombre || '';
  f.p_dni = c.paciente?.dni || '';
  f.p_nac = c.paciente?.nacimiento || '';
  f.p_edad = c.paciente?.edad || '';
  f.p_tel = c.paciente?.telefono || '';
  f.p_os = c.obraSocial || '';
  f.p_lucidez = (c.paciente?.edad && c.paciente.edad < 18) ? CI_LUCIDEZ[2].v : CI_LUCIDEZ[0].v;
  f.m_nombre = c.cirujano || (u ? u.nombre : '');
  f.m_mat = (u && u.matricula?.numero) || '';
  f.m_esp = c.servicio || (u ? u.servicio : '');
  f.m_serv = c.servicio || '';
  f.m_inst = 'Hospital Regional Ushuaia';
  f.c_esp = CI_PROCEDIMIENTOS[esp] ? esp : 'Otra especialidad';
  f.c_fecha = c.fecha || '';
  f.c_hora = c.horaProg || '';
  f.c_sala = c.quirofano || '';
  f.c_anest = CI_MAP_ANESTESIA[c.anestesia] || 'A definir por anestesiólogo';
  f.c_dx = c.diagnostico || '';
  f.c_cie10 = c.cie10 || '';
  f.c_nombre = c.procedimiento || '';
  // Contenido clínico sugerido a partir del nombre de la cirugía declarada.
  const clave = ciSugerirProc(f.c_esp, c.procedimiento);
  const p = clave ? CI_PROCEDIMIENTOS[f.c_esp][clave] : null;
  if (p) {
    f.c_proc = clave;
    f.t_desc = p.desc; f.t_comp = p.comp; f.t_alt = p.alt; f.t_cita = p.cita;
    if (!f.c_anest || f.c_anest === 'A definir por anestesiólogo') f.c_anest = p.anest;
  }
  return f;
}
/* Abre el generador con los datos del turno ya volcados. Si el turno ya tiene
   un consentimiento guardado, se recupera ese en lugar de rehacerlo. */
function irAConsentimiento(turnoId) {
  const c = DB.cirugias.find((x) => String(x.id) === String(turnoId));
  if (!c) return;
  const previo = consentimientoDeTurno(c);
  ciForm = previo ? { ...CI_VACIO, ...previo.datos } : ciDesdeTurno(c);
  ciEvidencia = previo ? 'recuperado del registro' : 'volcado desde la programación';
  ciTab = 'generar';
  go('consentimientos');
}
/* Turnos futuros del cirujano que todavía no tienen consentimiento generado.
   Alimenta el aviso del menú lateral. */
function ciPendientesDe(u) {
  if (!u) return 0;
  const hoy = hoyISO();
  return DB.cirugias.filter((c) => c.cirujanoEmail === u.email && (c.fecha || '') >= hoy
    && !['suspendida', 'realizada'].includes(c.estado) && !consentimientoDeTurno(c)).length;
}
function consentimientoDeTurno(c) {
  if (!c) return null;
  return DB.consentimientos.find((x) => String(x.turnoId) === String(c.id)) || null;
}

function ciBajarArchivo(cuerpo, nombre) {
  const blob = new Blob(['﻿', ciDocWord(cuerpo)], { type: 'application/msword' });

  a.href = URL.createObjectURL(blob);
  a.download = nombre + '.doc';

}

}
/* Guarda en el registro compartido y, si el consentimiento nació de un turno,

function ciRegistrar() {
  const previo = ciForm.turnoId ? DB.consentimientos.find((x) => String(x.turnoId) === String(ciForm.turnoId)) : null;
  const reg = {
    id: previo ? previo.id : Date.now(),

    medico: ciForm.m_nombre,
    especialidad: ciForm.c_esp,
    fechaCx: ciForm.c_fecha,
    turnoId: ciForm.turnoId || null,
    autor: (usuarioActual() || {}).email || (jefe ? 'jefatura' : ''),
    datos: { ...ciForm },
  };
  upsert('consentimientos', reg);
  if (reg.turnoId) {
    const c = DB.cirugias.find((x) => String(x.id) === String(reg.turnoId));
    if (c && !c.hce?.consentimiento) {
      c.hce = { ...(c.hce || {}), consentimiento: true };
      pushHist(c, 'Consentimiento informado generado y registrado');
      upsert('cirugias', c);
    }
  }
  return reg;
}
