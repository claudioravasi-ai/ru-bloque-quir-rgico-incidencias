    <div class="inc-card" onclick="openCirugia(${c.id})">
      <div class="inc-top">
        ${estChip(c)}
        ${prioChip(c)}
        <span class="chip">${ICONS.clockSm} ${c.horaProg || '—'} h · ${c.duracionMin || '?'} min</span>
        ${c.recursos?.arcoC ? '<span class="chip">Arco en C</span>' : ''}
        ${c.recursos?.implante ? '<span class="chip">Implante</span>' : ''}
        ${c.recursos?.hemoderivados ? '<span class="chip" style="background:var(--red-soft);color:var(--red);border-color:#f3c8c8">Hemoderivados</span>' : ''}
        <div class="inc-actions"><span class="chev">${ICONS.chevron}</span></div>
      </div>
      <div class="inc-desc" style="-webkit-line-clamp:1"><b>${esc(c.procedimiento)}</b> — ${esc(c.paciente?.nombre)}${c.paciente?.pediatrico ? ' (pediátrico)' : ''}</div>
      <div class="inc-meta">
        <span>${ICONS.steth} ${esc(c.cirujano)}</span>
        <span>${ICONS.user} ${esc(c.servicio)}</span>
        <span>${ICONS.fileText} ${esc(c.diagnostico)}${c.cie10 ? ' (CIE-10: ' + esc(c.cie10) + ')' : ''}</span>
      </div>
      ${c.estado === 'suspendida' && c.suspension ? `<div class="banner banner-red" style="margin:12px 0 0;padding:10px 14px"><div><strong>Suspendida: ${esc(c.suspension.causa)}</strong>${esc(c.suspension.detalle || '')}</div></div>` : ''}
    </div>`;
}

/* ================= SOLICITUD QUIRÚRGICA (cirujano) =================
   La solicitud se carga siempre sobre una franja concreta de la grilla: así
   ningún turno queda fuera de la programación diaria ni del parte. Esta vista
   busca las franjas libres del día elegido y delega en el modal de turno. */
function renderSolicitud() {
  const u = usuarioActual();
  if (!u) { go('acceso'); return; }
  if (!cuentaAprobada(u)) {
    const e = estadoCuenta(u);
    $('main').innerHTML = `
      <div class="page-head"><div>
        <h1 class="page-title">Solicitud Quirúrgica</h1>
        <p class="page-sub">Carga de solicitudes al ciclo de programación</p>
      </div></div>
      <div class="banner ${e === 'baja' ? 'banner-red' : 'banner-amber'}">${ico(ICONS.alertTri, 20)}
        <div><strong>${e === 'baja' ? 'Cuenta dada de baja por la Jefatura de Quirófanos' : 'Cuenta pendiente de autorización de la Jefatura de Quirófanos'}</strong>
        ${e === 'baja'
          ? `Su acceso fue dado de baja${u.cuentaMotivo ? ': <b>' + esc(u.cuentaMotivo) + '</b>' : '.'} No puede cargar solicitudes quirúrgicas. Comuníquese con la Jefatura de Quirófanos.`
          : 'Su alta fue registrada y está a la espera del visto de la Jefatura de Quirófanos. Hasta que la Jefatura la autorice no puede cargar solicitudes quirúrgicas. Mientras tanto puede completar su documentación de habilitación.'}</div></div>
      <button class="btn btn-outline" onclick="go('perfil')">${ICONS.user.replace('14', '16')} Ver mi perfil</button>`;
    return;
  }
  const hab = habilitacion(u);
  if (!hab.ok) {
    $('main').innerHTML = `
      <div class="page-head"><div>
        <h1 class="page-title">Solicitud Quirúrgica</h1>
        <p class="page-sub">Carga de solicitudes al ciclo de programación</p>
      </div></div>
      <div class="banner banner-red">${ICONS.alertTri.replace(/22/g, '20')}
        <div><strong>Habilitación incompleta</strong>
        Para cargar solicitudes quirúrgicas debe tener su perfil de habilitación completo y vigente. Requisitos faltantes:
        <ul style="margin:8px 0 0 18px">${hab.reqs.filter((r) => !r.ok).map((r) => `<li>${esc(r.label)}</li>`).join('')}</ul></div></div>
      <button class="btn btn-blue" onclick="go('perfil')">${ICONS.user.replace('14', '16')} Completar mi perfil</button>`;
    return;
  }

  if (!solFecha) solFecha = sumarDias(hoyISO(), 1);
  const d = solFecha;
  const cerrado = new Date() > limiteCierre(d);
  const dOn = diaHabilitado(d);

  const libres = SALAS.map((s) => {
    const fs = s.franjas.filter((f) => turnoHabilitado(d, s.id, f.p)
      && !turnoEn(d, s.id, f.id) && !franjaVencida(d, s, f) && puedeReservar(d, f, false));
    return fs.length ? { s, fs } : null;
  }).filter(Boolean);

  $('main').innerHTML = `
    <div class="page-head">
      <div class="head-row">
        <div class="head-icon">${ICONS.calPlus}</div>
        <div>
          <h1 class="page-title">Solicitud Quirúrgica</h1>
          <p class="page-sub">${esc(u.nombre)} — ${esc(u.servicio)} · elija una franja libre para cargar el turno</p>
        </div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="go('grilla')">${ICONS.grid.replace('18', '15')} Ver la grilla completa</button>
    </div>

    <div class="banner ${cerrado ? 'banner-amber' : 'banner-blue'}">${ICONS.clockSm.replace('14', '18')}
      <div><strong>${cerrado ? 'Cierre de solicitudes superado para esta fecha' : 'Ciclo de programación'}</strong>
      Las solicitudes del ${fmtFecha(d)} cerraban a las <b>${BLOQUE.cierreSolicitudes} h</b> del ${fmtFecha(sumarDias(d, -1))} y el parte se publica a las <b>${BLOQUE.publicacionParte} h</b>.
      ${cerrado ? 'Pasado el cierre solo ingresan emergencias y urgencias diferibles (P1–P2) por el Quirófano 1.' : `Anticipación mínima: ${HORAS_ANTICIPACION} h.`}</div></div>

    <div class="dia-bar">
      <button class="dia-nav" onclick="moverSolFecha(-1)" aria-label="Día anterior">‹</button>
      <button class="dia-nav" onclick="moverSolFecha(1)" aria-label="Día siguiente">›</button>
      <div class="dia-disp ${esLaborable(d) ? '' : 'finde'}">${fmtDiaLargo(d)}</div>
      <div style="margin-left:auto"><input type="date" value="${d}" min="${hoyISO()}" onchange="solFecha=this.value;renderSolicitud()"></div>
    </div>

    ${!dOn ? `<div class="dia-banner">${ICONS.lock}<div><b>Bloque programado cerrado para este día.</b>
      Los quirófanos 2, 3 y 4 y Endoscopía se habilitan desde la Jefatura de Quirófanos, por turno y por sala.
      Abajo solo aparecen el Quirófano 1 (urgencias) y Obstetricia, que no requieren habilitación.</div></div>` : ''}
    ${!esLaborable(d) ? `<div class="dia-banner">${ICONS.alertTri.replace(/22/g, '18')} Día no laborable: solo urgencias y emergencias.</div>` : ''}

    ${libres.length ? libres.map(({ s, fs }) => `
      <div class="sala-card" style="margin-bottom:14px">
        <div class="sala-hdr">
          <h3>${esc(s.nombre)}</h3>
          ${s.etiqueta ? `<span class="badge-sala ${s.clase}">${s.etiqueta}</span>` : ''}
          <span class="sala-estado"><span class="sd"></span>${fs.length} FRANJA(S) LIBRE(S)</span>
        </div>
        <div class="franjas-wrap">
          <div class="${s.tipo === 'endo' ? 'franjas-endo' : 'franjas-row'}" style="padding:0">
            ${fs.map((f) => `<button type="button" class="slot slot-libre" onclick="openSlot('${d}','${s.id}','${f.id}')">
              <span class="slot-hora">${f.t}</span><span class="slot-mas">+</span><span class="slot-hint">Solicitar</span></button>`).join('')}
          </div>
        </div>
      </div>`).join('')
      : `<div class="empty">No hay franjas disponibles para el ${fmtFecha(d)}. Pruebe con otra fecha o consulte con la Jefatura de Quirófanos.</div>`}`;
}
let solFecha = null;
function moverSolFecha(n) {
  const nueva = sumarDias(solFecha || hoyISO(), n);
  if (nueva < hoyISO()) return;
  solFecha = nueva;
  renderSolicitud();
}

/* ================= MIS SOLICITUDES (cirujano) ================= */

function leyendaEstados() {
  return `<div class="card" style="padding:16px 20px">

function cirCard(c, rol) {

  return `
    <div class="inc-card" onclick="openCirugia(${c.id})">

        ${estChip(c)}
        ${prioChip(c)}
        <span class="chip">${ICONS.calendar} ${fmtFecha(c.fecha)} · ${c.horaProg || '—'} h</span>
        <span class="chip">${esc(c.quirofano || 'Sin quirófano')}</span>
        <div class="inc-actions"><span class="chev">${ICONS.chevron}</span></div>
      </div>
      <div class="inc-desc" style="-webkit-line-clamp:1"><b>${esc(c.procedimiento)}</b> — ${esc(c.paciente?.nombre)}${c.paciente?.pediatrico ? ' (pediátrico)' : ''}</div>
      <div class="inc-meta">
        <span>${ICONS.steth} ${esc(c.cirujano)}</span>
        <span>${ICONS.user} ${esc(c.servicio)}</span>
        ${c.estado === 'realizada' && !c.informe ? `<span style="color:var(--red);font-weight:700">${ICONS.clockSm} Informe operatorio pendiente (plazo 2 h)</span>` : ''}
      </div>
      ${acciones.length ? `<div class="cir-actions" onclick="event.stopPropagation()">${acciones.join('')}</div>` : ''}
    </div>`;
}

function accionesCirugia(c, rol) {
  const u = usuarioActual();
  const esDueno = u && c.cirujanoEmail === u.email;
  const a = [];
  if (c.estado === 'borrador' && esDueno) {
    a.push(c.sala && c.franja
      ? `<button class="btn btn-sm btn-outline" onclick="openSlot('${diaDeGrilla(c)}','${c.sala}','${c.franja}')">${ICONS.edit} Editar</button>`
      : `<button class="btn btn-sm btn-outline" onclick="go('solicitud')">${ICONS.edit} Elegir franja</button>`);
    a.push(`<button class="btn btn-sm btn-red" onclick="delCirugia(${c.id})">${ICONS.trash} Eliminar</button>`);
  }
  // El circuito de la programada tiene un orden y el botón lo respeta: mientras
  // Admisión y Egresos no acepte, lo único que se ofrece es su trámite; recién
  // con la aceptación aparece la validación de la Jefatura.
  if (c.estado === 'pendiente' && jefe && !authOk(c)) {
    a.push(`<button class="btn btn-sm btn-outline" onclick="pedirAutorizacion(${c.id})">${ICONS.shield.replace('18', '14')} 1º Aceptación de Admisión y Egresos</button>`);
  }
  if (c.estado === 'pendiente' && jefe && authOk(c)) {
    a.push(`<button class="btn btn-sm btn-green" onclick="validarCirugia(${c.id})">${ICONS.check} Validar y confirmar en el parte</button>`);
  }
  // Turnos de la versión anterior, que quedaron detenidos en «Validada».
  if (c.estado === 'validada' && jefe) {
    a.push(`<button class="btn btn-sm btn-green" onclick="confirmarCirugia(${c.id})">${ICONS.check} Confirmar en el parte</button>`);
  }
  // El turno confirmado en el parte arranca con la LVQ. La urgencia que entró
  // fuera de horario, también: la validación de la Jefatura queda diferida y el
  // cirujano no espera a nadie para operar.
  if ((c.estado === 'confirmada' || puedeIniciarSinJefatura(c)) && (jefe || esDueno)) {
    a.push(`<button class="btn btn-sm btn-orange" onclick="openLVQ(${c.id}, 'inicio')">${ICONS.play} Iniciar (LVQ Entrada + Pausa)</button>`);
  }
  // Terminado el procedimiento, el cirujano completa la Salida del check-list
  // —que incluye el parte quirúrgico— y con eso la cirugía se cierra y queda
  // finalizada sola. La Jefatura no interviene.
  if (c.estado === 'en_curso' && (jefe || esDueno)) {
    a.push(`<button class="btn btn-sm btn-darkgreen" onclick="openLVQ(${c.id}, 'salida')">${ICONS.flag} Finalizar (LVQ Salida + parte)</button>`);
  }
  if (['pendiente', 'validada', 'confirmada', 'en_curso'].includes(c.estado) && jefe) {
    a.push(`<button class="btn btn-sm btn-red" onclick="openSuspender(${c.id})">${ICONS.x} Suspender</button>`);
  }
  // El paciente pudo operarse de urgencia antes de su fecha: el turno se cierra
  // por anticipación —no por suspensión— y la franja queda libre.
  if (['pendiente', 'validada', 'confirmada'].includes(c.estado) && !c.urgencia && (jefe || esDueno)) {
    a.push(`<button class="btn btn-sm btn-outline" onclick="openAnticipar(${c.id})">${ICONS.zap} Resuelta por urgencia</button>`);
  }
  if (c.estado === 'anticipada' && jefe) {
    a.push(`<button class="btn btn-sm btn-outline" onclick="reabrirAnticipada(${c.id})">${ICONS.refresh} Reponer el turno</button>`);
  }
  // Caso ya operado al que le falta el dictamen de Admisión y Egresos: el
  // trámite se cierra desde la propia tarjeta, sin ir a buscarlo a la grilla.
  if (jefe && operada(c) && c.auth !== 'AUTORIZADO') {
    a.push(`<button class="btn btn-sm btn-outline" onclick="pedirAutorizacion(${c.id})">${ICONS.shield.replace('18', '14')} ${c.auth === 'NO AUTORIZADO' ? 'Rectificar dictamen de Admisión' : 'Regularizar Admisión y Egresos'}</button>`);
  }
  // La urgencia se operó sin el visto previo: la Jefatura lo cierra después.
  if (jefe && jefaturaPendienteDiferida(c)) {
    a.push(`<button class="btn btn-sm btn-blue" onclick="regularizarJefatura(${c.id})">${ICONS.check} Regularizar validación</button>`);
  }
  if (c.estado === 'realizada' && !c.informe && (jefe || esDueno)) {
    a.push(`<button class="btn btn-sm btn-blue" onclick="openCirugia(${c.id})">${ICONS.fileText} Cargar informe operatorio</button>`);
  }
  if (jefe && ['borrador', 'suspendida'].includes(c.estado)) {
    a.push(`<button class="btn btn-sm btn-outline" onclick="delCirugia(${c.id})">${ICONS.trash} Eliminar</button>`);
  }
  return a;
}

async function delCirugia(id) {
  if (!await preguntar('Se borra la solicitud quirúrgica y todo su historial. No se puede deshacer.',
    { titulo: '¿Eliminar la solicitud?', tono: 'peligro', si: 'Sí, eliminar' })) return;
  removeDoc('cirugias', id);
  refreshView();
}

/* La validación de la Jefatura y la confirmación en el parte son un solo acto:
   la Jefatura repasa que esté todo lo que el cirujano pidió —arco en C,
   prótesis, implantes, hemoderivados, instrumental, apto anestésico— y, si
   está, el turno entra al parte quirúrgico de programados en ese mismo
   momento. Es ahí donde se le habilita la foja de LVQ al cirujano. */
function validarCirugia(id) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c) return;
  // Primero Admisión y Egresos, después la Jefatura. Sin la aceptación de
  // Admisión el turno no se valida ni entra al parte. Solo saltean este paso
  // las urgencias y emergencias, que regularizan el trámite después.
  if (!authOk(c)) {
    alert('No se puede validar el turno\n\nAdmisión y Egresos todavía no lo aceptó.'
      + (c.auth === 'NO AUTORIZADO' ? '\n\nDictamen: NO AUTORIZADO. Motivo: ' + (c.authMotivo || 'sin motivo registrado') + '.' : '\n\nEstado actual: pendiente de aceptación.')
      + '\n\nSolicite la aceptación desde la grilla de Programación Diaria, en el propio turno.'
      + '\n\nSolo saltean este paso las urgencias y emergencias y los turnos de prioridad P1 y P2, que la regularizan después.');
    return;
  }
  const faltan = coordFaltantes(c);
  if (faltan.length) {
    openCirugia(id);
    setTimeout(() => alert('No se puede validar: falta verificar lo que pidió el cirujano.\n\n· ' + faltan.join('\n· ') + '\n\nComplete las verificaciones en el detalle de la cirugía.'), 100);
    return;
  }
  c.estado = 'confirmada';
  pushHist(c, 'Validada por la ' + JEFATURA + ': verificado lo solicitado por el cirujano (Farmacia, Esterilización, Anestesiología'
    + (c.recursos?.hemoderivados ? ', Hemoterapia' : '') + (c.recursos?.arcoC ? ', arco en C' : '') + (c.recursos?.implante ? ', implante/prótesis' : '')
    + ') — CONFIRMADA en el parte quirúrgico de programados; queda habilitada la Lista de Verificación Quirúrgica para el día de la cirugía');
  upsert('cirugias', c);
  refreshView();
}

function confirmarCirugia(id) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c) return;
  // Un turno no entra al parte oficial sin la autorización de Admisión y Egresos.
  if (!authOk(c)) {
    alert('No se puede confirmar en el parte: el turno no tiene la autorización de Admisión y Egresos.\n\nEstado actual: ' + (c.auth || 'PENDIENTE') + '.'
      + (c.auth === 'NO AUTORIZADO' ? '\nMotivo del rechazo: ' + (c.authMotivo || 'sin motivo registrado') : '')
      + '\nSolicite la autorización desde la grilla de Programación Diaria.');
    return;
  }
  c.estado = 'confirmada';
  pushHist(c, 'Confirmada por jefatura — turno oficial en el parte');
  upsert('cirugias', c);
  refreshView();
}

/* ================= LVQ ================= */
let lvqCirId = null, lvqModo = null;
function openLVQ(id, modo) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c) return;
  // La foja no se abre antes del día de la cirugía.
  if (!lvqHabilitada(c)) { alert(lvqMotivoBloqueo(c)); return; }
  lvqCirId = id; lvqModo = modo;
  const fases = modo === 'inicio' ? ['entrada', 'pausa'] : ['salida'];
  $('lvq-modal').innerHTML = `
    <button class="modal-close" onclick="closeLVQ()" aria-label="Cerrar">✕</button>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <div class="head-icon" style="background:#e8f4fb;border-color:#c8dcf3">${ICONS.clipboard}</div>
      <div>
        <div style="font-weight:800;font-size:1.15rem">Lista de Verificación Quirúrgica</div>
        <div style="font-size:0.82rem;color:var(--muted)">OMS / RM 28/2012 — ${esc(c.procedimiento)} · ${esc(c.paciente?.nombre)}</div>
      </div>
    </div>
    <p style="font-size:0.85rem;color:var(--muted);margin-bottom:16px">${modo === 'inicio'
      ? 'Complete la fase de <b>Entrada</b> (antes de la inducción) y la <b>Pausa Quirúrgica</b> (antes de la incisión) para registrar el inicio del procedimiento.'
      : 'Complete la fase de <b>Salida</b> (antes de salir de quirófano) y el <b>parte quirúrgico</b>. El conteo de gasas e instrumental es obligatorio. Al confirmar, la cirugía se cierra y queda <b>finalizada</b>.'}</p>
    ${modo === 'inicio' && puedeIniciarSinJefatura(c) ? `<div class="banner banner-amber" style="margin:0 0 14px;padding:10px 14px">${ico(ICONS.zap, 16)}
      <div><strong>Validación de Jefatura diferida — ${esc(jefaturaMotivoExencion(c))}</strong>
      Este turno todavía no lo validó la ${esc(JEFATURA)}. Por ser ${esc(jefaturaMotivoExencion(c))} <b>no hace falta esperarla</b>:
      complete la Lista de Verificación, opere y cargue el parte quirúrgico cuando termine. Lo que sí queda pendiente es el
      <b>cierre del caso</b>: la aceptación de Admisión y Egresos y la validación de la ${esc(JEFATURA)} se regularizan después y,
      hasta que estén, la cirugía no se archiva ni computa en estadísticas ni en módulos.</div></div>` : ''}
    ${fases.map((f) => `
      <div class="lvq-phase" id="lvq-f-${f}">
        <div class="lvq-head">${ICONS.clipboard.replace('18', '16')} ${LVQ[f].titulo}</div>
        <div class="lvq-resp">Responsables: ${LVQ[f].resp}</div>
        ${LVQ[f].items.map((it, i) => `
          <label class="lvq-item"><input type="checkbox" class="lvq-chk" data-fase="${f}" onchange="checkLVQReady()"> ${it}</label>`).join('')}
      </div>`).join('')}
    ${modo === 'salida' ? `
      <div class="lvq-phase" id="lvq-parte">
        <div class="lvq-head">${ICONS.fileText.replace('18', '16')} Parte quirúrgico (informe operatorio)</div>
        <div class="lvq-resp">Responsable: cirujano — obligatorio para cerrar el procedimiento</div>
        <div class="field" style="margin-top:8px">
          <textarea id="lvq-informe" style="min-height:120px" oninput="checkLVQReady()"
            placeholder="Describa el procedimiento realizado, hallazgos, técnica, complicaciones, muestras enviadas a Anatomía Patológica...">${esc((c.informe && c.informe.texto) || '')}</textarea>
        </div>
      </div>
      ${cierreFaltantesPrevios(c).length ? `<div class="banner banner-amber" style="margin:0 0 14px;padding:10px 14px">${ico(ICONS.alertTri, 16)}
        <div><strong>La cirugía no va a quedar finalizada todavía</strong>
        Al confirmar, el procedimiento se cierra, pero el caso queda <b>pendiente de cierre</b> porque falta:<br>· ${cierreFaltantesPrevios(c).map(esc).join('<br>· ')}<br>
        Se regulariza después y ahí sí pasa a finalizada.</div></div>` : ''}` : ''}
    <div class="form-actions" style="margin-top:14px">
      <button class="btn ${modo === 'inicio' ? 'btn-orange' : 'btn-darkgreen'}" id="lvq-confirm" disabled onclick="confirmLVQ()">
        ${modo === 'inicio' ? ICONS.play + ' Confirmar LVQ e iniciar procedimiento' : ICONS.flag + ' Confirmar Salida, cerrar y finalizar'}
      </button>
      <p class="form-note">Todos los ítems deben verificarse en voz alta con el equipo presente.</p>
    </div>`;
  $('lvq-overlay').classList.add('open');
}
function checkLVQReady() {
  const chks = [...document.querySelectorAll('.lvq-chk')];
  const inf = $('lvq-informe');
  const parteOk = !inf || inf.value.trim().length >= 10;
  $('lvq-confirm').disabled = !chks.every((c) => c.checked) || !parteOk;
}
/* Lo que le faltaría al caso para cerrarse una vez completada la Salida y el
   parte. En la programada no falta nada —por eso se finaliza sola—; en la
   urgencia quedan la aceptación de Admisión y la validación de la Jefatura. */
function cierreFaltantesPrevios(c) {
  if (!c) return [];
  const f = [];
  if (c.auth === 'NO AUTORIZADO') f.push('Admisión y Egresos: dictamen NO AUTORIZADO sin rectificar');
  else if (c.auth !== 'AUTORIZADO') f.push('Admisión y Egresos: aceptación pendiente');
  if (jefaturaExenta(c) && ['pendiente', 'validada'].includes(c.estado)) f.push(`Validación de la ${JEFATURA} (diferida por ${jefaturaMotivoExencion(c)})`);
  else if (jefaturaPendienteDiferida(c)) f.push(`Validación de la ${JEFATURA}: diferida, sin regularizar`);
  return f;
}
function confirmLVQ() {
  const c = DB.cirugias.find((x) => x.id === lvqCirId);
  if (!c) return;
  c.lvq = c.lvq || {};
  const t = nowDT();
  if (lvqModo === 'inicio') {
    // Urgencia que arranca sin el visto de la Jefatura: queda escrito que la
    // validación se difiere, no que no hizo falta.
    if (['pendiente', 'validada'].includes(c.estado) && jefaturaExenta(c)) {
      c.jefaturaDiferida = { motivo: jefaturaMotivoExencion(c), desdeEstado: c.estado, t };
      pushHist(c, `Iniciada sin la validación previa de la ${JEFATURA} (${jefaturaMotivoExencion(c)}) — la validación y la lista de verificación de coordinación quedan diferidas y se regularizan después`);
    }
    c.lvq.entrada = { done: true, hora: t };
    c.lvq.pausa = { done: true, hora: t };
    c.estado = 'en_curso';
    c.horaInicioReal = t;
    pushHist(c, 'LVQ Entrada y Pausa completadas — inicio del procedimiento');
  } else {
    // El parte quirúrgico se escribe en esta misma ventana: la Salida no se
    // confirma sin él.
    const texto = (($('lvq-informe') || {}).value || '').trim();
    if (texto) {
      c.informe = { texto, fechaHora: t };
      pushHist(c, 'Parte quirúrgico (informe operatorio) cargado y cerrado por el cirujano junto con la LVQ de Salida');
    }
    c.lvq.salida = { done: true, hora: t };
    c.estado = 'realizada';
    c.horaFinReal = t;
    pushHist(c, 'LVQ Salida completada (conteo verificado) — procedimiento cerrado');
  }
  // La Salida cierra el caso sola. En la cirugía programada no falta nada más y
  // queda FINALIZADA en el acto, sin que la Jefatura intervenga; en la urgencia
  // operada fuera de horario quedan pendientes la aceptación de Admisión y la
  // validación de la Jefatura, y hasta que se regularicen no se finaliza.
  const cerro = lvqModo === 'salida' ? revisarCierre(c) : false;
  const pend = cierreFaltantes(c);
  upsert('cirugias', c);
  closeLVQ();
  if (lvqModo === 'salida') {
    setTimeout(() => {
      openCirugia(c.id);
      setTimeout(() => alert(cerro
        ? 'Procedimiento cerrado.\n\nLa cirugía queda FINALIZADA y ya computa en las estadísticas y en los módulos quirúrgicos.'
        : 'Procedimiento cerrado.\n\nLa cirugía todavía NO está finalizada. Falta:\n\n· ' + pend.join('\n· ')
          + '\n\nHasta que se regularice no se archiva ni computa en estadísticas ni en módulos.'), 100);
    }, 100);
  } else {
    refreshView();
  }
}
function closeLVQ() { $('lvq-overlay').classList.remove('open'); refreshView(); }

/* La Jefatura cierra después lo que no pudo hacer antes: repasa la lista de
   verificación de coordinación y deja el turno regularizado. No cambia el
   estado de la cirugía —ya se operó— ni toca los módulos: lo único que hace es
   dejar constancia de que la Jefatura tomó conocimiento y qué faltaba. */
async function regularizarJefatura(id) {
  const c = DB.cirugias.find((x) => String(x.id) === String(id));
  if (!c || !jefe) return;
  const faltan = coordFaltantes(c);
  const motivo = (c.jefaturaDiferida && c.jefaturaDiferida.motivo) || jefaturaMotivoExencion(c) || 'urgencia';
  if (!await preguntar(
    `${c.procedimiento} — ${c.paciente?.nombre || 's/d'} · ${fmtFecha(c.fecha)} (${c.quirofano || 's/d'}).\n\n`
    + `Entró como ${motivo} y se operó sin la validación previa de la ${JEFATURA}.\n\n`
    + (faltan.length
      ? `Todavía figuran sin verificar:\n· ${faltan.join('\n· ')}\n\nSe puede regularizar igual —la cirugía ya se hizo— y queda asentado qué faltaba.`
      : 'La lista de verificación de coordinación está completa.'),
    { titulo: 'Regularizar la validación de Jefatura', tono: 'jefatura', si: 'Regularizar', no: 'Cancelar' })) return;
  c.jefaturaRegularizada = { por: JEFATURA, t: nowDT(), faltaban: faltan };
  pushHist(c, `Validación de la ${JEFATURA} regularizada con la cirugía ya ${operada(c) ? 'operada' : 'en curso'}`
    + (faltan.length ? ` — quedaban sin verificar: ${faltan.join('; ')}` : ' — lista de verificación de coordinación completa'));
  // Si era lo último que faltaba, el caso se cierra acá mismo.
  const cerro = revisarCierre(c);
  const pend = cierreFaltantes(c);
  upsert('cirugias', c);
  refreshView();
  if (cerro) setTimeout(() => alert('Validación regularizada.\n\nLa cirugía queda FINALIZADA y ya computa en las estadísticas y en los módulos quirúrgicos.'), 120);
  else if (operada(c) && pend.length) setTimeout(() => alert('Validación regularizada.\n\nEl caso sigue sin cerrarse. Falta:\n\n· ' + pend.join('\n· ')), 120);
}

let suspCirId = null;
function openSuspender(id) {
  suspCirId = id;
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c) return;
  $('susp-modal').innerHTML = `
    <button class="modal-close" onclick="closeSuspender()" aria-label="Cerrar">✕</button>

    <p style="font-size:0.88rem;color:var(--muted);margin:6px 0 18px">${esc(c.procedimiento)} — ${esc(c.paciente?.nombre)} · ${fmtFecha(c.fecha)}. La carga de la causa es <b>obligatoria</b>.</p>
    <div class="field" style="margin-bottom:14px">
      <label>Causa de suspensión *</label>
      <select id="susp-causa">${CAUSAS_SUSP.map((x) => `<option>${x}</option>`).join('')}</select>

    <div class="field" style="margin-bottom:18px">

    <div class="form-actions" style="margin-top:0">

      <button class="btn btn-outline" onclick="closeSuspender()">Cancelar</button>
    </div>
    <p class="form-note" style="margin-top:14px">${ICONS.info.replace('18', '13')} La suspensión no planificada genera automáticamente una incidencia de <b>categoría D</b> en el módulo de mejora continua.</p>`;
  $('susp-overlay').classList.add('open');
}
function closeSuspender() { $('susp-overlay').classList.remove('open'); }
function confirmSuspender() {
  const c = DB.cirugias.find((x) => x.id === suspCirId);
  if (!c) return;
  const causa = $('susp-causa').value;
  const det = $('susp-det').value.trim();
  c.estado = 'suspendida';
  c.suspension = { causa, detalle: det, fechaHora: nowDT() };
  pushHist(c, 'Suspendida: ' + causa);
  upsert('cirugias', c);

  upsert('incidencias', {
    id: Date.now(),
    categoria: 'D', estado: 'Pendiente',
    fechaIncidencia: hoyISO(), horaIncidencia: nowDT().slice(11, 16), fechaReporte: hoyISO(),
    personal: c.cirujano || '—', servicio: c.servicio || '—',
    desglose: `[Generada automáticamente por el sistema] Suspensión no planificada de cirugía: ${c.procedimiento} (${c.paciente?.nombre}, ${fmtFecha(c.fecha)}, ${c.quirofano}). Causa registrada: ${causa}. ${det}`,
    informante: { nombre: 'Sistema HRU Quirófanos', dni: '—', telefono: '—', mail: 'sistema@hru.gob.ar' },
  });
  closeSuspender();
  refreshView();
}

/* ================= RESOLUCIÓN ANTICIPADA POR URGENCIA =================
   Un paciente con cirugía programada para el miércoles puede descompensarse el
   lunes y operarse de urgencia esa misma noche. La cirugía se hizo, pero no en
   el turno previsto: si nadie cierra ese turno, la franja del miércoles queda
   ocupada por una operación que no va a ocurrir y el paciente figura dos veces
   en el sistema.

   No se resuelve con una suspensión. Suspender significa que el turno se cayó
   por una falla —falta de insumo, paciente no apto, ayuno incumplido— y alimenta
   la tasa de suspensiones, que es un indicador de calidad. Acá no falló nada:
   el problema se resolvió antes y mejor. Por eso existe el estado
   `anticipada`, que:
     · deja el turno programado con su historia completa y trazable,
     · lo vincula con la urgencia que efectivamente lo resolvió,
     · devuelve la franja al bloque, que es capacidad real recuperada,
     · y no cuenta como suspensión en los indicadores ni en las estadísticas.

   El vínculo se ofrece solo, apenas se carga una urgencia de un paciente con
   turno pendiente; si nadie responde, un recordatorio insiste hasta que el turno
   se cierre o se opere. */
const ESTADOS_EN_CIRCUITO = ['borrador', 'pendiente', 'validada', 'confirmada'];

/* Identidad del paciente para cruzar turnos. El DNI manda; si falta, se compara
   el nombre normalizado, que alcanza para proponer el cruce (nunca se cierra
   nada solo: siempre lo confirma una persona). */
function idPaciente(c) {
  const dni = String((c && c.paciente && c.paciente.dni) || '').replace(/\D/g, '');
  if (dni.length >= 6) return 'dni:' + dni;
  const nom = sinTildes(String((c && c.paciente && c.paciente.nombre) || '')).replace(/\s+/g, ' ').trim();
  return nom ? 'nom:' + nom : '';
}
function turnosDelMismoPaciente(c) {
  const clave = idPaciente(c);
  if (!clave) return [];
  return DB.cirugias.filter((x) => x.id !== c.id && idPaciente(x) === clave);
}
/* Turnos programados que un turno nuevo podría dejar sin objeto: mismo
   paciente, todavía en circuito, electivos y con fecha igual o posterior. Sirve
   para una urgencia de la guardia y también para una cirugía común adelantada a
   otra fecha, que es el caso de la endoscopía o de la cesárea que se corre. */
function turnosQueResuelve(nuevo) {
  return turnosDelMismoPaciente(nuevo)
    .filter((x) => !x.urgencia && ESTADOS_EN_CIRCUITO.includes(x.estado) && String(x.fecha) >= String(nuevo.fecha))
    .sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)));
}
/* ¿Los dos turnos son del mismo responsable? Preguntar «¿este turno reemplaza
   al otro?» solo tiene sentido entre turnos del mismo cirujano o del mismo
   servicio: ahí el que carga sabe si es la misma cirugía adelantada. Que dos
   servicios distintos operen al mismo paciente en fechas distintas es lo
   habitual —traumatología el lunes, oftalmología el jueves— y preguntarlo sería
   ruido; ese cruce se resuelve avisando, no cerrando. */
function mismoResponsable(a, b) {
  const ma = String(a.cirujanoEmail || '').toLowerCase();
  const mb = String(b.cirujanoEmail || '').toLowerCase();
  if (ma && mb && ma === mb) return true;
  const na = sinTildes(a.cirujano || '').replace(/\s+/g, ' ').trim();
  const nb = sinTildes(b.cirujano || '').replace(/\s+/g, ' ').trim();
  if (na && nb && na === nb) return true;
  const sa = servicioCanonico(a.servicio), sb = servicioCanonico(b.servicio);
  return !!(sa && sb && sa === sb);
}
/* Urgencias ya cargadas del mismo paciente que podrían haber resuelto el turno. */
function urgenciasCandidatas(prog) {
  return turnosDelMismoPaciente(prog)
    .filter((x) => x.urgencia && ['confirmada', 'en_curso', 'realizada', 'finalizada'].includes(x.estado))
    .sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
}

/* Cierra el turno programado y libera su franja. `urg` puede ser null cuando la
   urgencia se resolvió en otro efector o no quedó cargada en la app: en ese caso
   se exige el detalle escrito, que es lo único que deja constancia. */
function anticiparTurno(prog, urg, quien, detalle) {
  prog.liberado = {
    sala: prog.sala || '', franja: prog.franja || '', diaGrilla: diaDeGrilla(prog),
    fecha: prog.fecha, hora: prog.horaProg || '', quirofano: prog.quirofano || '', t: nowDT(),
  };
  prog.estado = 'anticipada';
  prog.anticipada = {
    urgenciaId: urg ? urg.id : null,
    // `adelanto` es la misma cirugía corrida a otra fecha; `urgencia`, la que
    // resolvió la guardia. Cambia lo que se lee en la ficha, no el circuito.
    tipo: urg && !urg.urgencia ? 'adelanto' : 'urgencia',
    fechaUrgencia: urg ? urg.fecha : hoyISO(),
    quirofanoUrgencia: urg ? (urg.quirofano || '') : '',
    procedimientoUrgencia: urg ? (urg.procedimiento || '') : '',
    detalle: detalle || '', registradaPor: quien || JEFATURA, t: nowDT(),
  };
  // La franja se devuelve al bloque: es el sentido de todo esto.
  prog.sala = ''; prog.franja = '';
  const comoSeResolvio = prog.anticipada.tipo === 'adelanto'
    ? `Adelantada al ${fmtFecha(prog.anticipada.fechaUrgencia)}`
    : `Resuelta por urgencia el ${fmtFecha(prog.anticipada.fechaUrgencia)}`;
  pushHist(prog, `${comoSeResolvio} — se libera la franja del ${fmtFecha(prog.liberado.fecha)} (${prog.liberado.quirofano || 's/d'}, ${prog.liberado.hora || '—'} h)`);
  upsert('cirugias', prog);
  if (urg) {
    urg.resuelveTurno = prog.id;
    pushHist(urg, `Resuelve por anticipado el turno programado para el ${fmtFecha(prog.liberado.fecha)}`);
    upsert('cirugias', urg);
  }
}

/* El cruce se ofrece apenas se guarda el turno nuevo, que es cuando el dato
   está fresco y quien lo sabe está delante de la pantalla. Corre para cualquier
   turno nuevo, no solo para las urgencias: adelantar una endoscopía o una
   cesárea a otra fecha deja igual de huérfana la franja posterior.

   Dos caminos, según quién carga:
     · Urgencia de la guardia, o turno del mismo cirujano o servicio → se
       pregunta si reemplaza al turno posterior; si sí, la franja se libera.
     · Otro cirujano y otro servicio → no se pregunta —lo más probable es que
       sean dos cirugías distintas— pero se le emite una ALERTA al cirujano
       dueño del turno programado: su paciente se opera antes, otro día y por
       otro servicio, y eso le cambia el escenario de su propia cirugía. */
async function ofrecerAnticipacion(nuevo) {
  const quien = jefe ? JEFATURA : ((usuarioActual() && usuarioActual().nombre) || nuevo.cirujano || 'Sistema');
  const avisados = [];
  for (const p of turnosQueResuelve(nuevo)) {
    if (!nuevo.urgencia && !mismoResponsable(nuevo, p)) {
      const a = alertarCruceServicio(p, nuevo, quien);
      if (a) avisados.push(a);
      continue;
    }
    const esUrg = !!nuevo.urgencia;
    const msg = `Este paciente ya tiene una cirugía programada:\n\n`
      + `· ${p.procedimiento}\n`
      + `· ${fmtFecha(p.fecha)} ${p.horaProg || ''} h — ${p.quirofano || 'sin quirófano'}\n`
      + `· ${p.servicio || 's/d'} — ${p.cirujano || 's/d'}\n`
      + `· Estado: ${ESTC[p.estado].label}\n\n`
      + (esUrg
        ? `¿La urgencia que acaba de cargar resuelve esa misma cirugía?\n\n`
        : `¿El turno que acaba de cargar para el ${fmtFecha(nuevo.fecha)} es esa misma cirugía, adelantada de fecha?\n\n`)
      + `SÍ: el turno del ${fmtFecha(p.fecha)} se cierra como resuelto por anticipado, deja de figurar en el parte y su franja vuelve a estar disponible para otro paciente.\n\n`
      + `NO: los dos turnos siguen vigentes (elija esto si son cirugías distintas).`;
    if (await preguntar(msg, {
      titulo: 'El paciente ya tenía turno', tono: 'aviso', icono: 'zap',
      si: esUrg ? 'Sí, la resuelve' : 'Sí, es la misma adelantada', no: 'No, son distintas',
    })) {
      anticiparTurno(p, nuevo, quien, '');
    }
  }
  // Quien carga también tiene que saber que salió la alerta: si son la misma
  // cirugía, es el que puede levantar el teléfono y evitar el doble turno.
  if (avisados.length) {
    alert(`Este paciente ya tenía turno programado con otro servicio.\n\n`
      + avisados.map((a) => `· ${fmtFecha(a.fecha)} — ${a.servicio} — ${a.procedimiento} (${a.cirujano})`).join('\n')
      + `\n\nSe le emitió una alerta a ${avisados.length === 1 ? avisados[0].cirujano : 'cada cirujano'}: le va a aparecer como ventana que no se cierra sin confirmar la lectura. Los dos turnos siguen vigentes.`);
  }
}

/* ---- ALERTA de cruce entre servicios ----
   El cirujano tiene su paciente programado para el jueves y otro servicio lo
   opera el lunes. Aunque sean dos cirugías distintas —y casi siempre lo son—
   la primera le cambia el escenario a la segunda: ayuno, anestesia recibida,
   recuperación, riesgo acumulado. Enterarse el jueves a la mañana no es una
   opción, así que el aviso interrumpe: se emite como comunicado urgente
   dirigido a él, que no se cierra sin confirmar la lectura, y queda la
   constancia de que se enteró. */
function textoAlertaCruce(prog, nuevo) {
  const p = prog.paciente || {};
  return 'ALERTA\n\n'
    + `Su paciente tiene turno con usted el ${fmtDiaLargo(prog.fecha)} y va a ser operado antes, el ${fmtDiaLargo(nuevo.fecha)}, por otro servicio.\n\n`
    + 'PACIENTE\n'
    + `· ${p.nombre || 's/d'}${p.dni ? ' — DNI ' + p.dni : ''}\n\n`
    + 'LA CIRUGÍA QUE SE ADELANTA\n'
    + `· Fecha: ${fmtDiaLargo(nuevo.fecha)} — ${nuevo.horaProg || '—'} h\n`
    + `· ${nuevo.quirofano || 's/d'}\n`
    + `· Servicio: ${nuevo.servicio || 's/d'}\n`
    + `· Cirujano: ${nuevo.cirujano || 's/d'}\n`
    + `· Diagnóstico: ${nuevo.diagnostico || 's/d'}\n`
    + `· Cirugía: ${nuevo.procedimiento || 's/d'}\n`
    + (nuevo.urgencia ? '· Cargada como urgencia / emergencia\n' : '')
    + '\nEL TURNO QUE USTED TIENE PROGRAMADO\n'
    + `· Fecha: ${fmtDiaLargo(prog.fecha)} — ${prog.horaProg || '—'} h\n`
    + `· ${prog.quirofano || 's/d'}\n`
    + `· Diagnóstico: ${prog.diagnostico || 's/d'}\n`
    + `· Cirugía: ${prog.procedimiento || 's/d'}\n`
    + `· Estado: ${ESTC[prog.estado].label}\n\n`
    + 'QUÉ HACER\n'
    + '· Si son dos cirugías distintas, no hay nada que corregir: tenga en cuenta la cirugía previa al evaluar el riesgo, el ayuno y la anestesia de la suya.\n'
    + `· Si se trata de la misma cirugía, ciérrela desde la ficha del turno con el botón «Resuelta por urgencia»: la franja del ${fmtFecha(prog.fecha)} vuelve al bloque.\n`
    + '· Ante cualquier duda, comuníquese con la Jefatura de Quirófanos por la solapa «Reclamos».';
}
function alertarCruceServicio(prog, nuevo, quien) {
  const mail = String(prog.cirujanoEmail || '').toLowerCase();
  const dueno = mail && DB.usuarios.find((x) => String(x.email || '').toLowerCase() === mail && cuentaAprobada(x));
  if (!dueno) {
    // Sin cuenta activa no hay a quién emitirle: queda asentado en el turno y
    // se le avisa a quien está cargando, que es el único que puede levantar el
    // teléfono en ese momento.
    pushHist(prog, `No se pudo emitir la alerta de cruce a ${prog.cirujano || 's/d'}: no tiene cuenta activa en la app`);
    upsert('cirugias', prog);
    alert(`Atención: este paciente ya tiene turno el ${fmtFecha(prog.fecha)} con ${prog.cirujano || 's/d'} (${prog.servicio || 's/d'}) para ${prog.procedimiento || 's/d'}.\n\nNo se le pudo emitir la alerta porque no tiene cuenta activa en la app. Avísele por otra vía o comuníqueselo a la Jefatura de Quirófanos.`);
    return null;
  }
  const id = 'com' + Date.now();
  upsert('comunicados', {
    id,
    titulo: 'ALERTA — su paciente será operado antes por otro servicio',
    texto: textoAlertaCruce(prog, nuevo),
    prioridad: 'urgente',
    destino: { tipo: 'profesional', valor: dueno.email },
    // Deja de emerger pasada la fecha de su propio turno; el registro se conserva.
    vigenteHasta: prog.fecha,
    emitido: nowDT(), emitidoPor: JEFATURA, activo: true, lecturas: {},
    cruceTurno: prog.id, cruceNuevo: nuevo.id,
  });
  prog.avisosCruce = (prog.avisosCruce || []).concat([{ com: id, turno: nuevo.id, t: nowDT() }]);
  pushHist(prog, `Alerta emitida a ${dueno.nombre}: el paciente se opera el ${fmtFecha(nuevo.fecha)} por ${nuevo.servicio || 's/d'} (${nuevo.procedimiento || 's/d'}), cargada por ${quien || JEFATURA}`);
  upsert('cirugias', prog);
  pushHist(nuevo, `Cruce con el turno del ${fmtFecha(prog.fecha)} de ${prog.servicio || 's/d'}: se emitió la alerta a ${dueno.nombre}`);
  upsert('cirugias', nuevo);
  return { fecha: prog.fecha, servicio: prog.servicio || 's/d', procedimiento: prog.procedimiento || 's/d', cirujano: dueno.nombre };
}

let antCirId = null;
function openAnticipar(id) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c) return;
  antCirId = id;
  const cand = urgenciasCandidatas(c);
  $('susp-modal').innerHTML = `
    <button class="modal-close" onclick="closeAnticipar()" aria-label="Cerrar">✕</button>
    <h2 style="text-align:left;display:flex;align-items:center;gap:10px">${ico(ICONS.zap, 20)} Cerrar el turno como resuelto por urgencia</h2>
    <p style="font-size:0.88rem;color:var(--muted);margin:6px 0 16px">${esc(c.procedimiento)} — ${esc((c.paciente && c.paciente.nombre) || 's/d')} · programada para el ${fmtFecha(c.fecha)}${c.horaProg ? ' a las ' + esc(c.horaProg) + ' h' : ''} en ${esc(c.quirofano || 's/d')}.</p>
    <div class="banner banner-blue" style="margin-bottom:14px">${ICONS.info}
      <div><strong>No es una suspensión</strong>
      La cirugía se hizo: se adelantó por urgencia. El turno conserva toda su historia, no computa en la tasa de suspensiones y <b>la franja del ${fmtFecha(c.fecha)} queda liberada</b> para otro paciente.</div></div>
    <div class="field" style="margin-bottom:14px">
      <label>¿Qué urgencia resolvió esta cirugía?</label>
      <select id="ant-urg">
        ${cand.map((x) => `<option value="${x.id}">${fmtFecha(x.fecha)} · ${esc(x.quirofano || 's/d')} · ${esc(x.procedimiento)} (${ESTC[x.estado].label})</option>`).join('')}
        <option value="">No figura en el sistema (otro efector, guardia sin carga, etc.)</option>
      </select>
      ${cand.length ? '<span class="hint">Se listan las urgencias ya cargadas de este mismo paciente.</span>'
        : '<span class="hint">Este paciente no tiene ninguna urgencia cargada en la app: describa abajo dónde y cuándo se operó.</span>'}
    </div>
    <div class="field" style="margin-bottom:18px">
      <label>Detalle</label>
      <textarea id="ant-det" style="min-height:80px" placeholder="Dónde y cuándo se operó, quién lo informó, cualquier dato que permita reconstruirlo después."></textarea>
      <span class="hint">Obligatorio si la urgencia no figura en el sistema.</span>
    </div>
    <div class="form-actions" style="margin-top:0">
      <button class="btn btn-blue" onclick="confirmAnticipar()">${ICONS.check} Cerrar el turno y liberar la franja</button>
      <button class="btn btn-outline" onclick="closeAnticipar()">Cancelar</button>
    </div>
    <p class="form-note" style="margin-top:14px">${ICONS.info.replace('18', '13')} Si el turno se cierra por error, la Jefatura puede reponerlo desde la ficha de la cirugía.</p>`;
  $('susp-overlay').classList.add('open');
}
function closeAnticipar() { $('susp-overlay').classList.remove('open'); antCirId = null; }
function confirmAnticipar() {
  const c = DB.cirugias.find((x) => x.id === antCirId);
  if (!c) return;
  const uid = $('ant-urg').value;
  const det = ($('ant-det').value || '').trim();
  const urg = uid ? DB.cirugias.find((x) => String(x.id) === String(uid)) : null;
  if (!urg && !det) { alert('Como la urgencia no figura en el sistema, describa por escrito dónde y cuándo se operó el paciente.'); return; }
  const quien = jefe ? JEFATURA : ((usuarioActual() && usuarioActual().nombre) || c.cirujano || 'Sistema');
  anticiparTurno(c, urg, quien, det);
  closeAnticipar();
  refreshView();
  alert(`Turno cerrado como resuelto por urgencia.\n\nLa franja del ${fmtFecha(c.liberado.fecha)} (${c.liberado.quirofano || 's/d'}, ${c.liberado.hora || '—'} h) vuelve a estar disponible en la grilla.`);
}
/* Reponer: si la franja original sigue libre, el turno vuelve a ella; si no,
   queda sin franja y se le asigna una nueva desde la grilla. */
async function reabrirAnticipada(id) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c || !jefe) return;
  const l = c.liberado || {};
  const libre = l.sala && l.franja && !turnoEn(l.diaGrilla || l.fecha, l.sala, l.franja);
  if (!await preguntar(libre
    ? `El turno vuelve a su franja original: ${l.quirofano || 's/d'}, ${l.hora || '—'} h del ${fmtFecha(l.fecha)}.`
    : 'La franja original ya está ocupada o no quedó registrada.\n\nEl turno vuelve al circuito sin franja asignada: aparecerá como «turno sin franja» y habrá que reubicarlo en la grilla.',
    { titulo: 'Reponer el turno', tono: 'jefatura', si: 'Reponer', no: 'Cancelar' })) return;
  if (libre) { c.sala = l.sala; c.franja = l.franja; }
  c.estado = 'pendiente';
  delete c.anticipada;
  pushHist(c, libre ? 'Turno repuesto en su franja original' : 'Turno repuesto en el circuito, sin franja asignada');
  upsert('cirugias', c);
  refreshView();
}

/* ================= PROGRAMACIÓN FUERA DE HORARIO =================
   Potestad exclusiva del Jefe de Quirófanos y de uso excepcional: cargar una
   cirugía en una franja que el flujo normal ya cerró —sea porque el bloque de
   ese día no está habilitado, porque pasó el cierre de solicitudes del día
   previo o porque faltan menos de las 24 h de anticipación—.

   La excepción nunca es silenciosa. Al guardarse el turno se emite un comunicado
   urgente dirigido al cirujano que va a operar: le aparece como ventana que no
   se cierra sin confirmar la lectura, insiste cada diez minutos hasta que la
   confirme, y le indica que si él no autorizó esa cirugía debe comunicarse con
   la Jefatura por la solapa Reclamos. Del lado de la Jefatura queda el registro
   de quién confirmó y cuándo, que es la prueba de que el aviso circuló. */
let excCtx = null;    // excepción habilitada y todavía sin cargar (una por vez)
let excForm = { fecha: '', sala: 'Q2', franja: '', email: '', motivo: '', detalle: '' };

function excepcionPara(d, sid, fid) {
  const e = excCtx;
  return (e && e.d === d && e.sid === sid && e.fid === fid) ? e : null;
}
/* Profesionales que pueden recibir el aviso: sin cuenta activa no hay a quién
   avisarle, y una excepción sin aviso no es admisible. */
function excProfesionales() {
  return DB.usuarios.filter((u) => cuentaAprobada(u))
    .sort((a, b) => String(a.nombre).localeCompare(String(b.nombre), 'es'));
}
function excRegistradas() {
  return DB.cirugias.filter((c) => c.excepcion)
    .sort((a, b) => String(b.excepcion.fechaHora || '').localeCompare(String(a.excepcion.fechaHora || '')));
}
/* Acuse de lectura del aviso, leído del comunicado emitido. */
function excAcuse(c) {
  const e = c.excepcion || {};
  const com = DB.comunicados.find((x) => String(x.id) === String(e.avisoId));
  if (!com) return { ok: false, sinAviso: true, t: '' };
  const l = comLecturas(com)[claveMail(e.cirujanoEmail || '')];
  return { ok: !!l, sinAviso: false, t: l ? l.t : '' };
}
function excAcuseTexto(c) {
  const a = excAcuse(c);
  if (a.sinAviso) return '<span style="color:var(--red);font-weight:800">el aviso no llegó a emitirse</span>';
  return a.ok
    ? `<span style="color:var(--green);font-weight:800">leído y confirmado</span> el ${fmtDT(a.t)}`
    : '<span style="color:var(--amber);font-weight:800">emitido, sin confirmar</span> — sigue apareciéndole al cirujano hasta que lo confirme';
}
/* Excepciones todavía por delante y sin acuse: es lo que la Jefatura debe mirar. */
function excSinAcuse() {
  return excRegistradas().filter((c) => String(c.fecha) >= hoyISO() && !excAcuse(c).ok).length;
}

function excCuando(fechaISO) {
  const hoy = hoyISO();
  if (fechaISO === hoy) return 'hoy';
  if (fechaISO === sumarDias(hoy, 1)) return 'mañana';
  return 'el ' + fmtDiaLargo(fechaISO);
}
/* Texto del aviso. La primera parte es la fórmula fija que fijó la Jefatura; lo
   que sigue son los datos concretos del turno, para que el cirujano sepa de qué
   cirugía se trata sin tener que buscarla. */
function textoAvisoExcepcion(c) {
  const e = c.excepcion || {};
  const p = c.paciente || {};
  return 'ATENCIÓN\n\n'
    + `Jefatura de Quirófanos le ha coordinado una cirugía a realizarse ${excCuando(c.fecha)} y está fuera del cronograma habitual del flujo de trabajo.\n\n`
    + 'Comuníquese con Jefatura, mediante la solapa «Reclamos», si usted NO ha autorizado la misma.\n\n'
    + 'DATOS DEL TURNO\n'
    + `· Paciente: ${p.nombre || 's/d'}${p.dni ? ' — DNI ' + p.dni : ''}\n`
    + `· Cirugía: ${c.procedimiento || 's/d'}\n`
    + `· Diagnóstico: ${c.diagnostico || 's/d'}\n`
    + `· ${c.quirofano || 's/d'} — ${c.horaProg || '—'} h\n`
    + `· ${fmtDiaLargo(c.fecha)}\n`
    + `· Prioridad: P${prioridadEfectiva(c)} — ${PRIOS[prioridadEfectiva(c)].label}\n\n`
    + 'MOTIVO DE LA EXCEPCIÓN\n'
    + `· ${e.motivo || 's/d'}\n`
    + (e.detalle ? `· ${e.detalle}\n` : '')
    + `\nCoordinada por ${e.autorizadaPor || JEFATURA} el ${fmtDT(e.fechaHora || nowDT())}.`;
}
/* Emite el comunicado urgente y lo deja anotado en el turno. */
function avisarExcepcion(c, reenvio) {
  const e = c.excepcion;
  if (!e || !e.cirujanoEmail) return null;
  const id = 'com' + Date.now();
  upsert('comunicados', {
    id,
    titulo: 'ATENCIÓN — cirugía coordinada por Jefatura fuera del cronograma habitual',
    texto: textoAvisoExcepcion(c),
    prioridad: 'urgente',
    destino: { tipo: 'profesional', valor: e.cirujanoEmail },
    // Deja de emerger pasado el día de la cirugía; el registro se conserva.
    vigenteHasta: c.fecha,
    emitido: nowDT(), emitidoPor: JEFATURA, activo: true, lecturas: {},
    excepcionTurno: c.id,
  });
  e.avisoId = id;
  e.avisos = (e.avisos || []).concat([{ id, t: nowDT(), reenvio: !!reenvio }]);
  pushHist(c, reenvio ? 'Reenviado al cirujano el aviso de la excepción' : 'Emitido el aviso obligatorio de la excepción al cirujano');
  upsert('cirugias', c);
  return id;
}
async function excReenviar(id) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c || !c.excepcion) return;
  if (!await preguntar(`Se emite un comunicado urgente nuevo para ${c.excepcion.cirujano}, que vuelve a interrumpirle la app hasta que confirme la lectura.`,
    { titulo: 'Reenviar el aviso', tono: 'jefatura', icono: 'megafono', si: 'Reenviar', no: 'Cancelar' })) return;
  avisarExcepcion(c, true);
  renderExcepcion();
  alert('Aviso reenviado.');
}

/* ---- Formulario de la excepción ---- */
function excCapturar() {
  const g = (id) => ($(id) ? $(id).value : '');
  excForm = {
    fecha: g('x-fecha') || excForm.fecha,
    sala: g('x-sala') || excForm.sala,
    franja: g('x-franja'),
    email: g('x-cir'),
    motivo: g('x-motivo'),
    detalle: g('x-det'),
  };
}
function excCambio() { excCapturar(); renderExcepcion(); }

/* Por qué esta franja está fuera del flujo normal. Es lo que justifica que la
   carga pase por acá y no por la grilla. */
function excEstadoFranja(d, sid, fid) {
  const s = sala(sid), f = franjaDe(sid, fid);
  if (!f) return null;
  const inicio = inicioDeFranja(d, f);
  const razones = [];
  if (turnoEn(d, sid, fid)) razones.push('ocupada');
  if (!turnoHabilitado(d, sid, f.p)) razones.push('bloque no habilitado para ese día y turno');
  if (!puedeReservar(d, f, false)) razones.push(`menos de ${HORAS_ANTICIPACION} h de anticipación`);
  if (new Date() > limiteCierre(fechaDeFranja(d, f))) razones.push(`cierre de solicitudes superado (${BLOQUE.cierreSolicitudes} h del día previo)`);
  return { f, inicio, pasada: inicio.getTime() <= Date.now(), ocupada: !!turnoEn(d, sid, fid), razones };
}

function excHabilitar() {
  const err = $('x-error');
  const fail = (m) => { err.innerHTML = m; err.style.display = 'block'; };
  excCapturar();
  const { fecha, sala: sid, franja: fid, email, motivo, detalle } = excForm;
  if (!fecha) return fail('Elija la fecha de la cirugía.');
  if (fecha < hoyISO()) return fail('No se puede programar una cirugía en una fecha ya pasada.');
  if (!sid || !fid) return fail('Elija el quirófano y la franja horaria.');
  const est = excEstadoFranja(fecha, sid, fid);
  if (!est) return fail('Esa franja no existe en el quirófano elegido.');
  if (est.ocupada) return fail('Esa franja ya tiene un turno cargado. Elija otra o suspenda el turno existente.');
  if (est.pasada) return fail('Esa franja ya comenzó. La excepción sirve para adelantarse al cronograma, no para registrar hacia atrás: si la cirugía ya se hizo, cárguela como urgencia en el Quirófano 1.');
  const prof = excProfesionales().find((x) => x.email === email);
  if (!prof) return fail('Elija al cirujano que va a realizar la cirugía: el aviso obligatorio se emite a su cuenta.');
  if (!motivo) return fail('Indique el motivo de la excepción.');
  if (!String(detalle).trim()) return fail('Detalle por escrito la razón de la excepción. Queda asentada en el turno y viaja en el aviso al cirujano.');
  err.style.display = 'none';
  const f = est.f;
  const resumen = `${sala(sid).nombre} · ${f.t} h · ${fmtDiaLargo(fechaDeFranja(fecha, f))}`;
  pedirClave('Programación fuera de horario',
    `Va a cargar una cirugía fuera del cronograma en ${resumen} y a notificar a ${prof.nombre}. Ingrese nuevamente la clave de Jefatura.`,
    JEFE_CLAVE, () => {
      excCtx = {
        d: fecha, sid, fid, motivo, detalle: String(detalle).trim(),
        cirujano: { nombre: prof.nombre, email: prof.email, servicio: prof.servicio || '' },
      };
      openSlot(fecha, sid, fid);
    });
}
function excCancelarCtx() {
  excCtx = null;
  renderExcepcion();
}

function renderExcepcion() {
  const hoy = hoyISO();
  if (!excForm.fecha || excForm.fecha < hoy) excForm.fecha = sumarDias(hoy, 1);
  if (!SALAS.some((s) => s.id === excForm.sala)) excForm.sala = 'Q2';
  const d = excForm.fecha, sid = excForm.sala;
  const s = sala(sid);
  const profs = excProfesionales();
  if (!s.franjas.some((f) => f.id === excForm.franja)) excForm.franja = '';

      : e.pasada ? 'ya comenzó'
      : e.razones.length ? e.razones.join(' · ')

    return `<option value="${f.id}" ${e.ocupada || e.pasada ? 'disabled' : ''} ${excForm.franja === f.id ? 'selected' : ''}>${f.t} h${f.nd ? ' (+1 día)' : ''} — ${nota}</option>`;

          </div>

        </div>

      <div class="det-row"><b>Aviso</b> ${excAcuseTexto(c)}${(e.avisos || []).length > 1 ? ` · ${(e.avisos || []).length} envíos` : ''}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">

      </div>

  };

        <div>
          <h1 class="page-title">Programación Fuera de Horario</h1>

    ${excCtx ? `<div class="banner banner-blue">${ICONS.info}
      <div><strong>Hay una excepción habilitada y sin cargar</strong>
      ${esc(sala(excCtx.sid).nombre)} · ${esc((franjaDe(excCtx.sid, excCtx.fid) || {}).t || '')} h · ${fmtDiaLargo(excCtx.d)} — para ${esc(excCtx.cirujano.nombre)}.
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-sm btn-blue" onclick="openSlot('${excCtx.d}','${excCtx.sid}','${excCtx.fid}')">Continuar la carga</button>

          <div>${est.razones.length
            ? `<strong>Franja fuera del flujo normal</strong> ${esc(est.razones.join(' · '))}. La cirugía comienza ${humanoRestante(est.inicio - new Date())}.`
            : `<strong>Esta franja está abierta y en plazo</strong> Puede cargarla por la grilla de Programación Diaria sin usar la excepción. Si la carga igual desde acá, el cirujano recibirá el aviso de todos modos.`}</div></div></div>` : ''}

/* ================= PROGRAMACIÓN (jefe) ================= */
/* Grupos del circuito, en el orden en que ocurren. Cada uno es una línea y el
   detalle se despliega al pulsarla: la Jefatura ve el estado del bloque entero
   de un vistazo y entra solo a lo que le interesa. */
const PROG_GRUPOS = [
  { est: 'borrador',   hint: 'Iniciadas por el cirujano, todavía sin enviar al circuito' },
  { est: 'pendiente',  hint: '1º Admisión y Egresos acepta; 2º la Jefatura valida y confirma en el parte' },
  { est: 'validada',   hint: 'Turnos de la versión anterior: al confirmar entran al parte oficial' },
  { est: 'confirmada', hint: 'En el parte quirúrgico, con la foja de LVQ habilitada al cirujano' },
  { est: 'en_curso',   hint: 'Procedimiento iniciado: cierra con la LVQ de Salida y el parte quirúrgico' },
  { est: 'realizada',  hint: 'Operadas sin cerrar: falta regularizar Admisión y Jefatura. No computan' },
  { est: 'finalizada', hint: 'Caso cerrado: computa en estadísticas y en módulos quirúrgicos' },
  { est: 'suspendida', hint: 'Con causa registrada e incidencia de categoría D automática' },
  { est: 'anticipada', hint: 'El paciente se operó antes de su fecha: la franja quedó liberada' },
];
/* Estados terminales: se listan por fecha, del más reciente al más viejo. Los
   que siguen en circuito van por orden de prelación. */
const PROG_TERMINALES = ['finalizada', 'suspendida', 'anticipada', 'realizada'];
let progAbierto = {};
function progToggle(est) {
  progAbierto[est] = !progAbierto[est];
  renderProgramacion();
}
function progLista(est) {
  const l = DB.cirugias.filter((c) => estadoVisible(c) === est);
  return PROG_TERMINALES.indexOf(est) >= 0
    ? l.sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')))
    : l.sort(ordenPrelacion);
}

function renderProgramacion() {
  const tabs = [
    { id: 'flujo', label: 'Flujo de trabajo' },
    { id: 'todas', label: 'Todas' },
  ];
  let cuerpo = '';
  if (progTab === 'flujo') {
    const total = DB.cirugias.length;
    cuerpo = `<div class="q-acc-list">${PROG_GRUPOS.map((g) => {
      const e = ESTC[g.est];
      const lista = progLista(g.est);
      const abierto = !!progAbierto[g.est] && lista.length > 0;
      return `<div>
        <button type="button" class="q-acc ${abierto ? 'on' : ''} ${lista.length ? '' : 'vacio'}"
          ${lista.length ? `onclick="progToggle('${g.est}')"` : 'disabled'}>
          <span class="q-acc-dot" style="background:${e.color}"></span>
          <span class="q-acc-lbl">${e.label}</span>
          <span class="q-acc-hint">${g.hint}</span>
          <span class="q-acc-n" style="${lista.length ? `background:${e.soft};color:${e.text}` : ''}">${lista.length}</span>
          <span class="q-acc-car">${lista.length ? '▾' : ''}</span>
        </button>
        ${abierto ? `<div class="q-acc-body">${lista.map((c) => cirCard(c, 'jefe')).join('')}</div>` : ''}
      </div>`;
    }).join('')}</div>
    ${total ? '' : '<div class="empty">No hay solicitudes cargadas en el bloque.</div>'}`;
  } else {
    const lista = DB.cirugias
      .filter((c) => !progEstado || c.estado === progEstado)
      .sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')) || ordenPrelacion(a, b));
    cuerpo = `
      <div class="toolbar">
        <select onchange="progEstado=this.value;renderProgramacion()">
          <option value="">Todos los estados</option>
          ${Object.keys(ESTC).map((k) => `<option value="${k}" ${progEstado === k ? 'selected' : ''}>${ESTC[k].label}</option>`).join('')}
        </select>
      </div>
      <div class="result-count">${lista.length} solicitud(es)</div>
      ${lista.length ? lista.map((c) => cirCard(c, 'jefe')).join('') : '<div class="empty">Sin resultados.</div>'}`;
  }

  $('main').innerHTML = `
    <div class="page-head">
      <div class="head-row">
        <div class="head-icon">${ICONS.clipboard}</div>
        <div>
          <h1 class="page-title">Programación Quirúrgica</h1>
          <p class="page-sub">Programadas: Borrador → Pendiente (Admisión y Egresos) → Validada por la Jefatura y confirmada en el parte → LVQ (Entrada · Pausa · Salida) → Parte quirúrgico → <b>Finalizada</b>.
            Urgencias: se operan primero y la aceptación de Admisión y la validación de la Jefatura se regularizan después; hasta entonces el caso no se cierra.</p>
        </div>
      </div>
    </div>
    <div class="tabs">
      ${tabs.map((t) => `<button class="tab ${progTab === t.id ? 'active' : ''}" onclick="progTab='${t.id}';renderProgramacion()">${t.label}</button>`).join('')}
    </div>
    ${cuerpo}`;
}

/* ================= DETALLE DE CIRUGÍA ================= */
function openCirugia(id) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c) return;
  const u = usuarioActual();
  const esDueno = u && c.cirujanoEmail === u.email;
  const puedeCoordinar = jefe;
  // El parte quirúrgico se escribe dentro de la LVQ de Salida. Acá se puede
  // adelantar mientras la cirugía está en curso, o completar el de un turno
  // viejo que quedó sin él.
  const puedeInforme = (jefe || esDueno) && (c.estado === 'en_curso' || c.estado === 'realizada');
  const puedeMuestras = (jefe || esDueno) && ['confirmada', 'en_curso', 'realizada', 'finalizada'].includes(c.estado);
  const pe = prioridadEfectiva(c);
  const faltan = coordFaltantes(c);

  // Estado del cierre del caso: qué falta para que la cirugía quede finalizada
  // y empiece a computar en las estadísticas y en los módulos.
  let cierreHTML = '';
  if (operada(c)) {
    const pendCierre = cierreFaltantes(c);
    cierreHTML = pendCierre.length
      ? `<div class="det-section"><h4>Cierre del caso — pendiente</h4>

function setCoord(id, k, val) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c) return;
  c.coordinacion = c.coordinacion || {};
  c.coordinacion[k] = val;
  pushHist(c, (val ? 'Verificado: ' : 'Desmarcado: ') + (COORD_ITEMS.find((i) => i.k === k)?.label || k));
  upsert('cirugias', c);
}
/* ---- Anatomía Patológica ---- */
function agregarMuestra(id) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c) return;
  const tipo = $('mu-tipo-' + id).value;
  const rotulo = $('mu-rot-' + id).value.trim();
  if (!rotulo) { alert('Indique el rótulo o identificación de la muestra. El rotulado correcto es obligatorio en la LVQ de Salida.'); return; }
  c.muestras = c.muestras || [];
  c.muestras.push({ tipo, rotulo, enviada: false, fechaEnvio: '', registrada: nowDT() });
  pushHist(c, `Muestra registrada para Anatomía Patológica: ${tipo} (${rotulo})`);
  upsert('cirugias', c);
  openCirugia(id);
}
function toggleMuestra(id, idx) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c || !c.muestras || !c.muestras[idx]) return;
  const m = c.muestras[idx];
  m.enviada = !m.enviada;
  m.fechaEnvio = m.enviada ? nowDT() : '';
  pushHist(c, (m.enviada ? 'Muestra enviada a Anatomía Patológica: ' : 'Envío revertido: ') + m.tipo + ' (' + m.rotulo + ')');
  upsert('cirugias', c);
  openCirugia(id);
}
async function delMuestra(id, idx) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c || !c.muestras || !c.muestras[idx]) return;
  if (!await preguntar('Se borra el registro de la muestra enviada a Anatomía Patológica.',
    { titulo: '¿Eliminar la muestra?', tono: 'peligro', si: 'Sí, eliminar' })) return;
  const m = c.muestras.splice(idx, 1)[0];
  pushHist(c, 'Registro de muestra eliminado: ' + m.tipo);
  upsert('cirugias', c);
  openCirugia(id);
}

function guardarInforme(id) {
  const c = DB.cirugias.find((x) => x.id === id);
  const texto = $('inf-texto').value.trim();
  if (!c || !texto) { alert('Escriba el informe operatorio.'); return; }
  c.informe = { texto, fechaHora: nowDT() };
  pushHist(c, 'Parte quirúrgico (informe operatorio) cargado y cerrado por el cirujano');
  // Con el parte cargado el caso se cierra solo, salvo que todavía falte la
  // aceptación de Admisión o la validación de la Jefatura —la urgencia de la
  // madrugada—, que quedan pendientes de regularizar.
  const cerro = revisarCierre(c);
  const faltan = cierreFaltantes(c);
  upsert('cirugias', c);
  openCirugia(id);
  setTimeout(() => {
    if (cerro) alert('Parte quirúrgico guardado.\n\nLa cirugía queda FINALIZADA y ya computa en las estadísticas y en los módulos quirúrgicos.');
    else if (faltan.length) alert('Parte quirúrgico guardado.\n\nLa cirugía todavía NO está finalizada. Falta:\n\n· ' + faltan.join('\n· ')
      + '\n\nHasta que se regularice no se cierra ni computa en estadísticas ni en módulos.');
  }, 120);
}

/* ================= INDICADORES DE GESTIÓN (KPIs) ================= */
function calcKPIs(ym) {
  const delMes = DB.cirugias.filter((c) => (c.fecha || '').startsWith(ym));
  // Solo lo cerrado computa: la urgencia operada sin regularizar todavía no.
  const realizadas = delMes.filter(cirugiaCerrada);
  const suspendidas = delMes.filter((c) => c.estado === 'suspendida');
  const programadas = delMes.filter((c) => ['confirmada', 'en_curso', 'realizada', 'finalizada', 'suspendida'].includes(c.estado));

  // 1) Utilización del bloque: minutos operados / minutos disponibles
  const minOperados = realizadas.reduce((s, c) => {
    if (c.horaInicioReal && c.horaFinReal) return s + Math.max(0, diffMin(c.horaInicioReal, c.horaFinReal));
    return s + (c.duracionMin || 0);
  }, 0);
  const minDisponibles = horasDisponiblesMes(ym) * 60;
  const utilizacion = minDisponibles ? (minOperados / minDisponibles) * 100 : 0;

  // 2) Tasa de suspensiones sobre el total programado
  const tasaSusp = programadas.length ? (suspendidas.length / programadas.length) * 100 : 0;

  // 3) Recambio (turnover): minutos entre el fin de una cirugía y el inicio de la siguiente en el mismo quirófano
  const turnovers = [];
  BLOQUE.quirofanos.forEach((q) => {
    const porDia = {};
    realizadas.filter((c) => c.quirofano === q && c.horaInicioReal && c.horaFinReal)
      .forEach((c) => { (porDia[c.fecha] = porDia[c.fecha] || []).push(c); });
    Object.values(porDia).forEach((arr) => {
      arr.sort((a, b) => String(a.horaInicioReal).localeCompare(String(b.horaInicioReal)));
      for (let i = 1; i < arr.length; i++) {
        const t = diffMin(arr[i - 1].horaFinReal, arr[i].horaInicioReal);
        if (t >= 0 && t < 600) turnovers.push(t);
      }
    });
  });
  const turnover = turnovers.length ? turnovers.reduce((a, b) => a + b, 0) / turnovers.length : null;

  // 4) Cumplimiento del informe operatorio en menos de 2 h
  const conInforme = realizadas.filter((c) => c.informe && c.horaFinReal);
  const enPlazo = conInforme.filter((c) => diffMin(c.horaFinReal, c.informe.fechaHora) <= 120).length;
  const cumplInforme = realizadas.length ? (enPlazo / realizadas.length) * 100 : 0;

  // Causas de suspensión del mes
  const causas = {};
  suspendidas.forEach((c) => { const k = c.suspension?.causa || 'Sin causa registrada'; causas[k] = (causas[k] || 0) + 1; });

  // Operadas del mes que todavía no cerraron: no entran en ningún indicador,
  // pero se muestran para que la diferencia no aparezca como quirófano ocioso.
  const sinCerrar = delMes.filter((c) => c.estado === 'realizada' && !cirugiaCerrada(c)).length;

  return {
    utilizacion, tasaSusp, turnover, cumplInforme, sinCerrar,
    realizadas: realizadas.length, suspendidas: suspendidas.length, programadas: programadas.length,
    minOperados, minDisponibles, turnovers: turnovers.length, conInforme: conInforme.length, enPlazo, causas,
  };
}

function kpiCard(label, icon, valor, texto, ok, meta, pct, goalPct) {
  return `<div class="kpi">
    <div class="kpi-label">${icon} ${label}</div>
    <div class="kpi-val" style="color:${ok ? 'var(--green)' : 'var(--red)'}">${valor}</div>
    <div class="kpi-meta">${texto}</div>
    <div class="bar-track">
      <div class="bar-fill" style="width:${Math.min(100, Math.max(0, pct))}%;background:${ok ? 'var(--green)' : 'var(--red)'}"></div>
      <div class="bar-goal" style="left:${Math.min(100, Math.max(0, goalPct))}%" title="Meta"></div>
    </div>
    <div class="kpi-status ${ok ? 'kpi-ok' : 'kpi-bad'}">${ok ? ICONS.check + ' Cumple' : ICONS.x + ' No cumple'} · Meta ${meta}</div>
  </div>`;
}

function renderKPIs() {
  if (!kpiMes) kpiMes = mesActual();
  const k = calcKPIs(kpiMes);
  const [y, m] = kpiMes.split('-').map(Number);
  const sinDatos = k.programadas === 0;

  const turnoverTxt = k.turnover === null ? '—' : Math.round(k.turnover) + ' min';
  const turnoverOk = k.turnover !== null && k.turnover <= 30;

  const causasArr = Object.entries(k.causas).sort((a, b) => b[1] - a[1]);
  const maxCausa = causasArr.length ? causasArr[0][1] : 1;

    ${k.sinCerrar ? `<div class="banner banner-amber">${ico(ICONS.alertTri, 18)}<div><strong>${k.sinCerrar} cirugía(s) operada(s) sin cerrar</strong>
      Se operaron en el mes pero todavía no están finalizadas: falta el parte quirúrgico y/o regularizar la aceptación de Admisión y Egresos o la validación de la ${esc(JEFATURA)}.
      <b>No computan en ninguno de estos indicadores</b> hasta que se cierren. Se resuelven desde Programación Quirúrgica, en el grupo «Operadas — pendientes de cierre».</div></div>` : ''}

        k.utilizacion >= 75, '≥ 75 %', k.utilizacion, 75)}

      ${kpiCard('Tasa de suspensiones', ICONS.x.replace('14', '15'),
        k.tasaSusp.toFixed(1) + ' %',
        `${k.suspendidas} suspendidas sobre ${k.programadas} programadas`,
