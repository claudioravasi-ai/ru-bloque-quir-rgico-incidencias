   La solicitud se carga siempre sobre una franja concreta de la grilla: así
   ningún turno queda fuera de la programación diaria ni del parte. Esta vista
   busca las franjas libres del día elegido y delega en el modal de turno. */
function renderSolicitud() {
  const u = usuarioActual();
  if (!u) { go('acceso'); return; }
  const hab = habilitacion(u);
  if (!hab.ok) {
    $('main').innerHTML = `
      <div class="page-head"><div>
        <h1 class="page-title">Solicitud Quirúrgica</h1>
        <p class="page-sub">Carga de solicitudes al ciclo de programación</p>
      </div></div>
      <div class="banner banner-red">${ICONS.alertTri.replace(/22/g, '20')}
        <div><strong>Habilitación incompleta</strong>
        Para cargar solicitudes quirúrgicas debe tener su perfil de habilitación completo y vigente. Requisitos faltantes:
        <ul style="margin:8px 0 0 18px">${hab.reqs.filter((r) => !r.ok).map((r) => `<li>${esc(r.label)}</li>`).join('')}</ul></div></div>
      <button class="btn btn-blue" onclick="go('perfil')">${ICONS.user.replace('14', '16')} Completar mi perfil</button>`;
    return;
  }

  if (!solFecha) solFecha = sumarDias(hoyISO(), 1);
  const d = solFecha;
  const cerrado = new Date() > limiteCierre(d);
  const dOn = diaHabilitado(d);

  const libres = SALAS.map((s) => {
    if (!dOn || !salaHabilitada(d, s.id)) return null;
    const fs = s.franjas.filter((f) => !turnoEn(d, s.id, f.id) && puedeReservar(d, f.t, s.urgencias));
    return fs.length ? { s, fs } : null;
  }).filter(Boolean);

  $('main').innerHTML = `
    <div class="page-head">
      <div class="head-row">
        <div class="head-icon">${ICONS.calPlus}</div>
        <div>
          <h1 class="page-title">Solicitud Quirúrgica</h1>
          <p class="page-sub">${esc(u.nombre)} — ${esc(u.servicio)} · elija una franja libre para cargar el turno</p>
        </div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="go('grilla')">${ICONS.grid.replace('18', '15')} Ver la grilla completa</button>
    </div>

    <div class="banner ${cerrado ? 'banner-amber' : 'banner-blue'}">${ICONS.clockSm.replace('14', '18')}
      <div><strong>${cerrado ? 'Cierre de solicitudes superado para esta fecha' : 'Ciclo de programación'}</strong>
      Las solicitudes del ${fmtFecha(d)} cerraban a las <b>${BLOQUE.cierreSolicitudes} h</b> del ${fmtFecha(sumarDias(d, -1))} y el parte se publica a las <b>${BLOQUE.publicacionParte} h</b>.
      ${cerrado ? 'Pasado el cierre solo ingresan emergencias y urgencias diferibles (P1–P2) por el Quirófano 1.' : `Anticipación mínima: ${HORAS_ANTICIPACION} h.`}</div></div>

    <div class="dia-bar">
      <button class="dia-nav" onclick="moverSolFecha(-1)" aria-label="Día anterior">‹</button>
      <button class="dia-nav" onclick="moverSolFecha(1)" aria-label="Día siguiente">›</button>
      <div class="dia-disp ${esLaborable(d) ? '' : 'finde'}">${fmtDiaLargo(d)}</div>
      <div style="margin-left:auto"><input type="date" value="${d}" min="${hoyISO()}" onchange="solFecha=this.value;renderSolicitud()"></div>
    </div>

    ${!dOn ? `<div class="dia-banner">${ICONS.lock} Día deshabilitado por Jefatura de Quirófanos.</div>` : ''}
    ${!esLaborable(d) ? `<div class="dia-banner">${ICONS.alertTri.replace(/22/g, '18')} Día no laborable: solo urgencias y emergencias.</div>` : ''}

    ${libres.length ? libres.map(({ s, fs }) => `
      <div class="sala-card" style="margin-bottom:14px">
        <div class="sala-hdr">
          <h3>${esc(s.nombre)}</h3>
          ${s.etiqueta ? `<span class="badge-sala ${s.clase}">${s.etiqueta}</span>` : ''}
          <span class="sala-estado"><span class="sd"></span>${fs.length} FRANJA(S) LIBRE(S)</span>
        </div>
        <div class="franjas-wrap">
          <div class="${s.tipo === 'endo' ? 'franjas-endo' : 'franjas-row'}" style="padding:0">
            ${fs.map((f) => `<button type="button" class="slot slot-libre" onclick="openSlot('${d}','${s.id}','${f.id}')">
              <span class="slot-hora">${f.t}</span><span class="slot-mas">+</span><span class="slot-hint">Solicitar</span></button>`).join('')}
          </div>
        </div>
      </div>`).join('')
      : `<div class="empty">No hay franjas disponibles para el ${fmtFecha(d)}. Pruebe con otra fecha o consulte con la Jefatura de Quirófanos.</div>`}`;
}
let solFecha = null;
function moverSolFecha(n) {
  const nueva = sumarDias(solFecha || hoyISO(), n);
  if (nueva < hoyISO()) return;
  solFecha = nueva;
  renderSolicitud();
}

/* ================= MIS SOLICITUDES (cirujano) ================= */
function renderMis() {
  const u = usuarioActual();
  if (!u) { go('acceso'); return; }
  const mias = DB.cirugias.filter((c) => c.cirujanoEmail === u.email)
    .sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')));
  $('main').innerHTML = `
    <div class="page-head">
      <div>
        <h1 class="page-title">Mis Solicitudes</h1>
        <p class="page-sub">${esc(u.nombre)} — ${esc(u.servicio)}</p>
      </div>
      <button class="btn btn-blue" onclick="go('solicitud')">${ICONS.calPlus.replace('18', '16')} Nueva solicitud</button>
    </div>
    ${leyendaEstados()}
    ${mias.length ? mias.map((c) => cirCard(c, 'cirujano')).join('') : '<div class="empty">Aún no tiene solicitudes cargadas.</div>'}`;
}

function leyendaEstados() {
  return `<div class="card" style="padding:16px 20px">
    <div class="legend" style="margin:0">
      ${Object.keys(ESTC).map((k) => `<span title="${ESTC[k].desc}"><span class="dot" style="background:${ESTC[k].color};border-radius:50%"></span>${ESTC[k].label}</span>`).join('')}
    </div></div>`;
}

/* ================= TARJETA DE CIRUGÍA + ACCIONES ================= */
function cirCard(c, rol) {
  const acciones = accionesCirugia(c, rol);
  return `
    <div class="inc-card" onclick="openCirugia(${c.id})">
      <div class="inc-top">
        ${estChip(c)}
        ${prioChip(c)}
        <span class="chip">${ICONS.calendar} ${fmtFecha(c.fecha)} · ${c.horaProg || '—'} h</span>
        <span class="chip">${esc(c.quirofano || 'Sin quirófano')}</span>
        <div class="inc-actions"><span class="chev">${ICONS.chevron}</span></div>
      </div>
      <div class="inc-desc" style="-webkit-line-clamp:1"><b>${esc(c.procedimiento)}</b> — ${esc(c.paciente?.nombre)}${c.paciente?.pediatrico ? ' (pediátrico)' : ''}</div>
      <div class="inc-meta">
        <span>${ICONS.steth} ${esc(c.cirujano)}</span>
        <span>${ICONS.user} ${esc(c.servicio)}</span>
        ${c.estado === 'realizada' && !c.informe ? `<span style="color:var(--red);font-weight:700">${ICONS.clockSm} Informe operatorio pendiente (plazo 2 h)</span>` : ''}
      </div>
      ${acciones.length ? `<div class="cir-actions" onclick="event.stopPropagation()">${acciones.join('')}</div>` : ''}
    </div>`;
}

function accionesCirugia(c, rol) {
  const u = usuarioActual();
  const esDueno = u && c.cirujanoEmail === u.email;
  const a = [];
  if (c.estado === 'borrador' && esDueno) {
    a.push(c.sala && c.franja
      ? `<button class="btn btn-sm btn-outline" onclick="openSlot('${c.fecha}','${c.sala}','${c.franja}')">${ICONS.edit} Editar</button>`
      : `<button class="btn btn-sm btn-outline" onclick="go('solicitud')">${ICONS.edit} Elegir franja</button>`);
    a.push(`<button class="btn btn-sm btn-red" onclick="delCirugia(${c.id})">${ICONS.trash} Eliminar</button>`);
  }
  if (c.estado === 'pendiente' && jefe) {
    a.push(`<button class="btn btn-sm btn-blue" onclick="validarCirugia(${c.id})">${ICONS.check} Validar</button>`);
  }
  if (c.estado === 'validada' && jefe) {
    a.push(`<button class="btn btn-sm btn-green" onclick="confirmarCirugia(${c.id})">${ICONS.check} Confirmar en el parte</button>`);
  }
  if (c.estado === 'confirmada' && (jefe || esDueno)) {
    a.push(`<button class="btn btn-sm btn-orange" onclick="openLVQ(${c.id}, 'inicio')">${ICONS.play} Iniciar (LVQ Entrada + Pausa)</button>`);
  }
  if (c.estado === 'en_curso' && (jefe || esDueno)) {
    a.push(`<button class="btn btn-sm btn-darkgreen" onclick="openLVQ(${c.id}, 'salida')">${ICONS.flag} Finalizar (LVQ Salida)</button>`);
  }
  if (['pendiente', 'validada', 'confirmada', 'en_curso'].includes(c.estado) && jefe) {
    a.push(`<button class="btn btn-sm btn-red" onclick="openSuspender(${c.id})">${ICONS.x} Suspender</button>`);
  }
  if (c.estado === 'realizada' && !c.informe && (jefe || esDueno)) {
    a.push(`<button class="btn btn-sm btn-blue" onclick="openCirugia(${c.id})">${ICONS.fileText} Cargar informe operatorio</button>`);
  }
  if (jefe && ['borrador', 'suspendida'].includes(c.estado)) {
    a.push(`<button class="btn btn-sm btn-outline" onclick="delCirugia(${c.id})">${ICONS.trash} Eliminar</button>`);
  }
  return a;
}

function delCirugia(id) {
  if (!confirm('¿Eliminar esta solicitud de forma permanente?')) return;
  removeDoc('cirugias', id);
  refreshView();
}

function validarCirugia(id) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c) return;
  const faltan = coordFaltantes(c);
  if (faltan.length) {
    openCirugia(id);
    setTimeout(() => alert('No se puede validar: faltan verificaciones de coordinación.\n\n· ' + faltan.join('\n· ') + '\n\nComplete las verificaciones en el detalle de la cirugía.'), 100);
    return;
  }
  c.estado = 'validada';
  pushHist(c, 'Validada por áreas técnicas (Farmacia, Esterilización, Anestesiología' + (c.recursos?.hemoderivados ? ', Hemoterapia' : '') + ')');
  upsert('cirugias', c);
  refreshView();
}

function confirmarCirugia(id) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c) return;
  // Un turno no entra al parte oficial sin la autorización de Admisión y Egresos.
  if (c.auth !== 'AUTORIZADO') {
    alert('No se puede confirmar en el parte: el turno no tiene la autorización de Admisión y Egresos.\n\nEstado actual: ' + (c.auth || 'PENDIENTE') + '.\nSolicite la autorización desde la grilla de Programación Diaria.');
    return;
  }
  c.estado = 'confirmada';
  pushHist(c, 'Confirmada por jefatura — turno oficial en el parte');
  upsert('cirugias', c);
  refreshView();
}

/* ================= LVQ ================= */
let lvqCirId = null, lvqModo = null;
function openLVQ(id, modo) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c) return;
  lvqCirId = id; lvqModo = modo;
  const fases = modo === 'inicio' ? ['entrada', 'pausa'] : ['salida'];
  $('lvq-modal').innerHTML = `
    <button class="modal-close" onclick="closeLVQ()" aria-label="Cerrar">✕</button>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <div class="head-icon" style="background:#e8f4fb;border-color:#c8dcf3">${ICONS.clipboard}</div>
      <div>
        <div style="font-weight:800;font-size:1.15rem">Lista de Verificación Quirúrgica</div>
        <div style="font-size:0.82rem;color:var(--muted)">OMS / RM 28/2012 — ${esc(c.procedimiento)} · ${esc(c.paciente?.nombre)}</div>
      </div>
    </div>
    <p style="font-size:0.85rem;color:var(--muted);margin-bottom:16px">${modo === 'inicio'
      ? 'Complete la fase de <b>Entrada</b> (antes de la inducción) y la <b>Pausa Quirúrgica</b> (antes de la incisión) para registrar el inicio del procedimiento.'
      : 'Complete la fase de <b>Salida</b> (antes de salir de quirófano) para cerrar el procedimiento. El conteo de gasas e instrumental es obligatorio.'}</p>
    ${fases.map((f) => `
      <div class="lvq-phase" id="lvq-f-${f}">
        <div class="lvq-head">${ICONS.clipboard.replace('18', '16')} ${LVQ[f].titulo}</div>
        <div class="lvq-resp">Responsables: ${LVQ[f].resp}</div>
        ${LVQ[f].items.map((it, i) => `
          <label class="lvq-item"><input type="checkbox" class="lvq-chk" data-fase="${f}" onchange="checkLVQReady()"> ${it}</label>`).join('')}
      </div>`).join('')}
    <div class="form-actions" style="margin-top:14px">
      <button class="btn ${modo === 'inicio' ? 'btn-orange' : 'btn-darkgreen'}" id="lvq-confirm" disabled onclick="confirmLVQ()">
        ${modo === 'inicio' ? ICONS.play + ' Confirmar LVQ e iniciar procedimiento' : ICONS.flag + ' Confirmar LVQ y cerrar procedimiento'}
      </button>
      <p class="form-note">Todos los ítems deben verificarse en voz alta con el equipo presente.</p>
    </div>`;
  $('lvq-overlay').classList.add('open');
}
function checkLVQReady() {
  const chks = [...document.querySelectorAll('.lvq-chk')];
  $('lvq-confirm').disabled = !chks.every((c) => c.checked);
}
function confirmLVQ() {
  const c = DB.cirugias.find((x) => x.id === lvqCirId);
  if (!c) return;
  c.lvq = c.lvq || {};
  const t = nowDT();
  if (lvqModo === 'inicio') {
    c.lvq.entrada = { done: true, hora: t };
    c.lvq.pausa = { done: true, hora: t };
    c.estado = 'en_curso';
    c.horaInicioReal = t;
    pushHist(c, 'LVQ Entrada y Pausa completadas — inicio del procedimiento');
  } else {
    c.lvq.salida = { done: true, hora: t };
    c.estado = 'realizada';
    c.horaFinReal = t;
    pushHist(c, 'LVQ Salida completada (conteo verificado) — procedimiento finalizado');
  }
  upsert('cirugias', c);
  closeLVQ();
  if (lvqModo === 'salida') {
    setTimeout(() => {
      openCirugia(c.id);
      setTimeout(() => alert('Procedimiento cerrado. Recuerde cargar el informe operatorio dentro de las 2 horas (meta de cumplimiento ≥ 95 %).'), 100);
    }, 100);
  } else {
    refreshView();
  }
}
function closeLVQ() { $('lvq-overlay').classList.remove('open'); refreshView(); }

/* ================= SUSPENSIÓN ================= */
let suspCirId = null;
function openSuspender(id) {
  suspCirId = id;
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c) return;
  $('susp-modal').innerHTML = `
    <button class="modal-close" onclick="closeSuspender()" aria-label="Cerrar">✕</button>
    <h2 style="text-align:left;display:flex;align-items:center;gap:10px">${ICONS.alertTri.replace('22', '20').replace('22', '20')} Suspender cirugía</h2>
    <p style="font-size:0.88rem;color:var(--muted);margin:6px 0 18px">${esc(c.procedimiento)} — ${esc(c.paciente?.nombre)} · ${fmtFecha(c.fecha)}. La carga de la causa es <b>obligatoria</b>.</p>
    <div class="field" style="margin-bottom:14px">
      <label>Causa de suspensión *</label>
      <select id="susp-causa">${CAUSAS_SUSP.map((x) => `<option>${x}</option>`).join('')}</select>
    </div>
    <div class="field" style="margin-bottom:18px">
      <label>Detalle</label>
      <textarea id="susp-det" style="min-height:90px" placeholder="Circunstancias de la suspensión..."></textarea>
    </div>
    <div class="form-actions" style="margin-top:0">
      <button class="btn btn-red" onclick="confirmSuspender()">${ICONS.x} Confirmar suspensión</button>
      <button class="btn btn-outline" onclick="closeSuspender()">Cancelar</button>
    </div>
    <p class="form-note" style="margin-top:14px">${ICONS.info.replace('18', '13')} La suspensión no planificada genera automáticamente una incidencia de <b>categoría D</b> en el módulo de mejora continua.</p>`;
  $('susp-overlay').classList.add('open');
}
function closeSuspender() { $('susp-overlay').classList.remove('open'); }
function confirmSuspender() {
  const c = DB.cirugias.find((x) => x.id === suspCirId);
  if (!c) return;
  const causa = $('susp-causa').value;
  const det = $('susp-det').value.trim();
  c.estado = 'suspendida';
  c.suspension = { causa, detalle: det, fechaHora: nowDT() };
  pushHist(c, 'Suspendida: ' + causa);
  upsert('cirugias', c);
  // Incidencia automática categoría D (suspensión no planificada)
  upsert('incidencias', {
    id: Date.now(),
    categoria: 'D', estado: 'Pendiente',
    fechaIncidencia: hoyISO(), horaIncidencia: nowDT().slice(11, 16), fechaReporte: hoyISO(),
    personal: c.cirujano || '—', servicio: c.servicio || '—',
    desglose: `[Generada automáticamente por el sistema] Suspensión no planificada de cirugía: ${c.procedimiento} (${c.paciente?.nombre}, ${fmtFecha(c.fecha)}, ${c.quirofano}). Causa registrada: ${causa}. ${det}`,
    informante: { nombre: 'Sistema HRU Quirófanos', dni: '—', telefono: '—', mail: 'sistema@hru.gob.ar' },
  });
  closeSuspender();
  refreshView();
}

/* ================= PROGRAMACIÓN (jefe) ================= */
function renderProgramacion() {
  const n = (est) => DB.cirugias.filter((c) => c.estado === est).length;
  const tabs = [
    { id: 'flujo', label: 'Flujo de trabajo' },
    { id: 'todas', label: 'Todas' },
  ];
  let cuerpo = '';
  if (progTab === 'flujo') {
    const grupos = [
      { est: 'pendiente', titulo: 'Pendientes de validación', hint: 'Verificar coordinación de áreas antes de validar' },
      { est: 'validada', titulo: 'Validadas — esperan confirmación de jefatura', hint: 'Al confirmar entran al parte oficial' },
      { est: 'confirmada', titulo: 'Confirmadas en el parte', hint: 'El inicio requiere LVQ de Entrada y Pausa' },
      { est: 'en_curso', titulo: 'En curso', hint: 'El cierre requiere LVQ de Salida con conteo completo' },
      { est: 'realizada', titulo: 'Realizadas recientes', hint: 'Controlar carga del informe operatorio (≤ 2 h)', limite: 5 },
      { est: 'suspendida', titulo: 'Suspendidas', hint: 'Con causa registrada', limite: 5 },
    ];
    cuerpo = grupos.map((g) => {
      let lista = DB.cirugias.filter((c) => c.estado === g.est).sort(ordenPrelacion);
      if (g.est === 'realizada' || g.est === 'suspendida') lista = lista.sort((a, b) => String(b.fecha).localeCompare(String(a.fecha))).slice(0, g.limite);
      if (!lista.length) return '';
      return `<div class="q-group">
        <div class="q-group-title"><span class="est-dot" style="background:${ESTC[g.est].color};width:12px;height:12px"></span> ${g.titulo} <span style="color:var(--muted);font-weight:500;font-size:0.8rem">· ${g.hint}</span></div>
        ${lista.map((c) => cirCard(c, 'jefe')).join('')}
      </div>`;
    }).join('') || '<div class="empty">No hay solicitudes en el circuito.</div>';
  } else {
    const lista = DB.cirugias
      .filter((c) => !progEstado || c.estado === progEstado)
      .sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')) || ordenPrelacion(a, b));
    cuerpo = `
      <div class="toolbar">
        <select onchange="progEstado=this.value;renderProgramacion()">
          <option value="">Todos los estados</option>
          ${Object.keys(ESTC).map((k) => `<option value="${k}" ${progEstado === k ? 'selected' : ''}>${ESTC[k].label}</option>`).join('')}
        </select>
      </div>
      <div class="result-count">${lista.length} solicitud(es)</div>
      ${lista.length ? lista.map((c) => cirCard(c, 'jefe')).join('') : '<div class="empty">Sin resultados.</div>'}`;
  }

  $('main').innerHTML = `
    <div class="page-head">
      <div class="head-row">
        <div class="head-icon">${ICONS.clipboard}</div>
        <div>
          <h1 class="page-title">Programación Quirúrgica</h1>
          <p class="page-sub">Circuito completo: Borrador → Pendiente → Validada → Confirmada → En curso → Realizada</p>
        </div>
      </div>
    </div>
    ${leyendaEstados()}
    <div class="tabs">
      ${tabs.map((t) => `<button class="tab ${progTab === t.id ? 'active' : ''}" onclick="progTab='${t.id}';renderProgramacion()">${t.label}</button>`).join('')}
      <span class="tab" style="cursor:default;border-style:dashed">Pendientes <span class="n">${n('pendiente')}</span></span>
      <span class="tab" style="cursor:default;border-style:dashed">Validadas <span class="n">${n('validada')}</span></span>
      <span class="tab" style="cursor:default;border-style:dashed">Confirmadas <span class="n">${n('confirmada')}</span></span>
    </div>
    ${cuerpo}`;
}

/* ================= DETALLE DE CIRUGÍA ================= */
function openCirugia(id) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c) return;
  const u = usuarioActual();
  const esDueno = u && c.cirujanoEmail === u.email;
  const puedeCoordinar = jefe;
  const puedeInforme = (jefe || esDueno) && c.estado === 'realizada';
  const puedeMuestras = (jefe || esDueno) && ['confirmada', 'en_curso', 'realizada'].includes(c.estado);
  const pe = prioridadEfectiva(c);
  const faltan = coordFaltantes(c);

  let informeHTML = '';
  if (c.informe) {
    const min = c.horaFinReal ? diffMin(c.horaFinReal, c.informe.fechaHora) : null;
    informeHTML = `<div class="det-section"><h4>Informe operatorio</h4>
      <div class="det-desc">${esc(c.informe.texto)}</div>

function agregarMuestra(id) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c) return;
  const tipo = $('mu-tipo-' + id).value;
  const rotulo = $('mu-rot-' + id).value.trim();
  if (!rotulo) { alert('Indique el rótulo o identificación de la muestra. El rotulado correcto es obligatorio en la LVQ de Salida.'); return; }
  c.muestras = c.muestras || [];
  c.muestras.push({ tipo, rotulo, enviada: false, fechaEnvio: '', registrada: nowDT() });

  upsert('cirugias', c);
  openCirugia(id);

function toggleMuestra(id, idx) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c || !c.muestras || !c.muestras[idx]) return;
  const m = c.muestras[idx];
  m.enviada = !m.enviada;
  m.fechaEnvio = m.enviada ? nowDT() : '';
  pushHist(c, (m.enviada ? 'Muestra enviada a Anatomía Patológica: ' : 'Envío revertido: ') + m.tipo + ' (' + m.rotulo + ')');
  upsert('cirugias', c);

function delMuestra(id, idx) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c || !c.muestras || !c.muestras[idx]) return;

  const m = c.muestras.splice(idx, 1)[0];

  upsert('cirugias', c);
  openCirugia(id);

/* ================= INDICADORES DE GESTIÓN (KPIs) ================= */
function calcKPIs(ym) {
  const delMes = DB.cirugias.filter((c) => (c.fecha || '').startsWith(ym));
  const realizadas = delMes.filter((c) => c.estado === 'realizada');
  const suspendidas = delMes.filter((c) => c.estado === 'suspendida');
  const programadas = delMes.filter((c) => ['confirmada', 'en_curso', 'realizada', 'suspendida'].includes(c.estado));

  // 1) Utilización del bloque: minutos operados / minutos disponibles
  const minOperados = realizadas.reduce((s, c) => {
    if (c.horaInicioReal && c.horaFinReal) return s + Math.max(0, diffMin(c.horaInicioReal, c.horaFinReal));
    return s + (c.duracionMin || 0);
  }, 0);
  const minDisponibles = diasHabilesMes(ym) * BLOQUE.quirofanos.length * (BLOQUE.horaCierre - BLOQUE.horaApertura) * 60;
  const utilizacion = minDisponibles ? (minOperados / minDisponibles) * 100 : 0;

  // 2) Tasa de suspensiones sobre el total programado
  const tasaSusp = programadas.length ? (suspendidas.length / programadas.length) * 100 : 0;

  // 3) Recambio (turnover): minutos entre el fin de una cirugía y el inicio de la siguiente en el mismo quirófano
  const turnovers = [];
  BLOQUE.quirofanos.forEach((q) => {
    const porDia = {};
    realizadas.filter((c) => c.quirofano === q && c.horaInicioReal && c.horaFinReal)
      .forEach((c) => { (porDia[c.fecha] = porDia[c.fecha] || []).push(c); });
    Object.values(porDia).forEach((arr) => {
      arr.sort((a, b) => String(a.horaInicioReal).localeCompare(String(b.horaInicioReal)));
      for (let i = 1; i < arr.length; i++) {
        const t = diffMin(arr[i - 1].horaFinReal, arr[i].horaInicioReal);
        if (t >= 0 && t < 600) turnovers.push(t);
      }
    });
  });
  const turnover = turnovers.length ? turnovers.reduce((a, b) => a + b, 0) / turnovers.length : null;

  // 4) Cumplimiento del informe operatorio en menos de 2 h
  const conInforme = realizadas.filter((c) => c.informe && c.horaFinReal);
  const enPlazo = conInforme.filter((c) => diffMin(c.horaFinReal, c.informe.fechaHora) <= 120).length;
  const cumplInforme = realizadas.length ? (enPlazo / realizadas.length) * 100 : 0;

  // Causas de suspensión del mes
  const causas = {};
  suspendidas.forEach((c) => { const k = c.suspension?.causa || 'Sin causa registrada'; causas[k] = (causas[k] || 0) + 1; });

  return {
    utilizacion, tasaSusp, turnover, cumplInforme,
    realizadas: realizadas.length, suspendidas: suspendidas.length, programadas: programadas.length,
    minOperados, minDisponibles, turnovers: turnovers.length, conInforme: conInforme.length, enPlazo, causas,
  };
}

/* ================= ESTADÍSTICAS QUIRÚRGICAS (por servicio y cirujano) =================
   "Indicadores" mide el bloque como un todo contra las metas institucionales.
   Esta vista, en cambio, compara la producción entre equipos sobre un período
   libre: volumen, horas de quirófano, suspensiones, cumplimiento del informe
   operatorio y de la lista de verificación, y lista de espera.

   Alcance de la información: la Jefatura ve el plantel completo. Un profesional
   con sesión iniciada ve el agregado por servicio y, en el desglose nominal,
   solamente sus propios datos: el rendimiento individual de un colega no es
   información de acceso general. */

function estRango() {
  if (!estDesde || !estHasta) {
    const hoy = hoyISO();
    estDesde = hoy.slice(0, 8) + '01';
    estHasta = hoy;
  }
  return [estDesde, estHasta];
}
function estIso(y, m, d) { return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`; }
function estPreset(p) {
  const hoy = hoyISO();
  const [y, m] = hoy.split('-').map(Number);
  const ultDia = (yy, mm) => new Date(yy, mm, 0).getDate();
  if (p === 'mes') { estDesde = estIso(y, m, 1); estHasta = hoy; }
  else if (p === 'mesant') {
    const my = m === 1 ? y - 1 : y, mm = m === 1 ? 12 : m - 1;
    estDesde = estIso(my, mm, 1); estHasta = estIso(my, mm, ultDia(my, mm));
  } else if (p === 'trim') {
    const d = new Date(y, m - 1, 1); d.setMonth(d.getMonth() - 2);
    estDesde = estIso(d.getFullYear(), d.getMonth() + 1, 1); estHasta = hoy;
  } else if (p === 'anio') { estDesde = estIso(y, 1, 1); estHasta = hoy; }
  else if (p === '12m') {
    const d = new Date(y, m - 1, 1); d.setMonth(d.getMonth() - 11);
    estDesde = estIso(d.getFullYear(), d.getMonth() + 1, 1); estHasta = hoy;
  }
  renderEstadisticas();
}
function estSort(col) {
  if (estOrden === col) estAsc = !estAsc;
  else { estOrden = col; estAsc = col === 'nombre'; }
  renderEstadisticas();
}
function estVerCirujanos(servEnc) {
  estServicio = decodeURIComponent(servEnc);
  estTab = 'cirujano';
  renderEstadisticas();
}

function estGrupoVacio(nombre) {
  return {
    nombre, servicios: {}, salas: {}, causas: {}, espera: [],
    programadas: 0, realizadas: 0, suspendidas: 0, minutos: 0,
    urgencias: 0, pediatricos: 0, conInforme: 0, informeEnPlazo: 0, lvqOk: 0,
    enEspera: 0, esperaMax: 0, mails: {},
  };
}

/* Agrupa la actividad del período por servicio o por cirujano.
   Se consideran "programadas" las cirugías que llegaron al parte (confirmadas,
   en curso, realizadas y suspendidas): los borradores y las solicitudes en
   circuito de validación todavía no consumieron quirófano. */
function calcEstadisticas(clave) {
  const [desde, hasta] = estRango();
  const G = {};
  const grupo = (c) => {
    const k = (clave === 'servicio' ? c.servicio : c.cirujano) || 'Sin asignar';
    const g = G[k] || (G[k] = estGrupoVacio(k));
    if (c.servicio) g.servicios[c.servicio] = (g.servicios[c.servicio] || 0) + 1;
    if (c.cirujanoEmail) g.mails[c.cirujanoEmail] = true;
    return g;
  };

  DB.cirugias
    .filter((c) => c.fecha && c.fecha >= desde && c.fecha <= hasta)
    .filter((c) => ['confirmada', 'en_curso', 'realizada', 'suspendida'].includes(c.estado))
    .forEach((c) => {
      const g = grupo(c);
      g.programadas++;
      if (c.quirofano) g.salas[c.quirofano] = (g.salas[c.quirofano] || 0) + 1;
      if (c.estado === 'suspendida') {
        g.suspendidas++;
        const causa = c.suspension?.causa || 'Sin causa registrada';
        g.causas[causa] = (g.causas[causa] || 0) + 1;
        return;
      }
      if (c.estado !== 'realizada') return;
      g.realizadas++;
      g.minutos += minutosCirugia(c);
      if (prioridadEfectiva(c) <= 2) g.urgencias++;
      if (c.paciente?.pediatrico) g.pediatricos++;
      if (lvqIntegra(c)) g.lvqOk++;
      if (c.informe) {
        g.conInforme++;
        if (c.horaFinReal && diffMin(c.horaFinReal, c.informe.fechaHora) <= 120) g.informeEnPlazo++;
      }
      if (c.fechaSolicitud) g.espera.push(Math.max(0, diasEntre(c.fechaSolicitud, c.fecha)));
    });

  // Lista de espera: es una foto del estado actual, no del período elegido.
  DB.cirugias.filter((c) => ['borrador', 'pendiente', 'validada'].includes(c.estado)).forEach((c) => {
    const g = grupo(c);
    g.enEspera++;
    g.esperaMax = Math.max(g.esperaMax, esperaDias(c));
  });

  const arr = Object.values(G).map((g) => {
    g.horas = g.minutos / 60;
    g.tasaSusp = g.programadas ? (g.suspendidas / g.programadas) * 100 : 0;
    g.durMedia = g.realizadas ? g.minutos / g.realizadas : 0;
    g.cumplInforme = g.realizadas ? (g.informeEnPlazo / g.realizadas) * 100 : 0;
    g.cumplLVQ = g.realizadas ? (g.lvqOk / g.realizadas) * 100 : 0;
    g.esperaMedia = g.espera.length ? g.espera.reduce((a, b) => a + b, 0) / g.espera.length : null;
    g.servicioPrinc = Object.entries(g.servicios).sort((a, b) => b[1] - a[1])[0]?.[0] || '';
    g.salaPrinc = Object.entries(g.salas).sort((a, b) => b[1] - a[1])[0]?.[0] || '';
    return g;
  });
  const totMin = arr.reduce((s, g) => s + g.minutos, 0);
  arr.forEach((g) => { g.share = totMin ? (g.minutos / totMin) * 100 : 0; });
  return arr;
}

function estOrdenar(arr) {
  const dir = estAsc ? 1 : -1;
  return arr.slice().sort((a, b) => {
    if (estOrden === 'nombre') return a.nombre.localeCompare(b.nombre) * dir;
    const va = a[estOrden] === null || a[estOrden] === undefined ? -1 : a[estOrden];
    const vb = b[estOrden] === null || b[estOrden] === undefined ? -1 : b[estOrden];
    return (va - vb) * dir || a.nombre.localeCompare(b.nombre);
  });
}
function estPill(valor, buenoDesde, regularDesde) {
  const cls = valor >= buenoDesde ? 'ok' : valor >= regularDesde ? 'mid' : 'bad';
  return `<span class="est-pill ${cls}">${valor.toFixed(0)} %</span>`;
}
function estPillInv(valor, maloDesde, regularDesde) {
  const cls = valor >= maloDesde ? 'bad' : valor >= regularDesde ? 'mid' : 'ok';
  return `<span class="est-pill ${cls}">${valor.toFixed(1)} %</span>`;
}

/* ================= RECLAMOS (canal Jefe a Jefe) ================= */
const JEFATURA = 'Jefatura de Quirófanos';

/* El reclamo dejó de ser un mensaje con una única respuesta: ahora es un hilo.
   Los registros anteriores (asunto + texto + respuesta) se leen como un hilo de
   uno o dos mensajes, sin necesidad de migrar nada en la base. */
function hiloReclamo(r) {
  if (Array.isArray(r.mensajes) && r.mensajes.length) return r.mensajes;
  const h = [{ rol: 'autor', nombre: r.autor, email: r.autorMail || '', de: r.de, texto: r.texto, t: r.fechaHora }];
  if (r.respuesta) h.push({ rol: 'jefatura', nombre: JEFATURA, email: '', de: JEFATURA, texto: r.respuesta, t: r.fechaRespuesta || r.fechaHora });
  return h;
}
/* Papel de quien está mirando dentro de este reclamo. Si el jefe es además el
   autor, manda su condición de autor: es quien espera la respuesta. */
function rolEnReclamo(r) {
  const u = usuarioActual();
  if (u && r.autorMail && r.autorMail === u.email) return 'autor';
  if (jefe) return 'jefatura';
  return null;
}
function claveLector(r) {
  const rol = rolEnReclamo(r);
  if (rol === 'autor') return claveMail(usuarioActual().email);
  return rol === 'jefatura' ? '__jefatura' : '';
}
/* A quién le toca actuar: tras un mensaje del autor responde la Jefatura; tras
   una respuesta de la Jefatura, el autor debe leerla y cerrar o replicar. */
function turnoDeReclamo(r) {
  if (r.estado === 'cerrado') return null;
  const ult = hiloReclamo(r).slice(-1)[0];
  if (!ult) return null;
  return ult.rol === 'autor' ? 'jefatura' : 'autor';
}
function venceReclamo(r) {
  const delAutor = hiloReclamo(r).filter((m) => m.rol === 'autor').slice(-1)[0];
  return addHorasHabiles((delAutor && delAutor.t) || r.fechaHora, 48);
}
/* Cuántos mensajes leyó ya quien mira. Se guarda la cantidad de mensajes vistos
   y no la hora del último: `nowDT()` tiene precisión de minuto, y dos mensajes
   del mismo minuto harían que una respuesta se diera por leída sin serlo. */
function leidosPor(r) {
  const clave = claveLector(r);
  return clave ? (Number((r.leido || {})[clave]) || 0) : 0;
}
function reclamoNoLeidos(r) {
  const rol = rolEnReclamo(r);
  if (!rol) return 0;
  return hiloReclamo(r).slice(leidosPor(r)).filter((m) => m.rol !== rol).length;
}
/* Avisos de reclamos que le corresponden a quien está mirando: los que debe
   contestar y los que tienen respuestas sin leer. */
function reclamosPendientes() {
  return DB.reclamos.filter((r) => {
    const mio = rolEnReclamo(r);
    if (!mio || r.estado === 'cerrado') return false;
    return turnoDeReclamo(r) === mio || reclamoNoLeidos(r) > 0;
  }).length;
}
function verReclamo(id) {
  reclamoAbierto = (String(reclamoAbierto) === String(id)) ? null : id;
  if (reclamoAbierto !== null) marcarReclamoLeido(id);
  renderReclamos();
}
function abrirReclamo(id) {
  reclamoAbierto = id;
  marcarReclamoLeido(id);
  renderReclamos();
  const el = document.getElementById('msg-' + id);
  if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
function marcarReclamoLeido(id) {
  const r = DB.reclamos.find((x) => String(x.id) === String(id));
  if (!r) return;
  const clave = claveLector(r);
  if (!clave) return;
  const total = hiloReclamo(r).length;
  // Idempotente: sin esto, cada re-render volvería a escribir en la nube.
  if (leidosPor(r) >= total) return;
  r.leido = Object.assign({}, r.leido, { [clave]: total });
  upsert('reclamos', r);
}

function renderReclamos() {
  const u = usuarioActual();
  const aResponder = DB.reclamos.filter((r) => rolEnReclamo(r) && turnoDeReclamo(r) === rolEnReclamo(r));
  const sinLeer = DB.reclamos.filter((r) => r.estado !== 'cerrado' && reclamoNoLeidos(r) > 0);
  const permiso = ('Notification' in window) ? Notification.permission : 'unsupported';
  const lista = DB.reclamos.slice().sort((a, b) => {
    // Primero lo que exige acción de quien mira, después por antigüedad.
    const pa = (rolEnReclamo(a) && turnoDeReclamo(a) === rolEnReclamo(a) ? 0 : 2) - (reclamoNoLeidos(a) ? 1 : 0);
    const pb = (rolEnReclamo(b) && turnoDeReclamo(b) === rolEnReclamo(b) ? 0 : 2) - (reclamoNoLeidos(b) ? 1 : 0);
    return pa - pb || String(ultimaActividad(b)).localeCompare(String(ultimaActividad(a)));
  });
  $('main').innerHTML = `
    <div class="page-head">
      <div class="head-row">
        <div class="head-icon">${ICONS.mail.replace('16', '20')}</div>
        <div>

        </div>
      </div>
    </div>

    ${aResponder.length ? `<div class="banner banner-amber">${ICONS.reply.replace('15', '18')}
      <div><strong>${aResponder.length} reclamo(s) esperan su respuesta</strong>
      ${aResponder.map((r) => `<div style="margin-top:6px">· <a href="#reclamos" onclick="event.preventDefault();abrirReclamo(${r.id})" style="color:inherit;font-weight:700">${esc(r.asunto)}</a> — ${esc(r.de)}, ${fmtDT(ultimaActividad(r))}</div>`).join('')}</div></div>` : ''}

function ultimaActividad(r) {
  const h = hiloReclamo(r);
  return (h.length ? h[h.length - 1].t : r.fechaHora) || r.fechaHora;
}

function mensajeHTML(m, nuevo) {
  const quien = m.nombre || (m.rol === 'jefatura' ? JEFATURA : 'Autor');
  return `<div class="msg ${m.rol === 'jefatura' ? 'jefatura' : ''} ${nuevo ? 'nuevo' : ''}">
    <div class="msg-head">

      ${nuevo ? '<span class="sin-leer">Nuevo</span>' : ''}
    </div>
    <div class="msg-txt">${esc(m.texto)}</div>

}

function reclamoCard(r) {

  const leidos = leidosPor(r);
  const vence = venceReclamo(r);
  const vencido = turno === 'jefatura' && new Date() > vence;
  const abierto = String(reclamoAbierto) === String(r.id);
  const estadoChip = r.estado === 'cerrado'
    ? 'background:#eef1f4;color:#4b5563;border-color:var(--line)'
    : turno === 'jefatura' ? 'background:var(--amber-soft);color:#92600a;border-color:#f3ddb0'

  const estadoTxt = r.estado === 'cerrado' ? 'Cerrado' : turno === 'jefatura' ? 'Esperando respuesta' : 'Respondido';

  return `<div class="inc-card" style="cursor:default">
    <div class="inc-top">
      <span class="chip" style="${estadoChip}">${estadoTxt}</span>
      <span class="chip">${ICONS.calendar} ${fmtDT(r.fechaHora)}</span>
      ${turno ? `<span class="turno-de">${ICONS.reply.replace('15', '12')} Debe responder: ${turno === 'jefatura' ? JEFATURA : esc(r.autor)}${turno === rol ? ' (usted)' : ''}</span>` : ''}
      ${nuevos ? `<span class="sin-leer">${ICONS.msg.replace('16', '12')} ${nuevos} sin leer</span>` : ''}
      ${turno === 'jefatura' ? `<span class="chip" style="${vencido ? 'background:var(--red-soft);color:var(--red);border-color:#f3c8c8' : ''}">${ICONS.clockSm} ${vencido ? 'Plazo vencido' : 'Vence ' + fmtDT(dateToDT(vence))}</span>` : ''}
    </div>
    <div style="font-weight:700;font-size:0.98rem;margin-bottom:6px">${esc(r.asunto)}</div>
    ${abierto ? '' : `<div class="inc-desc" style="-webkit-line-clamp:3">${esc(hilo[hilo.length - 1].texto)}</div>`}
    <div class="inc-meta"><span>${ICONS.user} ${esc(r.autor)} · ${esc(r.de)}</span><span>${ICONS.mail.replace('16', '14')} ${esc(r.para)}</span><span>${ICONS.msg.replace('16', '14')} ${hilo.length} mensaje(s)</span></div>

      ${rol && r.estado === 'cerrado' ? `<button class="btn btn-sm btn-outline" onclick="reabrirReclamo(${r.id})">${ICONS.refresh} Reabrir</button>` : ''}
      ${rol === 'jefatura' && r.autorMail ? `<a class="btn btn-sm btn-outline" href="${avisoMailto(r)}">${ICONS.mail.replace('16', '15')} Avisar por correo</a>` : ''}
    </div>

    ${abierto ? `<div style="margin-top:16px">
      ${hilo.map((m, i) => mensajeHTML(m, !!rol && m.rol !== rol && i >= leidos)).join('')}

        <textarea id="msg-${r.id}" style="min-height:84px" placeholder="${rol === 'jefatura' ? 'Respuesta formal...' : 'Agregue información o responda a la Jefatura...'}"></textarea>

/* Aviso por correo: abre un borrador en el cliente de correo del dispositivo.
   El envío lo hace la persona, la app no manda nada por su cuenta. */
function avisoMailto(r) {
  const asunto = `HRU Quirófanos — respuesta a su reclamo: ${r.asunto}`;
  const cuerpo = `Estimado/a ${r.autor}:\n\nLa Jefatura de Quirófanos registró una respuesta a su reclamo "${r.asunto}".\nPuede leerla en la app, en la sección Reclamos.\n\n${location.origin}${location.pathname}#reclamos\n`;
  return `mailto:${encodeURIComponent(r.autorMail)}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
}

function enviarReclamo() {
  const u = usuarioActual();
  const asunto = $('r-asunto').value.trim();
  const texto = $('r-texto').value.trim();
  if (!u || !asunto || !texto) { alert('Complete el asunto y el detalle del reclamo.'); return; }
  const t = nowDT();
  const id = Date.now();
  upsert('reclamos', {
    id, de: u.servicio, para: JEFATURA, asunto, texto,
    autor: u.nombre, autorMail: u.email, fechaHora: t,
    estado: 'abierto', respuesta: '', fechaRespuesta: '',
    mensajes: [{ rol: 'autor', nombre: u.nombre, email: u.email, de: u.servicio, texto, t }],
    leido: { [claveMail(u.email)]: 1 },
  });
  reclamoAbierto = id;
  renderReclamos();
}

function enviarMensajeReclamo(id) {
  const r = DB.reclamos.find((x) => String(x.id) === String(id));
  if (!r) return;
  const rol = rolEnReclamo(r);
  if (!rol) { alert('Solo el autor del reclamo y la Jefatura pueden escribir en este hilo.'); return; }
  const ta = $('msg-' + id);
  const texto = ta ? ta.value.trim() : '';
  if (!texto) { alert('Escriba el mensaje.'); return; }
  const u = usuarioActual();
  const t = nowDT();
  const hilo = hiloReclamo(r).slice();
  hilo.push({
    rol, texto, t,
    nombre: rol === 'jefatura' ? JEFATURA : (u ? u.nombre : r.autor),
    email: rol === 'jefatura' ? '' : (u ? u.email : r.autorMail || ''),
    de: rol === 'jefatura' ? JEFATURA : (u ? u.servicio : r.de),
  });
  r.mensajes = hilo;
  r.estado = rol === 'jefatura' ? 'respondido' : 'abierto';
  // Espejo de la primera respuesta en los campos de la versión anterior.
  if (rol === 'jefatura' && !r.respuesta) { r.respuesta = texto; r.fechaRespuesta = t; }
  // Quien escribe leyó todo el hilo, incluido su propio mensaje.
  r.leido = Object.assign({}, r.leido, { [claveLector(r)]: hilo.length });
  if (ta) ta.value = '';
  upsert('reclamos', r);
  reclamoAbierto = r.id;
  renderReclamos();
}

function cerrarReclamo(id) {
  const r = DB.reclamos.find((x) => String(x.id) === String(id));
  if (!r || !rolEnReclamo(r)) return;
  if (!confirm('¿Dar por cerrado este reclamo? Dejarán de emitirse recordatorios. Puede reabrirse después.')) return;
  r.estado = 'cerrado';
  r.cerradoPor = rolEnReclamo(r) === 'jefatura' ? JEFATURA : (usuarioActual()?.nombre || r.autor);
  r.fechaCierre = nowDT();
  upsert('reclamos', r);
  renderReclamos();
}
function reabrirReclamo(id) {
  const r = DB.reclamos.find((x) => String(x.id) === String(id));
  if (!r || !rolEnReclamo(r)) return;
  r.estado = hiloReclamo(r).slice(-1)[0]?.rol === 'autor' ? 'abierto' : 'respondido';
  r.cerradoPor = ''; r.fechaCierre = '';
  upsert('reclamos', r);
  renderReclamos();
}

async function doLogin() {
  const mail = $('l-mail').value.trim().toLowerCase();
  const pass = $('l-pass').value;
  const u = DB.usuarios.find((x) => x.email.toLowerCase() === mail);
  const h = await hashPass(pass);
  if (!u || u.passHash !== h) {
    $('login-error').style.display = 'block';
    return;
  }
  sessionStorage.setItem('hru_user', u.email);
  go('mis');
}

async function doAlta() {
  const err = $('alta-error');
  const nombre = $('a-nombre').value.trim(), dni = $('a-dni').value.trim();
  const mail = $('a-mail').value.trim().toLowerCase(), serv = $('a-serv').value.trim();
  const p1 = $('a-pass').value, p2 = $('a-pass2').value;
  const fail = (m) => { err.textContent = m; err.style.display = 'block'; };
  if (!nombre || !dni || !mail || !serv || !p1) return fail('Complete todos los campos.');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) return fail('Ingrese un correo institucional válido.');
  if (p1.length < 6) return fail('La contraseña debe tener al menos 6 caracteres.');
  if (p1 !== p2) return fail('Las contraseñas no coinciden.');
  if (DB.usuarios.some((u) => u.email.toLowerCase() === mail)) return fail('Ya existe una cuenta con ese correo.');
  const u = {
    id: mail.replace(/[.#$/\[\]]/g, ','),
    email: mail, nombre, dni, servicio: serv,
    matricula: { numero: '', vigente: false },
    especialista: { titulo: '', si: false },
    seguro: { vence: '' },
    rcp: { tipo: '', fecha: '' },
    vacunas: { hepB: false, dobleAdultos: false, influenza: false, covid: false },
    passHash: await hashPass(p1), creado: hoyISO(),
  };
  upsert('usuarios', u);
  sessionStorage.setItem('hru_user', u.email);
  go('perfil');
}

function userLogout() {
  sessionStorage.removeItem('hru_user');
  go('panel');
}

            const b = (ok) => ok ? `<span class="badge-ok">${ICONS.check}</span>` : `<span class="badge-no">${ICONS.x}</span>`;
            return `<tr>
              <td><b>${esc(u.nombre)}</b><div class="req-sub">${esc(u.email)}</div></td>
              <td>${esc(u.servicio)}</td>
              <td>${b(h.reqs[0].ok)}</td>
              <td>${b(h.reqs[1].ok)}</td>
              <td>${b(h.reqs[2].ok)}<div class="req-sub">${u.seguro?.vence ? fmtFecha(u.seguro.vence) : '—'}</div></td>
              <td>${b(h.reqs[3].ok)}<div class="req-sub">${u.rcp?.fecha ? fmtFecha(u.rcp.fecha) : '—'}</div></td>
              <td>${b(h.reqs[4].ok)}</td>
              <td>${h.ok ? '<span class="badge-ok">Habilitado</span>' : '<span class="badge-no">Incompleto</span>'}</td>
            </tr>`;
          }).join('') : '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:30px">No hay profesionales registrados.</td></tr>'}
        </tbody>
      </table>
    </div>`;
}

/* ================= ACCESO JEFE ================= */
function openJefeModal() {
  $('jefe-pass').value = '';
  $('pass-error').style.display = 'none';
  $('jefe-overlay').classList.add('open');
  setTimeout(() => $('jefe-pass').focus(), 50);
}
function closeJefeModal() { $('jefe-overlay').classList.remove('open'); }
function tryJefeLogin() {
  if ($('jefe-pass').value === JEFE_CLAVE) {
    jefe = true;
    sessionStorage.setItem('hru_jefe', '1');
    closeJefeModal();
    go('programacion');
  } else {
    $('pass-error').style.display = 'block';
    $('jefe-pass').value = '';
    $('jefe-pass').focus();
  }
}
function jefeLogout() {
  jefe = false;
  sessionStorage.removeItem('hru_jefe');
  if (['confidenciales', 'programacion', 'kpis', 'usuarios'].includes(view)) view = 'panel';
  go(view);
}

/* ================= PROGRAMACIÓN DIARIA (GRILLA DE TURNOS) =================
   Superficie principal de programación: una grilla por día con las seis salas
   y sus franjas horarias. Cada franja ocupada es un turno quirúrgico completo
   que recorre el circuito de estados (borrador → pendiente → validada →
   confirmada → en curso → realizada / suspendida), con su prioridad de
   prelación, su LVQ y su coordinación de áreas. */
let diaSel = null;
let slotCtx = null;

function agendaDia(d) { return DB.agenda.find((a) => a.id === d) || null; }
function diaHabilitado(d) { const a = agendaDia(d); return !a || a.on !== false; }
function salaHabilitada(d, sid) {
  const a = agendaDia(d);
  return !a || !a.salas || !a.salas[sid] || a.salas[sid].on !== false;
}
function guardarAgenda(d, mut) {
  const a = agendaDia(d) || { id: d, on: true, salas: {} };
  a.salas = a.salas || {};
  mut(a);
  upsert('agenda', a);
}
function setDiaOn(d, v) { guardarAgenda(d, (a) => { a.on = v; }); }
function setSalaOn(d, sid, v) { guardarAgenda(d, (a) => { a.salas[sid] = { on: v }; }); }

function turnoEn(d, sid, fid) {
  return DB.cirugias.find((c) => c.fecha === d && c.sala === sid && c.franja === fid) || null;
}
function esLaborable(d) { const w = new Date(d + 'T12:00:00').getDay(); return w >= 1 && w <= 5; }
function fmtDiaLargo(d) {
  const dt = new Date(d + 'T12:00:00');
  return `${DIAS_S[dt.getDay()]} ${dt.getDate()} de ${MESES_FULL[dt.getMonth()]} de ${dt.getFullYear()}`;
}
/* Regla de anticipación: un turno electivo se programa con 24 h como mínimo.
   Las urgencias del Quirófano 1 y de Obstetricia la saltean. */
function puedeReservar(d, hora, urgencia) {
  if (urgencia) return true;
  return new Date(d + 'T' + hora + ':00').getTime() >= Date.now() + HORAS_ANTICIPACION * 36e5;
}
function anticipacionMinima() {
  const t = new Date(Date.now() + HORAS_ANTICIPACION * 36e5);
  return `${String(t.getDate()).padStart(2, '0')}/${String(t.getMonth() + 1).padStart(2, '0')}/${t.getFullYear()} ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')} h`;
}
function authChip(c) {
  if (!c.auth) return '<span class="slot-auth auth-pend">PEND. AUT.</span>';
  return c.auth === 'AUTORIZADO'
    ? '<span class="slot-auth auth-ok">AUTORIZADO</span>'
    : '<span class="slot-auth auth-no">NO AUTORIZ.</span>';
}

function slotCard(d, s, f, salaOff) {
  const c = turnoEn(d, s.id, f.id);
  if (c) {
    const e = ESTC[c.estado];
    const pe = prioridadEfectiva(c);
    return `<button type="button" class="slot" style="border-left:4px solid ${e.color}" onclick="openSlot('${d}','${s.id}','${f.id}')">
      ${c.urgencia ? '<span class="slot-urg-tag">URG</span>' : ''}
      <span class="slot-hora">${f.t}</span>
      <span class="slot-cir">${esc(c.cirujano || 's/d')}</span>
      <span class="slot-pac">${esc(c.paciente?.nombre || 's/d')}</span>
      <span class="slot-cx">${esc(c.procedimiento || '')}</span>
      <span class="slot-chips">
        <span class="slot-est" style="background:${e.soft};color:${e.text}">${e.label}</span>
        <span class="slot-prio" style="background:${PRIOS[pe].color}">P${pe}</span>
        ${authChip(c)}
      </span>
    </button>`;
  }
  if (salaOff) {
    return `<div class="slot slot-libre slot-bloq"><span class="slot-hora">${f.t}</span>
      <span class="slot-mas">${ICONS.lock.replace('18', '16')}</span><span class="slot-hint">Bloqueado</span></div>`;
  }
  const reservable = puedeReservar(d, f.t, false);
  if (!reservable && !s.urgencias) {
    return `<div class="slot slot-libre slot-bloq" title="Se programa con ${HORAS_ANTICIPACION} h de anticipación (desde ${anticipacionMinima()})">
      <span class="slot-hora">${f.t}</span><span class="slot-mas">${ICONS.clockSm.replace('14', '16')}</span>
      <span class="slot-hint">&lt; ${HORAS_ANTICIPACION} h</span></div>`;
  }
  return `<button type="button" class="slot slot-libre" onclick="openSlot('${d}','${s.id}','${f.id}')">
    <span class="slot-hora">${f.t}</span><span class="slot-mas">+</span>
    <span class="slot-hint">${!reservable && s.urgencias ? 'Solo urgencia' : 'Disponible'}</span></button>`;
}

function salaCard(d, s) {
  const off = !diaHabilitado(d) || !salaHabilitada(d, s.id);
  const cuerpo = s.tipo === 'endo'
    ? `<div class="franjas-endo">${s.franjas.map((f) => slotCard(d, s, f, off)).join('')}</div>`
    : `<div class="franjas-wrap">
         <div class="periodo-hdr">Turno Mañana <span class="ph-t">08:00 – 14:00</span></div>
         <div class="franjas-row">${s.franjas.filter((f) => f.p === 'M').map((f) => slotCard(d, s, f, off)).join('')}</div>
         <div class="periodo-hdr">Turno Tarde <span class="ph-t">14:00 – 20:00</span></div>
         <div class="franjas-row">${s.franjas.filter((f) => f.p === 'T').map((f) => slotCard(d, s, f, off)).join('')}</div>
       </div>`;
  return `<div class="sala-card ${off ? 'off' : ''}">
    <div class="sala-hdr">
      <h3>${esc(s.nombre)}</h3>
      ${s.etiqueta ? `<span class="badge-sala ${s.clase}">${s.etiqueta}</span>` : ''}
      <span class="sala-estado ${off ? 'off' : ''}"><span class="sd"></span>${off ? 'DESHABILITADA' : 'HABILITADA'}</span>
    </div>
    ${cuerpo}
  </div>`;
}

function renderProgDiaria() {
  if (!diaSel) diaSel = hoyISO();
  const d = diaSel;
  const laborable = esLaborable(d);
  const dOn = diaHabilitado(d);
  const delDia = DB.cirugias.filter((c) => c.fecha === d);
  const ocupadas = delDia.length;
  const capacidad = SALAS.reduce((n, s) => n + (salaHabilitada(d, s.id) && dOn ? s.franjas.length : 0), 0);

  let cuerpo = '';
  if (!laborable) {
    cuerpo = `<div class="dia-banner">${ICONS.alertTri.replace(/22/g, '18')} ${fmtDiaLargo(d)} — día no laborable (fin de semana). Solo se registran urgencias y emergencias.</div>`;
  }
  if (!dOn) {
    cuerpo += `<div class="dia-banner">${ICONS.lock} ${fmtDiaLargo(d)} — día deshabilitado por Jefatura de Quirófanos.</div>`;
  }
  cuerpo += `<div class="salas-grid">${SALAS.filter((s) => s.tipo === 'qx').map((s) => salaCard(d, s)).join('')}</div>`;
  cuerpo += SALAS.filter((s) => s.tipo !== 'qx').map((s) => `<div style="margin-bottom:16px">${salaCard(d, s)}</div>`).join('');

  // Turnos cargados antes de existir la grilla (o con la sala ya retirada del bloque):
  // se listan aparte para que ninguno quede invisible en la programación del día.
  const huerfanos = delDia.filter((c) => !c.sala || !c.franja || !SALAS.some((s) => s.id === c.sala));
  if (huerfanos.length) {
    cuerpo += `<div class="q-group-title" style="margin-top:20px">${ICONS.alertTri.replace(/22/g, '18')} Turnos sin franja asignada
      <span style="color:var(--muted);font-weight:500;font-size:0.8rem">· ${huerfanos.length} · cargados fuera de la grilla</span></div>
      ${huerfanos.map((c) => cirCard(c, jefe ? 'jefe' : 'cirujano')).join('')}`;
  }

  $('main').innerHTML = `
    <div class="page-head">
      <div class="head-row">
        <div class="head-icon">${ICONS.grid}</div>
        <div>
          <h1 class="page-title">Programación Diaria</h1>
          <p class="page-sub">Grilla de turnos por sala y franja horaria — ${ocupadas} de ${capacidad} franjas ocupadas</p>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-outline btn-sm" onclick="imprimirParte('${d}')">${ICONS.fileText} Imprimir parte</button>
        ${jefe ? `<button class="btn btn-outline btn-sm" onclick="openJefaturaDia()">${ICONS.shield.replace('18', '15')} Jefatura</button>` : ''}
      </div>
    </div>

    <div class="dia-bar">
      <button class="dia-nav" onclick="moverDia(-1)" aria-label="Día anterior">‹</button>
      <button class="dia-nav" onclick="moverDia(1)" aria-label="Día siguiente">›</button>
      <div class="dia-disp ${laborable ? '' : 'finde'}">${fmtDiaLargo(d)}</div>
      <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="btn btn-outline btn-sm" onclick="setDia('${hoyISO()}')">Hoy</button>
        <input type="date" value="${d}" onchange="setDia(this.value)">
      </div>
    </div>

    <div class="banner banner-blue">${ICONS.clockSm.replace('14', '18')}
      <div><strong>Reglas de programación</strong>
      Anticipación mínima de <b>${HORAS_ANTICIPACION} h</b> para turnos electivos (desde ${anticipacionMinima()}). Las <b>urgencias</b> del Quirófano 1 y de Obstetricia la saltean.
      Cierre de solicitudes <b>${BLOQUE.cierreSolicitudes} h</b> y publicación del parte <b>${BLOQUE.publicacionParte} h</b> del día previo.
      Los turnos se ordenan en el parte por prelación P1–P6.</div></div>

    ${leyendaEstados()}
    ${cuerpo}`;
}
function setDia(v) { diaSel = v; renderProgDiaria(); }
function moverDia(n) { diaSel = sumarDias(diaSel || hoyISO(), n); renderProgDiaria(); }

/* ---- Modal de turno sobre una franja ---- */
function openSlot(d, sid, fid) {
  const s = sala(sid), f = franjaDe(sid, fid);
  const c = turnoEn(d, sid, fid);
  const u = usuarioActual();
  const nuevo = !c;

  if (nuevo) {
    if (!u && !jefe) { alert('Para programar un turno debe ingresar con su correo institucional (Acceso Profesional) o con la clave de Jefatura.'); go('acceso'); return; }
    if (u && !habilitacion(u).ok) {
      alert('Su habilitación está incompleta. Complete matrícula, título de especialista, seguro de responsabilidad civil, RCP vigente y esquema de vacunación en Mi Perfil antes de programar turnos.');
      go('perfil'); return;
    }
  }
  slotCtx = { d, sid, fid, hora: f.t };
  const puedeEditar = nuevo || jefe || (u && c.cirujanoEmail === u.email && ['borrador', 'pendiente'].includes(c.estado));
  const ro = puedeEditar ? '' : 'disabled';
  const v = (x, alt) => esc((c && x) || alt || '');
  const eq = (c && c.equipos) || [];
  const avisoAnticip = (nuevo && !puedeReservar(d, f.t, false))
    ? `<div class="banner banner-amber" style="margin-bottom:14px">${ICONS.alertTri.replace(/22/g, '16')}<div>Este turno comienza en menos de ${HORAS_ANTICIPACION} horas.
        ${s.urgencias ? 'Solo puede programarse marcando <b>Urgencia / Emergencia</b>.' : 'Esta sala no admite excepciones: use el Quirófano 1 para urgencias.'}</div></div>` : '';

  $('slot-modal').innerHTML = `
    <button class="modal-close" onclick="closeSlot()" aria-label="Cerrar">✕</button>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:4px;flex-wrap:wrap">
      <div class="head-icon" style="background:#e8f4fb">${ICONS.calPlus}</div>
      <div>
        <div style="font-weight:800;font-size:1.1rem">${esc(s.nombre)} — ${f.t} h</div>
        <div style="font-size:0.82rem;color:var(--muted)">${fmtDiaLargo(d)} · ${nuevo ? 'Nuevo turno' : 'Turno programado'}</div>
      </div>
    </div>
    ${c ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0">${estChip(c)} ${prioChip(c)} ${authChip(c)}</div>` : '<div style="height:10px"></div>'}
    ${avisoAnticip}

    <div class="card" style="box-shadow:none;border:1px solid var(--line);margin-bottom:14px">
      <div class="card-title">Paciente y diagnóstico</div>
      <div class="card-sub">${ICONS.info.replace('18', '13')} Estos datos se importan de la Historia Clínica Electrónica cuando la interfaz HCE/HIS esté disponible; mientras tanto se declaran manualmente.</div>
      <div class="form-grid">
        <div class="field"><label>Paciente — apellido y nombre *</label><input type="text" id="k-pac" value="${v(c && c.paciente?.nombre)}" ${ro}></div>
        <div class="field"><label>DNI</label><input type="text" id="k-dni" value="${v(c && c.paciente?.dni)}" ${ro}></div>
        <div class="field"><label>Edad</label><input type="number" id="k-edad" min="0" max="120" value="${c?.paciente?.edad ?? ''}" ${ro}></div>
        <div class="field"><label>Obra social / financiador</label>
          <select id="k-obra" ${ro}><option value="">Seleccionar…</option>${OBRAS.map((o) => `<option ${c?.obraSocial === o ? 'selected' : ''}>${o}</option>`).join('')}</select></div>
        <div class="field"><label>Diagnóstico preoperatorio *</label><input type="text" id="k-diag" value="${v(c && c.diagnostico)}" ${ro}></div>
        <div class="field"><label>Código CIE-10</label><input type="text" id="k-cie" placeholder="Ej: K80.2" value="${v(c && c.cie10)}" ${ro}></div>
        <div class="field full"><label>Cirugía / procedimiento *</label><input type="text" id="k-proc" value="${v(c && c.procedimiento)}" ${ro}></div>
      </div>
      <div style="margin-top:12px">
        <label class="check-row"><input type="checkbox" id="k-preop" ${c?.hce?.preop ? 'checked' : ''} ${ro}> Estudios preoperatorios completos y verificados en la HCE</label>
        <label class="check-row"><input type="checkbox" id="k-consent" ${c?.hce?.consentimiento ? 'checked' : ''} ${ro}> Consentimiento informado firmado y registrado en la HCE</label>
      </div>
    </div>

    <div class="card" style="box-shadow:none;border:1px solid var(--line);margin-bottom:14px">
      <div class="card-title">Equipo quirúrgico</div>
      <div class="form-grid">
        <div class="field"><label>Cirujano / especialista *</label><input type="text" id="k-cir" value="${v(c && c.cirujano, u ? u.nombre : '')}" ${ro}></div>
        <div class="field"><label>Servicio / especialidad *</label>
          <select id="k-serv" ${ro}>${SERVICIOS_HRU.map((x) => `<option ${(c?.servicio || (u && u.servicio)) === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
        <div class="field"><label>Anestesista</label><input type="text" id="k-anest" value="${v(c && c.anestesista)}" ${ro}></div>
        <div class="field"><label>Tipo de anestesia</label>
          <select id="k-tanest" ${ro}><option value="">Seleccionar…</option>${ANESTESIAS.map((a) => `<option ${c?.anestesia === a ? 'selected' : ''}>${a}</option>`).join('')}</select></div>
      </div>
    </div>

    <div class="card" style="box-shadow:none;border:1px solid var(--line);margin-bottom:14px">
      <div class="card-title">Prioridad y recursos</div>
      <div class="form-grid">
        <div class="field full"><label>Prioridad de prelación *</label>
          <select id="k-prio" ${ro}>${Object.keys(PRIOS).filter((k) => k !== '5').map((k) => `<option value="${k}" ${String(c?.prioridad || 6) === k ? 'selected' : ''}>P${k} — ${PRIOS[k].label} (${PRIOS[k].desc})</option>`).join('')}</select>
          <span class="hint">La prioridad P5 (espera &gt; 90 días) la asigna el sistema automáticamente.</span></div>
        <div class="field"><label>Duración estimada (min)</label><input type="number" id="k-dur" min="15" step="5" value="${c?.duracionMin || (s.tipo === 'endo' ? 45 : 90)}" ${ro}></div>
      </div>
      <div style="margin-top:12px">
        <label class="check-row"><input type="checkbox" id="k-implante" ${c?.recursos?.implante ? 'checked' : ''} ${ro} onchange="$('k-impdet-wrap').style.display=this.checked?'flex':'none'"> Requiere implante / prótesis (verificación con Farmacia 48–72 h antes)</label>
        <div class="field" id="k-impdet-wrap" style="display:${c?.recursos?.implante ? 'flex' : 'none'};max-width:420px;margin:4px 0 0 26px"><input type="text" id="k-impdet" placeholder="Detalle del implante" value="${v(c && c.recursos?.implanteDetalle)}" ${ro}></div>
        <label class="check-row"><input type="checkbox" id="k-hemo" ${c?.recursos?.hemoderivados ? 'checked' : ''} ${ro}> Requiere reserva de hemoderivados (Hemoterapia)</label>
        ${s.urgencias ? `<label class="check-row" style="color:var(--red);font-weight:700"><input type="checkbox" id="k-urg" ${c?.urgencia ? 'checked' : ''} ${ro}> Urgencia / emergencia — saltea la anticipación de ${HORAS_ANTICIPACION} h</label>` : ''}
      </div>
      <div class="field full" style="margin-top:12px"><label>Equipamiento especial</label>
        <div class="coord-grid">
          ${EQUIPOS.map((x, i) => `<label class="coord-item"><input type="checkbox" class="k-eq" data-eq="${esc(x)}" ${eq.includes(x) ? 'checked' : ''} ${ro}> ${x}</label>`).join('')}
        </div></div>
    </div>

    ${c ? `<div class="det-section">
      <h4>Circuito del turno</h4>
      <div class="det-row"><b>Estado</b> ${ESTC[c.estado].label} — ${ESTC[c.estado].desc}</div>
      <div class="det-row"><b>Autorización</b> ${c.auth || 'PENDIENTE'} (Admisión y Egresos)</div>
      <div class="cir-actions" style="margin-top:10px">
        <button class="btn btn-sm btn-outline" onclick="closeSlot();openCirugia(${c.id})">${ICONS.eyeSm} Ver ficha completa (LVQ, coordinación, informe)</button>
        <button class="btn btn-sm btn-outline" onclick="pedirAutorizacion(${c.id})">${ICONS.shield.replace('18', '14')} Autorización de Admisión</button>
      </div>
    </div>` : ''}

    <div class="form-actions" style="margin-top:4px">
      ${puedeEditar ? `<button class="btn btn-blue" onclick="guardarSlot()">${ICONS.check.replace('14', '16')} ${nuevo ? 'Programar turno' : 'Guardar cambios'}</button>` : ''}
      ${c && (jefe || (u && c.cirujanoEmail === u.email)) ? `<button class="btn btn-red" onclick="cancelarSlot(${c.id})">${ICONS.trash} Cancelar turno</button>` : ''}
      <button class="btn btn-outline" onclick="closeSlot()">Cerrar</button>
      ${!puedeEditar ? `<p class="form-note">El turno ya avanzó en el circuito: los cambios se gestionan desde la ficha completa.</p>` : ''}
    </div>`;
  $('slot-overlay').classList.add('open');
}
function closeSlot() { $('slot-overlay').classList.remove('open'); slotCtx = null; }

function guardarSlot() {
  const { d, sid, fid, hora } = slotCtx;
  const s = sala(sid);
  const u = usuarioActual();
  const paciente = $('k-pac').value.trim();
  const cirujano = $('k-cir').value.trim();
  const diagnostico = $('k-diag').value.trim();
  const procedimiento = $('k-proc').value.trim();
  if (!paciente || !cirujano || !diagnostico || !procedimiento) {
    alert('Complete los campos obligatorios: paciente, cirujano, diagnóstico y procedimiento.');
    return;
  }
  const urgEl = $('k-urg');
  const urgencia = !!(urgEl && urgEl.checked);
  const existente = turnoEn(d, sid, fid);
  if (!existente && !puedeReservar(d, hora, urgencia)) {
    alert(`Este turno comienza en menos de ${HORAS_ANTICIPACION} horas.\n\nSolo puede programarse marcando "Urgencia / emergencia", y únicamente en el Quirófano 1 o en el quirófano de Obstetricia.`);
    return;
  }
  const edad = Number($('k-edad').value || 0);
  const prio = urgencia ? Math.min(Number($('k-prio').value), 2) : Number($('k-prio').value);
  const c = existente || {
    id: Date.now(), fechaSolicitud: hoyISO(), auth: null,
    historial: [{ t: nowDT(), a: 'Turno programado en la grilla' }],
    coordinacion: { insumos: false, esterilizacion: false, hemoterapia: false, anestesia: false },
    estado: 'pendiente',
  };
  Object.assign(c, {
    sala: sid, franja: fid, quirofano: s.nombre, fecha: d, horaProg: hora,
    paciente: { nombre: paciente, dni: $('k-dni').value.trim(), edad, pediatrico: edad > 0 && edad < 15 },
    obraSocial: $('k-obra').value,
    diagnostico, cie10: $('k-cie').value.trim(), procedimiento,
    cirujano, cirujanoEmail: existente ? c.cirujanoEmail : (u ? u.email : ''),
    servicio: $('k-serv').value,
    anestesista: $('k-anest').value.trim(), anestesia: $('k-tanest').value,
    duracionMin: Number($('k-dur').value || 90),
    prioridad: prio, urgencia,
    recursos: {
      arcoC: [...document.querySelectorAll('.k-eq')].some((x) => x.checked && x.dataset.eq.indexOf('Arco en C') === 0),
      implante: $('k-implante').checked,
      implanteDetalle: $('k-impdet').value.trim(),
      hemoderivados: $('k-hemo').checked,
    },
    equipos: [...document.querySelectorAll('.k-eq')].filter((x) => x.checked).map((x) => x.dataset.eq),
    hce: { datos: true, preop: $('k-preop').checked, consentimiento: $('k-consent').checked },
  });
  // La pediatría y la alta complejidad se programan en los primeros horarios.
  if (c.paciente.pediatrico && c.prioridad === 6) c.prioridad = 3;
  if (existente) pushHist(c, 'Turno actualizado');
  upsert('cirugias', c);
  closeSlot();
  renderProgDiaria();
}

function cancelarSlot(id) {
  const c = DB.cirugias.find((x) => x.id === id);
  if (!c) return;
  if (['en_curso', 'realizada'].includes(c.estado)) {
    alert('No se puede cancelar un turno en curso o ya realizado. Si corresponde, registre la incidencia correspondiente.');
    return;
  }
  if (c.estado === 'confirmada') {
    alert('El turno ya está confirmado en el parte oficial: debe suspenderse con causa registrada, no cancelarse.');
    closeSlot();
    openSuspender(id);
    return;
  }
  pedirClave('Cancelar turno', 'Ingrese la clave de autorización para liberar esta franja horaria.', CLAVE_CANCELAR, () => {
    if (!confirm('¿Confirma cancelar el turno de ' + (c.paciente?.nombre || 's/d') + '?')) return;
    removeDoc('cirugias', id);
    closeSlot();
    renderProgDiaria();
  });
}

function pedirAutorizacion(id) {
  pedirClave('Autorización — Admisión y Egresos', 'Ingrese la clave del sector de Admisión y Egresos del HRU.', CLAVE_AUTORIZACION, () => {
    const c = DB.cirugias.find((x) => x.id === id);

/* ================= ACTUALIZACIÓN AUTOMÁTICA =================
   La app se publica en GitHub Pages y queda instalada en teléfonos y
   computadoras del hospital. Sin esto, un dispositivo podría seguir usando la
   copia cacheada por el service worker durante días.

   Circuito: el navegador descarga el sw.js nuevo, entra en estado "waiting", la
   app avisa con una barra y —al aceptar— le ordena tomar el control y recarga.
   La comprobación se repite cada media hora y cada vez que la app vuelve al
   frente, de modo que un cambio publicado hoy llega solo, sin desinstalar nada. */
let swRegistro = null;
let swEsperando = null;

/* ¿Quedó texto cargado en la pantalla? Se ignoran las casillas y los selectores
   de fecha, que traen valor por defecto y no son trabajo del usuario. */
function hayTextoCargado() {
  return [...document.querySelectorAll('#main input, #main textarea')].some((el) => {
    if (['checkbox', 'radio', 'date', 'month'].includes(el.type)) return false;
    return String(el.value || '').trim() !== '';
  });
}
/* Hay trabajo a medio hacer si algún campo tiene texto o si hay un modal
   abierto: en ese caso la actualización no se aplica sola. */
function hayTrabajoEnCurso() {
  return !!document.querySelector('.overlay.open') || hayTextoCargado();
}
function mostrarAvisoActualizacion() {
  // Sin nada tipeado, la app se actualiza sola: es el caso habitual, con la
  // pantalla en el panel o en la grilla.
  if (!hayTrabajoEnCurso()) { aplicarActualizacion(); return; }
  const bar = $('update-bar');
  if (bar) bar.classList.add('open');
}
function aplicarActualizacion() {
  const bar = $('update-bar');
  if (bar) $('update-txt').textContent = 'Actualizando…';
  if (swEsperando) swEsperando.postMessage('skipWaiting');
  // Si el worker no responde, la recarga forzada alcanza igual.
  setTimeout(() => location.reload(), 1500);
}
function vigilarWorker(reg) {
  const nuevo = reg.installing || reg.waiting;
  if (!nuevo) return;
  const evaluar = () => {
    // Solo es una actualización si ya había una versión controlando la página:
    // en la primera instalación no hay nada que avisar.
    if (nuevo.state === 'installed' && navigator.serviceWorker.controller) {
      swEsperando = reg.waiting || nuevo;
      mostrarAvisoActualizacion();
    }
  };
  evaluar();
  nuevo.addEventListener('statechange', evaluar);
}
function initActualizaciones() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  navigator.serviceWorker.register('sw.js').then((reg) => {
    swRegistro = reg;
    vigilarWorker(reg);
    reg.addEventListener('updatefound', () => vigilarWorker(reg));
    setInterval(() => reg.update().catch(() => {}), 30 * 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    window.addEventListener('online', () => reg.update().catch(() => {}));
  }).catch(() => { /* sin SW la app funciona igual, solo pierde el modo offline */ });

  // El worker nuevo tomó el control: se recarga una sola vez para estrenar la
  // versión publicada. En la primera visita no hay nada que estrenar —el worker
  // recién se instala y reclama la página—, así que ahí no se recarga.
  const teniaControlador = !!navigator.serviceWorker.controller;
  let recargando = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (recargando || !teniaControlador) return;
    recargando = true;
    location.reload();
  });
}

    if (remTimer) clearInterval(remTimer);
    remTimer = setInterval(revisarRecordatorios, 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) revisarRecordatorios(); });
  });

  // Service worker: abre la app sin conexión y trae sola cada versión publicada.
  window.addEventListener('load', initActualizaciones);
});
</script>
</body>
</html>
